<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>케비라 실전 노트 · 모바일 미리보기</title>
<style>
  body{margin:0;background:#e9e4d8;font-family:"Noto Sans KR",sans-serif;padding:16px}
  .row{display:flex;gap:16px;align-items:flex-start}
  .col{width:390px}
  .lab{font-size:12px;font-weight:800;color:#1e293b;margin:0 0 6px 2px;letter-spacing:-.2px}
  .lab span{color:#948a7c;font-weight:600}
  .phone{width:390px;height:844px;overflow:hidden;border:1px solid #cfc6b4;border-radius:14px;
    background:#fff;box-shadow:0 6px 20px rgba(60,45,25,.12)}
  iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div class="row">
  <div class="col">
    <p class="lab">01 스토캐스틱 차트 도감 <span>· 390×844</span></p>
    <div class="phone"><iframe src="stochastic.html"></iframe></div>
  </div>
  <div class="col">
    <p class="lab">02 MACD 차트 도감 <span>· 390×844</span></p>
    <div class="phone"><iframe src="macd.html"></iframe></div>
  </div>
  <div class="col">
    <p class="lab">03 거래량·미결제·델타 차트 도감 <span>· 390×844</span></p>
    <div class="phone"><iframe src="volume-oi-delta.html"></iframe></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const y = q.get("y");
if (y) {
  const go = () => document.querySelectorAll("iframe").forEach(f => {
    try { f.contentWindow.scrollTo(0, Number(y)); } catch (e) {}
  });
  window.addEventListener("load", () => setTimeout(go, 1200));
  setTimeout(go, 2000);
}
</script>
</body>
</html>
