<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>케비라 브리핑 · 모바일 미리보기</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1220; }
  body { padding: 14px; display: flex; gap: 16px; align-items: flex-start; }
  .phone {
    flex: 0 0 auto; width: 390px; height: 844px; border-radius: 24px; overflow: hidden;
    border: 1px solid #2a3654; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
<div class="phone"><iframe id="f" title="케비라 브리핑 모바일 미리보기"></iframe></div>
<script>
  var s = new URLSearchParams(location.search).get("s");
  document.getElementById("f").src = "./index.html" + (s ? "?s=" + encodeURIComponent(s) : "");
</script>
</body>
</html>
