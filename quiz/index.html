"cat":"stock","sem":"short","type":"def2term","t":"대차잔고","sub":"Securities Lending Balance","head":"공매도를 위해 빌려준 주식이 아직 갚히지 않고 남아 있는 잔량.","def":"대차잔고는 기관 투자자가 공매도 세력에게 빌려준 주식 중 상환되지 않은 수량이다. 늘어나면 하락 베팅이 많다는 뜻이고, 줄어들면 숏커버링이 나올 수 있다는 신호로 본다.","ex":"대차잔고가 한 달 새 30% 늘면 공매도 압력이 커진 것으로 보고 주가 하방 위험을 의식한다.","rel":"공매도 · 숏커버링 · 신용잔고"},{"cat":"stock","sem":"margin","type":"def2term","t":"신용잔고","sub":"Margin Loan Balance","head":"투자자가 증권사에서 빌린 돈으로 산 주식의 잔액.","def":"신용잔고는 신용융자로 매수한 주식의 평가금액 또는 융자금 잔액이다. 늘어나면 빚을 내 산 매수세가 많다는 뜻이고, 주가가 하락하면 반대매매 물량이 쏟아질 수 있다.","ex":"신용잔고가 사상 최대로 늘어난 뒤 지수가 10% 빠지면 반대매매가 추가 하락을 부추긴다.","rel":"신용융자 · 반대매매 · 미수금"},{"cat":"stock","sem":"margin","type":"def2term","t":"신용융자","sub":"Margin Loan","head":"증권사가 투자자에게 주식 매수 자금을 빌려주는 제도.","def":"신용융자는 증권사가 담보를 잡고 매수 자금을 빌려주는 것으로, 투자자는 이자를 내고 정해진 기간 안에 갚아야 한다. 융자 한도는 종목과 계좌 등급에 따라 다르다.","ex":"신용융자로 1,000만원을 빌려 주식을 사면 연 8% 안팎의 이자가 매일 붙는다.","rel":"신용잔고 · 반대매매 · 미수금"},{"cat":"stock","sem":"ordertype","type":"def2term","t":"IOC 주문","sub":"Immediate or Cancel (IOC)","head":"즉시 체결되고 남은 수량은 자동으로 취소되는 주문.","def":"IOC는 주문이 들어가자마자 체결 가능한 만큼만 체결하고 나머지는 바로 취소하는 주문이다. 가격을 양보하지 않으면서 즉시성을 확보할 때 쓴다.","ex":"지정가로 IOC 매수 1,000주를 내면 300주만 체결되고 나머지 700주는 자동 취소된다.","rel":"FOK 주문 · 시장가 주문 · 지정가 주문"},{"cat":"stock","sem":"ordertype","type":"def2term","t":"FOK 주문","sub":"Fill or Kill (FOK)","head":"전량이 즉시 체결되지 않으면 아예 체결되지 않는 주문.","def":"FOK는 주문 수량 전부가 즉시 체결되어야 하고, 하나라도 못 채우면 전량 취소되는 주문이다. 대량 주문에서 일부만 체결되는 상황을 피하고 싶을 때 쓴다.","ex":"1,000주 FOK 매도는 1,000주를 한 번에 사려는 매수자가 없으면 전부 취소된다.","rel":"IOC 주문 · 지정가 주문 · 시장가 주문"},{"cat":"stock","sem":"ordertype","type":"def2term","t":"최유리 지정가","sub":"Best Limit Order","head":"현재 호가 중 가장 유리한 가격으로 내는 지정가 주문.","def":"최유리 지정가는 매수면 가장 낮은 매도호가, 매도면 가장 높은 매수호가로 가격을 자동 지정하는 주문이다. 가격을 직접 고르지 않아도 체결 가능성이 높다.","ex":"최유리 지정가 매수를 내면 현재 매도 1호가에 바로 붙어 대개 즉시 체결된다.","rel":"지정가 주문 · FOK 주문 · 호가 잔량"},{"cat":"stock","sem":"session","type":"def2term","t":"시간외 단일가","sub":"After-Hours Single Price Auction","head":"정규장 종료 뒤 10분 단위로 모아 단일가로 체결되는 매매.","def":"시간외 단일가는 장 마감 후 10분 동안 주문을 모아 하나의 가격으로 체결하는 방식이다. 종가 대비 일정 폭 안에서만 움직여 급격한 가격 변동이 제한된다.","ex":"장 마감 뒤 호재가 나면 시간외 단일가에서 상한가까지 사는 물량이 몰리기도 한다.","rel":"장 개시 동시호가 · 상한가 · 거래정지"},{"cat":"stock","sem":"session","type":"def2term","t":"장 개시 동시호가","sub":"Opening Auction","head":"개장 전 주문을 모아 시초가를 하나의 가격으로 정하는 절차.","def":"한국 증시는 08:30부터 09:00까지 주문을 모아 가장 많이 체결되는 가격을 시초가로 정한다. 전날 밤 해외 악재나 기업 공시가 반영되는 구간이라 시가 갭이 크게 벌어지기도 한다.","ex":"밤사이 실적 악화 공시가 나면 동시호가에서 시초가가 전일보다 10% 낮게 형성되기도 한다.","rel":"시간외 단일가 · 상한가 · 하한가"},{"cat":"stock","sem":"limit","type":"def2term","t":"상한가","sub":"Upper Limit","head":"하루에 오를 수 있는 최대 가격. 전일 종가보다 30% 높은 가격.","def":"상한가는 전일 종가 대비 30% 위로 정해진다. 사자 주문이 몰려 상한가에 도달하면 그 가격에서만 체결되고 더 이상 오르지 못한다.","ex":"전일 종가가 10,000원인 종목의 상한가는 13,000원이다.","rel":"하한가 · 거래정지 · 상한가 잠김"},{"cat":"stock","sem":"limit","type":"def2term","t":"하한가","sub":"Lower Limit","head":"하루에 내릴 수 있는 최대 가격. 전일 종가보다 30% 낮은 가격.","def":"하한가는 전일 종가 대비 30% 아래로 정해진다. 매도가 몰려 하한가가 되면 거래가 거의 끊기고 다음 날까지 매물이 이어질 수 있다.","ex":"전일 종가가 10,000원인 종목의 하한가는 7,000원이다.","rel":"상한가 · 거래정지 · 가격제한폭"},{"cat":"stock","sem":"limit","type":"def2term","t":"거래정지","sub":"Trading Halt","head":"중요 공시나 이상 급등락 때 거래소가 매매를 일시 멈추는 것.","def":"거래정지는 풍문·공시·주가 급변동 등으로 가격 형성이 정상적이지 않다고 판단될 때 매매를 중단하는 조치다. 재개되면 그동안 쌓인 주문이 한꺼번에 나와 가격이 크게 벌어질 수 있다.","ex":"최대주주 변경 공시가 나면 확인될 때까지 거래가 정지되고, 재개일에 급등락이 나타난다.","rel":"상한가 · 하한가 · 동시호가"},{"cat":"stock","sem":"micro","type":"def2term","t":"호가 잔량","sub":"Order Book Depth","head":"매수·매도 호가에 걸려 있는 미체결 주문의 수량.","def":"호가 잔량은 매수·매도 여러 단계 호가에 남아 있는 주문 수량이다. 매수 잔량이 두꺼우면 지지가 강하고, 얇으면 조금만 팔아도 가격이 밀린다.","ex":"매도 1~3호가 잔량이 매수보다 압도적으로 많다면 위쪽 저항이 두껍다고 본다.","rel":"스프레드 · 최유리 지정가 · 거래량"},{"cat":"stock","sem":"per-share","type":"def2term","t":"주당순이익","sub":"EPS","head":"순이익을 발행주식수로 나눈 주당 이익.","def":"EPS는 기업 순이익을 발행주식수로 나눈 값이다. 주가를 EPS로 나누면 PER이 되고, EPS가 늘면 같은 주가에서도 밸류에이션 부담이 줄어든다.","ex":"순이익 1,000억원, 발행주식 5,000만주면 EPS는 2,000원이다.","rel":"PER · BPS · 순이익률"},{"cat":"stock","sem":"per-share","type":"def2term","t":"주당순자산","sub":"BPS","head":"자기자본을 발행주식수로 나눈 주당 순자산.","def":"BPS는 기업의 장부상 순자산을 주식수로 나눈 값이다. 주가를 BPS로 나누면 PBR이 되며, 자산가치 대비 주가 수준을 볼 수 있다.","ex":"자기자본 5,000억원, 발행주식 2,000만주면 BPS는 25,000원이다.","rel":"PBR · EPS · 자기자본비율"},{"cat":"stock","sem":"returns","type":"def2term","t":"총자산이익률","sub":"ROA","head":"순이익을 총자산으로 나눈 비율. 자산을 얼마나 효율적으로 써서 이익을 냈는지 보여준다.","def":"ROA는 기업이 보유한 총자산으로 얼마나 이익을 냈는지를 나타낸다. 부채를 많이 쓴 기업은 ROE가 높아도 ROA는 낮을 수 있어 두 지표를 함께 본다.","ex":"순이익 200억원, 총자산 4,000억원이면 ROA는 5%다.","rel":"자기자본이익률 · 부채비율 · 이자보상배율"},{"cat":"stock","sem":"mult","type":"def2term","t":"주가매출비율","sub":"PSR","head":"시가총액을 매출로 나눈 배수. 이익이 없거나 적은 기업을 볼 때 쓴다.","def":"PSR은 주가를 주당매출로 나눈 값 또는 시가총액을 매출로 나눈 값이다. 적자 기업이나 성장 초기 기업의 매출 대비 가치를 비교할 때 쓰며, 업종 평균과 함께 봐야 한다.","ex":"시가총액 2조원, 연매출 4,000억원이면 PSR은 5배다.","rel":"PER · EV/EBITDA · 주가수익비율"},{"cat":"stock","sem":"cash","type":"def2term","t":"잉여현금흐름","sub":"Free Cash Flow (FCF)","head":"영업활동으로 벌어들인 현금에서 설비투자 등을 뺀, 실제로 남는 현금.","def":"FCF는 영업활동 현금흐름에서 자본적 지출을 뺀 값이다. 배당·자사주 매입·부채 상환에 쓸 수 있는 돈으로, 회계 이익보다 현금 창출력을 잘 보여준다.","ex":"영업현금흐름 800억원, 설비투자 300억원이면 FCF는 500억원이다.","rel":"배당성향 · 자사주 소각 · 영업이익률"},{"cat":"stock","sem":"margin","type":"def2term","t":"영업이익률","sub":"Operating Margin","head":"영업이익을 매출로 나눈 비율. 본업의 수익성을 보여준다.","def":"영업이익률은 매출에서 원가와 판관비를 뺀 영업이익이 매출의 몇 %인지를 나타낸다. 같은 업종 안에서 가격 경쟁력과 원가 관리 능력을 비교하는 지표다.","ex":"매출 1조원, 영업이익 1,200억원이면 영업이익률은 12%다.","rel":"순이익률 · 매출총이익률 · 주가수익비율"},{"cat":"stock","sem":"leverage","type":"def2term","t":"부채비율","sub":"Debt-to-Equity Ratio","head":"부채총계를 자본총계로 나눈 비율. 재무 안정성을 보여준다.","def":"부채비율은 빚이 자기자본의 몇 배인지를 나타낸다. 100% 아래면 자본이 부채보다 많아 안정적이고, 200%를 넘으면 금리 상승기에 이자 부담이 커진다.","ex":"부채 6,000억원, 자본 4,000억원이면 부채비율은 150%다.","rel":"이자보상배율 · 자기자본비율 · 하이일드채권"},{"cat":"stock","sem":"mult","type":"def2term","t":"PEG","sub":"PEG Ratio","head":"PER을 이익 성장률로 나눈 값. 성장을 감안한 밸류에이션 지표.","def":"PEG는 PER을 EPS 성장률로 나눈 값이다. 1보다 작으면 성장 속도에 비해 주가가 싸다고 보고, 성장주를 비교할 때 PER만 보는 한계를 보완한다.","ex":"PER이 30배이고 이익 성장률이 40%면 PEG는 0.75로 성장 대비 저평가로 읽을 수 있다.","rel":"주가수익비율 · 주당순이익 · 주가매출비율"},{"cat":"stock","sem":"mult","type":"def2term","t":"기업가치","sub":"Enterprise Value (EV)","head":"시가총액에 순부채를 더한, 기업 전체를 사는 데 드는 값.","def":"EV는 시가총액 + 순부채로 계산하며, 회사를 통째로 인수할 때 실제로 부담하는 금액이다. 부채가 많은 기업은 시가총액이 싸 보여도 EV는 클 수 있다.","ex":"시가총액 5,000억원, 순부채 1,000억원이면 EV는 6,000억원이다.","rel":"EV/EBITDA · 시가총액 · 부채비율"},{"cat":"stock","sem":"dividend","type":"def2term","t":"배당성향","sub":"Payout Ratio","head":"순이익 중 배당으로 나눠준 비율.","def":"배당성향은 순이익에서 배당금 총액이 차지하는 비중이다. 높으면 주주환원이 크지만 지나치게 높으면 성장 투자 여력이 부족할 수 있다.","ex":"순이익 1,000억원에 배당 300억원을 지급하면 배당성향은 30%다.","rel":"잉여현금흐름 · 중간배당 · 주식배당"},{"cat":"stock","sem":"leverage","type":"def2term","t":"이자보상배율","sub":"Interest Coverage Ratio","head":"영업이익을 이자비용으로 나눈 값. 이자를 갚을 능력을 보여준다.","def":"이자보상배율이 1 아래면 영업이익으로 이자도 못 갚는다는 뜻이다. 금리 상승기나 실적 악화기에 재무 위험을 판단하는 핵심 지표다.","ex":"영업이익 300억원, 이자비용 100억원이면 이자보상배율은 3배다.","rel":"부채비율 · 하이일드채권 · 신용스프레드"},{"cat":"stock","sem":"margin","type":"def2term","t":"순이익률","sub":"Net Margin","head":"순이익을 매출로 나눈 비율. 최종적으로 남는 이익의 크기다.","def":"순이익률은 매출에서 모든 비용과 세금을 뺀 뒤 남은 이익의 비중이다. 영업이익률과의 차이가 크면 이자비용이나 일회성 손실이 많다는 신호다.","ex":"매출 5,000억원, 순이익 400억원이면 순이익률은 8%다.","rel":"영업이익률 · 총자산이익률 · 주당순이익"},{"cat":"stock","sem":"leverage","type":"def2term","t":"자기자본비율","sub":"Equity Ratio","head":"자본총계를 총자산으로 나눈 비율. 자산 중 내 돈의 비중이다.","def":"자기자본비율은 총자산 가운데 자기자본이 차지하는 비중이다. 부채비율과 반대 방향으로 움직이며, 높을수록 외부 충격을 견디는 힘이 크다.","ex":"총자산 1조원, 자본 4,000억원이면 자기자본비율은 40%다.","rel":"부채비율 · 이자보상배율 · 총자산이익률"},{"cat":"stock","sem":"margin","type":"def2term","t":"매출총이익률","sub":"Gross Margin","head":"매출에서 매출원가를 뺀 매출총이익을 매출로 나눈 비율.","def":"매출총이익률은 제품을 만드는 데 든 원가를 빼고 남은 이익의 비중이다. 가격 결정력과 원가 경쟁력을 보여주며, 영업이익률과의 차이가 클수록 판관비 부담이 크다.","ex":"매출 1,000억원, 매출원가 600억원이면 매출총이익률은 40%다.","rel":"영업이익률 · 순이익률 · 재고자산"},{"cat":"stock","sem":"issue","type":"def2term","t":"주식병합","sub":"Share Consolidation","head":"여러 주를 하나로 합쳐 주식 수를 줄이고 주가를 높이는 것.","def":"주식병합은 액면가를 높여 주식 수를 줄이는 것이다. 5:1 병합이면 주식 수는 5분의 1, 주가는 5배가 되며 시가총액은 변하지 않는다. 동전주 이미지를 벗거나 상장 유지 요건을 맞출 때 쓴다.","ex":"주가 500원인 종목을 20:1 병합하면 주가는 10,000원이 되고 주식 수는 20분의 1로 줄어든다.","rel":"액면분할 · 무상감자 · 시가총액"},{"cat":"stock","sem":"issue","type":"def2term","t":"무상감자","sub":"Capital Reduction","head":"주식 수를 줄여 결손을 메우는 감자. 주주에게 아무것도 주지 않는다.","def":"무상감자는 자본금을 줄여 누적 결손을 상계하는 방식이다. 주주에게 대가를 지급하지 않고 주식 수만 줄어들어 주당 가치는 내려가며, 재무 구조를 정리하고 상장 폐지를 피하려는 목적이 크다.","ex":"10:1 무상감자를 하면 보유 주식 10주가 1주로 바뀌고 손실도 그대로 남는다.","rel":"주식병합 · 액면분할 · 유상증자"},{"cat":"stock","sem":"issue","type":"def2term","t":"전환사채","sub":"Convertible Bond (CB)","head":"정해진 조건에 따라 주식으로 바꿀 수 있는 회사채.","def":"전환사채(CB)는 만기 전에 미리 정한 가격으로 주식으로 전환할 수 있는 권리가 붙은 회사채다. 주가가 오르면 전환해 차익을 얻고, 내리면 이자를 받고 만기를 기다린다. 전환되면 주식 수가 늘어 기존 주주의 지분이 희석된다.","ex":"전환가 5,000원인 CB를 1억원어치 사 두었다가 주가가 8,000원이 되면 전환해 6,000만원의 평가차익을 얻는다.","rel":"신주인수권부사채 · 유상증자 · 지분 희석"},{"cat":"stock","sem":"issue","type":"def2term","t":"신주인수권부사채","sub":"Bond with Warrant (BW)","head":"신주를 살 수 있는 권리(워런트)가 붙은 회사채.","def":"BW는 회사채에 신주인수권이 붙은 상품으로, 투자자는 별도로 정해진 가격에 신주를 살 수 있다. 권리를 행사하지 않아도 채권은 그대로 남는다는 점이 CB와 다르다.","ex":"주가가 신주인수권 행사가격을 넘으면 워런트를 행사해 신주를 사고, 못 넘으면 채권만 들고 만기를 기다린다.","rel":"전환사채 · 유상증자 · 지분 희석"},{"cat":"stock","sem":"event","type":"def2term","t":"배당락","sub":"Ex-Dividend","head":"배당기준일 다음 날, 배당금만큼 주가가 조정되는 것.","def":"배당락은 배당을 받을 권리가 사라진 날 주가가 배당금만큼 떨어지는 것이다. 배당을 받은 주주는 현금을, 새로 산 투자자는 그만큼 싼 주가를 갖게 되어 실질 가치는 같아진다.","ex":"주가 10,000원, 주당 배당 500원이면 배당락일에 주가가 9,500원으로 조정된다.","rel":"중간배당 · 배당성향 · 주식배당"},{"cat":"stock","sem":"event","type":"def2term","t":"권리락","sub":"Ex-Rights","head":"유상증자 새 주식을 살 권리가 사라지며 주가가 조정되는 것.","def":"권리락은 신주배정기준일이 지나 새 주식을 배정받을 권리가 없어진 상태에서 주가가 이론 권리 가치만큼 낮아지는 것이다. 증자 규모와 발행가가 낮을수록 조정 폭이 커진다.","ex":"1주당 1주를 3,000원에 발행하는 증자에서 주가가 5,000원이면 권리락으로 주가가 크게 낮아진다.","rel":"배당락 · 유상증자 · 제3자배정 유상증자"},{"cat":"stock","sem":"issue","type":"def2term","t":"제3자배정 유상증자","sub":"Third-Party Allotment","head":"기존 주주가 아니라 특정 투자자에게 새 주식을 배정하는 증자.","def":"제3자배정 유상증자는 특정 투자자나 전략적 제휴 상대에게 신주를 배정하는 방식이다. 자금 조달이 빠르지만 기존 주주의 지분이 희석되고, 발행가가 시가보다 크게 낮으면 주주 반발이 커진다.","ex":"운영자금 500억원을 대주주에게 제3자배정으로 조달하면 기존 주주 지분율이 함께 낮아진다.","rel":"유상증자 · 전환사채 · 권리락"},{"cat":"stock","sem":"buyback","type":"def2term","t":"자사주 소각","sub":"Share Cancellation","head":"회사가 사들인 자기 주식을 영구히 없애는 것.","def":"자사주 소각은 매입한 자기 주식을 상각해 발행주식수를 줄이는 것이다. 총 주식 수가 줄어 주당순이익과 주당가치가 올라가며, 주주환원의 대표 수단으로 평가받는다.","ex":"발행주식 1,000만주 중 100만주를 소각하면 남은 900만주 기준으로 EPS가 약 11% 늘어난다.","rel":"자사주 매입 · 주당순이익 · 주주환원"},{"cat":"stock","sem":"issue","type":"def2term","t":"인적분할","sub":"Spin-off","head":"회사를 둘 이상으로 나눠 주주가 새 회사 주식을 직접 받는 것.","def":"인적분할은 한 회사의 사업을 분리해 별도 법인으로 만들고, 기존 주주에게 그 법인의 주식을 나눠 주는 방식이다. 주주는 두 회사의 주식을 함께 갖게 되고 분할 비율만큼 기존 주가가 조정된다.","ex":"A사가 0.4 대 0.6으로 인적분할되면 주주는 A사를 그대로 갖고 신설 B사 지분 40%를 추가로 받는다.","rel":"물적분할 · 주식병합 · 무상감자"},{"cat":"stock","sem":"issue","type":"def2term","t":"물적분할","sub":"Physical Split-off","head":"회사가 자회사를 세우고 모회사가 그 지분을 100% 갖는 분할.","def":"물적분할은 사업부를 떼어 새 법인을 만들되 신설 법인의 주식을 모회사가 전부 보유하는 방식이다. 기존 주주에겐 신주가 가지 않아 자회사 상장 시 모회사 가치가 희석된다는 논란이 생긴다.","ex":"물적분할한 자회사가 상장되면 모회사 주주의 지분 가치가 나뉘어 모주가 하락하는 사례가 있다.","rel":"인적분할 · 주식병합 · 유상증자"},{"cat":"stock","sem":"dividend","type":"def2term","t":"주식배당","sub":"Stock Dividend","head":"현금 대신 주식으로 지급하는 배당.","def":"주식배당은 이익을 현금이 아닌 신주로 나눠 주는 것이다. 보유 주수는 늘지만 발행주식수가 함께 늘어 주당 가치는 희석되고, 회사는 현금을 안고 남길 수 있다.","ex":"1주당 0.1주를 주식배당하면 1,000주를 가진 주주는 100주를 더 받고 총 1,100주가 된다.","rel":"배당락 · 무상증자 · 배당성향"},{"cat":"stock","sem":"dividend","type":"def2term","t":"중간배당","sub":"Interim Dividend","head":"회계연도 중간에 한 번 지급하는 배당.","def":"중간배당은 결산 배당과 별도로 연중 한 차례 지급하는 배당이다. 정관에서 정한 경우 사업보고서 없이 이사회 결의로 지급하며, 현금 흐름이 좋은 기업이 주주환원을 강화할 때 쓴다.","ex":"6월에 중간배당을 지급하면 투자자는 12월 결산 배당과 별도로 두 번 현금을 받는다.","rel":"배당락 · 배당성향 · 잉여현금흐름"},{"cat":"stock","sem":"rate","type":"def2term","t":"기준금리","sub":"Policy Rate","head":"중앙은행이 정하는 정책금리. 시중 금리의 출발점이다.","def":"기준금리는 한국은행이 결정하는 정책금리로, 익일물 환매조건부 거래 등 단기 자금 거래에 적용된다. 오르면 대출·예금 금리가 따라 올라 주식 밸류에이션에 부담이 된다.","ex":"기준금리가 3.5%에서 3.25%로 내리면 채권금리가 먼저 내리고 성장주가 반사적으로 오르기도 한다.","rel":"실질금리 · 채권가격과 금리 · 매파"},{"cat":"stock","sem":"bond","type":"def2term","t":"채권가격과 금리","sub":"Bond Price vs Yield","head":"금리가 오르면 채권 가격이 내려가는 역의 관계.","def":"채권은 발행 때 정한 이자를 주므로, 시장금리가 오르면 기존 채권은 덜 매력적이 되어 가격이 내려간다. 만기가 길수록 이 민감도가 커지며, 이 크기를 듀레이션으로 잰다.","ex":"금리가 1%포인트 오르면 만기 10년 채권 가격은 대략 8~9% 하락한다.","rel":"듀레이션 · 기준금리 · 수익률곡선"},{"cat":"stock","sem":"bond","type":"def2term","t":"신용스프레드","sub":"Credit Spread","head":"회사채 금리에서 같은 만기 국채 금리를 뺀 차이.","def":"신용스프레드는 발행 기업의 부도 위험에 대한 시장의 값을 보여준다. 경기가 나빠지거나 유동성이 마르면 스프레드가 벌어지고, 좋아지면 좁혀진다.","ex":"국고채 3년물이 3.0%인데 BBB 회사채가 5.5%면 신용스프레드는 2.5%포인트다.","rel":"하이일드채권 · 이자보상배율 · 듀레이션"},{"cat":"stock","sem":"cycle","type":"def2term","t":"스태그플레이션","sub":"Stagflation","head":"경기는 침체인데 물가는 계속 오르는 상황.","def":"스태그플레이션은 성장 정체와 높은 물가가 동시에 나타나는 상태다. 금리로 경기를 부양하면 물가가 더 오르고, 물가를 잡으면 경기가 더 꺾여 정책 대응이 어렵다.","ex":"성장률이 0%에 가까운데 소비자물가가 6%씩 오르면 주식과 채권이 함께 약해지기 쉽다.","rel":"디스인플레이션 · 리플레이션 · 매파"},{"cat":"stock","sem":"cycle","type":"def2term","t":"디스인플레이션","sub":"Disinflation","head":"물가가 오르긴 하지만 상승 속도가 둔화되는 것.","def":"디스인플레이션은 물가 수준은 여전히 오르지만 오르는 속도가 느려지는 상태다. 금리 인하 기대를 키워 주식시장에 우호적으로 작용하며, 물가가 실제로 내려가는 디플레이션과는 다르다.","ex":"물가 상승률이 6%에서 3%로 낮아지면 물가는 여전히 오르는 것이지만 디스인플레이션이라 부른다.","rel":"스태그플레이션 · 리플레이션 · 소비자물가지수"},{"cat":"stock","sem":"cycle","type":"def2term","t":"리플레이션","sub":"Reflation","head":"경기 부양 정책으로 성장과 물가가 함께 살아나는 것.","def":"리플레이션은 금리 인하·재정 지출·유동성 공급으로 침체된 경기와 물가를 다시 끌어올리는 국면이다. 원자재·경기 민감주·가치주가 상대적으로 강해지는 경향이 있다.","ex":"대규모 재정 지출과 금리 인하가 겹치면 원자재 가격과 경기주가 먼저 움직인다.","rel":"디스인플레이션 · 스태그플레이션 · 양적완화"},{"cat":"stock","sem":"bond","type":"def2term","t":"듀레이션","sub":"Duration","head":"채권 가격이 금리 변화에 얼마나 민감한지를 나타내는 지표.","def":"듀레이션은 채권 현금흐름의 가중평균 만기로, 금리가 1%포인트 움직일 때 가격이 몇 % 변하는지를 근사해 보여준다. 만기가 길고 표면금리가 낮을수록 커진다.","ex":"듀레이션이 7인 채권은 금리가 1%포인트 오르면 가격이 약 7% 하락한다.","rel":"채권가격과 금리 · 신용스프레드 · 수익률곡선"},{"cat":"stock","sem":"bond","type":"def2term","t":"하이일드채권","sub":"High-Yield Bond","head":"신용등급이 투자부적격인 회사가 발행한, 이자가 높은 채권.","def":"하이일드채권은 신용등급이 BB+ 이하인 기업이 발행한 채권으로, 부도 위험이 큰 대신 높은 이자를 준다. 경기 침체기에는 신용스프레드가 급격히 벌어지며 가격이 크게 흔들린다.","ex":"경기 둔화 우려가 커지면 하이일드 펀드에서 자금이 빠져나가며 스프레드가 3%포인트 넘게 벌어지기도 한다.","rel":"신용스프레드 · 이자보상배율 · 부채비율"},{"cat":"stock","sem":"fx","type":"def2term","t":"원달러 환율","sub":"USD/KRW","head":"1달러를 사는 데 필요한 원화의 양.","def":"원달러 환율은 달러 대비 원화의 가치를 나타낸다. 숫자가 오르면 원화 약세로 수입 물가가 오르고 외국인 자금이 빠지기 쉬우며, 내리면 반대다.","ex":"환율이 1,300원에서 1,380원으로 오르면 수입 원자재 가격이 올라 항공·정유 업종 수익성이 나빠진다.","rel":"달러인덱스 · 외국인 수급 · 경상수지"},{"cat":"stock","sem":"flow","type":"def2term","t":"외국인 수급","sub":"Foreign Investor Flows","head":"외국인 투자자가 국내 주식을 사고파는 규모와 방향.","def":"외국인 수급은 외국인 계좌의 현물 순매수 규모로, 환율·금리·글로벌 위험 선호에 크게 좌우된다. 시가총액 비중이 큰 대형주에 집중되는 경향이 있다.","ex":"환율이 급등하고 미국 금리가 오르면 외국인이 국내 주식을 순매도하며 지수가 눌리는 패턴이 반복된다.","rel":"원달러 환율 · 투자자별 매매동향 · 프로그램 매매"},{"cat":"stock","sem":"macro","type":"def2term","t":"경상수지","sub":"Current Account","head":"상품·서비스·소득·이전 거래를 모두 합친 대외 거래의 차액.","def":"경상수지는 무역수지에 서비스수지와 소득수지를 더한 값이다. 흑자가 크면 외화 공급이 늘어 원화 강세 요인이 되고, 적자가 이어지면 환율 상승 압력이 커진다.","ex":"반도체 수출이 늘어 경상수지가 100억달러 흑자를 내면 원화가 강세를 보이기 쉽다.","rel":"원달러 환율 · 외국인 수급 · 무역수지"},{"cat":"stock","sem":"macro","type":"def2term","t":"경기선행지수","sub":"Leading Economic Index","head":"앞으로의 경기 방향을 미리 보여주는 지표.","def":"경기선행지수는 주가, 신규 주문, 건설 허가, 소비자 기대처럼 경기보다 먼저 움직이는 항목을 모아 만든다. 6개월 전과 비교해 상승하면 경기 확장, 하락하면 둔화를 예상한다.","ex":"선행지수가 3개월 연속 전월 대비 하락하면 경기 둔화 우려가 커져 방어주가 강해지기도 한다.","rel":"구매관리자지수 · 리플레이션 · 스태그플레이션"},{"cat":"stock","sem":"bond","type":"def2term","t":"실질금리","sub":"Real Interest Rate","head":"명목금리에서 물가 상승률을 뺀 금리.","def":"실질금리는 돈의 실제 구매력 기준 수익률이다. 명목금리가 3%여도 물가가 4% 오르면 실질금리는 −1%가 되어 현금을 들고 있으면 손해다.","ex":"명목금리 3.5%, 물가 상승률 2.5%면 실질금리는 1%다.","rel":"기준금리 · 디스인플레이션 · 금 선물"},{"cat":"eng","sem":"breakout","type":"en2ko","t":"breakdown","sub":"브레이크다운","mean":"하락 돌파, 지지선 붕괴","head":"breakdown","def":"주가가 지지선을 아래로 뚫고 내려가는 움직임. 그동안 버티던 매수세가 무너졌다는 신호로 읽는다.","ex":"The stock broke down below 50,000 won on heavy volume.","exko":"그 주식은 거래량을 동반하며 5만원 아래로 하락 돌파했다.","rel":"breakout · support · sell-off"},{"cat":"eng","sem":"sideways","type":"en2ko","t":"consolidation","sub":"컨설리데이션","mean":"횡보·정체, 방향을 정하기 전의 다지기","head":"consolidation","def":"급등이나 급락 뒤 가격이 좁은 구간에서 오르내리며 힘을 모으는 구간. 다음 방향을 정하기 전의 숨 고르기다.","ex":"After the rally, the index has been in consolidation for three weeks.","exko":"랠리 이후 지수는 3주째 횡보하며 다지고 있다.","rel":"sideways · breakout · range"},{"cat":"eng","sem":"level","type":"en2ko","t":"support","sub":"서포트","mean":"지지선, 매수세가 받쳐 주는 가격대","head":"support","def":"가격이 내려올 때 매수세가 붙어 추가 하락을 막는 가격대. 여러 번 지지된 가격일수록 신뢰도가 높다.","ex":"The 3,400 level has held as support all month.","exko":"3,400선이 한 달 내내 지지선으로 버텼다.","rel":"resistance · breakdown · pullback"},{"cat":"eng","sem":"level","type":"en2ko","t":"resistance","sub":"리지스턴스","mean":"저항선, 매도세가 막는 가격대","head":"resistance","def":"가격이 올라갈 때 매도 물량이 나와 더 오르지 못하게 막는 가격대. 저항을 뚫으면 돌파로 이어지고, 못 뚫으면 되밀린다.","ex":"The stock stalled at resistance near 62,000 won.","exko":"그 주식은 6만2,000원 부근 저항선에서 멈췄다.","rel":"support · breakout · consolidation"},{"cat":"eng","sem":"gap","type":"en2ko","t":"gap up","sub":"갭 업","mean":"시가가 전일 종가보다 크게 높게 출발하는 것","head":"gap up","def":"장이 열리자마자 전일 종가보다 높은 가격에서 시작해 차트에 빈 공간이 생기는 것. 호재나 실적 발표 뒤에 자주 나온다.","ex":"The shares gapped up 8% after the earnings beat.","exko":"실적이 예상을 웃돌자 주가는 8% 갭 업으로 출발했다.","rel":"gap down · earnings beat · opening"},{"cat":"eng","sem":"gap","type":"en2ko","t":"gap down","sub":"갭 다운","mean":"시가가 전일 종가보다 크게 낮게 출발하는 것","head":"gap down","def":"장이 열리자마자 전일 종가보다 낮은 가격에서 시작해 차트에 빈 공간이 생기는 것. 악재나 해외 급락이 반영된 결과다.","ex":"The futures gapped down after the hawkish FOMC.","exko":"매파적인 FOMC 이후 선물이 갭 다운으로 출발했다.","rel":"gap up · sell-off · overnight"},{"cat":"eng","sem":"chop","type":"en2ko","t":"whipsaw","sub":"윕소","mean":"급등락을 반복해 양쪽 포지션을 다 털어내는 장","head":"whipsaw","def":"가격이 위아래로 크게 흔들려 롱과 숏 모두 손절하게 만드는 움직임. 방향이 없는데 변동성만 큰 장에서 자주 나온다.","ex":"The market whipsawed traders all afternoon.","exko":"장은 오후 내내 트레이더들을 윕소로 흔들었다.","rel":"chop · stop hunt · volatility"},{"cat":"eng","sem":"trap","type":"en2ko","t":"stop hunt","sub":"스톱 헌트","mean":"손절 주문을 노려 털어낸 뒤 되돌리는 움직임","head":"stop hunt","def":"손절 주문이 몰린 가격대를 일부러 건드려 매도·매수 주문을 체결시킨 뒤 곧바로 되돌리는 움직임.","ex":"That spike below the low looked like a stop hunt.","exko":"저점 아래로 튀었다가 돌아온 것은 스톱 헌트처럼 보였다.","rel":"whipsaw · stop-loss order · liquidity"},{"cat":"eng","sem":"indicator","type":"en2ko","t":"overbought","sub":"오버보트","mean":"과매수, 단기간에 너무 많이 오른 상태","head":"overbought","def":"가격이 단기간에 지나치게 올라 조정 가능성이 커진 상태. RSI 70 이상을 과매수 구간으로 보는 경우가 많다.","ex":"The RSI shows the stock is overbought after a 40% run.","exko":"40% 급등 뒤 RSI는 이 주식이 과매수 상태임을 보여 준다.","rel":"oversold · pullback · RSI"},{"cat":"eng","sem":"indicator","type":"en2ko","t":"oversold","sub":"오버솔드","mean":"과매도, 단기간에 너무 많이 내린 상태","head":"oversold","def":"가격이 단기간에 지나치게 떨어져 반등 가능성이 커진 상태. RSI 30 이하를 과매도 구간으로 보는 경우가 많다.","ex":"Selling looks overdone; the index is deeply oversold.","exko":"매도가 과한 듯하다. 지수는 깊은 과매도 상태다.","rel":"overbought · capitulation · rebound"},{"cat":"eng","sem":"move","type":"en2ko","t":"parabolic","sub":"패러볼릭","mean":"거의 수직에 가까운 급등","head":"parabolic","def":"차트가 포물선처럼 휘어 오를 만큼 가속이 붙은 상승. 이후 급격한 되돌림이 따르기 쉽다.","ex":"Bitcoin went parabolic and then gave back half the move.","exko":"비트코인은 수직 급등을 보인 뒤 상승분의 절반을 반납했다.","rel":"capitulation · blow-off top · volatility"},{"cat":"eng","sem":"move","type":"en2ko","t":"capitulation","sub":"캐피튤레이션","mean":"항복 매도, 투매로 바닥을 만드는 국면","head":"capitulation","def":"버티던 투자자들까지 포기하고 쏟아내는 매도. 거래량이 폭발하며 이 국면에서 바닥이 만들어지는 경우가 많다.","ex":"The panic selling on Friday looked like capitulation.","exko":"금요일의 투매는 항복 매도처럼 보였다.","rel":"oversold · sell-off · panic selling"},{"cat":"eng","sem":"downmove","type":"en2ko","t":"sell-off","sub":"셀오프","mean":"급격한 매도세로 인한 하락","head":"sell-off","def":"짧은 시간에 매도가 몰려 가격이 크게 빠지는 것. 특정 종목에도, 시장 전체에도 쓴다.","ex":"A broad sell-off hit tech shares after the CPI report.","exko":"CPI 발표 이후 기술주에 광범위한 매도세가 몰렸다.","rel":"rally · pullback · capitulation"},{"cat":"eng","sem":"action","type":"en2ko","t":"buy the dip","sub":"바이 더 딥","mean":"눌림목에서 사는 것","head":"buy the dip","def":"상승 추세가 살아 있다고 보고 일시적인 하락에서 매수하는 전략. 하락이 추세 전환인지 구분하는 게 관건이다.","ex":"Investors keep buying the dip, so the index keeps bouncing.","exko":"투자자들이 계속 눌림목을 사들여서 지수가 계속 반등한다.","rel":"dip · pullback · average down"},{"cat":"eng","sem":"sizing","type":"en2ko","t":"average down","sub":"애버리지 다운","mean":"물타기, 하락한 종목을 더 사서 평균 단가를 낮추는 것","head":"average down","def":"가격이 내린 자리에서 같은 종목을 더 사 평균 매입 단가를 낮추는 행동. 추세가 꺾였다면 손실을 키우는 쪽이 된다.","ex":"He averaged down three times and now the position is too big.","exko":"그는 세 번 물타기를 해서 지금은 포지션이 너무 커졌다.","rel":"buy the dip · position sizing · averaging"},{"cat":"eng","sem":"pos","type":"en2ko","t":"long","sub":"롱","mean":"매수 포지션, 상승에 걸어 둔 상태","head":"long","def":"자산을 사서 보유한 상태. 상승하면 이익이 나는 포지션으로, 숏과 반대다.","ex":"I am long the December futures from 350.","exko":"나는 350에서 12월물 선물을 매수해 들고 있다.","rel":"short · flat · hedge"},{"cat":"eng","sem":"pos","type":"en2ko","t":"short","sub":"숏","mean":"매도 포지션, 하락에 걸어 둔 상태","head":"short","def":"자산을 빌려 팔거나 선물을 매도해 하락하면 이익이 나는 포지션.","ex":"He is short the index and covered half this morning.","exko":"그는 지수를 숏으로 들고 있다가 오전에 절반을 환매수했다.","rel":"long · flat · short squeeze"},{"cat":"eng","sem":"pos","type":"en2ko","t":"flat","sub":"플랫","mean":"포지션이 없는 상태","head":"flat","def":"사거나 판 포지션을 남기지 않고 현금만 들고 있는 상태. 방향을 정하지 않았다는 뜻이기도 하다.","ex":"After the margin call I am flat until the FOMC is over.","exko":"마진콜 이후 나는 FOMC가 끝날 때까지 무포지션이다.","rel":"long · short · on the sidelines"},{"cat":"eng","sem":"tone","type":"en2ko","t":"risk-on","sub":"리스크온","mean":"위험자산 선호, 주식시장의 공격적 심리","head":"risk-on","def":"주식·원자재·고위험 통화로 자금이 몰리고 안전자산이 팔리는 분위기. 유동성이 풀리고 경기 기대가 살아날 때 나타난다.","ex":"We saw a classic risk-on day: tech up, gold down.","exko":"전형적인 리스크온 장이었다. 기술주는 오르고 금은 내렸다.","rel":"risk-off · safe haven · sentiment"},{"cat":"eng","sem":"tone","type":"en2ko","t":"risk-off","sub":"리스크오프","mean":"안전자산 선호, 위험을 피하는 심리","head":"risk-off","def":"주식을 팔고 달러·국채·금으로 자금이 옮겨가는 분위기. 충격이 커지면 달러가 가장 먼저 사랑받는다.","ex":"The sell-off turned into a risk-off move into Treasuries.","exko":"매도세는 국채로 몰리는 리스크오프로 바뀌었다.","rel":"risk-on · flight to safety · VIX"},{"cat":"eng","sem":"macro2","type":"en2ko","t":"soft landing","sub":"소프트 랜딩","mean":"연착륙, 경기 침체 없이 물가가 잡히는 것","head":"soft landing","def":"금리를 올려 물가를 낮추면서도 경기 침체로 빠지지 않고 연착륙하는 상황. 주식시장이 가장 좋아하는 결말이다.","ex":"A soft landing would justify new highs in the index.","exko":"연착륙이라면 지수의 신고가를 정당화할 수 있다.","rel":"hard landing · stagflation · rate cut"},{"cat":"eng","sem":"macro2","type":"en2ko","t":"hard landing","sub":"하드 랜딩","mean":"경착륙, 금리 인상 끝에 경기가 급격히 꺾이는 것","head":"hard landing","def":"물가를 잡으려고 금리를 올린 결과 실업이 늘고 경기가 급격히 가라앉는 상황. 신용 스프레드가 벌어지고 주가가 크게 밀린다.","ex":"Credit spreads widened on hard landing fears.","exko":"경착륙 우려로 신용 스프레드가 벌어졌다.","rel":"soft landing · recession · credit spread"},{"cat":"eng","sem":"expect","type":"en2ko","t":"priced in","sub":"프라이스드 인","mean":"이미 주가에 반영됨, 선반영","head":"priced in","def":"호재나 악재가 이미 시장가격에 반영되어 있어, 발표가 나와도 추가 반응이 크지 않다는 뜻.","ex":"Two rate cuts are already priced in.","exko":"두 차례 금리 인하는 이미 가격에 반영되어 있다.","rel":"sell the news · consensus · guidance"},{"cat":"eng","sem":"expect","type":"en2ko","t":"sell the news","sub":"셀 더 뉴스","mean":"호재가 나오자 오히려 파는 것","head":"sell the news","def":"기대가 미리 주가에 반영된 호재가 발표되면 오히려 차익 실현 매도가 나와 가격이 빠지는 패턴.","ex":"Guidance was raised, but investors sold the news.","exko":"전망치를 올렸는데도 투자자들은 재료가 나오자 매도했다.","rel":"priced in · buy the rumor · take profit"},{"cat":"eng","sem":"earn","type":"en2ko","t":"earnings beat","sub":"어닝스 비트","mean":"실적이 시장 예상치를 웃도는 것","head":"earnings beat","def":"분기 실적이 시장 예상치(컨센서스)보다 좋게 나오는 것. 가이던스까지 올리면 좋은 반응이 이어진다.","ex":"The chipmaker posted an earnings beat and raised guidance.","exko":"그 반도체 회사는 어닝스 비트를 내고 전망치도 올렸다.","rel":"earnings miss · guidance · consensus"},{"cat":"eng","sem":"earn","type":"en2ko","t":"earnings miss","sub":"어닝스 미스","mean":"실적이 시장 예상치를 밑도는 것","head":"earnings miss","def":"분기 실적이 시장 예상치보다 나쁘게 나오는 것. 전망치까지 낮추면 주가가 크게 밀린다.","ex":"An earnings miss sent the shares down 12% after hours.","exko":"어닝스 미스로 시간외에서 주가가 12% 빠졌다.","rel":"earnings beat · guidance cut · sell-off"},{"cat":"eng","sem":"risk2","type":"en2ko","t":"black swan","sub":"블랙스완","mean":"예측할 수 없던 대형 충격","head":"black swan","def":"아무도 예측하지 못한 채 시장을 뒤흔드는 사건. 발생 확률은 낮지만 한 번 나오면 가격이 통째로 재편된다.","ex":"No model can price a black swan.","exko":"어떤 모델도 블랙스완을 가격에 반영할 수는 없다.","rel":"tail risk · event risk · volatility"},{"cat":"eng","sem":"risk2","type":"en2ko","t":"tail risk","sub":"테일 리스크","mean":"발생 확률은 낮지만 피해가 큰 위험","head":"tail risk","def":"정규분포의 꼬리에서 일어나는, 드물지만 충격이 큰 손실 위험. 옵션으로 적은 비용을 내고 대비할 수 있다.","ex":"Cheap puts are a way to hedge tail risk.","exko":"싼 풋옵션은 테일 리스크를 헤지하는 방법이다.","rel":"black swan · protective put · volatility"},{"cat":"eng","sem":"cross","type":"en2ko","t":"golden cross","sub":"골든 크로스","mean":"단기 이동평균선이 장기 이동평균선을 위로 뚫는 것","head":"golden cross","def":"보통 50일선이 200일선을 아래에서 위로 돌파하는 것. 추세가 상승으로 바뀌었다는 신호로 본다.","ex":"The 50-day crossed above the 200-day for a golden cross.","exko":"50일선이 200일선을 상향 돌파해 골든 크로스가 나왔다.","rel":"death cross · moving average · trend"},{"cat":"eng","sem":"cross","type":"en2ko","t":"death cross","sub":"데스 크로스","mean":"단기 이동평균선이 장기 이동평균선을 아래로 뚫는 것","head":"death cross","def":"보통 50일선이 200일선을 위에서 아래로 돌파하는 것. 추세가 하락으로 바뀌었다는 신호로 본다.","ex":"The death cross appeared just before the sell-off.","exko":"매도세가 나오기 직전에 데스 크로스가 나타났다.","rel":"golden cross · moving average · breakdown"},{"cat":"eng","sem":"sizing2","type":"ko2en","t":"pyramiding","sub":"피라미딩","mean":"불타기, 오르는 포지션에 추가 매수","head":"수익이 나는 포지션에 물량을 더 얹어 불타는 것","def":"가격이 예상대로 움직여 이익이 나는 포지션에 추가로 사서 규모를 키우는 것. 반대로 손실 포지션에 더 넣는 것은 물타기다.","ex":"He is pyramiding into the winner instead of adding to losers.","exko":"그는 지는 포지션에 더 넣지 않고 이기는 포지션에 불타고 있다.","rel":"average down · scaling in · position sizing"},{"cat":"eng","sem":"sizing2","type":"ko2en","t":"scaling in","sub":"스케일링 인","mean":"분할 진입, 나눠서 사 들어가기","head":"한 번에 다 사지 않고 여러 가격에 나눠서 진입하는 것","def":"한 가격에 전량을 사지 않고 가격대를 나눠 조금씩 진입해 평균 단가와 체감 위험을 낮추는 방법.","ex":"I am scaling in at 350 and 345 instead of all at once.","exko":"나는 한 번에 사지 않고 350과 345에서 분할 진입하고 있다.","rel":"scaling out · pyramiding · position sizing"},{"cat":"eng","sem":"sizing2","type":"ko2en","t":"scaling out","sub":"스케일링 아웃","mean":"분할 청산, 나눠서 팔아 나가기","head":"한 번에 다 팔지 않고 여러 가격에 나눠서 청산하는 것","def":"목표가 근처에서 전량을 한 번에 팔지 않고 나눠 팔아 평균 청산가를 높이고 심리적 부담을 줄이는 방법.","ex":"He is scaling out of the position on the way up.","exko":"그는 오르는 동안 포지션을 분할 청산하고 있다.","rel":"scaling in · take profit · trimming"},{"cat":"eng","sem":"sizing2","type":"ko2en","t":"raising cash","sub":"레이징 캐시","mean":"현금 확보, 비중을 줄여 현금을 늘리는 것","head":"보유 자산을 팔아 현금 비중을 높이는 것","def":"불확실성이 커질 때 주식 비중을 줄이고 현금을 확보해 대응 여력을 만드는 것.","ex":"The fund is raising cash ahead of the FOMC.","exko":"그 펀드는 FOMC를 앞두고 현금을 확보하고 있다.","rel":"trimming · risk-off · on the sidelines"},{"cat":"eng","sem":"style","type":"ko2en","t":"trend following","sub":"트렌드 팔로잉","mean":"추세 추종, 흐름에 올라타는 매매","head":"추세가 생기면 그 방향으로 따라가는 매매 방식","def":"방향이 정해진 추세에 올라타 이익을 키우는 대표적인 매매 방식. 횡보장에서는 손실이 잦다.","ex":"Trend following works well in strong markets, not in chop.","exko":"추세 추종은 강한 장에서는 잘 맞지만 횡보장에서는 어렵다.","rel":"mean reversion · breakout · momentum"},{"cat":"eng","sem":"style","type":"ko2en","t":"mean reversion","sub":"민 리버전","mean":"역추세 매매, 평균으로 되돌아오는 것에 베팅","head":"가격이 평균에서 벗어나면 다시 평균으로 돌아온다고 보고 반대로 매매하는 것","def":"가격이 평균에서 크게 벗어나면 다시 되돌아온다고 보고, 오른 쪽을 팔고 내린 쪽을 사는 방식.","ex":"Mean reversion traders buy the oversold bounce.","exko":"역추세 매매꾼들은 과매도 반등을 산다.","rel":"trend following · overbought · oversold"},{"cat":"eng","sem":"style","type":"ko2en","t":"bottom fishing","sub":"바텀 피싱","mean":"저점 매수, 급락한 종목을 줍는 것","head":"크게 떨어진 종목을 바닥이라 보고 사는 것","def":"많이 빠진 종목을 바닥 근처라고 판단해 매수하는 것. 바닥을 확인하지 않고 사면 더 떨어질 수 있다.","ex":"Bottom fishing in a downtrend is dangerous.","exko":"하락 추세에서 저점을 줍는 것은 위험하다.","rel":"buy the dip · capitulation · falling knife"},{"cat":"eng","sem":"style","type":"ko2en","t":"selling into strength","sub":"셀링 인투 스트렝스","mean":"고점 매도, 오를 때 팔아 이익을 확정하는 것","head":"가격이 오르는 힘을 이용해 미리 팔아 이익을 확정하는 것","def":"오르는 흐름에 매도 주문을 얹어 유리한 가격에 파는 것. 급락 뒤에는 팔 곳이 사라지므로 미리 나눠 파는 편이 낫다.","ex":"Instead of waiting for the top, he is selling into strength.","exko":"그는 고점을 기다리지 않고 오를 때 팔아 이익을 확정하고 있다.","rel":"take profit · scaling out · resistance"},{"cat":"eng","sem":"order","type":"ko2en","t":"unfilled order","sub":"언필드 오더","mean":"미체결 주문, 아직 체결되지 않은 주문","head":"가격이 닿지 않아 아직 체결되지 않고 남아 있는 주문","def":"지정한 가격에 시장이 닿지 않아 체결되지 않고 대기 중인 주문.","ex":"My unfilled order is still sitting below the market.","exko":"내 미체결 주문은 아직 시장가 아래에 걸려 있다.","rel":"filled · limit order · IOC"},{"cat":"eng","sem":"portfolio","type":"ko2en","t":"holdings","sub":"홀딩스","mean":"보유 종목, 들고 있는 자산","head":"지금 계좌에 들고 있는 종목과 수량","def":"계좌에서 현재 보유하고 있는 종목과 수량. 평가손익은 보유 종목을 현재가로 평가해 계산한다.","ex":"Tech makes up half of my holdings.","exko":"내 보유 종목의 절반이 기술주다.","rel":"position · unrealized gain · portfolio"},{"cat":"eng","sem":"pl3","type":"ko2en","t":"unrealized gain","sub":"언리얼라이즈드 게인","mean":"평가이익, 아직 팔지 않아 확정되지 않은 이익","head":"아직 팔지 않아 실현되지 않은 평가상의 이익","def":"보유 중인 자산을 현재가로 평가했을 때 매입가보다 높아 생긴 이익. 팔기 전에는 확정되지 않는다.","ex":"The position shows a large unrealized gain, but nothing is locked in yet.","exko":"그 포지션은 평가이익이 크지만 아직 확정된 것은 없다.","rel":"unrealized loss · realized P&L · holdings"},{"cat":"eng","sem":"pl3","type":"ko2en","t":"unrealized loss","sub":"언리얼라이즈드 로스","mean":"평가손실, 아직 팔지 않아 확정되지 않은 손실","head":"아직 팔지 않아 실현되지 않은 평가상의 손실","def":"보유 중인 자산의 현재가가 매입가보다 낮아 생긴 손실. 팔지 않으면 확정 손실은 아니다.","ex":"He is holding a 15% unrealized loss and hoping for a rebound.","exko":"그는 15%의 평가손실을 안고 반등을 기다리고 있다.","rel":"unrealized gain · underwater · realized P&L"},{"cat":"eng","sem":"pl3","type":"ko2en","t":"realized P&L","sub":"리얼라이즈드 피앤엘","mean":"실현손익, 거래를 끝내 확정된 손익","head":"포지션을 청산해 실제로 확정된 손익","def":"포지션을 청산해 계좌에 실제로 남은 손익. 세금과 수수료는 실현손익을 기준으로 계산한다.","ex":"My realized P&L for the month is plus 3 million won.","exko":"이번 달 내 실현손익은 300만원 플러스다.","rel":"unrealized gain · tax · closing"},{"cat":"eng","sem":"exit2","type":"ko2en","t":"stopped out","sub":"스톱트 아웃","mean":"손절 당함, 손절선에 걸려 포지션이 정리됨","head":"손절 주문에 걸려 포지션이 자동으로 정리된 상태","def":"가격이 손절선에 닿아 자동으로 포지션이 정리된 상태. 방향은 맞았지만 손절 폭이 좁아 털린 경우도 많다.","ex":"I was stopped out right before the rally.","exko":"나는 랠리 직전에 손절로 털리고 말았다.","rel":"stop-loss order · whipsaw · cut losses"},{"cat":"eng","sem":"psych","type":"ko2en","t":"loss aversion","sub":"로스 어버전","mean":"손실 회피, 손실을 이익보다 크게 느끼는 심리","head":"같은 크기의 이익보다 손실을 훨씬 크게 느끼는 심리","def":"이익의 기쁨보다 손실의 고통을 약 두 배 크게 느끼는 심리. 손절을 미루고 이익을 너무 일찍 확정하게 만든다.","ex":"Loss aversion keeps traders holding losers too long.","exko":"손실 회피 심리 때문에 트레이더들은 지는 포지션을 너무 오래 들고 있게 된다.","rel":"confirmation bias · herd mentality · discipline"},{"cat":"eng","sem":"psych","type":"ko2en","t":"herd mentality","sub":"허드 멘탈리티","mean":"군중 심리, 남들이 사니 따라 사는 것","head":"다수와 같은 쪽으로 움직이려는 심리","def":"다수가 하는 대로 따라 하는 심리. 급등 막바지에 대거 유입되어 고점 매수자가 되는 주된 이유다.","ex":"Herd mentality pushed everyone into the trade at the top.","exko":"군중 심리 때문에 모두가 고점에서 그 매매에 뛰어들었다.","rel":"FOMO · loss aversion · bag holder"},{"cat":"eng","sem":"psych","type":"ko2en","t":"confirmation bias","sub":"컨펌메이션 바이어스","mean":"확증 편향, 보고 싶은 것만 보는 심리","head":"자기 판단에 맞는 정보만 골라 받아들이는 심리","def":"이미 내린 결정을 지지하는 정보만 찾고 반대 증거는 무시하는 심리. 손절 판단을 흐리게 만든다.","ex":"Confirmation bias makes you read only the bullish news.","exko":"확증 편향은 강세 뉴스만 읽게 만든다.","rel":"loss aversion · herd mentality · discipline"},{"cat":"eng","sem":"estimate","type":"ko2en","t":"in line with estimates","sub":"인 라인 위드 에스티메이츠","mean":"예상치 부합, 컨센서스와 비슷한 실적","head":"실적이 시장 예상치와 거의 같게 나오는 것","def":"실적이 컨센서스와 거의 일치하는 것. 놀라움이 없어 주가 반응도 대개 제한적이다.","ex":"The results were in line with estimates, so the stock barely moved.","exko":"실적이 예상치에 부합해서 주가는 거의 움직이지 않았다.","rel":"beat estimates · miss estimates · consensus"},{"cat":"eng","sem":"estimate","type":"ko2en","t":"beat estimates","sub":"비트 에스티메이츠","mean":"예상치 상회, 컨센서스를 웃도는 실적","head":"실적이 시장 예상치를 넘어서는 것","def":"실적이 컨센서스를 넘는 것. 전망치까지 올리면 주가가 크게 오르는 재료가 된다.","ex":"The company beat estimates on both revenue and earnings.","exko":"그 회사는 매출과 이익 모두에서 예상치를 웃돌았다.","rel":"in line with estimates · earnings beat · guidance"},{"cat":"eng","sem":"estimate","type":"ko2en","t":"miss estimates","sub":"미스 에스티메이츠","mean":"예상치 하회, 컨센서스를 밑도는 실적","head":"실적이 시장 예상치에 미치지 못하는 것","def":"실적이 컨센서스에 못 미치는 것. 전망치를 낮추면 주가가 급락하는 경우가 많다.","ex":"The retailer missed estimates and cut its outlook.","exko":"그 유통업체는 예상치를 밑돌고 전망치도 낮췄다.","rel":"in line with estimates · earnings miss · guidance cut"}];

};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 문제마다 4지선다 구성 (같은 개념군은 오답 보기에서 제외) */
const ITEMS = DATA.map((d, i) => {
  const correct = d.type === 'en2ko' ? d.mean : d.t;
  const label = o => (d.type === 'en2ko' ? o.mean : o.t);
  const banned = new Set([...(d.not || []), correct]);
  const picks = [];

  const pool = DATA.filter(o => o.cat === d.cat && o !== d && o.sem !== d.sem);
  for (const o of shuffle(pool)) {
    const l = label(o);
    if (!l || banned.has(l)) continue;
    banned.add(l);
    picks.push(l);
    if (picks.length === 3) break;
  }
  if (picks.length < 3) {
    for (const o of shuffle(DATA.filter(o => o.cat === d.cat && o !== d))) {
      const l = label(o);
      if (!l || banned.has(l)) continue;
      banned.add(l);
      picks.push(l);
      if (picks.length === 3) break;
    }
  }

  const choices = shuffle([{ text: correct, ok: true }, ...picks.map(t => ({ text: t, ok: false }))]);
  return Object.assign({}, d, { id: i, choices });
});

/* ---------- 저장 ---------- */
const KEY = 'kebira-eng-stock-quiz-v1';
const blankState = () => ({ solved: [], wrong: [], marks: [], streak: 0, best: 0, hits: 0, tries: 0 });

let S = blankState();
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && Array.isArray(raw.solved)) S = Object.assign(blankState(), raw);
} catch (e) { /* 저장소를 쓸 수 없으면 세션 기록만 유지 */ }

const solvedSet = new Set(S.solved);
const wrongSet = new Set(S.wrong);
const markSet = new Set(S.marks);

function save() {
  S.solved = [...solvedSet];
  S.wrong = [...wrongSet];
  S.marks = [...markSet];
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* 화면 전용 상태 */
const ui = new Map();
function uiOf(id) {
  if (!ui.has(id)) ui.set(id, { picked: new Set(), gone: new Set(), hint: 0 });
  return ui.get(id);
}

let filter = 'all';
let list = [];
let pos = 0;

function buildList() {
  if (filter === 'fut') list = ITEMS.filter(it => it.cat === 'fut');
  else if (filter === 'stock') list = ITEMS.filter(it => it.cat === 'stock');
  else if (filter === 'eng') list = ITEMS.filter(it => it.cat === 'eng');
  else if (filter === 'wrong') list = ITEMS.filter(it => wrongSet.has(it.id));
  else if (filter === 'mark') list = ITEMS.filter(it => markSet.has(it.id));
  else list = ITEMS.slice();
}

function current() { return list[pos] || null; }

/* ---------- 요소 ---------- */
const $ = id => document.getElementById(id);
const elTabs = $('tabs'), elLv = $('lv');

  { key: 'eng', name: '🇺🇸 실전 영어' },

  { key: 'mark', name: '⭐ 북마크' }
];

function countFor(key) {
  if (key === 'fut') return ITEMS.filter(it => it.cat === 'fut').length;
  if (key === 'stock') return ITEMS.filter(it => it.cat === 'stock').length;
  if (key === 'eng') return ITEMS.filter(it => it.cat === 'eng').length;
  if (key === 'wrong') return wrongSet.size;
  if (key === 'mark') return markSet.size;
  return ITEMS.length;
}

/* ---------- 렌더 ---------- */
function renderTabs() {
  elTabs.innerHTML = '';
  FILTERS.forEach(f => {
    const b = document.createElement('button');
    b.className = 'tab' + (filter === f.key ? ' on' : '');
    b.innerHTML = f.name + ' <span class="n">' + countFor(f.key) + '</span>';
    b.addEventListener('click', () => setFilter(f.key));
    elTabs.appendChild(b);
  });
}

function renderStats() {
  const total = S.hits + S.tries;
  const acc = total ? Math.round((S.hits / total) * 100) : 0;
  elStreak.textContent = '🔥 ' + S.streak;
  elAcc.textContent = '🎯 ' + acc + '%';
  elSolved.textContent = '✅ ' + solvedSet.size + '/' + ITEMS.length;
  elLv.textContent = 'Lv.' + Math.min(10, Math.floor(solvedSet.size / 30) + 1);
}

function renderHeader() {
  const it = current();
  if (!it) {
    elBar.style.width = '0%';
    elPText.textContent = '0 / 0';
    elPrev.disabled = true;
    elNext.disabled = true;
    return;
  }
  const w = ((pos + 1) / list.length) * 100;
  elBar.style.width = w + '%';
  elPText.textContent = (pos + 1) + ' / ' + list.length;
  elPrev.disabled = pos === 0;
  elNext.disabled = pos === list.length - 1;
}

function statusText(it) {
  const st = uiOf(it.id);
  if (solvedSet.has(it.id)) return { cls: 'ok', text: '✅ 정답! [' + it.t + '] — 눌러서 해설 보기' };
  if (st.hint === 2) return { cls: 'hint', text: '💡 50:50 — 오답 2개를 지웠습니다. 이제 고르세요' };
  if (st.hint === 1) return { cls: 'hint', text: '💡 힌트: ' + hintText(it) };
  if (st.picked.size) return { cls: 'bad', text: '❌ 아쉽습니다. 지운 보기를 빼고 다시 골라 보세요' };
  return { cls: '', text: '4지선다 · 막히면 [💡 힌트] (2단계)' };
}

function hintText(it) {
  if (it.type === 'def2term' && /[가-힣]/.test(it.t)) {
    const words = it.t.split(' ');
    const mask = words.map(w => (w.length > 1 ? w[0] + '○'.repeat(w.length - 1) : w)).join(' ');
    return mask + ' (' + it.t.replace(/\s/g, '').length + '글자)';
  }
  if (it.type === 'def2term') {
    return '영문 약어 · 첫 글자 ' + it.t[0];
  }
  const words = it.t.split(' ');
  if (words.length > 1) {
    return words.map(w => (w.length > 1 ? w[0] + '○'.repeat(w.length - 1) : w)).join(' ');
  }
  const letters = it.t.replace(/[^A-Za-z]/g, '').length;
  return it.t[0] + '○'.repeat(Math.max(0, it.t.length - 1)) + ' (' + letters + '글자)';
}

function renderQuestion() {
  const it = current();

  if (!it) {
    elChip.textContent = filter === 'mark' ? '⭐ 북마크' : '❌ 오답노트';

      ? '북마크한 문제가 없습니다.\n문제 화면에서 ☆ 북마크를 눌러 모아 보세요.'
      : '오답이 없습니다. 🎉\n틀린 문제가 생기면 여기에 모입니다.';
    elQask.textContent = '';
    elStatus.className = 'status';
    elStatus.textContent = '다른 탭에서 문제를 풀어 보세요';
    elHint.disabled = true;
    elExplain.disabled = true;
    elMark.disabled = true;
    renderHeader();
    return;
  }

  elHint.disabled = false;
  elExplain.disabled = false;
  elMark.disabled = false;

  elChip.textContent = CAT_NAME[it.cat];
  elChip.className = 'chip' + (it.cat === 'eng' ? ' eng' : it.cat === 'fut' ? ' fut' : '');
  elQno.textContent = 'Q' + (it.id + 1);

  elQhead.className = 'qhead' + (it.type === 'en2ko' ? ' en' : it.type === 'ko2en' ? ' ko' : '');
  elQhead.textContent = it.head;
  elQask.textContent = ASK[it.type];

  const st = statusText(it);
  elStatus.className = 'status' + (st.cls ? ' ' + st.cls : '');
  elStatus.textContent = st.text;

  elMark.textContent = markSet.has(it.id) ? '★ 북마크' : '☆ 북마크';
  elMark.className = 'act mark' + (markSet.has(it.id) ? ' on' : '');

  renderChoices();
  renderHeader();
}

function renderChoices() {
  const it = current();
  elChoices.innerHTML = '';
  if (!it) return;

  const st = uiOf(it.id);
  const done = solvedSet.has(it.id);

  it.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.dataset.i = String(i);
    b.innerHTML = '<span class="k">' + 'ABCD'[i] + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = c.text;

    if (done) {
      if (c.ok) b.classList.add('ok');
      b.disabled = true;
    } else if (st.picked.has(i) || st.gone.has(i)) {
      b.classList.add('gone');
      b.disabled = true;
    }

    b.addEventListener('click', () => answer(i));
    elChoices.appendChild(b);
  });
}

/* 오답노트에서 정답을 맞히면 목록에서 빠지고 다음 문제로 이어진다 */
function refreshWrongList() {
  buildList();
  if (!list.length) { pos = 0; return; }
  pos = Math.min(pos, list.length - 1);
}

/* ---------- 정답 처리 ---------- */
function answer(i) {
  const it = current();
  if (!it || solvedSet.has(it.id)) return;
  const st = uiOf(it.id);
  if (st.picked.has(i) || st.gone.has(i)) return;
  const opt = it.choices[i];

  if (opt.ok) {
    solvedSet.add(it.id);
    wrongSet.delete(it.id);
    S.streak += 1;
    S.best = Math.max(S.best, S.streak);
    S.hits += 1;
    save();
    if (filter === 'wrong') refreshWrongList();
    renderQuestion();
    renderStats();
    renderTabs();
    const solvedId = it.id;
    setTimeout(() => {
      const cur = current();
      if (!cur || cur.id === solvedId) openModal(true, it);
    }, 340);
    return;
  }

  S.tries += 1;
  S.streak = 0;
  wrongSet.add(it.id);
  st.picked.add(i);
  save();
  renderQuestion();
  renderStats();
  renderTabs();
  const btn = elChoices.querySelector('.choice[data-i="' + i + '"]');
  if (btn) {
    btn.classList.remove('gone');
    btn.classList.add('bad');
    btn.disabled = true;
    setTimeout(() => { if (current() && current().id === it.id) renderChoices(); }, 460);
  }
}

/* ---------- 힌트 ---------- */
elHint.addEventListener('click', () => {
  const it = current();
  if (!it) return;
  if (solvedSet.has(it.id)) { openModal(true); return; }
  const st = uiOf(it.id);
  const wrongIdx = it.choices.map((c, i) => (c.ok ? -1 : i)).filter(i => i >= 0 && !st.picked.has(i) && !st.gone.has(i));

  if (st.hint === 0) {
    st.hint = 1;
    renderQuestion();
    return;
  }
  if (wrongIdx.length >= 2) {
    shuffle(wrongIdx).slice(0, 2).forEach(i => st.gone.add(i));
    st.hint = 2;
    renderQuestion();
    return;
  }
  st.hint = 2;
  const s = statusText(it);
  elStatus.className = 'status hint';
  elStatus.textContent = wrongIdx.length
    ? '💡 오답을 모두 지웠습니다. 남은 보기가 정답입니다'
    : '💡 더 지울 오답이 없습니다';
  renderChoices();
});

/* ---------- 북마크 ---------- */
elMark.addEventListener('click', () => {
  const it = current();
  if (!it) return;
  if (markSet.has(it.id)) markSet.delete(it.id); else markSet.add(it.id);
  save();
  renderQuestion();
  renderTabs();
});

/* ---------- 해설 모달 ---------- */
function openModal(auto, explicit) {
  const it = explicit || current();
  if (!it) return;
  const done = solvedSet.has(it.id);

  elMBadge.className = 'mbadge' + (it.cat === 'eng' ? ' eng' : it.cat === 'fut' ? ' fut' : '');
  elMBadge.textContent = done ? '🎉 정답 · 상세 해설' : '📖 해설 보기';
  elMTerm.className = 'mterm' + (it.cat === 'eng' ? ' en' : '');
  elMTerm.textContent = it.t;
  elMSub.textContent = it.cat === 'eng'
    ? '발음 ' + it.sub + ' · ' + it.mean
    : it.sub;
  elMDef.textContent = it.def;

  if (it.cat === 'eng') {
    elMEx.innerHTML = '<div class="mex"></div><div class="mexko"></div>';
    elMEx.querySelector('.mex').textContent = '“' + it.ex + '”';
    elMEx.querySelector('.mexko').textContent = it.exko;
  } else {
    elMEx.innerHTML = '<div class="mex"></div>';
    elMEx.querySelector('.mex').textContent = it.ex;
  }
  elMRel.textContent = it.rel;

  const inList = !!(current() && current().id === it.id);
  const isLast = !inList || pos === list.length - 1;
  elMNext.disabled = false;
  elMNext.textContent = isLast ? '닫기' : '다음 문제 ▶';
  elModal.classList.add('open');
}

function closeModal() { elModal.classList.remove('open'); }
elExplain.addEventListener('click', () => openModal(false));
elStatus.addEventListener('click', () => { if (current() && solvedSet.has(current().id)) openModal(true); });
$('mClose').addEventListener('click', closeModal);
$('mBack').addEventListener('click', closeModal);
elModal.addEventListener('click', e => { if (e.target === elModal) closeModal(); });
elMNext.addEventListener('click', () => {
  closeModal();
  if (pos < list.length - 1) { pos += 1; renderQuestion(); }
});

/* ---------- 이동 / 필터 ---------- */
function setFilter(key) {
  filter = key;
  buildList();
  pos = 0;
  for (let i = 0; i < list.length; i++) {
    if (!solvedSet.has(list[i].id)) { pos = i; break; }
  }
  renderTabs();
  renderQuestion();
  renderStats();
}

elPrev.addEventListener('click', () => { if (pos > 0) { pos -= 1; renderQuestion(); } });
elNext.addEventListener('click', () => { if (pos < list.length - 1) { pos += 1; renderQuestion(); } });

/* ---------- 초기화 ---------- */
$('btnReset').addEventListener('click', () => elConfirm.classList.add('open'));
$('cCancel').addEventListener('click', () => elConfirm.classList.remove('open'));
$('cOk').addEventListener('click', () => {
  S = blankState();
  solvedSet.clear();
  wrongSet.clear();
  markSet.clear();
  ui.clear();
  try { localStorage.removeItem(KEY); } catch (e) {}
  elConfirm.classList.remove('open');
  filter = 'all';
  buildList();
  pos = 0;
  renderTabs();
  renderQuestion();
  renderStats();
});

/* ---------- 키보드 (데스크톱) ---------- */
document.addEventListener('keydown', e => {
  if (elModal.classList.contains('open') || elConfirm.classList.contains('open')) {
    if (e.key === 'Escape') { closeModal(); elConfirm.classList.remove('open'); }
    return;
  }
  if (/^[1-4]$/.test(e.key)) {
    const b = elChoices.querySelector('.choice[data-i="' + (Number(e.key) - 1) + '"]');
    if (b && !b.disabled) b.click();
  } else if (e.key === 'ArrowRight' && pos < list.length - 1) { pos += 1; renderQuestion(); }
  else if (e.key === 'ArrowLeft' && pos > 0) { pos -= 1; renderQuestion(); }
});

/* ---------- 시작 ---------- */
buildList();
pos = 0;
for (let i = 0; i < list.length; i++) {
  if (!solvedSet.has(list[i].id)) { pos = i; break; }
}
renderTabs();
renderQuestion();
renderStats();
</script>
</body>
</html>
