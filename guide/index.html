<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fbf8f1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="케비라 선물·옵션 백과" />
<title>케비라 선물·옵션 실전 백과 100선</title>
<meta name="description" content="중1도 따라 하는 선물·옵션 실전 백과 100선. 2026년 12월물 실제 시세(코스피200 755.34)로 배우는 기초·옵션·스프레드·그릭스·실전 리스크." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --ink:#16202e;
  --sub:#6b7789;
  --line:#e8e2d6;
  --paper:#fbf8f1;
  --card:#fffdf9;
  --basic:#4f46e5;
  --opt:#0369a1;
  --spread:#0f766e;
  --greek:#7c3aed;
  --real:#be123c;
  --ok:#15803d;
  --bad:#c2410c;
  --gold:#b45309;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#e7e2d6;color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.app{width:100%;max-width:430px;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fffdf8 0%,#fbf7ee 60%,#f6f1e6 100%);position:relative;overflow:hidden}
@media(min-width:431px){.app{box-shadow:0 0 0 1px #ddd5c5,0 22px 60px rgba(30,25,15,.16)}}
.rainbow{height:5px;flex:0 0 auto;background:linear-gradient(90deg,#ef4444 0%,#f59e0b 16%,#facc15 32%,#22c55e 48%,#3b82f6 64%,#6366f1 81%,#a855f7 100%)}

/* ---------- top ---------- */
.top{flex:0 0 auto;padding:10px 16px 0}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{font-family:'Gowun Batang','Noto Sans KR',serif;font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.brand b{background:linear-gradient(90deg,#be123c,#b45309,#15803d,#1d4ed8,#7c3aed);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:-.1px}
.stamp{flex:0 0 auto;text-align:right;font-size:9.5px;line-height:1.35;color:#8a7654;background:#f6efe1;
  border:1px solid #eadfc9;border-radius:8px;padding:4px 7px;font-weight:700}
.stamp span{display:block;font-weight:500;color:#9b8a6b}

/* snapshot */
.snap{flex:0 0 auto;margin:9px 16px 0;background:linear-gradient(135deg,#1e293b,#0f172a);color:#e8eef7;
  border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(15,23,42,.18)}
.snap .row1{display:flex;align-items:baseline;justify-content:space-between;font-size:10.5px;color:#9fb0c7;letter-spacing:.1px}
.snap .row1 b{color:#fbbf24;font-size:10.5px;font-weight:700}
.snap .grid{display:flex;gap:6px;margin-top:7px}
.snap .cell{flex:1;background:rgba(255,255,255,.06);border-radius:9px;padding:5px 6px;text-align:center}
.snap .cell i{display:block;font-style:normal;font-size:9px;color:#93a4bb;letter-spacing:-.2px}
.snap .cell b{display:block;font-size:12.5px;font-weight:800;margin-top:1px;letter-spacing:-.3px}
.snap .cell b.dn{color:#fb7185}
.snap .cell b.up{color:#4ade80}

/* progress */
.prog{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 16px 0;font-size:10px;color:var(--sub)}
.pbar{flex:1;height:6px;border-radius:99px;background:#ece5d8;overflow:hidden;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;
  background:linear-gradient(90deg,#22c55e,#0ea5e9,#8b5cf6);transition:width .35s ease}
.prog b{color:#3f4c60;font-weight:700}

/* search */
.searchwrap{flex:0 0 auto;margin:9px 16px 0;position:relative}
.searchwrap input{width:100%;height:40px;border-radius:12px;border:1.5px solid #e4dccb;background:#fffdf8;
  padding:0 34px 0 34px;font-size:13px;color:var(--ink);outline:none;box-shadow:0 2px 6px rgba(120,100,60,.05)}
.searchwrap input:focus{border-color:#c9a24a;background:#fff}
.searchwrap input::placeholder{color:#a99f8b}
.searchwrap .ic{position:absolute;left:11px;top:11px;font-size:14px;opacity:.55}
.searchwrap .clr{position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;
  background:#efe7d6;color:#8b7a58;font-size:12px;display:none;align-items:center;justify-content:center}
.searchwrap.has .clr{display:flex}

/* pills */
.pills{flex:0 0 auto;display:flex;gap:5px;overflow-x:auto;padding:9px 16px 8px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;font-size:11px;font-weight:700;color:#6d6350;background:#fffaf0;border:1.3px solid #e6dcc6;
  border-radius:99px;padding:6px 10px;letter-spacing:-.3px;white-space:nowrap;transition:.15s}
.pill b{font-weight:800;opacity:.65;margin-left:2px;font-size:10px}
.pill.on{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.pill[data-f="all"].on{background:linear-gradient(135deg,#334155,#0f172a)}
.pill[data-f="basic"].on{background:var(--basic)}
.pill[data-f="opt"].on{background:var(--opt)}
.pill[data-f="spread"].on{background:var(--spread)}
.pill[data-f="greek"].on{background:var(--greek)}
.pill[data-f="real"].on{background:var(--real)}
.pill[data-f="fav"].on{background:#b45309}
.pill[data-f="done"].on{background:#15803d}

/* list */
.list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px 24px;-webkit-overflow-scrolling:touch}
.grouphead{display:flex;align-items:center;gap:7px;margin:13px 2px 7px}
.grouphead .dot{width:8px;height:8px;border-radius:3px}
.grouphead .nm{font-size:12px;font-weight:800;letter-spacing:-.3px}
.grouphead .ln{flex:1;height:1px;background:#e8e0d0}
.grouphead .ct{font-size:10px;color:#a3967e;font-weight:700}
.card{position:relative;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid #ece5d7;
  border-radius:14px;padding:11px 11px 11px 10px;margin-bottom:8px;box-shadow:0 2px 7px rgba(120,100,60,.05);
  transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:scale(.985);box-shadow:0 1px 4px rgba(120,100,60,.1)}
.card .no{flex:0 0 auto;width:26px;height:26px;border-radius:9px;background:#f3ecdc;color:#8a7654;
  font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.3px}
.card .body{flex:1;min-width:0;display:block}
.card .title{display:block;font-size:13.2px;font-weight:700;line-height:1.32;letter-spacing:-.35px;color:#182433}
.card .prev{display:block;font-size:11px;color:#8b8577;line-height:1.4;margin-top:3px;letter-spacing:-.25px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:-.2px}
.chip.basic{background:#eef0ff;color:#4338ca}
.chip.opt{background:#e5f4fd;color:#0369a1}
.chip.spread{background:#e3f6f1;color:#0f766e}
.chip.greek{background:#f1e9ff;color:#6d28d9}
.chip.real{background:#ffe9ee;color:#be123c}
.chip.tag{background:#f6f1e5;color:#8a7654}
.card .mk{margin-left:auto;display:flex;gap:3px;font-size:10px;align-items:center}
.card.done{border-color:#c9e6cf;background:linear-gradient(180deg,#fdfffd,#f7fdf8)}
.card .fas{position:absolute;top:8px;right:9px;font-size:11px;opacity:.9}
.empty{text-align:center;color:#a3967e;font-size:12.5px;padding:48px 20px;line-height:1.6}
.foot{margin:16px 2px 0;font-size:10.5px;line-height:1.65;color:#9a8e77;border-top:1px dashed #e4dbc8;padding-top:11px}
.foot b{color:#7d6f56}

/* ---------- reader ---------- */
.sheet{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:40;
  box-shadow:0 -8px 30px rgba(40,30,10,.18);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-top{flex:0 0 auto;background:rgba(251,248,241,.97);backdrop-filter:blur(8px);border-bottom:1px solid #e9e1d1;
  padding:9px 12px 8px}
.sh-nav{display:flex;align-items:center;gap:8px}
.iconbtn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:#f2ebdb;color:#7d6f56}
.iconbtn:active{background:#e8dfc9}
.sh-no{font-size:10px;font-weight:800;color:#a08e6c;letter-spacing:.3px}
.sh-titles{flex:1;min-width:0}
.sh-titles .k{font-size:9.5px;font-weight:800;letter-spacing:-.2px}
.sh-titles h2{font-size:14.5px;font-weight:800;line-height:1.28;letter-spacing:-.45px;margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.favbtn{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:#f2ebdb}
.favbtn.on{background:#fff1d6}
.sh-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 26px;-webkit-overflow-scrolling:touch}

.sec{margin-bottom:15px}
.sec h3{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:-.3px;margin-bottom:7px;color:#2c3a4d}
.sec h3 .em{font-size:13px}
.sec h3 .rule{flex:1;height:1px;background:#e8e0d0}
.analogy{background:linear-gradient(135deg,#fff8e6,#fdf3dc);border:1px solid #f0e0b8;border-radius:14px;
  padding:12px 13px;font-size:12.8px;line-height:1.62;color:#5c4a25;letter-spacing:-.3px;font-weight:500}
.analogy::first-letter{font-weight:800}
.ntable{width:100%;border-collapse:separate;border-spacing:0;background:#fffdf8;border:1px solid #e8e0d0;
  border-radius:12px;overflow:hidden;font-size:11.5px}
.ntable tr+tr td{border-top:1px solid #f0ead9}
.ntable td{padding:7px 8px;vertical-align:middle;line-height:1.4;letter-spacing:-.25px}
.ntable td:first-child{width:34%;color:#6d6350;font-weight:600;background:#fbf7ec}
.ntable td:nth-child(2){font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums;white-space:nowrap;width:1%}
.ntable td:last-child{color:#8b8271;font-size:10.5px}
.note{font-size:10.5px;color:#8d8267;line-height:1.55;margin-top:6px;padding-left:2px;letter-spacing:-.2px}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 0 27px;margin-bottom:8px;font-size:12.2px;
  line-height:1.55;letter-spacing:-.3px;color:#26313f}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:19px;height:19px;border-radius:7px;
  background:#e7f0f8;color:#1d4e79;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.timing{display:flex;flex-direction:column;gap:7px}
.tbox{border-radius:12px;padding:9px 11px;font-size:11.8px;line-height:1.55;letter-spacing:-.25px}
.tbox b{display:block;font-size:10px;font-weight:800;margin-bottom:2px;letter-spacing:-.1px}
.tbox.good{background:#f1faf1;border:1px solid #cfe9d2;color:#245c33}
.tbox.bad{background:#fdf3ef;border:1px solid #f3d9ce;color:#8a3f22}
.pc{display:flex;gap:8px}
.pc>div{flex:1;border-radius:12px;padding:9px 10px;font-size:11.2px;line-height:1.5;letter-spacing:-.25px}
.pc .p{background:#f4f9ff;border:1px solid #d7e6f5}
.pc .c{background:#fff7f4;border:1px solid #f2ded4}
.pc b{display:block;font-size:10px;font-weight:800;margin-bottom:3px}
.pc .p b{color:#1d5296}
.pc .c b{color:#a2451f}
.pc li{list-style:none;position:relative;padding-left:9px;margin-bottom:3px;color:#39465a}
.pc li::before{content:'·';position:absolute;left:0;font-weight:900}
.warn{background:linear-gradient(135deg,#fff1f2,#ffe9ec);border:1px solid #f5c6cf;border-left:4px solid #e11d48;
  border-radius:10px;padding:10px 12px;font-size:11.8px;line-height:1.6;color:#8c1c37;letter-spacing:-.25px;font-weight:500}
.quiz{border:1.5px solid #dbe6f5;border-radius:14px;padding:11px 12px 12px;background:linear-gradient(180deg,#f7fbff,#eff6fd)}
.quiz .qq{font-size:12.5px;font-weight:800;line-height:1.45;letter-spacing:-.35px;color:#173a5e;margin-bottom:9px}
.quiz .qq i{font-style:normal;color:#2563eb;margin-right:3px}
.qopt{display:block;width:100%;text-align:left;background:#fff;border:1.3px solid #d5e2f0;border-radius:10px;
  padding:9px 11px;font-size:12px;line-height:1.45;letter-spacing:-.3px;color:#25364a;margin-bottom:6px;
  transition:.15s;position:relative;padding-right:28px}
.qopt:active{transform:scale(.99)}
.qopt .lb{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:900;opacity:0}
.qopt.right{border-color:#86c99a;background:#f1fbf3;color:#14532d;font-weight:700}
.qopt.right .lb{opacity:1;color:#15803d}
.qopt.wrong{border-color:#f0a8b5;background:#fdf2f4;color:#9f1239}
.qopt.wrong .lb{opacity:1;color:#e11d48}
.qopt.dim{opacity:.55}
.qexp{display:none;margin-top:7px;font-size:11.3px;line-height:1.6;color:#2e475f;background:#fff;border:1px dashed #c9d9ea;
  border-radius:9px;padding:9px 10px;letter-spacing:-.25px}
.qexp.show{display:block}
.qexp b{color:#0f766e}
.sh-bot{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(251,248,241,.97);border-top:1px solid #e9e1d1;backdrop-filter:blur(8px)}
.navbtn{flex:0 0 auto;height:38px;min-width:64px;border-radius:11px;background:#f2ebdb;color:#6d6350;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;letter-spacing:-.3px}
.navbtn:disabled{opacity:.4}
.donebtn{flex:1;height:38px;border-radius:11px;font-size:12px;font-weight:800;letter-spacing:-.3px;
  background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.donebtn.is-done{background:linear-gradient(135deg,#15803d,#166534)}
.toast{position:absolute;left:50%;bottom:74px;transform:translate(-50%,14px);background:rgba(20,30,45,.94);color:#fff;
  font-size:11.5px;padding:8px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<script>window.__ERR=[];addEventListener('error',function(e){__ERR.push(String(e.message||e))});addEventListener('unhandledrejection',function(e){__ERR.push('rej:'+e.reason)});</script>
</head>
<body>
<div class="app">
  <div class="rainbow"></div>

  <div class="top">
    <div class="brandrow">
      <div>
        <div class="brand">케비라 <b>선물·옵션</b><br>실전 백과 100선</div>
        <div class="sub">중1도 따라 하는 · 2026년 12월물 실제 시세로</div>
      </div>
      <div class="stamp">2026.11.20 종가<span>만기 12.10 · 잔존 21일</span></div>
    </div>
  </div>

  <div class="snap">
    <div class="row1"><span>코스피200 · 12월물</span><b>11/20(금) 마감</b></div>
    <div class="grid">
      <div class="cell"><i>코스피200</i><b class="dn">755.34</b></div>
      <div class="cell"><i>F 2612</i><b class="dn">752.75p</b></div>
      <div class="cell"><i>베이시스</i><b class="dn">-2.59</b></div>
      <div class="cell"><i>1p</i><b>25만원</b></div>
    </div>
  </div>

  <div class="prog"><div class="pbar"><i id="pbar"></i></div><span id="ptxt">읽음 <b>0</b>/100</span></div>

  <div class="searchwrap">
    <span class="ic">🔍</span>
    <input id="q" type="search" placeholder="낱말로 찾기 (예: 스트래들, 세타, 증거금)" autocomplete="off" enterkeyhint="search" />
    <button class="clr" id="clr" aria-label="지우기">✕</button>
  </div>

  <div class="pills">
    <button class="pill on" data-f="all">전체 <b id="cnt-all">100</b></button>
    <button class="pill" data-f="basic">기초·선물 <b id="cnt-basic">20</b></button>
    <button class="pill" data-f="opt">옵션기초 <b id="cnt-opt">20</b></button>
    <button class="pill" data-f="spread">스프레드·전략 <b id="cnt-spread">20</b></button>
    <button class="pill" data-f="greek">그릭스·변동성 <b id="cnt-greek">20</b></button>
    <button class="pill" data-f="real">실전·리스크 <b id="cnt-real">20</b></button>
    <button class="pill" data-f="fav">⭐ 즐겨찾기</button>
    <button class="pill" data-f="done">✅ 완료</button>
  </div>

  <div class="list" id="list"></div>

  <!-- reader -->
  <div class="sheet" id="sheet">
    <div class="sh-top">
      <div class="sh-nav">
        <button class="iconbtn" id="backbtn" aria-label="목록으로">←</button>
        <div class="sh-titles">
          <div class="sh-no" id="shNo">No.001</div>
          <h2 id="shTitle">제목</h2>
        </div>
        <button class="favbtn" id="favbtn" aria-label="즐겨찾기">☆</button>
      </div>
      <div class="sh-no" style="margin-top:4px"><span id="shCat">카테고리</span></div>
    </div>
    <div class="sh-body" id="shBody"></div>
    <div class="sh-bot">
      <button class="navbtn" id="prevbtn">← 이전</button>
      <button class="donebtn" id="donebtn">완료 표시</button>
      <button class="navbtn" id="nextbtn">다음 →</button>
    </div>
  </div>

</div>
<script>const DATA=[{"id":1,"cat":"basic","t":"선물이란? '오늘 정한 가격으로 나중에 사는 약속'","badge":"개념","sim":"빵집에서 “다음 달에 식빵 100개를 오늘 가격으로 주세요” 하고 계약서를 쓰는 것. 빵은 다음 달에 오지만 값은 지금 못 박혀요. 그 계약서를 사고파는 시장이 선물시장이에요.","nums":[["기초자산","코스피200 지수","지수 자체를 사고팔아요"],["12월물 선물","752.75p","2026-11-20 종가 (-5.43%)"],["만기일","2026-12-10","그날 15:20에 거래 끝, 현금결제"],["1계약 금액","188,187,500원","752.75 × 25만원"]],"steps":["사고 싶은 결제월을 고른다 → 지금은 2612(2026년 12월물)예요.","방향을 정한다. 오르면 매수(롱), 내리면 매도(숏).","수량을 1계약부터. 1계약이 이미 1억 8,818만원어치예요.","주문은 꼭 지정가로. 시장가는 순간에 엉뚱한 값에 체결될 수 있어요.","만기 전에 반대 주문(매수했으면 매도)으로 청산한다. 안 하면 만기일에 자동 현금결제."],"good":"앞으로 지수가 오를지 내릴지 내 생각이 있을 때. 다만 방향이 틀리면 손실이 빠르게 커져요.","bad":"아무 생각 없이 '싸 보여서', 또는 생활비·비상금으로는 절대 하지 마세요.","pros":["적은 증거금으로 큰 금액을 움직일 수 있어요","오를 때도 내릴 때도 돈을 벌 수 있어요","거래 수수료가 주식보다 싸요"],"cons":["레버리지 때문에 손실도 몇 배로 커져요","만기라는 시한이 있어 기다려 줄 수 없어요","증거금이 모자라면 강제 청산돼요"],"warn":"선물은 '권리'가 아니라 '의무'예요. 사기로 했으면 반드시 사야 하고, 팔기로 했으면 반드시 팔아야 합니다. 만기일에 자동으로 현금결제되니 '잊고 있다가' 정산되는 일이 없도록 하세요.","q":"선물 1계약의 금액은 무엇으로 계산할까요?","opts":["프리미엄 × 100,000원","지수 × 250,000원","지수 × 10,000원"],"ans":1,"exp":"코스피200 선물은 지수에 25만원(거래승수)을 곱해요. 752.75p면 1억 8,818만 7,500원어치를 다루는 계약입니다.","note":""},{"id":2,"cat":"basic","t":"현물 vs 선물, 딱 한 가지가 달라요","badge":"개념","sim":"문구점에서 볼펜을 지금 사서 들고 나오면 '현물'. 오늘 값을 정하고 다음 주에 받기로 하면 '선물'이에요. 물건이 오는 날짜가 다를 뿐, 가격을 정하는 순간은 똑같이 오늘이에요.","nums":[["현물(코스피200 지수)","755.34","지금 이 순간의 지수"],["선물 F 2612","752.75p","12월에 정산할 값, 오늘 정해짐"],["차이(베이시스)","-2.59p","선물이 현물보다 2.59p 낮아요"],["차이를 돈으로","-647,500원","-2.59 × 25만원"]],"steps":["현물은 '지금 사는 것', 선물은 '나중에 정산하기로 약속한 것'으로 나눠 생각하세요.","선물 가격은 현물 지수보다 '이자·배당·남은 날짜'만큼 벌어져요. 그래서 숫자가 살짝 달라요.","만기에는 두 가격이 한 점으로 만나요. 이걸 '수렴'이라고 해요.","그래서 선물로는 만기 전에 팔아 차익을 얻고, 현물은 직접 사서 들고 있는 거예요."],"good":"만기가 가까워질수록 선물과 현물의 차이는 줄어들어요. 이 수렴을 이용하는 게 차익거래예요.","bad":"만기가 아주 멀 때는 두 가격이 많이 벌어질 수 있어 '싸다/비싸다'를 단정하면 안 돼요.","pros":["선물은 돈을 다 대지 않고 계약만 해 두는 것이라 자금이 적게 들어요","현물 지수를 통째로 사는 것보다 훨씬 간단해요"],"cons":["현물은 만기·증거금 압박이 없지만 선물은 둘 다 있어요","선물은 시한이 있어 판단이 틀리면 기다릴 시간이 없어요"],"warn":"현물을 안 이가 25,000원이라 호가 싸움이 중요해요"],"warn":"2.0p를 '겨우 2'라고 생각하면 큰일 나요. 2p = 50만원이에요. 주문 화면에서 보이는 숫자에 항상 25만을 곱해 보는 습관을 들이세요.","q":"선물이 750.00p에서 753.00p로 올랐어요. 1계약 매수의 이익은?","opts":["3,000원","75,000원","750,000원"],"ans":2,"exp":"3p 상승 × 25만원 = 75만원이에요. 승수를 곱하지 않으면 100배 틀리는 셈이죠.","note":""},{"id":5,"cat":"basic","t":"호가단위 0.05p = 12,500원, 이게 '틱'이에요","badge":"규칙","sim":"엘리베이터가 한 층씩만 움직이는 것처럼, 선물 가격은 0.05p씩만 움직일 수 있어요. 그 한 칸이 12,500원이에요. 0.03p 같은 값은 아예 주문이 안 돼요.","nums":[["틱 크기","0.05p","선물 호가단위"],["1틱 =","12,500원","0.05 × 25만원"],["10틱","0.50p = 125,000원","한 번에 움직이는 폭"],["옵션 호가단위","0.01p (2,500원)","프리미엄이 2p대일 때"],["미니 선물 틱","0.02p = 1,000원","승수 5만원"]],"steps":["주문 가격은 0.05의 배수로만 넣을 수 있어요. 752.75, 752.80, 752.85처럼요.","손절을 정할 때 '몇 틱'으로 세면 정확해요. 예: 10틱 손절 = 0.50p = 12만 5,000원.","수수료·세금을 뺀 실제 손익은 '틱 수 × 12,500원'으로 계산하세요.","호가가 한 칸 비어 있으면 그만큼 불리한 값에 체결돼요. 이게 슬리피지예요."],"good":"손절·목표를 틱 단위로 정할 때. 하루 변동이 큰 날엔 20~30틱도 우습게 움직여요.","bad":"호가가 얇은 시간(장 초반, 야간 늦은 시간)에는 한 칸 차이가 커서 불리해요.","pros":["가격이 딱 떨어져서 주문과 손절 계산이 명확해요","1틱이 12,500원이라 손실 크기를 눈으로 확인할 수 있어요"],"cons":["호가 한 칸을 넘느라 원하는 값에 못 사는 경우가 많아요","자주 사고팔면 틱만큼 손실이 쌓여요"],"warn":"옵션은 프리미엄 구간에 따라 호가단위가 달라져요(2p 미만은 0.01p). 지금 2.0대 옵션은 0.01p = 2,500원씩 움직인다는 것만 기억하세요.","q":"선물에서 0.05p 한 칸의 가치는 얼마일까요?","opts":["1,250원","12,500원","125,000원"],"ans":1,"exp":"0.05 × 250,000원 = 12,500원이에요. 이걸 '1틱'이라고 부릅니다.","note":""},{"id":6,"cat":"basic","t":"개시증거금 — 계약할 때 미리 맡기는 보증금","badge":"증거금","sim":"친구에게 100만원짜리 게임기를 빌리려면 보증금 10만원을 맡겨야 해요. 선물도 마찬가지로, 1억 8,818만원짜리 계약을 하려면 그 10%쯤 되는 보증금을 증권사에 맡겨야 해요.","nums":[["계약금액","188,187,500원","752.75p × 25만원"],["위탁증거금률","9.75%","2025년 8월 기준, 수시 변경"],["필요한 돈","약 18,348,000원","계약금액 × 9.75%"],["미니 선물","약 3,670,000원","승수 5만원 기준"],["레버리지","약 10배","1,835만원으로 1억 8,818만원 운용"]],"steps":["증권사 앱에서 '주문가능금액'을 먼저 확인해요. 이보다 적으면 주문이 거부돼요.","1계약에 1,835만원이 필요하니, 계좌에 여유금이 그보다 넉넉해야 해요.","증거금은 '수수료'가 아니라 담보예요. 청산하면 돌려받아요.","증거금률은 거래소가 시장 상황에 따라 자주 바꿔요. 주문 전에 꼭 앱에서 최신 값을 확인하세요."],"good":"증거금률이 낮아졌을 때는 같은 돈으로 더 많이 할 수 있지만, 그만큼 위험도 커져요.","bad":"증거금률이 올라가면 갑자기 돈을 더 넣어야 해요. 그때 몰리면 강제 청산될 수 있어요.","pros":["적은 돈으로 큰 계약을 할 수 있어요","증거금은 담보라서 청산 후 돌려받아요"],"cons":["증거금이 곧 '내 손실 한도'가 아니에요. 그보다 더 잃을 수 있어요","증거금률이 오르면 추가 입금 압박이 생겨요"],"warn":"1,835만원이 있으면 1계약을 할 수 있다는 뜻이지, 1,835만원까지만 잃는다는 뜻이 아니에요. 지수가 10% 내리면 1,881만원이 사라져 증거금을 넘어섭니다.","q":"개시증거금은 무엇을 뜻할까요?","opts":["거래 수수료","계약을 위해 맡기는 보증금","세금"],"ans":1,"exp":"수수료가 아니라 담보예요. 청산하면 정산 후 돌려받습니다. 다만 손실이 나면 그만큼 깎여서 돌아와요.","note":""},{"id":7,"cat":"basic","t":"유지증거금과 마진콜 — 보증금이 모자라면 생기는 일","badge":"증거금","sim":"보증금 10만원으로 빌린 게임기에 흠집이 나서 보증금이 5만원까지 깎였어요. 그러면 주인집에서 “5만원 더 채워 넣어” 하고 문자를 보내요. 못 채우면 물건을 뺏기죠. 이게 마진콜이에요.","nums":[["개시증거금","약 1,835만원","9.75%"],["유지증거금","약 1,223만원","6.5% 수준"],["마진콜 발생","잔액 < 1,223만원","그때 추가 입금 요구"],["반대매매","다음 영업일","못 채우면 강제 청산"]],"steps":["매일 장 마감 후 내 계좌의 '증거금 잔액'을 확인해요.","잔액이 유지증거금 밑으로 떨어지면 증권사가 추가 입금을 요구해요(마진콜).","정해진 시간 안에 못 넣으면 증권사가 내 포지션을 반대로 팔아버려요(반대매매).","그래서 계좌에는 '개시증거금 + 여유금 2배'를 두는 게 안전해요."],"good":"지수가 급하게 움직이는 날, 하루 5% 이상 출렁이는 날엔 마진콜이 몰려요.","bad":"계좌를 증거금 딱 맞게 채워 두면 안 됩니다. 1틱만 밀려도 마진콜이 와요.","pros":["위험을 미리 알려 주는 안전장치예요","손실이 무한정 커지기 전에 정리해 줘요"],"cons":["마진콜은 감정적으로 판단을 흐리게 해요","반대매매는 내가 원하지 않는 가격에 체결돼요"],"warn":"마진콜을 받고도 버티면 반대매매 가격이 최악일 수 있어요. 이날처럼 지수가 5% 넘게 빠진 날은 유지증거금이 몇 시간 만에 무너지기도 합니다. 계좌의 절반은 항상 비워 두세요.","q":"유지증거금 아래로 잔액이 내려가면 가장 먼저 일어나는 일은?","opts":["아무 일도 없다","증권사가 추가 입금을 요구한다","자동으로 이익이 난다"],"ans":1,"exp":"마진콜(추가증거금 납부 요구)이에요. 기한 안에 못 채우면 다음 영업일에 반대매매가 나갑니다.","note":""},{"id":8,"cat":"basic","t":"일일정산 — 매일 저녁 손익이 '진짜'가 돼요","badge":"규칙","sim":"하루가 끝나면 용돈 장부를 쓰는 것과 같아요. 오늘 번 돈과 잃은 돈을 종이에 적으면 다음 날 시작 금액이 바뀌어요. 선물도 매일 15:45에 장부를 정리해요.","nums":[["정산 시각","정규장 마감 후","15:45 이후"],["정산가격","당일 종가 기준","약정가 아닌 정산가"],["정산 결과","계좌에 즉시 반영","이익은 입금, 손실은 차감"],["남은 날","21일","그동안 매일 반복"]],"steps":["장 마감 후 증권사 앱에서 '정산 내역'을 확인해요.","평가손익이 '실현손익'으로 바뀌어 계좌 잔고에 반영돼요.","이익이 나면 출금할 수 있는 돈이 늘고, 손실이 나면 증거금이 줄어요.","다음 날 아침 잔고가 줄어 있으면 마진콜 위험을 먼저 확인하세요."],"good":"하루 이상 들고 갈 때는 매일 정산을 확인해야 해요. 특히 밤사이 해외시장이 크게 움직인 날.","bad":"장 마감 직전에 잔고를 확인하지 않고 넘기면 다음 날 아침에 놀랄 수 있어요.","pros":["손익이 매일 확정돼서 '얼마 남았는지'가 분명해요","복리 효과(번 돈으로 더 하는 것)가 생겨요"],"cons":["하루만 버텨 보려는 '존버'가 통하지 않아요","정산으로 증거금이 줄면 다음 날 포지션이 줄어요"],"warn":"일일정산은 '내일 다시 시작'을 강제해요. 오늘 손실이 컸다면 내일은 같은 크기로 다시 하지 말고 계약 수를 줄이세요. 정산가격은 종가가 아니라 거래소가 정한 정산가라서 마지막 순간 가격과 조금 다를 수 있어요.","q":"선물 손익이 '실현'되는 시점은?","opts":["청산할 때만","매일 장 마감 후 정산 때","만기일에만"],"ans":1,"exp":"선물은 매일 정산해요. 그래서 오래 들고 있어도 손익이 매일 계좌에 반영되고, 그만큼 증거금도 매일 변합니다.","note":""},{"id":9,"cat":"basic","t":"베이시스 — 선물이 현물보다 2.59p 싸요","badge":"시세","sim":"같은 아이스크림이 마트에서 1,000원, 편의점에서 1,100원인 것처럼, 같은 코스피200인데 현물과 선물 가격이 조금 달라요. 그 차이가 베이시스예요.","nums":[["선물 F 2612","752.75p","2026-11-20 종가"],["현물 코스피200","755.34p","같은 날 종가"],["베이시스","-2.59p","선물 - 현물"],["돈으로","-647,500원","2.59 × 25만원"],["만기까지","21일","12월 10일 수렴"]],"steps":["베이시스 = 선물 가격 − 현물 지수. 이날은 752.75 − 755.34 = -2.59p예요.","음수면 '백워데이션'(선물이 저렴), 양수면 '콘탱고'(선물이 비쌈)라고 해요.","만기가 다가오면 이 차이는 0을 향해 줄어요(수렴).","차익거래꾼은 이 차이를 먹고, 개인은 '시장 심리'를 읽는 신호로 봐요."],"good":"베이시스가 크게 벌어졌다가 좁혀질 때. 다만 개인이 직접 차익거래를 하긴 어려워요.","bad":"베이시스만 보고 방향을 정하면 안 돼요. 이자·배당 때문에 원래 음수일 수 있어요.","pros":["시장이 얼마나 불안한지 보여 주는 지표예요","만기 수렴은 거의 확실한 규칙이에요"],"cons":["배당·금리에 따라 부호가 계속 바뀌어요","개인이 이 차익을 직접 먹기는 어려워요"],"warn":"베이시스가 -2.59p라는 건 선물이 647,500원만큼 싸다는 뜻이에요. 하지만 12월 배당이 다가오면 원래 이렇게 음수가 되는 게 정상이에요. '싸다'고 사면 안 되고, 만기 수렴 폭만큼의 이익이 이미 정해져 있다고 생각해야 해요.","q":"베이시스가 -2.59p라는 말의 뜻은?","opts":["선물이 현물보다 2.59p 높다","선물이 현물보다 2.59p 낮다","두 가격이 같다"],"ans":1,"exp":"선물(752.75) − 현물(755.34) = -2.59p예요. 음수 베이시스를 백워데이션이라고 합니다.","note":""},{"id":10,"cat":"basic","t":"콘탱고와 백워데이션, 방향이 반대인 두 얼굴","badge":"시세","sim":"우유가 유통기한이 길수록 조금 더 비싼 것처럼, 먼 미래의 물건은 보관·이자 비용 때문에 비싼 게 보통이에요(콘탱고). 그런데 지금처럼 '당장 필요하다'는 사람이 많으면 오히려 싸져요(백워데이션).","nums":[["오늘 베이시스","-2.59p","백워데이션 상태"],["콘탱고 예","+1.30p","이자만 반영했을 때"],["백워데이션 폭","647,500원","2.59 × 25만원"],["원인","12월 배당·수급","배당락 전 매도 압력"]],"steps":["콘탱고인지 백워데이션인지부터 확인해요. 부호 하나로 해석이 완전히 달라져요.","콘탱고 = 선물 > 현물. 이자·보관 비용이 반영된 정상 상태예요.","백워데이션 = 선물 < 현물. 배당이 크거나, 지금 팔려는 사람이 많다는 신호예요.","12월물은 배당락(12월 말)을 앞두고 백워데이션이 흔해요. 놀랄 일이 아니에요."],"good":"배당 시즌(11~12월)에는 백워데이션이 자연스러워요. 3월물로 넘어가면 콘탱고로 돌아오기도 해요.","bad":"콘탱고/백워데이션만으로 '오른다/내린다'를 예측하면 안 돼요. 그건 가격 차이지 방향이 아니에요.","pros":["시장의 수급과 심리를 읽을 수 있어요","만기 수렴을 이용한 전략의 기초가 돼요"],"cons":["부호가 자주 바뀌어 초보가 헷갈리기 쉬워요","배당·금리라는 외부 요인이 커서 단독 판단은 위험해요"],"warn":"백워데이션이 크다고 '선물이 싸니 사자'는 아니에요. 만기까지 그 차이가 유지되면 이익이 없고, 오히려 배당락으로 지수가 빠지면 선물도 같이 빠집니다.","q":"선물이 현물보다 낮은 상태를 뭐라고 할까요?","opts":["콘탱고","백워데이션","수렴"],"ans":1,"exp":"선물 < 현물이면 백워데이션이에요. 이날 -2.59p가 바로 그 상태입니다.","note":""},{"id":11,"cat":"basic","t":"이론가 — 선물의 '제값'을 계산해 보기","badge":"계산","sim":"친구에게 10만원을 빌려주면 이자를 조금 붙여 받아요. 선물 가격도 '현물 가격 + 이자 − 배당'으로 계산한 제값(이론가)이 있어요. 시장 가격이 이 제값에서 얼마나 떨어졌는지를 보는 거예요.","nums":[["현물","755.34p","기준"],["이자 비용","+1.30p","연 3% × 21/365"],["배당(예시)","-3.78p","0.5% 가정"],["이론가","752.86p","755.34+1.30-3.78"],["실제 선물","752.75p","괴리 -0.11p"]],"steps":["공식은 '이론가 = 현물 + 이자 − 배당'이에요. 이자와 배당은 남은 날짜에 비례해요.","금리 3%, 배당 0.5%로 계산하면 21일 동안 이자 1.30p, 배당 3.78p예요.","이론가 752.86p와 실제 752.75p의 차이는 -0.11p, 돈으로 -27,500원이에요.","괴리가 크면(예: 1p 이상) 차익거래 기회가 생기고, 곧 좁혀지는 경우가 많아요."],"good":"금리·배당 발표가 있는 시기, 그리고 만기 직전에 이론가와의 차이를 점검할 때.","bad":"이자·배당을 모른 채 '이론가보다 싸다'고 단정하면 안 돼요. 배당 추정이 틀리면 결론도 틀려요.","pros":["가격이 합리적인지 판단하는 기준이 돼요","차익거래의 출발점이에요"],"cons":["이자율·배당을 정확히 알아야 해서 계산이 복잡해요","괴리가 있어도 개인이 바로 먹기 어려워요"],"warn":"이론가는 '정답'이 아니라 '기준선'이에요. 배당 추정치는 사람마다 다르고, 실제 시장은 수급으로 움직여요. 이 값은 '지금 선물이 얼마나 눌려 있는지'를 재는 자로만 쓰세요.","q":"선물 이론가를 구하는 공식은?","opts":["현물 + 이자 − 배당","현물 − 이자 + 배당","현물 × 2"],"ans":0,"exp":"현물을 빌려 사서 만기까지 들고 있으면 이자(조달비용)가 들고, 배당은 받아요. 그래서 '현물 + 이자 − 배당'이 이론가예요.","note":""},{"id":12,"cat":"basic","t":"만기일 12월 10일, 그날 15:20에 끝나요","badge":"규칙","sim":"여름방학 마지막 날처럼, 선물에는 반드시 끝나는 날이 있어요. 12월물은 2026년 12월 10일 목요일, 그날 15:20에 거래가 끝나고 현금으로 정산돼요.","nums":[["최종거래일","2026-12-10(목)","12월 둘째 목요일"],["마감 시간","15:20","평소보다 25분 빨라요"],["잔존일","21일","11월 20일 기준"],["결제 방식","현금결제","주식을 주고받지 않아요"],["최종결제일","12월 11일(금)","다음 거래일"]],"steps":["달력에 만기일을 크게 적어 두세요. 잊으면 자동 정산돼요.","최종거래일에는 15:20에 거래가 끝나니, 그 전에 청산 여부를 정해야 해요.","만기까지 들고 가면 '최종 정산가'  매수자(베가 플러스)는 이익입니다.","note":""},{"id":66,"cat":"greek","t":"로(Rho) — 금리에는 얼마나 민감할까","badge":"로","sim":"은행 이자가 오르면 예금이 매력적이죠. 옵션도 금리에 조금 반응해요. 그 민감도가 로예요. 다만 21일짜리 짧은 옵션에서는 영향이 아주 작아요.","nums":[["잔존 21일","로 거의 0","금리 영향 미미"],["잔존 3개월","조금 커짐","캘린더에서 중요"],["금리 1%p 상승","콜 소폭 상승","행사가가 높을수록 커요"],["이 백과의 결론","무시해도 됨","21일 기준"]],"steps":["로는 '금리 1%p 변할 때 프리미엄 변화'예요.","만기가 짧으면 로가 거의 0이에요. 21일짜리는 신경 쓰지 않아도 돼요.","만기가 길어질수록(3개월 이상) 로가 커져요. 캘린더 스프레드에서 중요해져요.","초보는 로를 '있다' 정도만 알고 넘어가세요."],"good":"장기 옵션이나 캘린더 스프레드를 할 때만 확인하세요.","bad":"21일짜리 옵션에서 로를 걱정하는 것. 시간 낭비예요.","pros":["장기 전략에서 금리 위험을 관리할 수 있어요","이론가 계산의 정확도가 올라가요"],"cons":["짧은 옵션엔 영향이 거의 없어요","금리 전망을 맞히기 어려워요"],"warn":"로는 초보에게 '존재하지 않는 것'과 같아요. 이 백과의 21일 옵션에서는 계산에 넣지 않아도 돼요. 대신 세타와 베가를 확실히 익히세요.","q":"만기 21일 옵션에서 로(Rho)의 영향은?","opts":["아주 크다","거의 없다","세타보다 크다"],"ans":1,"exp":"만기가 짧을수록 금리 민감도(로)는 급격히 작아져요. 21일짜리는 무시할 수준입니다.","note":""},{"id":67,"cat":"greek","t":"내재변동성(IV) — 시장이 기대하는 출렁임","badge":"변동성","sim":"기상청이 '내일 바람이 얼마나 불지' 예보하는 것과 같아요. IV는 시장이 생각하는 앞으로의 출렁임이에요. 높을수록 옵션이 비싸요.","nums":[["콜 IV","47.20 ~ 47.58%","8개 종목"],["풋 IV","76.19 ~ 80.97%","12개 종목"],["21일 기대 변동","약 ±11.4%","47.5% × √(21/365)"],["지수로","약 ±86p","755.34 × 11.4%"]],"steps":["IV는 옵션 가격에 이미 들어 있는 '기대 변동성'이에요. 계산으로 뽑아낸 값이에요.","콜 IV 47.5%면 앞으로 1년 동안 47.5% 출렁일 것으로 본다는 뜻이에요.","21일로 환산하면 ±11.4%, 약 86p예요. 755에서 669~841을 본다는 뜻이에요.","그래서 900 콜이 5% 확률로만 이익이 되는 거예요."],"good":"IV가 낮을 때 매수, 높을 때 매도가 기본이에요. 지금처럼 급락 직후는 IV가 높아요.","bad":"IV를 '예측'으로 오해하는 것. IV는 기대일 뿐 보장이 아니에요.","pros":["시장의 공포를 숫자로 볼 수 있어요","옵션 가격이 싼지 비싼지 판단할 수 있어요"],"cons":["IV가 높다고 꼭 크게 움직이는 건 아니에요","IV만으로 방향은 알 수 없어요"],"warn":"IV 47%는 '많이 출렁일 것'이라는 뜻이지 '오른다'는 뜻이 아니에요. 방향은 따로 판단해야 해요. IV와 방향을 섞으면 큰 실수를 합니다.","q":"IV(내재변동성)가 뜻하는 것은?","opts":["주가가 오른다","앞으로 얼마나 출렁일지에 대한 기대","배당금"],"ans":1,"exp":"IV는 방향이 아니라 '변동 폭'에 대한 기대예요. 그래서 방향 판단과는 별개입니다.","note":""},{"id":68,"cat":"greek","t":"역사적 변동성(HV)과 비교 — 지금 옵션이 비싼가?","badge":"변동성","sim":"지난달 시험 난이도(과거)와 이번 달 예상 난이도(기대)를 비교하는 것. 과거보다 기대가 훨씬 높으면 '비싸다'고 볼 수 있어요.","nums":[["IV(기대)","47.5% (콜)","옵션 가격에 반영"],["HV(최근 20일 실제)","예: 38%","지난 움직임"],["차이","IV > HV","옵션이 비싼 편"],["풋 IV","79%","훨씬 높아요"]],"steps":["HV는 지난 20~60일 실제로 얼마나 움직였는지 계산한 값이에요.","IV가 HV보다 크면 '기대가 과하다' = 옵션이 비싸다로 봐요.","IV가 HV보다 작으면 '싸다'로 보고 매수를 고려해요.","단, 급락 직후엔 IV가 정당하게 높아요. 무조건 '비싸다'가 아니에요."],"good":"IV/HV 비율이 1.2를 넘으면 매도 쪽, 0.9 아래면 매수 쪽을 고려해요.","bad":"HV만 보고 '무조건 싸다'고 판단하는 것. 시장 상황이 달라졌을 수 있어요.","pros":["가격의 비싼/싼을 판단하는 기준이 돼요","전략 선택에 도움을 줘요"],"cons":["HV는 과거라 미래를 보장하지 않아요","계산 기간에 따라 값이 달라져요"],"warn":"이날 지수가 5.5% 빠졌으니 HV도 급등했을 거예요. 그럼 'IV가 비싸다'는 판단이 약해져요. HV와 IV는 함께 봐야 의미가 있습니다.","q":"IV가 HV보다 크게 높을 때 일반적으로 보는 것은?","opts":["옵션이 싸다","옵션이 비싸다","만기가 짧다"],"ans":1,"exp":"기대(IV)가 과거 실제(HV)보다 크면 옵션이 비싸게 거래된다고 봐요. 그래서 매도 쪽을 고려합니다.","note":""},{"id":69,"cat":"greek","t":"IV 크러시 — 이벤트가 끝나면 프리미엄이 뚝","badge":"변동성","sim":"시험 전날엔 학원이 붐비고 값이 비싸요. 시험이 끝나면 다음 날 조용해지고 값도 떨어져요. 이벤트가 끝난 옵션이 딱 그래요.","nums":[["C 900 IV 47.5%","2.62p","이벤트 전"],["IV 40%로 하락","약 0.96p","-1.66p, 약 -63%"],["IV 10%p 하락","약 -58만원","베가 근사, 프리미엄의 88%"],["지수가 그대로여도","손실","IV만 빠져도"]],"steps":["큰 이벤트(금리 결정, 선거) 전엔 IV가 올라 옵션이 비싸져요.","이벤트가 끝나면 불확실성이 사라져 IV가 뚝 떨어져요. 이게 IV 크러시예요.","지수가 내 방향으로 움직여도, IV 하락이 그 이익을 상쇄할 수 있어요.","그래서 이벤트 직전 매수는 '방향을 맞혀도 손해'일 수 있어요.","이벤트 전에는 매도(베가 마이너스)가 유리할 수 있지만, 방향 위험이 커요."],"good":"이벤트 직후(크러시 후) IV가 낮아졌을 때 매수하는 게 유리해요.","bad":"이벤트 하루 전에 IV가 높은 옵션을 사는 것.","pros":["IV 흐름을 이해하면 타이밍이 좋아져요","매도 전략의 근거가 돼요"],"cons":["방향을 맞혀도 손해가 날 수 있어요","타이밍을 놓치면 급격히 손실이에요"],"warn":"IV 크러시는 '방향을 맞혔는데도 지는' 대표적 함정이에요. 이벤트 전날 사면 이미 비싸게 사는 거예요. 이벤트는 '끝나고' 사는 게 기본입니다.","q":"이벤트 직후 IV가 급락하면 옵션 매수자는?","opts":["이익","지수가 그대로여도 손실","아무 영향 없다"],"ans":1,"exp":"베가가 마이너스로 작용해 프리미엄이 줄어요. 방향이 맞아도 IV 하락이 이익을 상쇄할 수 있습니다.","note":""},{"id":70,"cat":"greek","t":"변동성 스큐 — 왜 풋이 콜보다 비쌀까","badge":"변동성","sim":"같은 우산인데 '폭풍용'이라고 붙으면 더 비싸요. 시장은 하락(폭풍)을 더 무서워해서 풋에 더 높은 값을 매겨요. 이 기울기를 스큐라고 해요.","nums":[["콜 IV","47.20 ~ 47.58%","8개 종목"],["풋 IV","76.19 ~ 80.97%","12개 종목"],["IV 차이","약 30%p","풋이 훨씬 높아요"],["같은 날","-5.53% 급락","공포가 반영"]],"steps":["스큐는 '행사가에 따라 IV가 달라지는 기울기'예요.","이날 콜 IV는 47%대, 풋 IV는 76~81%예요. 같은 지수, 같은 날인데 30%p 차이예요.","이유는 두 가지예요. 하나는 하락 공포, 다른 하나는 기관의 하락 헤지 수요예요.","그래서 풋을 사는 건 비싼 보험을, 파는 건 비싼 보험료를 받는 거예요."],"good":"풋 IV가 아주 높을 때(지금처럼)는 풋 매수에 불리해요. 콜 IV가 상대적으로 싸요.","bad":"스큐를 모르고 '풋이 원래 비싼 것'이라고 생각하는 것.","pros":["시장의 공포를 정확히 볼 수 있어요","콜과 풋의 상대 가격을 판단할 수 있어요"],"cons":["스큐는 계속 변해요","높은 IV는 매수자에게 불리해요"],"warn":"풋 IV 79%는 '보험이 아주 비싼 상태'예요. 여기서 풋을 사면 지수가 빠져도 IV 하락으로 손실이 날 수 있어요. 반대로 이때 풋을 파는 건 '비싼 보험료를 받는' 것이지만, 급락하면 큰 손실이에요.","q":"풋 IV가 콜 IV보다 높은 현상을 무엇이라고 하나요?","opts":["변동성 스큐","콘탱고","베이시스"],"ans":0,"exp":"하락 쪽 IV가 더 높은 기울기를 변동성 스큐라고 해요. 시장이 하락을 더 무서워하기 때문입니다.","note":""},{"id":71,"cat":"greek","t":"스마일 곡선 — 행사가마다 IV가 달라요","badge":"변동성","sim":"미소 짓는 입 모양처럼, 양쪽 끝(아주 높거나 낮은 행사가)의 IV가 가운데보다 높아요. 이날 데이터에서도 그 모양이 보여요.","nums":[["P 540 IV","80.97%","아래쪽 끝, 가장 높아요"],["P 567.5 IV","76.19%","조금 낮아져요"],["C 892.5 IV","47.20%","위쪽은 낮아요"],["C 910 IV","47.53%","거의 평평"]],"steps":["행사가를 가로축, IV를 세로축으로 그리면 곡선이 나와요. 이걸 스마일이라고 해요.","이날은 아래쪽(풋) IV가 76~81%로 아주 높고, 위쪽(콜)은 47%대로 평평해요.","완전한 미소보다 '한쪽으로 기운' 모양이에요. 급락장의 특징이에요.","이 곡선을 보면 '어느 쪽 옵션이 비싼지' 한눈에 알 수 있어요."],"good":"행사가를 고를 때 IV가 낮은 쪽을 선호하세요(같은 확률이면 싸니까).","bad":"IV가 가장 높은 행사가(지금은 풋 아래쪽)를 매수하는 것.","pros":["전체 옵션 시장의 심리를 한 장으로 볼 수 있어요","비싼 행사가를 피할 수 있어요"],"cons":["곡선이 매일 바뀌어요","초보가 해석하기 어려워요"],"warn":"스마일을 모르면 '풋이 원래 비싼 것'으로 오해해요. 이날 풋 IV 81%는 아주 높은 상태예요. 2.06p가 싸 보여도 IV로 보면 비싼 겁니다.","q":"이날 데이터에서 IV가 가장 높은 종목은?","opts":["C 892.5","P 540","C 910"],"ans":1,"exp":"P 540의 IV가 80.97%로 가장 높아요. 아래쪽으로 갈수록 IV가 높은 스큐 구조입니다.","note":""},{"id":72,"cat":"greek","t":"VKOSPI — 시장 전체의 공포 온도계","badge":"변동성","sim":"학교 전체의 '긴장 온도'를 재는 온도계예요. VKOSPI는 코스피200 옵션 가격으로 계산한 30일 기대 변동성이에요.","nums":[["계산 기준","코스피200 옵션","30일 만기"],["이날 콜 IV","47%대","외가격"],["이날 풋 IV","76~81%","훨씬 높아요"],["확인처","KRX 정보데이터시스템","지수 공표"]],"steps":["VKOSPI는 여러 옵션의 IV를 섞어 만든 '대표 변동성'이에요.","20을 넘으면 긴장, 30을 넘으면 공포로 보는 게 일반적이에요.","이날처럼 지수가 5.5% 빠진 날은 VKOSPI가 크게 올라 있어요.","정확한 수치는 KRX 정보데이터시스템에서 매일 확인할 수 있어요."],"good":"VKOSPI가 급등한 직후는 옵션이 비싼 구간이에요. 매수보다 관망이 나아요.","bad":"VKOSPI 숫자만 보고 방향을 예측하는 것. 그건 변동성이지 방향이 아니에요.","pros":["시장 전체 공포를 한 숫자로 볼 수 있어요","옵션 가격 수준을 판단할 수 있어요"],"cons":["방향을 알려 주지 않아요","급등락이 심해 해석이 어려워요"],"warn":"VKOSPI가 높다는 건 '옵션이 비싸다'는 뜻이에요. 이때 옵션을 사면 비싸게 사는 거예요. 공포가 클수록 매수는 불리하고, 매도는 위험해요.","q":"VKOSPI가 높을 때 옵션 가격은?","opts":["싸다","비싸다","변화 없다"],"ans":1,"exp":"VKOSPI는 기대 변동성이에요. 높을수록 프리미엄이 비싸집니다.","note":""},{"id":73,"cat":"greek","t":"델타 헤지 — 선물로 방향 위험 지우기","badge":"헤지","sim":"배가 한쪽으로 기울면 반대쪽에 물을 실어 균형을 맞추는 것. 옵션의 델타만큼 선물을 반대로 잡아 방향 위험을 0으로 만들어요.","nums":[["C 900 100계약","델타 6.56","0.0656 × 100"],["헤지 선물","6.56계약 매도","반올림 7계약"],["헤지 후","델타 중립","방향 위험 0"],["남는 위험","감마·세타·베가","방향 외 위험"]],"steps":["보유 옵션의 총 델타를 계산해요(계약 수 × 델타).","그 델타만큼 반대 방향으로 선물을 잡아요. 델타 6.56이면 선물 6.56계약 매도예요.","그러면 지수가 조금 움직여도 손익이 거의 0이 돼요(델타 중립).","하지만 시간이 지나면 델타가 변해 다시 맞춰야 해요(재헤지).","초보는 이걸 직접 하지 않아요. 기관의 헤지 원리를 이해하는 용도예요."],"good":"기관의 프로그램 매매가 어떻게 움직이는지 이해할 때.","bad":"개인이 델타 헤지를 직접 하려는 것. 수수료와 슬리피지가 더 커요.","pros":["방향 위험을 정확히 0으로 만들 수 있어요","시장 충격을 흡수하는 역할을 해요"],"cons":["계속 다시 맞춰야 해요","거래비용이 발생해요"],"warn":"델타 헤지를 하면 '방향'은 지워지지만 '시간(세타)'과 '변동성(베가)'은 남아요. 그래서 헤지해도 돈을 잃을 수 있어요. 초보는 헤지보다 '크기를 줄이는 것'이 낫습니다.","q":"델타 6.56인 콜 포지션을 중립으로 만들려면?","opts":["선물 6.56계약 매수","선물 6.56계약 매도","옵션을 더 산다"],"ans":1,"exp":"콜 매수의 델타가 플러스이므로, 같은 크기의 선물 매도로 상쇄해요. 그러면 델타가 0이 됩니다.","note":""},{"id":74,"cat":"greek","t":"숏 감마의 공포 — 만기일이 위험한 이유","badge":"위험","sim":"좁은 골목에서 자동차가 미끄러지는 것처럼, 만기일엔 가격이 조금만 움직여도 손익이 크게 흔들려요. 감마가 폭발하는 날이에요.","nums":[["만기 21일","감마 0.0015/p","작아요"],["만기 1일","감마 수십 배","폭발"],["ATM 근처","가장 위험","핀닝 구간"],["숏 감마","손실이 가속","헤지 매매 유발"]],"steps":["감마는 만기가 가까울수록 커져요. 특히 ATM 근처에서요.","옵션을 판 사람(숏 감마)은 지수가 움직일 때마다 손실이 가속해요.","그래서 딜러들이 만기일 오후에 지수를 따라 선물을 사고팔아요. 이게 지수를 특정 가격에 고정시키는 핀닝이에요.","만기일 오후엔 새 포지션을 잡지 말고 관망하세요."],"good":"만기일 오전에 정리하고, 오후엔 관망하세요.","bad":"만기일 오후에 ATM 근처 옵션을 파는 것. 감마 폭발 구간이에요.","pros":["만기일 움직임을 이해하면 손실을 피할 수 있어요","핀닝 가격을 예측할 수 있어요"],"cons":["예측이 어려워요","개인이 감마를 관리하기 힘들어요"],"warn":"만기일 오후에 reek","t":"IV가 높을 때와 낮을 때, 무엇을 사고 팔까","badge":"전략","sim":"세일 기간엔 사고, 성수기엔 팔아요. 옵션도 IV가 낮으면 사고, 높으면 파는 게 기본이에요. 다만 '높다/낮다'는 과거와 비교해 판단해요.","nums":[["풋 IV 79%","높음","풋 매수 불리"],["콜 IV 47%","상대적으로 낮음","콜 매수 유리"],["IV 10%p 차이","57만원","C 900 기준"],["HV 비교","필수","과거와 비교해 판단"]],"steps":["IV를 HV(과거 변동성)와 비교해 '높다/낮다'를 판단해요.","IV가 높으면 매도(베가 마이너스)가 유리하지만, 방향 위험이 커요.","IV가 낮으면 매수(베가 플러스)가 유리해요. 프리미엄이 싸니까요.","이날은 풋 IV가 79%로 높고 콜 IV가 47%로 상대적으로 낮아요.","그래서 '콜 매수 + 풋 매도'가 IV 측면에서 유리한 구도예요(위험은 큼)."],"good":"IV가 낮을 때 매수, 높을 때 매도. 이 원칙만 지켜도 절반은 이겨요.","bad":"급락한 날 겁이 나서 풋을 사는 것. 그때가 가장 비쌀 때예요.","pros":["같은 전략도 IV에 따라 성과가 달라져요","가격의 비싼/싼을 판단할 수 있어요"],"cons":["IV 판단이 틀릴 수 있어요","높은 IV엔 이유가 있어요"],"warn":"IV가 높다고 무조건 파는 건 위험해요. 이날 풋 IV 79%는 '더 빠질지도'라는 공포예요. 그 공포가 현실이 되면 매도자는 크게 잃어요. IV 전략은 소액으로만.","q":"IV가 낮을 때 유리한 포지션은?","opts":["옵션 매수","옵션 매도","관계없다"],"ans":0,"exp":"IV가 낮으면 프리미엄이 싸서 매수에 유리해요. IV가 오르면 베가 이익도 생깁니다.","note":""},{"id":78,"cat":"greek","t":"이벤트와 IV — 금리 결정·만기·실적 발표","badge":"변동성","sim":"소풍 전날은 설레서 잠이 안 오고, 다음 날은 조용해져요. 시장도 이벤트 전엔 들떠서 IV가 오르고, 끝나면 조용해져요.","nums":[["이벤트 전","IV 상승","프리미엄 비싸짐"],["이벤트 후","IV 급락","크러시"],["만기일","IV 하락","시간가치 0"],["이날처럼 급락","IV 급등","풋 79%"]],"steps":["큰 이벤트(금리 결정, 선거, 실적) 전엔 IV가 올라요.","이벤트가 지나면 IV가 급격히 내려와요. 방향을 맞혀도 손실이 날 수 있어요.","그래서 '이벤트는 끝나고 사는' 것이 기본이에요.","만기일에도 IV가 빠져요. 아무리 맞혀도 프리미엄이 사라져요."],"good":"이벤트 직후 IV가 낮아진 뒤에 진입하세요.","bad":"이벤트 하루 전에 옵션을 사는 것. 이미 비싸게 사는 거예요.","pros":["이벤트 타이밍을 활용할 수 있어요","IV 흐름을 예측할 수 있어요"],"cons":["이벤트 결과는 알 수 없어요","IV 크러시가 이익을 상쇄해요"],"warn":"이날 지수가 5.5% 빠진 것도 하나의 '이벤트'예요. 그 결과 풋 IV가 79%까지 올랐어요. 여기서 풋을 사면 '공포를 비싸게 사는' 것이고, 팔면 '공포에 베팅하는' 것이에요.","q":"이벤트 전에 옵션을 사면 불리한 이유는?","opts":["IV가 이미 높아 비싸서","거래량이 적어서","만기가 짧아서"],"ans":0,"exp":"이벤트 전엔 기대가 커져 IV가 올라 있어요. 그래서 비싸게 사고, 이벤트 후 IV 크러시로 손해를 봅니다.","note":""},{"id":79,"cat":"greek","t":"프리미엄을 움직이는 세 가지 — 방향·시간·변동성","badge":"정리","sim":"자동차의 핸들(방향), 연료(시간), 날씨(변동성)처럼 프리미엄을 움직이는 힘은 세 가지예요. 어느 것이 큰지 알면 다음 움직임을 예상할 수 있어요.","nums":[["지수 1p 상승","+16,500원","델타 0.066"],["하루 경과","-65,209원 ["연속 손실","2회면 중단","그날은 끝"],["수수료","3,000원 × 횟수","10회면 3만원"],["복구 매매","금지","가장 위험"]],"steps":["아침에 '오늘은 2번만 한다'고 종이에 적어요.","2번을 채우면 앱을 닫아요. 더 보면 손이 근질거려요.","연속 2번 틀리면 그날은 끝내요. 복구하려는 마음이 가장 위험해요.","이익이 난 날도 마찬가지예요. '더 벌자'가 다음 손실의 시작이에요."],"good":"항상. 특히 손실이 난 날엔 더 엄격하게.","bad":"손실 후 '본전 찾기' 매매. 이게 계좌를 끝내는 가장 흔한 길이에요.","pros":["판단이 선명해져요","수수료가 줄어요"],"cons":["기회를 놓치는 것 같아요","지루해요"],"warn":"하루 2회 제한이면 수수료 6,000원이에요. 10회면 3만원이에요. 그리고 10회 중 8회는 충동 매매예요. 횟수를 줄이면 실력이 보입니다.","q":"손실 후 '본전 찾기' 매매가 위험한 이유는?","opts":["수수료가 비싸서","판단이 흐려져 크게 잃기 때문","세금이 붙어서"],"ans":1,"exp":"손실을 만회하려는 마음은 크기를 키우고 손절을 늦춰요. 한 번의 큰 손실로 이어집니다.","note":""},{"id":100,"cat":"real","t":"하루 체크리스트 — 이 8가지만 지켜요","badge":"마무리","sim":"비행기 조종사가 이륙 전 체크리스트를 읽는 것처럼, 매매도 순서를 정해 두면 실수가 줄어요. 이 8가지를 매일 확인하세요.","nums":[["1","지수·선물 확인","755.34 / 752.75"],["2","잔존일 확인","21일 (12.10 만기)"],["3","증거금 여유","개시의 2배"],["4","손절선·목표","종이에 적기"],["5","하루 2회 제한","횟수 지키기"]],"steps":["장 전: 지수(755.34)와 선물(752.75), 잔존일(21일), 오늘의 뉴스를 확인해요.","장 전: 계좌의 주문가능금액이 증거금의 2배 이상인지 봐요.","장 전: 오늘의 시나리오와 손절선·목표를 종이에 적어요.","장 중: 하루 2회 제한, 지정가 주문, 손절 예외 없음.","장 후: 거래 일지를 쓰고, 내일 할 일을 한 줄 적어요."],"good":"매일. 5분이면 끝나요.","bad":"체크리스트 없이 '느낌'으로 주문하는 것.","pros":["실수가 줄어요","하루를 정리하는 습관이 생겨요"],"cons":["시간이 걸려요","지루해서 건너뛰게 돼요"],"warn":"이 체크리스트를 3개월 지키면 대부분의 큰 손실을 피해요. 이날처럼 -5.43%가 나는 날에도 '증거금 2배'와 '손절'이 있으면 살아남습니다. 준비가 전부예요.","q":"매매 전 체크리스트에서 가장 중요한 항목은?","opts":["오늘의 기분","손절선과 증거금 확인","친구의 조언"],"ans":1,"exp":"손절선을 미리 정하고 증거금 여유를 확인해야 그날의 변동을 견딜 수 있어요. 나머지는 그다음입니다.","note":""}];</script>
<script>/* 케비라 선물·옵션 실전 백과 100선 */
const KEY = 'kebira-futures-guide-100-v1';
const CATS = [
  ['basic', '기초·선물', '#4f46e5'],
  ['opt', '옵션 기초', '#0369a1'],
  ['spread', '스프레드·전략', '#0f766e'],
  ['greek', '그릭스·변동성', '#7c3aed'],
  ['real', '실전·리스크', '#be123c']
];
const CATMAP = Object.fromEntries(CATS.map(c => [c[0], { name: c[1], color: c[2] }]));

let S = { read: {}, ans: {}, fav: {}, manual: {} };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) S = Object.assign(S, JSON.parse(raw) || {});
} catch (e) { }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
}
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let filter = 'all', q = '', view = [], cur = 0;

/* 선택지 순서를 문항마다 고정된 방식으로 섞는다 (정답 위치가 한쪽으로 몰리지 않게) */
function permFor(id) {
  let s = (id * 9301 + 49297) % 233280;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const p = [0, 1, 2];
  for (let i = 2; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  return p;
}

/* ---------- list ---------- */
function isDone(it) { return S.ans[it.id] === it.ans || !!S.manual[it.id]; }

function buildView() {
  const kw = q.trim().toLowerCase();
  view = DATA.filter(it => {
    if (filter === 'fav' && !S.fav[it.id]) return false;
    if (filter === 'done' && !isDone(it)) return false;
    if (filter !== 'all' && filter !== 'fav' && filter !== 'done' && it.cat !== filter) return false;
    if (!kw) return true;
    const hay = [it.t, it.sim, it.badge, it.warn, it.exp, it.q, ...it.steps, ...it.pros, ...it.cons,
    ...it.nums.map(n => n.join(' '))].join(' ').toLowerCase();
    return hay.indexOf(kw) >= 0;
  });
  return view;
}

function cardHTML(it, i) {
  const c = CATMAP[it.cat];
  const marks = [];
  if (S.fav[it.id]) marks.push('⭐');
  if (S.ans[it.id] === it.ans) marks.push('✅');
  else if (isDone(it)) marks.push('✔️');
  else if (S.read[it.id]) marks.push('👁');
  return `<button class="card${isDone(it) ? ' done' : ''}" data-i="${i}">
    <span class="no">${String(it.id).padStart(2, '0')}</span>
    <span class="body">
      <span class="title">${esc(it.t)}</span>
      <span class="prev">${esc(it.sim)}</span>
      <span class="meta">
        <span class="chip ${it.cat}">${c.name}</span>
        <span class="chip tag">${esc(it.badge)}</span>
        ${marks.length ? `<span class="mk">${marks.join('')}</span>` : ''}
      </span>
    </span>
  </button>`;
}

function renderList() {
  buildView();
  const list = $('#list');
  if (!view.length) {
    list.innerHTML = `<div class="empty">${filter === 'fav' ? '아직 즐겨찾기한 항목이 없어요.<br>카드를 열고 ☆를 눌러 모아 두세요.' : filter === 'done' ? '아직 완료한 항목이 없어요.<br>카드를 열어 맨 아래 확인 퀴즈를 맞혀 보세요.' : '검색 결과가 없어요.<br>다른 낱말로 찾아보세요.'}</div>`;
    return;
  }
  const groups = CATS.filter(c => view.some(it => it.cat === c[0]));
  list.innerHTML = groups.map(c => {
    const items = view.filter(it => it.cat === c[0]);
    return `<div class="grouphead"><span class="dot" style="background:${c[2]}"></span>
      <span class="nm">${c[1]}</span><span class="ln"></span><span class="ct">${items.length}장</span></div>`
      + items.map(it => cardHTML(it, view.indexOf(it))).join('');
  }).join('') + `<div class="foot">
    <b>이 백과의 숫자는 2026년 11월 20일(금) 종가</b>입니다. 코스피200 지수 755.34(-5.53%), 12월물 선물 F 2612 752.75p(-5.43%), 만기 2026년 12월 10일(잔존 21일). 옵션 예시는 모두 그날 2.00~3.00p대에 거래된 실제 종목(콜 892.5~910, 풋 540~567.5)이고, 계산은 1계약 기준(승수 25만원)입니다.
    <br><br>이 앱은 공부용 자료예요. <b>투자 권유가 아니고, 실제 주문은 본인 판단과 책임</b>으로 하세요. 선물·옵션은 원금 전액을 잃거나 그보다 더 잃을 수 있습니다. 실제 거래 전에 <b>사전교육 → 모의투자 → 소액</b> 순서를 꼭 지키세요.</div>`;
}

function updProg() {
  const rd = DATA.filter(it => S.read[it.id]).length;
  const dn = DATA.filter(isDone).length;
  $('#pbar').style.width = (rd / DATA.length * 100) + '%';
  $('#ptxt').innerHTML = `읽음 <b>${rd}</b>/${DATA.length} · 완료 <b>${dn}</b>`;
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', p.dataset.f === f));
  renderList(); updProg();
  $('#list').scrollTop = 0;
}

/* ---------- reader ---------- */
function secHTML(it) {
  const rows = it.nums.map(n => `<tr><td>${esc(n[0])}</td><td>${esc(n[1])}</td><td>${esc(n[2] || '')}</td></tr>`).join('');
  const opts = permFor(it.id).map(i =>
    `<button class="qopt" data-o="${i}">${esc(it.opts[i])}<span class="lb">${i === it.ans ? '✓' : '✕'}</span></button>`).join('');
  return `
  <div class="sec"><h3><span class="em">🎒</span>중1 눈높이 한 줄 비유<span class="rule"></span></h3>
    <div class="analogy">${esc(it.sim)}</div></div>

  <div class="sec"><h3><span class="em">📊</span>2026년 12월물 실제 시세로 계산<span class="rule"></span></h3>
    <table class="ntable">${rows}</table>
    ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}</div>

  <div class="sec"><h3><span class="em">🎯</span>매매 기준 &amp; 따라 하는 방법<span class="rule"></span></h3>
    <ol class="steps">${it.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>

  <div class="sec"><h3><span class="em">⏰</span>어느 때 해야 좋은지<span class="rule"></span></h3>
    <div class="timing">
      <div class="tbox good"><b>이럴 때 써요</b>${esc(it.good)}</div>
      <div class="tbox bad"><b>이럴 땐 하지 마요</b>${esc(it.bad)}</div>
    </div></div>

  <div class="sec"><h3><span class="em">⚖️</span>장점 · 단점<span class="rule"></span></h3>
    <div class="pc">
      <div class="p"><b>장점</b>${it.pros.map(p => `<li>${esc(p)}</li>`).join('')}</div>
      <div class="c"><b>단점</b>${it.cons.map(p => `<li>${esc(p)}</li>`).join('')}</div>
    </div>
    <div style="height:7px"></div>
    <div class="warn">⚠️ <b>초보 절대 주의</b> — ${esc(it.warn)}</div></div>

  <div class="sec"><h3><span class="em">✅</span>이해 확인 퀴즈<span class="rule"></span></h3>
    <div class="quiz" id="quiz">
      <div class="qq"><i>Q.</i>${esc(it.q)}</div>
      ${opts}
      <div class="qexp" id="qexp"><b>해설</b> ${esc(it.exp)}</div>
    </div></div>`;
}

function applyQuiz(it) {
  const chosen = S.ans[it.id];
  if (chosen === undefined) return;
  document.querySelectorAll('.qopt').forEach(b => {
    const i = +b.dataset.o;
    if (i === it.ans) b.classList.add('right');
    else if (i === chosen) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  $('#qexp').classList.add('show');
}

function syncDoneBtn(it) {
  const db = $('#donebtn');
  db.classList.toggle('is-done', isDone(it));
  db.textContent = isDone(it) ? '✓ 완료한 장' : '완료 표시';
}

function openItem(i) {
  cur = i;
  const it = view[i];
  if (!it) return;
  S.read[it.id] = 1; save();
  const c = CATMAP[it.cat];
  $('#shCat').textContent = c.name;
  $('#shCat').style.color = c.color;
  $('#shNo').textContent = 'No.' + String(it.id).padStart(3, '0') + ' · ' + it.badge;
  $('#shTitle').textContent = it.t;
  $('#shBody').innerHTML = secHTML(it);
  $('#favbtn').classList.toggle('on', !!S.fav[it.id]);
  $('#favbtn').textContent = S.fav[it.id] ? '★' : '☆';
  $('#prevbtn').disabled = i === 0;
  $('#nextbtn').disabled = i === view.length - 1;
  syncDoneBtn(it);
  applyQuiz(it);
  $('#sheet').classList.add('open');
  $('#shBody').scrollTop = 0;
  updProg(); renderList();
}

function closeSheet() { $('#sheet').classList.remove('open'); updProg(); renderList(); }

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) { openItem(+card.dataset.i); return; }
  const pill = e.target.closest('.pill');
  if (pill) { setFilter(pill.dataset.f); return; }
  const opt = e.target.closest('.qopt');
  if (opt) {
    const it = view[cur];
    if (!it || S.ans[it.id] !== undefined) return;
    const i = +opt.dataset.o;
    S.ans[it.id] = i; save();
    applyQuiz(it);
    if (i === it.ans) toast('정답이에요! 완료로 표시했어요 ✓');
    else toast('아쉬워요. 해설을 읽고 다시 정리해 보세요');
    syncDoneBtn(it);
    updProg(); renderList();
    return;
  }
});

$('#backbtn').addEventListener('click', closeSheet);
$('#clr').addEventListener('click', () => {
  const el = $('#q'); el.value = ''; q = ''; $('.searchwrap').classList.remove('has'); renderList();
});
$('#q').addEventListener('input', e => {
  q = e.target.value; $('.searchwrap').classList.toggle('has', !!q); renderList();
});
$('#favbtn').addEventListener('click', () => {
  const it = view[cur]; if (!it) return;
  if (S.fav[it.id]) { delete S.fav[it.id]; } else { S.fav[it.id] = 1; }
  save();
  $('#favbtn').classList.toggle('on', !!S.fav[it.id]);
  $('#favbtn').textContent = S.fav[it.id] ? '★' : '☆';
  toast(S.fav[it.id] ? '즐겨찾기에 담았어요 ★' : '즐겨찾기에서 뺐어요');
  renderList();
});
$('#donebtn').addEventListener('click', () => {
  const it = view[cur]; if (!it) return;
  if (isDone(it)) { delete S.manual[it.id]; delete S.ans[it.id]; }
  else { S.manual[it.id] = 1; }
  save();
  syncDoneBtn(it);
  toast(isDone(it) ? '완료로 표시했어요' : '완료를 취소했어요');
  updProg(); renderList();
});
$('#prevbtn').addEventListener('click', () => { if (cur > 0) openItem(cur - 1); });
$('#nextbtn').addEventListener('click', () => { if (cur < view.length - 1) openItem(cur + 1); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- boot ---------- */
renderList();
updProg();
$('#cnt-all').textContent = DATA.length;
CATS.forEach(c => {
  const el = document.getElementById('cnt-' + c[0]);
  if (el) el.textContent = DATA.filter(it => it.cat === c[0]).length;
});
</script>
</body>
</html>
