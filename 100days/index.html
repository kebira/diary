<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#fbf8f1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="케비라 실전옵션" />
<title>케비라 실전옵션 · 100일간 쌩초보 옵션탈출기</title>
<meta name="description" content="중1도 따라 하는 100일 옵션 실전 코스. 2026년 12월물 실제 종가(코스피200 755.34, C900 2.62, P550 2.35)로 배우는 기초·스프레드·월물 시기·장중 시간대·델타·감마·세타·리스크." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fbf8f1; --ink:#241f1a; --sub:#6f665c; --line:#e8e0d3; --card:#fffdf8;
  --red:#e0483c; --org:#ef8b2c; --yel:#e9c432; --grn:#4c9c58; --blu:#3d7cc9; --ind:#5b5fb0; --vio:#9463b5;
  --good:#2e8b57; --bad:#d2452f;
}
html,body{margin:0;padding:0}
body{
  background:#f2ede2; color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:15px; line-height:1.62; word-break:keep-all; -webkit-font-smoothing:antialiased;
}
.app{
  max-width:430px; margin:0 auto; background:var(--bg); min-height:100dvh; height:100dvh;
  display:flex; flex-direction:column; position:relative; overflow:hidden;
  box-shadow:0 0 40px rgba(60,45,30,.12);
}
.rainbow{display:flex; height:5px; flex:0 0 5px}
.rainbow i{flex:1}
.rainbow i:nth-child(1){background:var(--red)}
.rainbow i:nth-child(2){background:var(--org)}
.rainbow i:nth-child(3){background:var(--yel)}
.rainbow i:nth-child(4){background:var(--grn)}
.rainbow i:nth-child(5){background:var(--blu)}
.rainbow i:nth-child(6){background:var(--ind)}
.rainbow i:nth-child(7){background:var(--vio)}

/* header */
.top{flex:0 0 auto; padding:13px 16px 10px; background:linear-gradient(180deg,#fffdf8,#fbf8f1 70%); border-bottom:1px solid var(--line)}
.brandrow{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.brand{font-family:"Gowun Batang",serif; font-weight:800; font-size:19px; line-height:1.25; letter-spacing:-.3px}
.brand b{color:var(--org)}
.brand span{display:block; font-family:"Noto Sans KR",sans-serif; font-weight:500; font-size:11.5px; color:var(--sub); letter-spacing:0; margin-top:3px}
.stampbox{
  flex:0 0 auto; border:1.5px solid var(--red); color:var(--red); border-radius:8px;
  font-size:11px; font-weight:900; padding:4px 7px; text-align:center; line-height:1.2; transform:rotate(-3deg);
}
.stampbox span{display:block; font-size:9px; font-weight:700; color:var(--sub)}
.snap{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:11px}
.snap .cell{background:#fff; border:1px solid var(--line); border-radius:9px; padding:5px 4px; text-align:center}
.snap .cell i{display:block; font-style:normal; font-size:9.5px; color:var(--sub); letter-spacing:-.2px}
.snap .cell b{font-size:13.5px; letter-spacing:-.4px}
.dn{color:#1d63b0}
.up{color:#c0392b}
.prog{display:flex; align-items:center; gap:9px; margin-top:10px}
.pbar{flex:1; height:7px; border-radius:99px; background:#eae3d5; overflow:hidden}
.pbar i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--grn),var(--blu)); transition:width .35s}
.prog span{font-size:11px; color:var(--sub); white-space:nowrap}
.prog span b{color:var(--ink); font-size:12.5px}

/* month tabs */
.monthtabs{flex:0 0 auto; display:flex; gap:6px; overflow-x:auto; padding:9px 12px; background:var(--bg); border-bottom:1px solid var(--line); scrollbar-width:none}
.monthtabs::-webkit-scrollbar{display:none}
.mt{
  flex:0 0 auto; border:1px solid var(--line); background:#fff; color:#4a4239; border-radius:99px;
  padding:5px 12px; font-size:12px; font-weight:800; font-family:inherit; line-height:1.2; cursor:pointer;
}
.mt span{display:none}
.mt.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.mt:nth-child(2).on{background:var(--red); border-color:var(--red)}
.mt:nth-child(3).on{background:var(--org); border-color:var(--org)}
.mt:nth-child(4).on{background:var(--grn); border-color:var(--grn)}
.mt:nth-child(5).on{background:var(--blu); border-color:var(--blu)}
.mt:nth-child(6).on{background:var(--vio); border-color:var(--vio)}

/* tools */
.tools{flex:0 0 auto; padding:8px 12px 9px; background:var(--bg); border-bottom:1px solid var(--line)}
.searchwrap{display:flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:11px; padding:0 9px; height:36px}
.searchwrap .ic{font-size:12px; opacity:.6}
.searchwrap input{flex:1; border:0; outline:0; background:transparent; font-family:inherit; font-size:13.5px; color:var(--ink); min-width:0}
.searchwrap input::-webkit-search-cancel-button{display:none}
.clr{border:0; background:transparent; color:#a79b8c; font-size:13px; cursor:pointer; padding:4px}
.viewrow{display:flex; align-items:center; gap:6px; margin-top:7px}
.seg{display:flex; background:#ece5d7; border-radius:9px; padding:2px; flex:0 0 auto}
.sg{border:0; background:transparent; font-family:inherit; font-size:11.5px; font-weight:800; color:#6a6157; padding:5px 8px; border-radius:7px; cursor:pointer}
.sg.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(60,45,30,.12)}
.chip{margin-left:auto; border:1px solid var(--line); background:#fff; border-radius:99px; font-family:inherit; font-size:11px; font-weight:800; color:#5e554b; padding:5px 9px; cursor:pointer; white-space:nowrap}
.chip b{font-size:11px; color:var(--sub)}
.chip.on{background:#fff3d6; border-color:#e9c432; color:#8a6410}
.chip.on b{color:#8a6410}

/* main list */
.main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px 40px}
.msep{display:flex; align-items:baseline; gap:8px; padding:12px 4px 7px}
.msep b{font-family:"Gowun Batang",serif; font-size:15px}
.msep span{font-size:10.5px; color:var(--sub); letter-spacing:.3px}
.card{
  width:100%; display:flex; align-items:center; gap:10px; text-align:left; font-family:inherit;
  background:var(--card); border:1px solid var(--line); border-radius:13px; padding:10px 11px; margin-bottom:7px;
  cursor:pointer; color:var(--ink); box-shadow:0 1px 0 #fff inset, 0 1px 2px rgba(70,55,35,.04);
}
.card:active{transform:scale(.995)}
.card.isdone{background:#f4f9f1; border-color:#cfe3c6}
.cno{
  flex:0 0 34px; height:34px; border-radius:10px; background:#f1ebdd; color:#7a6f60;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;
  font-variant-numeric:tabular-nums;
}
.card.isdone .cno{background:#dcefd4; color:#2e7d46}
.cmain{flex:1; min-width:0}
.ct{font-size:13.5px; font-weight:800; line-height:1.35; letter-spacing:-.3px}
.ct .ce{margin-right:4px}
.ct em{font-style:normal; font-size:11px}
.cs{font-size:11.5px; color:var(--sub); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cmark{flex:0 0 auto; color:#b3a897; font-size:15px; font-weight:700}
.card.isdone .cmark{font-size:12px}
.empty{text-align:center; color:var(--sub); font-size:13px; padding:50px 0; line-height:1.7}
.empty span{font-size:11.5px; color:#a79b8c}

/* stamp grid */
.gm{margin-bottom:14px}
.gmh{display:flex; align-items:baseline; justify-content:space-between; padding:4px 3px 8px}
.gmh b{font-family:"Gowun Batang",serif; font-size:14.5px}
.gmh span{font-size:10.5px; color:var(--sub)}
.gg{display:grid; grid-template-columns:repeat(5,1fr); gap:7px}
.gs{
  aspect-ratio:1/1; border-radius:12px; border:1px dashed #d9cfbe; background:#fffdf8;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  font-family:inherit; font-size:13px; font-weight:900; color:#a1958400; color:#8d8272; cursor:pointer;
  position:relative;
}
.gs i{font-style:normal; font-size:11px; opacity:.75}
.gs.on{background:#e9f4e3; border:1px solid #9dc98d; color:#2c7a44}
.gs.off{opacity:.28; cursor:default; font-size:11px; color:#b3a897}
.gs.fv::after{content:"⭐"; position:absolute; top:2px; right:3px; font-size:8px}

/* sheet */
.sheet{
  position:absolute; inset:0; background:var(--bg); z-index:40; display:flex; flex-direction:column;
  transform:translateX(100%); visibility:hidden;
  transition:transform .26s cubic-bezier(.3,.8,.4,1), visibility 0s linear .26s; will-change:transform;
}
.sheet.open{transform:translateX(0); visibility:visible; transition:transform .26s cubic-bezier(.3,.8,.4,1), visibility 0s}
.sh-top{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:11px 12px 9px; border-bottom:1px solid var(--line); background:#fffdf8}
.iconbtn{border:1px solid var(--line); background:#fff; border-radius:10px; width:34px; height:34px; font-size:16px; cursor:pointer; color:var(--ink); line-height:1}
.sh-ttl{flex:1; min-width:0; text-align:center}
.sh-no{font-size:12.5px; font-weight:900; letter-spacing:.4px; color:var(--red)}
.sh-m{font-size:10px; color:var(--sub); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.favbtn{border:1px solid var(--line); background:#fff; border-radius:10px; width:34px; height:34px; font-size:15px; cursor:pointer; color:#b3a897; line-height:1}
.favbtn.on{color:#e0a800; background:#fff8e2; border-color:#e9c432}
.sh-body{flex:1 1 auto; overflow-y:auto; padding:0 0 30px}
.dhero{display:flex; gap:11px; padding:15px 16px 14px; background:linear-gradient(180deg,#fffdf8,#fbf8f1); border-bottom:1px solid var(--line)}
.dh-e{font-size:30px; line-height:1.1}
.dhero h1{margin:0; font-family:"Gowun Batang",serif; font-size:20px; line-height:1.35; letter-spacing:-.4px}
.dhero p{margin:5px 0 0; font-size:12.5px; color:var(--sub); line-height:1.5}
.sec{padding:15px 16px 14px; border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{
  margin:0 0 9px; font-size:11.5px; font-weight:900; letter-spacing:.2px; color:#8a5a12;
  display:flex; align-items:center; gap:5px;
}
.sec p{margin:0 0 8px; font-size:14px; line-height:1.72}
.sec p:last-child{margin-bottom:0}
.sec ul{margin:0 0 8px; padding-left:17px}
.sec li{margin-bottom:5px; font-size:13.8px; line-height:1.66}
.sec li:last-child{margin-bottom:0}
.sec b{color:#111}
.sec .hi{background:linear-gradient(transparent 62%, #ffe9a8 62%); font-weight:800}
.num{font-variant-numeric:tabular-nums}
.box{background:#fff; border:1px solid var(--line); border-left:4px solid var(--grn); border-radius:10px; padding:9px 11px; margin:8px 0; font-size:13px; line-height:1.65}
.warn{background:#fff6f3; border:1px solid #f4cfc4; border-left:4px solid var(--red); border-radius:10px; padding:9px 11px; margin:8px 0; font-size:13px; line-height:1.65}
.tip{background:#f2f7fd; border:1px solid #cfe0f2; border-left:4px solid var(--blu); border-radius:10px; padding:9px 11px; margin:8px 0; font-size:13px; line-height:1.65}
.mission{background:#fdfbf2}
.mission p{font-size:14px}
table.tb{width:100%; border-collapse:collapse; margin:8px 0; font-size:11.8px; line-height:1.4; background:#fff; border-radius:8px; overflow:hidden}
table.tb th{background:#f3ecdd; color:#5c5040; font-weight:800; padding:5px 4px; text-align:center; border-bottom:1px solid var(--line); font-size:11px; letter-spacing:-.2px}
table.tb td{padding:5px 4px; text-align:center; border-bottom:1px solid #f1eadf; font-variant-numeric:tabular-nums; letter-spacing:-.2px}
table.tb tr:last-child td{border-bottom:0}
table.tb td.l,table.tb th.l{text-align:left; padding-left:6px}
table.tb .em{font-weight:900; color:#c0392b}
table.tb .em2{font-weight:900; color:#1d63b0}
.cap{font-size:10.5px; color:#9a8f80; margin:-2px 0 8px; line-height:1.5}

/* quiz */
.quiz{background:#fffdf6}
.qq{font-size:14px; font-weight:700; line-height:1.6; margin-bottom:9px}
.qas{display:flex; flex-direction:column; gap:6px}
.qa{
  text-align:left; font-family:inherit; font-size:13.3px; line-height:1.5; color:var(--ink);
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 11px; cursor:pointer;
}
.qa.ok{background:#e9f5e6; border-color:#7fbb6d; font-weight:800}
.qa.ng{background:#fdeceb; border-color:#e3918a}
.qa.dim{opacity:.55}
.qfb{display:none; margin-top:9px; font-size:12.8px; line-height:1.6; border-radius:10px; padding:9px 11px}
.qfb.show{display:block}
.qfb.good{background:#eaf6e7; border:1px solid #bfe0b4; font-weight:800; color:#24663a}
.qfb.bad{background:#fdeeec; border:1px solid #f3c8c2; font-weight:800; color:#a53424}
.qfb span{display:block; font-weight:500; color:#4a4239; margin-top:4px}

/* sheet bottom */
.sh-bot{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:9px 12px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#fffdf8}
.navbtn{flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:10px; font-family:inherit; font-size:11.5px; font-weight:800; color:#5e554b; padding:10px 9px; cursor:pointer}
.donebtn{flex:1; border:1px solid #b9d5a9; background:#eef7e9; border-radius:10px; font-family:inherit; font-size:13px; font-weight:900; color:#2c7a44; padding:10px; cursor:pointer}
.donebtn.on{background:#2e8b57; border-color:#2e8b57; color:#fff}
</style>
<script>window.__ERR=[];addEventListener('error',function(e){__ERR.push(String(e.message||e))});addEventListener('unhandledrejection',function(e){__ERR.push('rej:'+e.reason)});</script>
</head>
<body>
<div class="app">
  <div class="rainbow"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <header class="top">
    <div class="brandrow">
      <div class="brand">케비라 <b>실전옵션</b><span>100일간 쌩초보 옵션탈출기</span></div>
      <div class="stampbox">D-21<span>만기 12.10</span></div>
    </div>
    <div class="snap">
      <div class="cell"><i>코스피200</i><b class="dn">755.34</b></div>
      <div class="cell"><i>F 2612</i><b class="dn">752.75</b></div>
      <div class="cell"><i>베이시스</i><b class="dn">-2.59</b></div>
      <div class="cell"><i>1p</i><b>25만원</b></div>
    </div>
    <div class="prog">
      <div class="pbar"><i id="pbar"></i></div>
      <span id="ptxt">완료 <b>0</b>/100</span>
    </div>
  </header>

  <nav class="monthtabs" id="mtabs">
    <button class="mt on" data-m="0">전체</button>
    <button class="mt" data-m="1">1개월<span>기초·4대 포지션</span></button>
    <button class="mt" data-m="2">2개월<span>스프레드·장세</span></button>
    <button class="mt" data-m="3">3개월<span>월물 시기</span></button>
    <button class="mt" data-m="4">4개월<span>시간대·수급</span></button>
    <button class="mt" data-m="5">5개월<span>델타·변동폭·졸업</span></button>
  </nav>

  <div class="tools">
    <div class="searchwrap">
      <span class="ic">🔍</span>
      <input id="q" type="search" placeholder="낱말로 찾기 (예: 갭필, 세타, 양매도, 꽝)" autocomplete="off" enterkeyhint="search" />
      <button class="clr" id="clr" aria-label="지우기">✕</button>
    </div>
    <div class="viewrow">
      <div class="seg"><button class="sg on" id="vlist">📋 목록</button><button class="sg" id="vgrid">🔖 도장판</button></div>
      <button class="chip" id="cfav">⭐ 북마크 <b id="cfavn">0</b></button>
      <button class="chip" id="cdone">✅ 완료 <b id="cdonen">0</b></button>
    </div>
  </div>

  <main class="main" id="main"></main>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sh-top">
      <button class="iconbtn" id="backbtn" aria-label="목록으로">←</button>
      <div class="sh-ttl">
        <div class="sh-no" id="shNo">Day 1</div>
        <div class="sh-m" id="shM">1개월차</div>
      </div>
      <button class="favbtn" id="favbtn" aria-label="북마크">☆</button>
    </div>
    <div class="sh-body" id="shBody"></div>
    <div class="sh-bot">
      <button class="navbtn" id="prevbtn">← 이전</button>
      <button class="donebtn" id="donebtn">✅ 완료</button>
      <button class="navbtn" id="nextbtn">다음 →</button>
    </div>
  </div>
</div>
<script>

s=\"warn\">⚠️ '콜이 싸다'는 이유로 콜을 사면 안 됩니다. 싼 콜은 <b>오를 확률이 낮다는 시장의 평가<\/b>입니다. 2.10짜리 C910은 지수 755 대비 154p 위에 있습니다.<\/div>","mission":"<p>위 표에서 <b>등락률이 가장 큰 풋(P540, +142.35%)<\/b>과 <b>가장 작은 풋(P562.5, +79.73%)<\/b>을 찾아보세요. 왜 하락장인데 풋마다 다를까요? — 행사가 위치와 원래 가격이 달라서입니다.<\/p>","quiz":{"q":"지수가 급락하는 날 가장 크게 오를 수 있는 포지션은?","a":["콜매수","풋매수","풋매도"],"k":1,"why":"풋은 지수가 내릴 때 이득입니다. 콜매수와 풋매도는 반대로 큰 손실을 봅니다. 11/20에도 풋 12종목 전부 두 배 가까이 올랐습니다."}},{"n":3,"m":1,"emoji":"🕯","tag":"시고저종","title":"시가·고가·저가·종가 — 하루의 네 숫자","sub":"10/30 C900은 시가 59.25로 열어 저가 51.00에서 마감, 하루에 -8.25p","bite":"<p>하루를 네 장의 사진으로 남긴 것이 시가·고가·저가·종가입니다. <b>시가<\/b>는 출발선, <b>고가·저가<\/b>는 그날의 최고·최저, <b>종가<\/b>는 마지막 합의 가격입니다.<\/p>","market":"<p>전광판에 남아 있는 <b>2026-10-30<\/b> C 2612 900의 네 숫자입니다.<\/p>\n<table class=\"tb\"><thead><tr><th>시가<\/th><th>고가<\/th><th>저가<\/th><th>종가<\/th><\/tr><\/thead><tbody>\n<tr><td>59.25<\/td><td class=\"em\">59.25<\/td><td class=\"em2\">51.00<\/td><td class=\"em2\">51.00<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">시가 = 고가 → 시작하자마자 팔자가 쏟아졌다. 종가 = 저가 → 하루 끝까지 밀렸다. 11/20 종가는 2.62.<\/div>\n<p>네 숫자가 모두 같으면(예: C892.5 82.95/82.95/82.95/82.95) 그날은 <b>거래가 거의 없었다<\/b>는 뜻입니다.<\/p>","action":"<p>차트를 볼 때 읽는 순서를 정해 두세요.<\/p>\n<ul>\n<li><b>종가부터<\/b> — 어제 어디서 끝났나<\/li>\n<li><b>시가<\/b> — 오늘 어디서 시작했나 (갭 판단)<\/li>\n<li><b>고가·저가<\/b> — 오늘 힘이 어디까지 뻗었나<\/li>\n<\/ul>\n<p><b>종가 &gt; 시가<\/b>면 사는 힘이 이긴 날, <b>종가 &lt; 시가<\/b>면 파는 힘이 이긴 날입니다. 오늘의 종가는 내일의 출발선이 됩니다.<\/p>","caution":"<div class=\"warn\">⚠️ 옵션 가격은 하루에도 몇 번씩 배가 됩니다. 종가 하나만 보고 \"내일 오르겠지\"라고 판단하면 안 됩니다. 10/30 C900의 51.00이 11/20에는 2.62가 되었습니다.<\/div>","mission":"<p>10/30 C900에서 <b>종가 − 시가<\/b>를 계산하세요. → 51.00 − 59.25 = <b>−8.25p<\/b>. 계약 1개면 <b>−206,250원<\/b>입니다.<\/p>","quiz":{"q":"어떤 날 종가가 저가와 똑같았다면 무슨 뜻일까요?","a":["거래가 아예 없었다","하루 종일 파는 힘이 이겼다","사는 힘이 아주 강했다"],"k":1,"why":"저가에서 마감했다는 건 마지막까지 더 낮은 가격을 받아내려는 매도가 우세했다는 뜻입니다. 반대로 종가=고가면 매수 우위입니다."}},{"n":4,"m":1,"emoji":"📏","tag":"전일 기준선","title":"전일 고가·저가·종가 — 어제를 자로 쓰기","sub":"F 2612는 전일 약 796.0에서 752.75로, 하루에 세 줄입니다.<\/p>\n<ul>\n<li>가격이 중심선 <b>위<\/b>에서 놀면 → 매수 우위, 눌림에서 산다<\/li>\n<li>가격이 중심선 <b>아래<\/b>에서 놀면 → 매도 우위, 반등에서 판다<\/li>\n<li>중심선을 <b>위아래로 왔다 갔다<\/b>하면 → 횡보, 관망<\/li>\n<\/ul>\n<p>5분봉이 중심선을 뚫고 <b>두 봉 연속<\/b> 위에서 마감할 때만 신호로 인정하세요.<\/p>","caution":"<div class=\"warn\">⚠️ 중심선은 '오늘의 평균'일 뿐 예측 도구가 아닙니다. 뉴스 하나로 중심선이 무의미해지는 날도 많습니다. 신호가 아니라 <b>필터<\/b>로만 쓰세요.<\/div>","mission":"<p>C 2612 892.5의 10/30 값은 시·고·저·종가가 모두 82.95입니다. 중심선은? → <b>82.95<\/b>. 네 숫자가 같다는 건 그날 거래가 사실상 없었다는 뜻입니다.<\/p>","quiz":{"q":"가격이 중심선 아래에서만 움직이고 있다면 오늘의 기본 자세는?","a":["매수 우위로 본다","아무 의미 없다","매도 우위로 본다"],"k":2,"why":"중심선 아래는 그날 파는 힘이 평균보다 강했다는 뜻입니다. 반등은 중심선까지로 보고, 그 위에서 매수하는 것이 원칙입니다."}},{"n":6,"m":1,"emoji":"🚀","tag":"갭상승","title":"갭상승 — 전일 종가보다 높게 출발","sub":"10/30 C900은 전일 51.00에서 59.25로 +8.25p(+16%) 갭상승 출발","bite":"<p>어제 51.00에서 끝났는데 오늘 아침 59.25로 시작했다면, 그 사이에 <b>아무도 거래하지 않은 빈칸 8.25p<\/b>가 생깁니다. 이 빈칸이 갭입니다.<\/p>","market":"<p>10/30 C 2612 900의 실제 기록입니다.<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">구분<\/th><th>가격<\/th><th>해석<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">전일 종가<\/td><td>51.00<\/td><td>출발선<\/td><\/tr>\n<tr><td class=\"l\">당일 시가<\/td><td class=\"em\">59.25<\/td><td>+8.25p (+16%) 갭상승<\/td><\/tr>\n<tr><td class=\"l\">당일 고가<\/td><td>59.25<\/td><td>시가가 곧 고가<\/td><\/tr>\n<tr><td class=\"l\">당일 종가<\/td><td class=\"em2\">51.00<\/td><td>갭을 다 메우고 마감<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">시작부터 팔자가 나와 고점을 못 넘고, 결국 전일 종가까지 되돌아온 하루였습니다.<\/div>","action":"<p>갭상승을 만나면 두 갈래로만 판단합니다.<\/p>\n<ul>\n<li><b>갭 유지<\/b> — 시가 위에서 15분 이상 버티고 고가를 다시 넘으면 강세 지속 → 콜매수 근거<\/li>\n<li><b>갭 메움<\/b> — 시가 아래로 내려와 전일 종가 쪽으로 가면 약세 → 콜 정리<\/li>\n<\/ul>\n<p>10/30처럼 <b>시가 = 고가<\/b>로 시작한 날은 \"사자 없이 팔자만 있던 날\"이라 갭 유지 확률이 낮습니다.<\/p>","caution":"<div class=\"warn\">⚠️ 갭상승 추격매수가 초보의 1번 손실 원인입니다. 갭이 난 뒤 옵션 값은 이미 올라 있으니, 되돌림(갭필)이 나오면 두 배로 아픕니다.<\/div>","mission":"<p>8.25p의 갭을 계약 1개로 계산하면? → 8.25 × 25만원 = <b>2,062,500원<\/b>. 갭 하나가 200만원짜리라는 걸 기억하세요.<\/p>","quiz":{"q":"갭상승 후 가격이 내려와 전일 종가를 채우는 것을 무엇이라 하나요?","a":["만기","갭필","갭유지"],"k":1,"why":"빈칸을 메우는 움직임이 갭필입니다. 갭필이 나오면 갭상승으로 생긴 강세 신호는 무효가 됩니다."}},{"n":7,"m":1,"emoji":"📉","tag":"갭하락","title":"갭하락 — 11/20, -5.4%로 시작한 날","sub":"지수 -5.53%에 콜은 -60%, 풋은 두 배. 갭하락 날의 실제 손익","bite":"<p>갭상승의 반대입니다. 어제보다 훨씬 낮게 시작하면, 그 빈칸을 두고 <b>공포가 먼저 달립니다<\/b>. 11/20이 바로 그런 날이었습니다.<\/p>","market":"<p>11/20 실제 숫자입니다. 전일 종가와 비교하면 하루의 크기가 보입니다.<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">종목<\/th><th>전일 종가<\/th><th>11/20 종가<\/th><th>등락률<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">C 892.5<\/td><td>6.51<\/td><td>2.99<\/td><td class=\"em\">-54.07%<\/td><\/tr>\n<tr><td class=\"l\">C 900.0<\/td><td>6.62<\/td><td>2.62<\/td><td class=\"em\">-60.42%<\/td><\/tr>\n<tr><td class=\"l\">C 910.0<\/td><td>5.37<\/td><td>2.10<\/td><td class=\"em\">-60.89%<\/td><\/tr>\n<tr><td class=\"l\">P 540.0<\/td><td>0.85<\/td><td>2.06<\/td><td class=\"em2\">+142.35%<\/td><\/tr>\n<tr><td class=\"l\">P 550.0<\/td><td>1.03<\/td><td>2.35<\/td><td class=\"em2\">+128.16%<\/td><\/tr>\n<tr><td class=\"l\">P 560.0<\/td><td>1.21<\/td><td>2.69<\/td><td class=\"em2\">+122.31%<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">전일 종가 = 11/20 종가 − 전일대비. C900 매수자는 하루에 655,000원 중 400,000원을 잃었습니다.<\/div>","action":"<p>갭하락 날의 세 가지 원칙.<\/p>\n<ul>\n<li><b>시초 30분은 관망<\/b> — 첫 30분의 방향은 절반이 함정입니다<\/li>\n<li><b>콜 물타기 금지<\/b> — 델타가 0.07로 줄어 지수가 올라도 거의 안 오릅니다<\/li>\n<li><b>풋 추격 금지<\/b> — 이미 두 배가 됐습니다. 여기서 사면 되돌림에 그대로 맞습니다<\/li>\n<\/ul>\n<p>그래서 11/20 같은 날의 정답은 대부분 <b>'아무것도 안 하기'<\/b>입니다.<\/p>","caution":"<div class=\"warn\">⚠️ 하루 -60%는 특별한 사건이 아닙니다. 지수가 -5% 빠지면 멀리 떨어진 콜은 이 정도로 녹습니다. 이걸 견딜 수 있는 돈만 넣으세요.<\/div>","mission":"<p>C900의 전일 종가를 표에서 역산하세요. → 2.62 + 4.00 = <b>6.62<\/b>. 하루 만에 6.62 → 2.62, <b>-60.4%<\/b>입니다.<\/p>","quiz":{"q":"갭하락 날 이미 두 배가 된 풋을 뒤늦게 사는 것의 가장 큰 문제는?","a":["수익은 작고 되돌림 위험이 크다","아무 문제 없다","수익이 무한대라 위험하다"],"k":0,"why":"이미 오를 만큼 오른 값입니다. 조금 더 빠지면 이익은 제한적이고, 반등이 나오면 두 배로 비싸게 산 값이 하루에 반토막 날 수 있습니다."}},{"n":8,"m":1,"emoji":"🕳","tag":"갭필","title":"갭필 — 빈칸을 메우는 힘","sub":"11/20의 갭필 목표는 산하세요. → (910 − 900 − 0.52) × 25만 = <b>2,370,000원<\/b>. 130,000원으로 237만원입니다.<\/p>","quiz":{"q":"불 콜 스프레드의 손익분기 지수는?","a":["755.34","900 + 0.52 = 900.52","910"],"k":1,"why":"낮은 행사가 900에 순비용 0.52를 더한 900.52가 손익분기입니다. 그 위로 가야 이익이 나기 시작합니다."}},{"n":23,"m":2,"emoji":"📉","tag":"베어 풋 스프레드","title":"풋 수직 스프레드 — 하락에 거는 72,500원짜리","sub":"P550 매수 + P540 매도. 최대 이익 2,427,500원, 최대 손실 72,500원","bite":"<p>이번엔 반대입니다. 높은 행사가 풋을 사고 낮은 행사가 풋을 팝니다. <b>내리면 벌고, 많이 내리면 더는 못 버는<\/b> 구조입니다.<\/p>","market":"<p>P 2612 550 / 540 베어 풋 스프레드입니다.<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">다리<\/th><th>가격<\/th><th>1계약<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">P 550 매수 (+)<\/td><td>2.35<\/td><td>-587,500원<\/td><\/tr>\n<tr><td class=\"l\">P 540 매도 (−)<\/td><td>2.06<\/td><td>+515,000원<\/td><\/tr>\n<tr><td class=\"l\">순비용<\/td><td class=\"em\">0.29<\/td><td class=\"em\">-72,500원<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">최대 이익 = (550 − 540 − 0.29) × 25만 = 9.71p = 2,427,500원.<\/div>","action":"<p>하락장에서 단독 풋매수 대신 쓰는 이유입니다.<\/p>\n<ul>\n<li>단독 P550 매수는 587,500원인데, 스프레드는 72,500원<\/li>\n<li>손실은 72,500원으로 고정, 이익은 242만원<\/li>\n<li>같은 하락이라도 <b>계좌를 덜 태우고 오래 버틴다<\/b><\/li>\n<\/ul>\n<p>11/20처럼 -5% 급락한 다음 날, 풋이 두 배가 된 상태에서는 스프레드가 훨씬 현실적입니다.<\/p>","caution":"<div class=\"warn\">⚠️ 풋 행사가가 낮을수록(540) 이익 구간이 좁아집니다. 그리고 지수가 550 아래로 가야 본격 이익이라, 확률은 높지 않습니다. 낮은 행사가 쪽 <b>매도 다리<\/b>에 증거금이 필요합니다.<\/div>","mission":"<p>손익분기를 계산하세요. → 550 − 0.29 = <b>549.71<\/b>. 그 아래로 내려가야 이익입니다.<\/p>","quiz":{"q":"베어 풋 스프레드의 최대 손실은?","a":["무한대","587,500원","순비용 72,500원"],"k":2,"why":"아래쪽 위험을 다른 풋을 팔아 막았기 때문에 손실은 순비용으로 고정됩니다. 그래서 초보가 하락에 베팅할 때 단독 매수보다 안전합니다."}},{"n":24,"m":2,"emoji":"🧮","tag":"스프레드 계산","title":"스프레드 손익 계산 — 3초 안에 끝내기","sub":"(행사가 차이 − 순비용) × 25만원 × 계약수. 이 한 줄이면 된다","bite":"<p>스프레드는 계산이 조금 복잡해 보이지만 공식은 하나입니다. <b>행사가 차이에서 순비용을 빼고, 25만원을 곱한다.<\/b><\/p>","market":"<p>세 가지 조합을 같은 방식으로 계산합니다.<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">조합<\/th><th>순비용<\/th><th>행사가 차<\/th><th>최대 이익<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">콜 900/910<\/td><td>0.52<\/td><td>10<\/td><td class=\"em2\">2,370,000원<\/td><\/tr>\n<tr><td class=\"l\">콜 892.5/900<\/td><td>0.37<\/td><td>7.5<\/td><td class=\"em2\">1,782,500원<\/td><\/tr>\n<tr><td class=\"l\">풋 550/540<\/td><td>0.29<\/td><td>10<\/td><td class=\"em2\">2,427,500원<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">콜 892.5 매수 2.99 − 콜 900 매도 2.62 = 0.37p. (7.5 − 0.37) × 25만 = 1,782,500원.<\/div>","action":"<p>계산 순서를 정해 두세요.<\/p>\n<ul>\n<li><b>①<\/b> 산 가격 − 판 가격 = 순비용<\/li>\n<li><b>②<\/b> 높은 행사가 − 낮은 행사가 = 재료<\/li>\n<li><b>③<\/b> (재료 − 순비용) × 25만 × 계약수 = 최대 이익<\/li>\n<li><b>④<\/b> 손익분기 = 낮은 행사가 + 순비용 (콜 기준)<\/li>\n<\/ul>\n<p>이 네 줄을 주문 전에 반드시 적으세요. 적지 못하면 진입하지 않습니다.<\/p>","caution":"<div class=\"warn\">⚠️ 순비용이 행사가 차이의 절반을 넘으면 손익비가 나빠집니다. 10p 차이에 6p를 내면 남는 게 4p뿐입니다. <b>순비용은 재료의 30% 이하<\/b>를 기준으로 삼으세요.<\/div>","mission":"<p>콜 892.5/900 스프레드의 손익분기를 구하세요. → 892.5 + 0.37 = <b>892.87<\/b>.<\/p>","quiz":{"q":"콜 900/910 스프레드(순비용 0.52)의 최대 이익은?","a":["2,370,000원","250,000원","130,000원"],"k":0,"why":"(10 − 0.52) × 250,000 = 2,370,000원입니다. 행사가 차이에서 순비용을 뺀 값에 승수를 곱합니다."}},{"n":25,"m":2,"emoji":"🪃","tag":"양매수·스트래들","title":"양매수 스트래들 — 콜과 풋을 같은 자리에서","sub":"같은 행사가 콜+풋을 사면 위아래 어느 쪽으로 터져도 이익","bite":"<p>방향을 모를 때 쓰는 방법입니다. <b>위로 터져도, 아래로 터져도<\/b> 이익인 대신, 제자리에 있으면 두 프리미엄이 다 녹습니다.<\/p>","market":"<p>11/20 표에는 <b>같은 행사가의 콜과 풋이 없습니다<\/b>(콜 892.5~910, 풋 540~567.5). 그래서 오늘 데이터로는 등가 스트래들 가격을 직접 매기기 어렵습니다.<\/p>\n<p>대신 계산 감각만 잡아 봅니다. 지수 755 근처 등가 콜+풋을 사면 프리미엄 합계가 대략 <b>지수의 8~9%<\/b> 수준(변동성 47% 가정 시 약 68~70p, 1,700만원대)입니다. 만기까지 지수가 그만큼 움직여야 본전입니다.<\/p>\n<div class=\"cap\">2.0~3.0대 종목만으로 짜면 아래 <b>스트랭글<\/b>이 되어 성격이 완전히 달라집니다(Day 26).<\/div>","action":"<p>스트래들의 성질 세 가지입니다.<\/p>\n<ul>\n<li>이익은 <b>양쪽 모두<\/b> 열려 있다<\/li>\n<li>손실은 <b>프리미엄 합계<\/b>로 고정<\/li>\n<li>본전을 넘으려면 <b>크게<\/b> 움직여야 한다<\/li>\n<\/ul>\n<p>그래서 쓰는 자리는 딱 하나, <b>큰 이벤트 직전<\/b>입니다. 금리 발표, 만기일 전후, 갭이 크게 난 다음 날처럼 변동성이 커질 때입니다.<\/p>","caution":"<div class=\"warn\">⚠️ '방향을 몰라서 양쪽 사면 되겠네'가 가장 위험한 생각입니다. 프 d class=\"em\">4.97<\/td><td class=\"em2\">+1,242,500원<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">이익 상한은 1,242,500원. 손실은 위로 무한, 아래로 550×25만 = 1억 3,750만원.<\/div>","action":"<p>양매도가 성립하는 조건은 단 하나, <b>지수가 조용할 것<\/b>입니다.<\/p>\n<ul>\n<li>이익 구간: 545.03 ~ 904.97 (넓다)<\/li>\n<li>하지만 11/20처럼 -5.5% 하루가 나면 그날로 크게 다칩니다<\/li>\n<li>증거금이 수백만원 이상 묶이고, 지수가 움직이면 <b>추가 증거금<\/b> 요구<\/li>\n<\/ul>\n<p>기관·전문가는 변동성이 높을 때 양매도로 프리미엄을 걷습니다. 초보가 같은 자리에 서면 <b>그 돈을 물어 주는 쪽<\/b>이 됩니다.<\/p>","caution":"<div class=\"warn\">⚠️ 1,242,500원을 벌려고 1억 넘는 위험을 지는 구조입니다. 100번 이겨도 1번 크게 지면 계좌가 사라집니다. <b>초보 1년은 양매도 금지<\/b>로 정하십시오.<\/div>","mission":"<p>양매도 최대 이익을 확인하세요. → 4.97 × 25만 = <b>1,242,500원<\/b>. 최대 손실은 위로는 무한, 아래로는 1억 3,750만원입니다.<\/p>","quiz":{"q":"양매도의 손익 구조로 맞는 것은?","a":["양쪽 모두 0","이익은 프리미엄까지, 손실은 크게 열려 있다","이익은 무한, 손실은 프리미엄까지"],"k":1,"why":"매도자는 프리미엄까지만 벌고, 반대로 움직이면 손실이 계속 커집니다. 그래서 '이익은 작고 손실은 큰' 구조입니다."}},{"n":29,"m":2,"emoji":"🎲","tag":"양매도 승률","title":"양매도 승률 80%의 함정 — 이겨도 계좌가 사라지는 이유","sub":"80% 이겨도 1번의 큰 손실이 100번의 이익을 지운다","bite":"<p>동전 던지기에서 10원을 걸고 80% 이기면 좋아 보입니다. 그런데 20%에서 <b>1만원을 잃는다면<\/b> 이야기가 달라집니다. 양매도가 정확히 이 구조입니다.<\/p>","market":"<p>11/20 양매도(4.97p = 1,242,500원)의 손익을 확률과 함께 보면,<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">결과<\/th><th>확률(대략)<\/th><th>손익<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">횡보 (545~905)<\/td><td>약 80%<\/td><td class=\"em2\">+1,242,500원<\/td><\/tr>\n<tr><td class=\"l\">900~950 상승<\/td><td>약 8%<\/td><td class=\"em\">-최대 1,125만원<\/td><\/tr>\n<tr><td class=\"l\">550 아래 하락<\/td><td>약 5%<\/td><td class=\"em\">-최대 1억 3,750만원<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">80% × 124만원 ≈ +99만원. 8% × 1,125만원 ≈ -90만원. 5% × 1억 = -500만원. 기대값이 마이너스입니다.<\/div>","action":"<p>확률 매매에서 살아남는 규칙은 세 줄입니다.<\/p>\n<ul>\n<li><b>① 손실 상한을 만든다<\/b> — 그게 스프레드(2·3개월차)<\/li>\n<li><b>② 한 번의 손실이 계좌 2%를 넘지 않게 한다<\/b><\/li>\n<li><b>③ 승률이 아니라 기대값으로 판단한다<\/b><\/li>\n<\/ul>\n<p>\"10번 중 8번 맞았다\"는 말은 자랑이 아닙니다. <b>나머지 2번에서 얼마를 잃었는지<\/b>가 전부입니다.<\/p>","caution":"<div class=\"warn\">⚠️ 승률 80%짜리 전략에서 사람은 수익에 익숙해져 <b>수량을 늘립니다<\/b>. 수량을 늘린 뒤 찾아오는 한 번의 급변동이 계좌를 지웁니다. 11/20 같은 날은 21일 중 하루 있었을 뿐입니다.<\/div>","mission":"<p>내 계좌가 500만원이라면 2%는 얼마인가요? → <b>10만원<\/b>. 양매도 1계약의 손실 가능액(1억)은 2%의 <b>1,000배<\/b>입니다. 이 비교를 기억하세요.<\/p>","quiz":{"q":"승률 80% 전략이 계좌를 위험하게 만드는 이유는?","a":["승률이 낮아서","한 번의 손실이 이익 여러 번을 지울 만큼 크기 때문","수수료가 비싸서"],"k":1,"why":"기대값은 확률×이익에서 확률×손실을 뺀 값입니다. 손실 쪽이 크면 승률이 높아도 계좌는 줄어듭니다."}},{"n":30,"m":2,"emoji":"🔀","tag":"레이쇼 스프레드","title":"레이쇼 스프레드 — 1개 사고 2개 팔기","sub":"C900 1매수 + C910 2매도 = 1.58p를 오히려 받고 시작(395,000원)","bite":"<p>사는 것보다 파는 것을 더 많이 하는 조합입니다. 그래서 <b>돈을 내는 게 아니라 받고<\/b> 시작합니다. 대신 한쪽 위험이 열립니다. 공짜 점심은 없습니다.<\/p>","market":"<p>11/20 실제 가격으로 만든 콜 레이쇼입니다.<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">다리<\/th><th>가격<\/th><th>1계약<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">C 900 매수 1<\/td><td>2.62<\/td><td>-655,000원<\/td><\/tr>\n<tr><td class=\"l\">C 910 매도 2<\/td><td>2.10 × 2<\/td><td>+1,050,000원<\/td><\/tr>\n<tr><td class=\"l\">순수취<\/td><td class=\"em\">1.58<\/td><td class=\"em2\">+395,000원<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">들어오는 돈 1,050,000원, 나가는 돈 655,000원. 차액 395,000원을 받고 포지션을 시작합니다.<\/div>","action":"<p>이 구조의 핵심은 <b>지수가 910 근처에 머물 때 가장 좋다<\/b>는 점입니다.<\/p>\n<ul>\n<li>755~900: 받은 1.58p가 그대로 이익 (395,000원)<\/li>\n<li>910: 최대 이익 (10 + 1.58) = 11.58p = 2,895,000원<\/li>\n<li>921.58 위: 손실 시작, 위로 무한<\/li>\n<\/ul>\n<p>즉 \"조금 오르면 좋고, 많이 오르면 위험\"한 <b>비대칭<\/b> 포지션입니다.<\/p>","caution":"<div class=\"warn\">⚠️ 프리미엄을 받는다고 '안전한 매도'가 아닙니다. 매도 2계약 중 1계약은 <b>맨몸 매도<\/b>라 위험이 그대로 남습니다. 증거금과 손절 규칙 없이는 절대 금지입니다.<\/div>","mission":"<p>순수취 금액을 계산하세요. → (2.10×2 − 2.62) × 25만 = <b>395,000원<\/b>.<\/p>","quiz":{"q":"콜 레이쇼(1매수 2매도)에서 가장 좋은 장세는?","a":["폭락할 때","지수가 매도 행사가 근처까지 완만히 오를 때","아무 움직임 없을 때"],"k":1,"why":"매도 행사가(910)에서 최대 이익이 나고, 그 위로는 손실이 시작됩니다. 완만한 상승이 가장 이상적입니다."}},{"n":31,"m":2,"emoji":"🚧","tag":"위험 경계선","title":"레이쇼 손실 전환점 — 921.58 위로는 위험","sub":"최대 이익 2,895,000원, 921.58을 넘으면 손실이 무제한으로 열린다","bite":"<p>레이쇼에는 <b>울타리가 한쪽 <td>살아 있음<\/td><\/tr>\n<tr><td class=\"l\">D-16<\/td><td>90.4p<\/td><td>1.60<\/td><td>1.29<\/td><td>반토막<\/td><\/tr>\n<tr><td class=\"l\">D-10<\/td><td>71.5p<\/td><td>2.02<\/td><td>0.29<\/td><td>거의 꽝<\/td><\/tr>\n<tr><td class=\"l\">D-6<\/td><td>55.4p<\/td><td>2.61<\/td><td class=\"em\">0.03<\/td><td>1틱 미만<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">거리는 그대로인데 σ가 줄어 '몇 배 멀리' 있는지가 커집니다. 2σ를 넘으면 사실상 끝입니다.<\/div>","action":"<p>꽝 여부를 3초에 판단하는 방법입니다.<\/p>\n<ul>\n<li><b>①<\/b> 지수와 행사가의 거리를 잰다 (144.66p)<\/li>\n<li><b>②<\/b> 남은 날의 표준편차를 구한다 (D-10이면 71.5p)<\/li>\n<li><b>③<\/b> 나눈다 — 2.0배가 넘으면 사지 않는다<\/li>\n<\/ul>\n<p>이 계산 하나로 '싼 옵션'의 함정을 대부분 피할 수 있습니다.<\/p>","caution":"<div class=\"warn\">⚠️ 꽝 경계는 지수가 움직이면 달라집니다. 지수가 850이 되면 C900의 거리는 50p로 줄어 다시 살아납니다. <b>고정된 숫자가 아닙니다.<\/b><\/div>","mission":"<p>D-10에서 C900까지 거리 144.66p, σ 71.5p. 몇 배인가요? → <b>2.02배<\/b>. 이때부턴 사지 않습니다.<\/p>","quiz":{"q":"옵션이 '꽝'이 되는 시점을 결정하는 두 가지는?","a":["계좌 잔고와 증거금","행사가까지의 거리와 남은 시간","거래량과 수수료"],"k":1,"why":"거리가 멀수록, 시간이 적을수록 살아날 확률이 급격히 낮아집니다. 그 비율(거리÷변동폭)이 2배를 넘으면 사실상 꽝입니다."}},{"n":48,"m":3,"emoji":"🕯","tag":"시간가치 곡선","title":"시간가치 소멸 곡선 — 뒤로 갈수록 빨라진다","sub":"세타 -0.274p → -0.217p → -0.108p. 하루 감소액이 모양을 바꾼다","bite":"<p>얼음이 녹는 속도는 처음엔 느리고, 다 녹을 때쯤 빨라 보입니다. 옵션 시간가치도 <b>만기에 가까울수록 남은 값을 빠르게 토해냅니다<\/b>.<\/p>","market":"<p>C 2612 900의 하루 감소액(세타)입니다.<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">구간<\/th><th>세타<\/th><th>1계약 하루<\/th><th>성격<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">D-21 ~ 16<\/td><td>-0.27 ~ -0.22p<\/td><td>-68,500 ~ -54,300원<\/td><td>꾸준히<\/td><\/tr>\n<tr><td class=\"l\">D-15 ~ 10<\/td><td>-0.22 ~ -0.11p<\/td><td>-54,300 ~ -27,100원<\/td><td>빨라짐<\/td><\/tr>\n<tr><td class=\"l\">D-9 ~ 6<\/td><td>-0.11 ~ -0.03p<\/td><td>-27,100 ~ -6,700원<\/td><td>거의 끝<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">절대 금액은 줄지만, 남은 가격 대비 비율은 커집니다. 0.29p에서 -0.03p는 하루 -10%입니다.<\/div>","action":"<p>곡선을 실전에 쓰는 방법입니다.<\/p>\n<ul>\n<li><b>월물 초<\/b> — 하루 감소가 커서 오래 못 버틴다(3일 룰)<\/li>\n<li><b>중반<\/b> — 방향이 맞아야만 남는다(1~2일 룰)<\/li>\n<li><b>만기주<\/b> — 시간이 아니라 <b>지수 위치<\/b>만 본다<\/li>\n<\/ul>\n<p>그래서 '며칠 들고 갈까'는 내 마음이 아니라 <b>D-day가 정합니다<\/b>.<\/p>","caution":"<div class=\"warn\">⚠️ 세타는 매수자에게 적, 매도자에게 아군입니다. 하지만 매도는 위험이 무한하니, 초보는 <b>세타를 피하는 쪽(짧게 들고 있기)<\/b>으로만 활용하세요.<\/div>","mission":"<p>D-10의 0.29p에서 하루 -0.108p면, 하루 손실률은? → <b>약 -37%<\/b>. 하루 만에 3분의 1이 사라집니다.<\/p>","quiz":{"q":"옵션 가격이 낮아질수록 하루 손실률이 커지는 이유는?","a":["승수가 커지기 때문","남은 가격에 비해 하루 감소액의 비중이 커지기 때문","수수료가 오르기 때문"],"k":1,"why":"절대 금액은 줄어도 남은 값이 더 빨리 줄어듭니다. 0.29p에서 0.03p 감소는 10%입니다."}},{"n":49,"m":3,"emoji":"🎯","tag":"시기별 승률","title":"월물 초 vs 만기주 — 어디서 이기는 확률이 높나","sub":"같은 2.62라도 21일짜리와 6일짜리는 다른 게임이다","bite":"<p>승률은 전략이 아니라 <b>시간<\/b>이 정합니다. 시간이 많으면 틀려도 기회가 오고, 적으면 한 번 틀리면 끝입니다.<\/p>","market":"<p>지수 755.34에서 C900(144.66p 위)이 만기에 살아 있을 확률입니다.<\/p>\n<table class=\"tb\"><thead><tr><th class=\"l\">시점<\/th><th>σ<\/th><th>거리<\/th><th>살아있을 확률<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"l\">D-21<\/td><td>103.6p<\/td><td>1.40σ<\/td><td>약 8%<\/td><\/tr>\n<tr><td class=\"l\">D-16<\/td><td>90.4p<\/td><td>1.60σ<\/td><td>약 5%<\/td><\/tr>\n<tr><td class=\"l\">D-10<\/td><td>71.5p<\/td><td>2.02σ<\/td><td>약 2%<\/td><\/tr>\n<tr><td class=\"l\">D-6<\/td><td>55.4p<\/td><td>2.61σ<\/td><td class=\"em\">약 0.5%<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"cap\">만기까지 들고 가면 8%도 안 되는 확률. 그래서 옵션은 '만기까지 들고 가는 상품'이 아닙니다.<\/div>","action":"<p>승률을 올리는 세 가지 방법입니다.<\/p>\n<ul>\n<li><b>가까운 행사가로 간다<\/b> — 거리가 1σ 안쪽이면 확률이 30%대로 올라간다<\/li>\n<li><b>빨리 정리한다<\/b> — 만기까지 안 들고 가면 확률 싸움이 아니다<\/li>\n<li><b>월물 초에 한다<\/b> — 같은 실수에도 회복 기회가 있다<\/li>\n<\/ul>\n<p>확률이 낮은 상품으로 높은 승률을 만드는 유일한 방법은 <b>짧게 들고 있기<\/b>입니다.<\/p>","caution":"<div class=\"warn\">⚠️ 승률 8%짜리를 100번 사면 92번 잃습니다. 그 8번이 크게 맞아야 본전인데, 그건 운에 가깝습니다. <b>외가는 소액으로만.<\/b><\/div>","mission":"<p>지수 755.34에서 거리 103.6p(1σ) 안쪽 행사가는 몇인가요? → 콜 <b>859 근처<\/b>, 풋 <b>652 근처<\/b>. 우리 표의 900은 훨씬 멉니다.<\/p>","quiz":{"q":"옵션 매수의 승률을 높이는 가장 현실적인 방법은?","a":["만기까지 들고 간다","가까운 행사가를 고르고 짧게 보유한다","먼 행사가를 싸게 많이 산다"],"k":1,"why":"거     if(FDONE && !ST.done[d.n]) return false;
    if(!q) return true;
    const hay = (d.title+' '+d.sub+' '+d.bite+' '+d.market+' '+d.action+' '+d.caution+' '+d.mission+' '+d.quiz.q).toLowerCase();
    return hay.indexOf(q)>=0;
  });
}
function render(){
  const list = filtered();
  updateProg();
  if(VIEW==='grid'){ renderGrid(list); return; }
  if(!list.length){ $('#main').innerHTML = '<div class="empty">찾는 날이 없습니다.<br><span>다른 낱말로 찾아보세요.</span></div>'; return; }
  let h='', lastM=0;
  list.forEach(d=>{
    if(!FM && d.m!==lastM){ lastM=d.m; h += '<div class="msep"><b>'+MN[d.m]+'</b><span>'+(d.m===1?'Day 1–20':d.m===2?'Day 21–40':d.m===3?'Day 41–60':d.m===4?'Day 61–80':'Day 81–100')+'</span></div>'; }
    h += '<button class="card'+(ST.done[d.n]?' isdone':'')+'" data-n="'+d.n+'">'
      + '<div class="cno">'+String(d.n).padStart(2,'0')+'</div>'
      + '<div class="cmain"><div class="ct"><span class="ce">'+d.emoji+'</span>'+esc(d.title)+(ST.fav[d.n]?' <em>⭐</em>':'')+'</div>'
      + '<div class="cs">'+esc(d.sub)+'</div></div>'
      + '<div class="cmark">'+(ST.done[d.n]?'✅':'›')+'</div></button>';
  });
  $('#main').innerHTML = h;
  $('#main').querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>open(+b.dataset.n)));
}
function renderGrid(list){
  let h='', lastM=0, shown = {};
  list.forEach(d=>shown[d.n]=1);
  for(let m=1;m<=5;m++){
    if(FM && m!==FM) continue;
    h += '<div class="gm"><div class="gmh"><b>'+MN[m]+'</b><span>'+DAYS.filter(d=>d.m===m&&ST.done[d.n]).length+'/20 완료</span></div><div class="gg">';
    for(let n=(m-1)*20+1;n<=m*20;n++){
      const d = DAYS[n-1];
      if(!shown[n]){ h += '<div class="gs off">'+n+'</div>'; continue; }
      h += '<button class="gs'+(ST.done[n]?' on':'')+(ST.fav[n]?' fv':'')+'" data-n="'+n+'">'+(ST.done[n]?'✓':n)+'<i>'+d.emoji+'</i></button>';
    }
    h += '</div></div>';
  }
  $('#main').innerHTML = h;
  $('#main').querySelectorAll('.gs[data-n]').forEach(b=>b.addEventListener('click',()=>open(+b.dataset.n)));
}
function open(n){
  const d = DAYS[n-1]; if(!d) return; CUR = n;
  $('#shNo').textContent = 'Day '+n;
  $('#shM').textContent = MN[d.m] + ' · ' + d.tag;
  $('#favbtn').textContent = ST.fav[n] ? '★' : '☆';
  $('#favbtn').classList.toggle('on', !!ST.fav[n]);
  $('#donebtn').textContent = ST.done[n] ? '✅ 완료됨' : '완료 표시';
  $('#donebtn').classList.toggle('on', !!ST.done[n]);
  const q = d.quiz;
  let qh = '<section class="sec quiz"><h3>✅ 이해 확인 퀴즈</h3><div class="qq">'+q.q+'</div><div class="qas">';
  q.a.forEach((a,i)=>{ qh += '<button class="qa" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+a+'</button>'; });
  qh += '</div><div class="qfb" id="qfb"></div></section>';
  $('#shBody').innerHTML =
    '<div class="dhero"><div class="dh-e">'+d.emoji+'</div><div><h1>'+esc(d.title)+'</h1><p>'+esc(d.sub)+'</p></div></div>'
    + '<section class="sec"><h3>🎒 한 줄 비유</h3>'+d.bite+'</section>'
    + '<section class="sec"><h3>📊 26년 12월물 실제 시세</h3>'+d.market+'</section>'
    + '<section class="sec"><h3>🎯 실전 매매 기준 · 따라 하기</h3>'+d.action+'</section>'
    + '<section class="sec"><h3>⚖️ 장단점 · ⚠️ 초보 주의</h3>'+d.caution+'</section>'
    + '<section class="sec mission"><h3>📝 오늘의 1분 미션</h3>'+d.mission+'</section>'
    + qh;
  $('#shBody').scrollTop = 0;
  $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden','false');
  $('#backbtn').focus({preventScroll:true});
  const fb = $('#qfb');
  $('#shBody').querySelectorAll('.qa').forEach(b=>b.addEventListener('click',()=>{
    const i = +b.dataset.i, ok = i===q.k;
    $('#shBody').querySelectorAll('.qa').forEach(x=>x.classList.remove('ok','ng','dim'));
    b.classList.add(ok?'ok':'ng');
    $('#shBody').querySelectorAll('.qa').forEach(x=>{ if(x!==b) x.classList.add('dim'); });
    $('#shBody').querySelectorAll('.qa')[q.k].classList.add('ok');
    fb.className = 'qfb show '+(ok?'good':'bad');
    fb.innerHTML = (ok?'⭕ 정답입니다! ':'❌ 다시 볼까요. 정답은 '+String.fromCharCode(65+q.k)+'. ')+'<span>'+q.why+'</span>';
  }));
  history.replaceState(null,'','#d'+n);
}
function closeSheet(){
  $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true');
  history.replaceState(null,'',location.pathname+location.search);
  render();
}
$('#backbtn').addEventListener('click', closeSheet);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
$('#favbtn').addEventListener('click', ()=>{
  const n = CUR; ST.fav[n] = !ST.fav[n]; $('#favbtn').textContent = ST.fav[n]?'★':'☆';
  $('#favbtn').classList.toggle('on', !!ST.fav[n]); save(); updateProg();
});
$('#donebtn').addEventListener('click', ()=>{
  const n = CUR; ST.done[n] = !ST.done[n];
  $('#donebtn').textContent = ST.done[n]?'✅ 완료됨':'완료 표시';
  $('#donebtn').classList.toggle('on', !!ST.done[n]); save(); updateProg();
});
$('#prevbtn').addEventListener('click', ()=>{ if(CUR>1) open(CUR-1); });
$('#nextbtn').addEventListener('click', ()=>{ if(CUR<100) open(CUR+1); });
$('#mtabs').addEventListener('click', e=>{
  const b = e.target.closest('.mt'); if(!b) return;
  FM = +b.dataset.m;
  $('#mtabs').querySelectorAll('.mt').forEach(x=>x.classList.toggle('on', x===b));
  render(); $('#main').scrollTop = 0;
});
$('#vlist').addEventListener('click', ()=>{ VIEW='list'; $('#vlist').classList.add('on'); $('#vgrid').classList.remove('on'); render(); });
$('#vgrid').addEventListener('click', ()=>{ VIEW='grid'; $('#vgrid').classList.add('on'); $('#vlist').classList.remove('on'); render(); });
$('#cfav').addEventListener('click', ()=>{ FAV=!FAV; render(); });
$('#cdone').addEventListener('click', ()=>{ FDONE=!FDONE; render(); });
$('#q').addEventListener('input', ()=>{ render(); });
$('#clr').addEventListener('click', ()=>{ $('#q').value=''; render(); $('#q').focus(); });
const h = (location.hash||'').match(/^#d(\d{1,3})$/);
render();
if(h && +h[1]>=1 && +h[1]<=100) setTimeout(()=>open(+h[1]), 30);
</script>
</body>
</html>
