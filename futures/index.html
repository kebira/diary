른다"],"def":"큰 이벤트가 코앞이면 단기 IV가 장기 IV보다 높아지는 역전이 생겨요. 지나고 나면 다시 정상 구조로 돌아옵니다.","ex":"FOMC 전날 1주 IV가 28%, 3개월 IV가 20%라면 역전이에요. 발표가 끝나면 1주 IV가 18%로 급락하며 정상 구조로 돌아옵니다.","rel":"기간구조 · IV 크러시 · FOMC","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"롱 감마","sub":"Long gamma","head":"지수가 크게 흔들릴수록 유리해지는, 감마가 플러스인 포지션은?","hint":"흔들림을 사 두는 포지션이에요","w":["숏 감마","델타 중립","숏 베가"],"def":"롱 감마는 옵션을 매수해 감마가 플러스인 상태예요. 지수가 오르면 델타가 커지고 내리면 작아져, 어느 쪽으로 크게 움직여도 이익이 납니다.","ex":"등가격 콜·풋을 함께 사면 롱 감마가 돼요. 지수가 30p 흔들리면 델타가 유리한 방향으로 커져 이익이 나고, 제자리면 세타를 잃습니다.","rel":"숏 감마 · 감마 스캘핑 · 스트래들","sem":"ga","type":"concept","cat":"s3","semLabel":"감마"},{"t":"숏 감마","sub":"Short gamma","head":"지수가 크게 흔들릴수록 불리해지는, 감마가 마이너스인 포지션은?","hint":"흔들림을 팔아 둔 포지션이에요","w":["롱 감마","델타 중립","롱 베가"],"def":"숏 감마는 옵션을 팔아 감마가 마이너스인 상태예요. 지수가 크게 움직이면 델타가 불리한 방향으로 커져 손실이 빨라집니다.","ex":"아이언 콘도르를 팔면 숏 감마예요. 지수가 범위 안에 있으면 프리미엄을 벌지만, 30p 이상 튀면 손실이 급격히 커집니다.","rel":"롱 감마 · 아이언 콘도르 · 감마 리스크","sem":"ga","type":"concept","cat":"s3","semLabel":"감마"},{"t":"델타 중립","sub":"Delta neutral","head":"포트폴리오 전체 델타의 합이 0이 되게 만든 상태는?","hint":"지수가 조금 움직여도 손익이 0에 가까워요","w":["감마 중립","베가 중립","세타 중립"],"def":"델타 중립은 전체 델타 합이 0이라 지수가 조금 움직여도 손익이 거의 없는 상태예요. 방향 베팅을 지우고 변동성만 보는 전략입니다.","ex":"콜 10계약(델타 0.6, 합 6)을 들고 있다면 선물 6계약을 팔아 델타를 0으로 맞춰요. 이후에는 변동성과 시간만 손익을 좌우합니다.","rel":"델타 헤지 · 감마 · 베가","sem":"de","type":"concept","cat":"s3","semLabel":"델타"},{"t":"델타 헤지","sub":"Delta hedge","head":"옵션 포지션의 방향 위험을 없애려고 선물을 사고파는 것을 부르는 말은?","hint":"델타를 0으로 맞추는 작업이에요","w":["감마 스캘핑","베가 헤지","롤오버"],"def":"델타 헤지는 옵션의 델타만큼 반대 방향으로 선물을 잡아 방향 위험을 지우는 거예요. 지수가 움직이면 델타가 변해 다시 조정해야 합니다.","ex":"델타 0.5 콜 20계약은 선물 10계약어치예요. 선물 10계약을 팔면 델타 중립이 되고, 지수가 1p 움직여도 손익은 거의 0입니다.","rel":"델타 중립 · 감마 · 합성 선물","sem":"de","type":"concept","cat":"s3","semLabel":"델타"},{"t":"감마 스캘핑","sub":"Gamma scalping","head":"롱 감마 상태에서 지수가 움직일 때마다 델타를 다시 맞춰 이익을 쌓는 전략은?","hint":"오르면 팔고 내리면 사서 델타를 되돌려요","w":["델타 헤지","세타 수취","차익거래"],"def":"감마 스캘핑은 롱 감마 포지션에서 지수가 오르면 선물을 팔고 내리면 사서, 흔들림에서 이익을 모으는 거예요. 세타 비용을 흔들림 이익으로 메웁니다.","ex":"콜·풋을 사서 롱 감마를 만들고, 지수가 10p 오를 때마다 선물을 팔아 델타를 맞춰요. 하루 20p 이상 흔들리면 세타보다 큰 이익이 납니다.","rel":"롱 감마 · 세타 · 델타 헤지","sem":"ga","type":"concept","cat":"s3","semLabel":"감마"},{"t":"감마를 얻으면 세타를 낸다","sub":"Gamma-theta tradeoff","head":"롱 감마 포지션이 항상 지불하는 비용은?","hint":"흔들림을 사려면 시간값을 내야 해요","w":["베가를 받는다","델타가 커진다","프리미엄을 받는다"],"def":"감마와 세타는 맞바꾸는 관계예요. 롱 감마는 흔들림에 유리하지만 매일 세타를 지불하고, 숏 감마는 세타를 받지만 흔들림에 취약합니다.","ex":"스트래들 매수는 감마 +0.1, 세타 −1.5p예요. 하루에 1.5p(37만 5,000원)를 내고, 지수가 그 이상 흔들려야 이익이 납니다.","rel":"롱 감마 · 세타 · 스트래들","sem":"ga","type":"concept","cat":"s3","semLabel":"감마"},{"t":"옵션 매도","sub":"Collecting theta","head":"세타를 받는 대표적인 포지션은?","hint":"시간이 녹는 것을 팔아요","w":["옵션 매수","선물 매수","현물 매수"],"def":"옵션을 팔면 세타가 플러스가 되어 시간이 흐를수록 이익이 쌓여요. 대신 감마가 마이너스라 급격한 움직임에 취약합니다.","ex":"등가격 콜을 8p에 팔고 일주일 뒤 5.5p에 되사면 2.5p(62만 5,000원) 이익이에요. 지수가 제자리였기 때문입니다.","rel":"세타 · 숏 감마 · 프리미엄","sem":"th","type":"concept","cat":"s3","semLabel":"세타"},{"t":"베가가 플러스인 포지션","sub":"Long vega","head":"IV 상승으로 이익을 보려면 어떤 포지션이어야 할까요?","hint":"변동성을 사 두는 쪽이에요","w":["베가가 마이너스인 포지션","델타가 0인 현물","숏 감마 포지션"],"def":"베가가 플러스인 포지션, 즉 옵션을 순매수한 상태는 IV가 오르면 이익이 납니다. 반대로 순매도는 IV 상승에 손실입니다.","ex":"베가 0.3p인 콜 1계약은 IV가 5%포인트 오르면 1.5p(37만 5,000원) 이익이에요. 지수가 제자리여도 가능합니다.","rel":"베가 · 롱 감마 · IV","sem":"ve","type":"concept","cat":"s3","semLabel":"베가"},{"t":"이벤트 전 옵션 매수를 피한다","sub":"IV crush defense","head":"실적발표처럼 IV가 급락할 이벤트를 앞두고 옵션 매수자가 조심할 점은?","hint":"좋은 뉴스에도 프리미엄이 녹을 수 있어요","w":["무조건 콜을 산다","만기를 짧게 잡는다","증거금을 더 낸다"],"def":"이벤트 전 옵션은 IV가 높아 비싸요. 발표 뒤 IV가 급락하면 방향이 맞아도 손실이 날 수 있어, 매수보다 매도나 스프레드가 유리할 때가 많아요.","ex":"실적발표 전 콜을 10p에 샀는데 발표 뒤 주가가 2% 올라도 IV가 60%→35%로 빠지면 프리미엄이 8p가 될 수 있어요.","rel":"IV 크러시 · 베가 · 실적발표","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"감마가 커져 델타가 급변한다","sub":"Expiry gamma risk","head":"만기 하루 전 등가격 옵션에서 특히 조심해야 할 것은?","hint":"마지막 날에는 델타가 0과 1 사이를 요동쳐요","w":["세타가 0이 된다","베가가 최대가 된다","프리미엄이 사라진다"],"def":"만기 직전 등가격 옵션은 감마가 폭발적으로 커져 델타가 급변해요. 지수가 조금만 움직여도 옵션 가치가 0과 극대 사이를 오갑니다.","ex":"만기 당일 지수 750p에서 행사가 750 콜은 지수가 0.5p만 움직여도 0.5p(12만 5,000원)씩 요동쳐요. 10계약이면 125만원입니다.","rel":"감마 · 만기일 · 핀닝","sem":"ga","type":"concept","cat":"s3","semLabel":"감마"},{"t":"VIX 선물이 현물보다 높다","sub":"VIX contango","head":"평온한 시장에서 VIX 선물 가격은 현물 VIX보다 보통 어떨까요?","hint":"변동성도 평균으로 돌아가니 먼 미래가 조금 높아요","w":["VIX 선물이 현물보다 낮다","둘이 항상 같다","VIX 선물이 0이 된다"],"def":"평온할 때는 VIX 선물이 현물보다 높은 콘탱고 구조가 흔해요. 변동성이 낮은 지금보다 미래에 조금 높아질 것으로 보기 때문입니다.","ex":"현물 VIX 15, 1개월물 17, 3개월물 18이라면 콘탱고예요. VIX가 급등하면 반대로 선물이 현물보다 낮은 백워데이션이 됩니다.","rel":"VIX · 콘탱고 · 변동성 기간구조","sem":"vo","type":"concept","cat":"s3","semLabel":"변동성지수"},{"t":"공포가 커졌다","sub":"VIX spike","head":"VIX가 하루 만에 20에서 35로 급등했습니다. 이것이 뜻하는 것은?","hint":"공포지수가 확 오르면 시장이 불안해요","w":["시장이 안정됐다","옵션이 싸졌다","변동성이 사라졌다"],"def":"VIX 급등은 시장이 앞으로 크게 흔들릴 것으로 보고 공포를 키웠다는 뜻이에요. 보통 주가 급락과 함께 나타납니다.","ex":"VIX가 75% 오르면 등가격 옵션 프리미엄도 거의 두 배가 돼요. 이때 옵션을 사 두지 못한 사람은 뒤늦게 비싼 보험을 사게 됩니다.","rel":"VIX · 공포지수 · 헤지","sem":"vo","type":"concept","cat":"s3","semLabel":"변동성지수"},{"t":"하방 공포가 커졌다","sub":"Skew steepening","head":"풋 IV와 콜 IV의 차이(스큐)가 더 벌어지면 무엇을 뜻할까요?","hint":"아래쪽 보험료만 더 비싸지는 거예요","w":["상승 기대가 커졌다","변동성이 0이 됐다","풋이 싸졌다"],"def":"스큐가 깊어진다는 것은 낮은 행사가 풋의 IV가 콜보다 훨씬 높아진다는 뜻이에요. 시장이 폭락 위험을 크게 보는 신호입니다.","ex":"콜 IV 47%는 그대로인데 풋 IV가 79%에서 95%로 오르면 스큐가 깊어진 거예요. 폭락 보험료만 급등한 셈입니다.","rel":"변동성 스큐 · 풋옵션 · 꼬리 위험","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"양쪽 꼬리의 위험","sub":"Smile cause","head":"변동성 스마일이 나타나는 근본적인 이유는?","hint":"크게 오르거나 크게 내릴 가능성 모두 값이 붙어요","w":["거래량이 적어서","금리가 올라서","만기가 짧아서"],"def":"스마일은 시장이 아주 크게 움직일 확률을 정규분포보다 높게 보기 때문에 생겨요. 양쪽 극단에 보험 수요가 몰려 IV가 올라갑니다.","ex":"지수가 하루 5%씩 움직이는 날이 실제로는 정규분포 예상보다 자주 나와요. 그래서 양쪽 먼 행사가 옵션에 웃돈이 붙습니다.","rel":"변동성 스큐 · 꼬리 위험 · IV","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"계약 수를 곱해 더한다","sub":"Aggregate greeks","head":"옵션 여러 계약을 보유할 때 포트폴리오 델타를 구하는 방법은?","hint":"각 계약의 델타 × 계약 수를 모두 더해요","w":["가장 큰 델타만 쓴다","평균을 낸다","계약 수를 곱하지 않는다"],"def":"포트폴리오 델타는 각 포지션의 델타 × 계약 수를 모두 더한 값이에요. 매도 포지션은 부호를 반대로 넣습니다.","ex":"델타 0.6 콜 5계약(+3), 델타 −0.4 풋 2계약(−0.8)이면 합계 델타는 +2.2예요. 선물 2.2계약어치 롱과 같습니다.","rel":"델타 · 델타 중립 · 포지션","sem":"de","type":"concept","cat":"s3","semLabel":"델타"},{"t":"6","sub":"Total delta","head":"델타 0.6인 콜 10계약을 보유했습니다. 선물 환산 델타는?","hint":"0.6 × 10계약이에요","w":["0.6","60","1.6"],"def":"계약 수를 곱하면 0.6 × 10 = 6이에요. 선물 6계약을 들고 있는 것과 비슷하게 움직입니다.","ex":"지수가 1p 오르면 6 × 25만원 = 150만원 이익이에요. 10p 오르면 1,500만원입니다.","rel":"델타 · 합성 선물 · 계약 수","sem":"de","type":"calc","cat":"s3","semLabel":"델타"},{"t":"1.5p","sub":"Total vega","head":"베가 0.15p인 옵션 10계약의 총 베가는?","hint":"0.15 × 10이에요","w":["0.15p","15p","1.5%"],"def":"총 베가 = 계약당 베가 × 계약 수 = 0.15 × 10 = 1.5p예요. IV가 1%포인트 오르면 1.5p(37만 5,000원)가 움직입니다.","ex":"IV가 5%포인트 오르면 7.5p(187만 5,000원) 이익이에요. 계약을 늘리면 변동성 민감도도 비례해서 커집니다.","rel":"베가 · 내재변동성 · 계약 수","sem":"ve","type":"calc","cat":"s3","semLabel":"베가"},{"t":"둘 다 유리하다","sub":"IV up for buyers","head":"IV가 급등하면 콜 매수자와 풋 매수자는 각각 어떻게 될까요?","hint":"변동성은 방향과 상관없이 옵션 값을 밀어 올려요","w":["콜만 유리하다","풋만 유리하다","둘 다 불리하다"],"def":"IV 상승은 콜과 풋 모두의 가격을 올려요. 그래서 옵션을 순매수한 사람은 방향과 상관없이 베가 이익을 얻습니다.","ex":"지수가 제자리여도 IV가 20%에서 30%로 오르면 콜과 풋이 함께 30% 넘게 오를 수 있어요. 이때 스트래들 매수자가 이익입니다.","rel":"베가 · 스트래들 · 내재변동성","sem":"ve","type":"concept","cat":"s3","semLabel":"베가"},{"t":"과거 20일","sub":"HV window","head":"역사적변동성을 계산할 때 흔히 쓰는 기간은?","hint":"최근 한 달 남짓의 움직임을 봐요","w":["과거 20년","미래 20일","만기까지 남은 기간"],"def":"역사적변동성은 보통 최근 20일(약 한 달) 또는 60일 수익률의 표준편차로 계산해요. 기간을 어떻게 잡느냐에 따라 값이 달라집니다.","ex":"20일 HV가 15%인데 60일 HV가 25%라면 최근 시장이 조용해진 거예요. IV가 어느 쪽에 가까운지 비교해 판단합니다.","rel":"역사적변동성 · 내재변동성 · IV 랭크","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"커버드 콜","sub":"Covered call","head":"주식을 들고 있으면서 그 주식의 콜옵션을 파는 전략은?","hint":"가진 주식 위에 콜을 하나 얹어요","w":["프로텍티브 풋","스트래들","칼라"],"def":"커버드 콜은 현물(또는 선물)을 보유한 상태에서 콜을 매도해 프리미엄을 버는 전략이에요. 주가가 행사가 아래에 머물면 프리미엄이 그대로 이익입니다.","ex":"지수 350p 상당을 들고 행사가 360 콜을 5p에 팔면 125만원을 먼저 받아요. 지수가 360 아래면 이 125만원이 그대로 남습니다.","rel":"프로텍티브 풋 · 콜 매도 · 프리미엄","sem":"cb","type":"concept","cat":"s4","semLabel":"커버드·보호"},{"t":"프로텍티브 풋","sub":"Protective put","head":"주식을 들고 있으면서 하락을 막으려고 풋옵션을 사는 전략은?","hint":"주식에 보험을 붙이는 거예요","w":["커버드 콜","스트랭글","합성 선물"],"def":"프로텍티브 풋은 현물을 보유하면서 풋을 매수해 하락 손실을 제한하는 전략이에요. 보험료(프리미엄)를 내고 최대 손실을 확정합니다.","ex":"지수 350p 상당을 들고 340 풋을 3p에 사면, 지수가 300으로 빠져도 손실은 13p(325만원)에서 멈춰요.","rel":"커버드 콜 · 풋 매수 · 헤지","sem":"cb","type":"concept","cat":"s4","semLabel":"커버드·보호"},{"t":"스트래들 매수","sub":"Long straddle","head":"같은 행사가의 콜과 풋을 함께 사서 큰 변동을 노리는 전략은?","hint":"위로든 아래로든 크게만 움직이면 돼요","w":["스트랭글 매수","스트래들 매도","아이언 콘도르"],"def":"롱 스트래들은 등가격 콜과 풋을 함께 사는 전략이에요. 어느 방향이든 크게 움직이면 이익이지만, 제자리면 두 프리미엄을 모두 잃습니다.","ex":"지수 350p에서 콜 8p, 풋 8p를 사면 총 16p(400만원)를 내요. 만기 지수가 334 아래나 366 위면 이익입니다.","rel":"스트랭글 · 스트래들 매도 · 손익분기","sem":"st","type":"concept","cat":"s4","semLabel":"스트래들"},{"t":"스트래들 매도","sub":"Short straddle","head":"같은 행사가의 콜과 풋을 함께 팔아 횡보에서 이익을 노리는 전략은?","hint":"제자리에 있으면 프리미엄을 다 먹어요","w":["스트래들 매수","아이언 콘도르","커버드 콜"],"def":"숏 스트래들은 등가격 콜과 풋을 모두 팔아 프리미엄을 받는 전략이에요. 지수가 좁은 범위에 머물면 이익이지만, 크게 움직이면 손실이 급격히 커집니다.","ex":"350p에서 콜·풋을 각 8p에 팔면 16p(400만원)를 받아요. 만기 지수가 350이면 400만원 전액이 이익, 320이면 1,400만원 손실입니다.","rel":"스트래들 매수 · 숏 감마 · 아이언 콘도르","sem":"st","type":"concept","cat":"s4","semLabel":"스트래들"},{"t":"스트랭글 매수","sub":"Long strangle","head":"행사가가 다른 외가격 콜과 풋을 함께 사는, 더 싼 변동성 전략은?","hint":"양쪽 멀리 싼 옵션을 하나씩 사요","w":["스트래들 매수","아이언 콘도르","불 콜 스프레드"],"def":"롱 스트랭글은 외가격 콜과 외가격 풋을 함께 사는 전략이에요. 스트래들보다 싸지만 더 크게 움직여야 이익이 납니다.","ex":"지수 350p에서 360 콜 4p, 340 풋 4p를 사면 총 8p(200만원)예요. 스트래들 16p의 절반이지만 332/368을 넘어야 이익입니다.","rel":"스트래들 · 손익분기 · 변동성","sem":"st","type":"concept","cat":"s4","semLabel":"스트래들"},{"t":"스트랭글 매도","sub":"Short strangle","head":"행사가가 다른 외가격 콜과 풋을 함께 팔아 좁은 범위를 노리는 전략은?","hint":"멀리 있는 양쪽 보험을 다 팔아요","w":["스트랭글 매수","스트래들 매도","불 풋 스프레드"],"def":"숏 스트랭글은 외가격 콜과 풋을 모두 팔아 프리미엄을 받는 전략이에요. 넓은 범위에서는 이익이지만 한쪽으로 크게 벗어나면 위험합니다.","ex":"360 콜 4p, 340 풋 4p를 팔면 8p(200만원)를 받아요. 만기 지수가 340~360 사이면 전액 이익, 300이면 1,000만원 손실입니다.","rel":"스트래들 매도 · 숏 감마 · 승률","sem":"st","type":"concept","cat":"s4","semLabel":"스트래들"},{"t":"불 콜 스프레드","sub":"Bull call spread","head":"낮은 행사가 콜을 사고 높은 행사가 콜을 파는 상승 전략은?","hint":"콜을 하나 사고 더 비싼 행사가 콜을 팔아 비용을 줄여요","w":["베어 풋 스프레드","불 풋 스프레드","커버드 콜"],"def":"불 콜 스프레드는 상승에 베팅하되 비용을 줄이려고 높은 행사가 콜을 함께 파는 전략이에요. 이익과 손실이 모두 제한됩니다.","ex":"350 콜 8p 매수, 360 콜 4p 매도면 순비용 4p(100만원)예요. 만기 360 이상이면 최대 6p(150만원) 이익, 350 아래면 100만원 손실입니다.","rel":"베어 풋 스프레드 · 스프레드 최대이익 · 상승 전략","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"베어 풋 스프레드","sub":"Bear put spread","head":"높은 행사가 풋을 사고 낮은 행사가 풋을 파는 하락 전략은?","hint":"풋을 사되 더 낮은 풋을 팔아 비용을 줄여요","w":["불 콜 스프레드","베어 콜 스프레드","프로텍티브 풋"],"def":"베어 풋 스프레드는 하락에 베팅하면서 낮은 행사가 풋을 팔아 비용을 줄이는 전략이에요. 손실과 이익이 모두 제한됩니다.","ex":"360 풋 12p 매수, 340 풋 4p 매도면 순비용 8p(200만원)예요. 만기 340 아래면 12p(300만원) 이익, 360 위면 200만원 손실입니다.","rel":"불 콜 스프레드 · 하락 전략 · 스프레드","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"불 풋 스프레드","sub":"Bull put spread","head":"높은 행사가 풋을 팔고 낮은 행사가 풋을 사서 프리미엄을 받는 상승 전략은?","hint":"아래쪽을 막아 두고 위쪽 풋을 팔아요","w":["베어 콜 스프레드","베어 풋 스프레드","불 콜 스프레드"],"def":"불 풋 스프레드는 높은 행사가 풋을 팔아 프리미엄을 받고, 낮은 행사가 풋을 사서 폭락을 막는 전략이에요. 지수가 오르거나 제자리면 이익입니다.","ex":"350 풋 3p 매도, 340 풋 1p 매수면 2p(50만원)를 받아요. 만기 350 위면 50만원 이익, 340 아래면 250만원 손실입니다.","rel":"불 콜 스프레드 · 신용 스프레드 · 상승 전략","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"베어 콜 스프레드","sub":"Bear call spread","head":"낮은 행사가 콜을 팔고 높은 행사가 콜을 사서 하락에 베팅하는 전략은?","hint":"위쪽을 막아 두고 콜을 팔아요","w":["불 풋 스프레드","베어 풋 스프레드","숏 스트래들"],"def":"베어 콜 스프레드는 낮은 행사가 콜을 팔아 프리미엄을 받고, 높은 행사가 콜을 사서 급등을 막는 전략이에요. 지수가 내리거나 제자리면 이익입니다.","ex":"360 콜 4p 매도, 370 콜 1.5p 매수면 2.5p(62만 5,000원)를 받아요. 만기 360 아래면 이익, 370 위면 187만 5,000원 손실입니다.","rel":"불 풋 스프레드 · 신용 스프레드 · 콜 매도","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"아이언 콘도르","sub":"Iron condor","head":"풋 스프레드와 콜 스프레드를 함께 팔아 횡보에서 이익을 노리는 전략은?","hint":"위아래를 다 막아 둔 상자 모양이에요","w":["아이언 버터플라이","스트랭글 매수","불 콜 스프레드"],"def":"아이언 콘도르는 불 풋 스프레드와 베어 콜 스프레드를 합친 전략이에요. 가운데 범위에 머물면 최대 이익, 크게 벗어나면 제한된 손실입니다.","ex":"345 풋 2.5p 매도·335 풋 1p 매수, 365 콜 2.5p 매도·375 콜 1p 매수면 3p(75만원)를 받아요. 345~365에 머물면 75만원 이익입니다.","rel":"아이언 버터플라이 · 스트랭글 매도 · 횡보 전략","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"아이언 버터플라이","sub":"Iron butterfly","head":"등가격 콜·풋을 팔고 양쪽 외가격을 사서 좁은 횡보를 노리는 전략은?","hint":"가운데를 팔고 양쪽을 막아요","w":["아이언 콘도르","롱 버터플라이","스트래들 매수"],"def":"아이언 버터플라이는 등가격 콜과 풋을 매도하고 양쪽 외가격 옵션을 매수해 위험을 막는 전략이에요. 정확히 제자리일 때 이익이 가장 큽니다.","ex":"350 콜·풋을 각 8p에 팔고 340 풋·360 콜을 각 3p에 사면 10p(250만원)를 받아요. 만기 350이면 최대 이익입니다.","rel":"아이언 콘도르 · 롱 버터플라이 · 핀닝","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"롱 버터플라이","sub":"Long butterfly","head":"같은 방향 옵션 네 개를 행사가별로 사고팔아 아주 좁은 구간에서 이익을 보는 전략은?","hint":"낮은 것 사고, 가운데 두 개 팔고, 높은 것 사요","w":["아이언 버터플라이","캘린더 스프레드","비율 스프레드"],"def":"롱 버터플라이는 행사가 340·350·360 콜을 1개·2개·1개로 조합하는 전략이에요. 비용이 적고 손실이 제한되며 350 근처에서 최대 이익입니다.","ex":"340 콜 12p 매수, 350 콜 2개 6p씩 매도, 360 콜 2p 매수면 순비용 2p(50만원)예요. 만기 350에서 8p(200만원) 이익입니다.","rel":"아이언 버터플라이 · 핀닝 · 행사가","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"캘린더 스프레드","sub":"Calendar spread","head":"같은 행사가에서 단기 옵션을 팔고 장기 옵션을 사는 전략은?","hint":"만기가 다른 두 옵션을 포개요","w":["대각 스프레드","롱 버터플라이","아이언 콘도르"],"def":"캘린더 스프레드는 같은 행사가의 근월물을 팔고 원월물을 사는 전략이에요. 단기 옵션의 빠른 시간 소멸을 이용해 이익을 노립니다.","ex":"350 콜 1주물을 5p에 팔고 1개월물을 8p에 사면 3p(75만원) 비용이에요. 일주일 뒤 1주물이 1p로 녹으면 7p 이익이 납니다.","rel":"대각 스프레드 · 세타 · 기간구조","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"대각 스프레드","sub":"Diagonal spread","head":"행사가도 다르고 만기도 다른 두 옵션을 조합하는 전략은?","hint":"가로(행사가)와 세로(만기)가 모두 달라요","w":["캘린더 스프레드","수직 스프레드","스트랭글"],"def":"대각 스프레드는 행사가와 만기가 모두 다른 옵션을 사고파는 전략이에요. 캘린더와 수직 스프레드의 성격을 함께 가집니다.","ex":"350 콜 1주물을 팔고 360 콜 3개월물을 사면 대각 스프레드예요. 짧은 쪽의 시간가치를 벌면서 긴 쪽으로 상승 여지를 남깁니다.","rel":"캘린더 스프레드 · 수직 스프레드 · 세타","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"합성 숏 선물","sub":"Synthetic short","head":"풋옵션 매수와 콜옵션 매도를 같은 행사가로 하면 어떤 포지션과 같아질까요?","hint":"아래로 내리면 이익, 위로 오르면 손실이에요","w":["합성 롱 선물","롱 스트래들","아이언 콘도르"],"def":"풋 매수 + 콜 매도는 선물 매도와 손익 모양이 같아요. 그래서 합성 숏 선물이라고 합니다.","ex":"350p에서 풋 3p 매수, 콜 3p 매도면 비용이 거의 없어요. 만기 340이면 풋 10p 이익으로 선물 10p 숏과 같습니다.","rel":"합성 롱 선물 · 풋콜패리티 · 숏 포지션","sem":"sy","type":"concept","cat":"s4","semLabel":"합성·차익"},{"t":"칼라","sub":"Collar","head":"주식을 들고 풋을 사면서 그 비용을 콜 매도로 메우는 전략은?","hint":"보험료를 다른 옵션 팔아 충당해요","w":["커버드 콜","프로텍티브 풋","스트랭글"],"def":"칼라는 풋을 매수해 하락을 막고, 콜을 매도해 그 비용을 줄이는 전략이에요. 손실과 이익이 모두 좁은 범위로 묶입니다.","ex":"지수 350p 보유, 340 풋 3p 매수, 360 콜 3p 매도면 비용이 0이에요. 340~360 사이에 손익이 갇히는 무비용 칼라가 됩니다.","rel":"프로텍티브 풋 · 커버드 콜 · 무비용 칼라","sem":"cb","type":"concept","cat":"s4","semLabel":"커버드·보호"},{"t":"리버스 아이언 콘도르","sub":"Reverse iron condor","head":"아이언 콘도르와 반대로, 크게 움직일 때 이익이 나는 전략은?","hint":"콘도르를 뒤집으면 변동성 매수가 돼요","w":["아이언 콘도르","롱 버터플라이","숏 스트래들"],"def":"리버스 아이언 콘도르는 안쪽 옵션을 사고 바깥쪽을 팔아, 지수가 크게 벗어날 때 이익이 나는 전략이에요. 비용이 제한적입니다.","ex":"345 풋·365 콜 매수, 335 풋·375 콜 매도로 2p(50만원)를 내요. 만기 지수가 340 아래나 370 위면 이익이 납니다.","rel":"아이언 콘도르 · 롱 감마 · 변동성 매수","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"비율 스프레드","sub":"Ratio spread","head":"콜 1개를 사고 콜 2개를 파는 것처럼 수량 비율을 다르게 하는 전략은?","hint":"사는 수와 파는 수가 달라요","w":["수직 스프레드","캘린더 스프레드","버터플라이"],"def":"비율 스프레드는 매수와 매도 수량을 다르게 해 프리미엄을 맞추는 전략이에요. 한 방향으로 크게 가면 손실이 커질 수 있습니다.","ex":"350 콜 8p 1개 매수, 360 콜 4p 2개 매도면 비용이 0이에요. 360까지는 이익이지만 380이 되면 10p(250만원) 손실입니다.","rel":"수직 스프레드 · 숏 감마 · 수량 비율","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"15p (375만원)","sub":"Covered call max","head":"지수 350p 상당을 보유하고 360 콜을 5p에 팔았습니다. 최대 이익은?","hint":"행사가까지 오른 이익 + 받은 프리미엄이에요","w":["5p (125만원)","10p (250만원)","무한대"],"def":"커버드 콜의 최대 이익은 (행사가 − 매입가 + 프리미엄)이에요. (360 − 350 + 5) = 15p, 375만원입니다.","ex":"지수가 380까지 올라도 360에서 넘겨줘야 해 15p가 한계예요. 대신 지수가 빠지면 프리미엄 5p가 완충 역할을 합니다.","rel":"커버드 콜 · 최대이익 · 프리미엄","sem":"cb","type":"calc","cat":"s4","semLabel":"커버드·보호"},{"t":"13p (325만원)","sub":"Protective put max loss","head":"지수 350p 상당을 보유하고 340 풋을 3p에 샀습니다. 최대 손실은?","hint":"340까지의 하락 + 보험료예요","w":["3p (75만원)","10p (250만원)","무한대"],"def":"프로텍티브 풋의 최대 손실은 (매입가 − 행사가 + 프리미엄)이에요. (350 − 340 + 3) = 13p, 325만원입니다.","ex":"지수가 300으로 폭락해도 손실은 325만원에서 멈춰요. 보험료 75만원으로 250만원 추가 손실을 막은 셈입니다.","rel":"프로텍티브 풋 · 보험 · 최대손실","sem":"cb","type":"calc","cat":"s4","semLabel":"커버드·보호"},{"t":"334p와 366p","sub":"Straddle break-even","head":"행사가 350에서 콜 8p, 풋 8p를 함께 샀습니다. 만기 손익분기점은?","hint":"행사가에서 총 프리미엄을 더하고 빼요","w":["342p와 358p","350p 하나","334p 하나"],"def":"스트래들 손익분기점은 행사가 ± 총 프리미엄이에요. 350 ± 16 = 334p와 366p입니다.","ex":"총 16p(400만원)를 냈으니 지수가 16p 넘게 움직여야 본전이에요. 334 아래나 366 위에서 이익이 납니다.","rel":"스트래들 · 손익분기 · 프리미엄","sem":"st","type":"calc","cat":"s4","semLabel":"스트래들"},{"t":"3p (75만원)","sub":"Iron condor max","head":"345 풋 2.5p 매도·335 풋 1p 매수, 365 콜 2.5p 매도·375 콜 1p 매수. 최대 이익은?","hint":"받은 프리미엄 전액이 최대 이익이에요","w":["2.5p (62만 5,000원)","5p (125만원)","10p (250만원)"],"def":"아이언 콘도르의 최대 이익은 받은 순 프리미엄이에요. (2.5 − 1) + (2.5 − 1) = 3p, 75만원입니다.","ex":"만기 지수가 345~365 안에 있으면 75만원을 다 먹어요. 335 아래나 375 위로 벗어나면 최대 7p(175만원) 손실입니다.","rel":"아이언 콘도르 · 최대이익 · 프리미엄","sem":"sp","type":"calc","cat":"s4","semLabel":"스프레드"},{"t":"4p (100만원)","sub":"Bull call max loss","head":"350 콜 8p 매수, 360 콜 4p 매도. 이 스프레드의 최대 손실은?","hint":"낸 순비용이 최대 손실이에요","w":["8p (200만원)","10p (250만원)","6p (150만원)"],"def":"불 콜 스프레드의 최대 손실은 순비용이에요. 8 − 4 = 4p, 100만원입니다.","ex":"지수가 350 아래로 내려가면 두 콜이 모두 무가치가 되어 100만원을 잃어요. 8p를 다 잃지 않는 것이 스프레드의 장점입니다.","rel":"불 콜 스프레드 · 최대손실 · 순비용","sem":"sp","type":"calc","cat":"s4","semLabel":"스프레드"},{"t":"6p (150만원)","sub":"Bull call max profit","head":"350 콜 8p 매수, 360 콜 4p 매도. 최대 이익은?","hint":"행사가 차이 10p에서 순비용 4p를 빼요","w":["4p (100만원)","10p (250만원)","14p (350만원)"],"def":"불 콜 스프레드의 최대 이익은 (행사가 차이 − 순비용)이에요. 10 − 4 = 6p, 150만원입니다.","ex":"지수가 360 위로 오르면 6p가 확정돼요. 100만원을 걸고 150만원을 버는 구조로, 손익비 1.5배입니다.","rel":"불 콜 스프레드 · 최대이익 · 손익비","sem":"sp","type":"calc","cat":"s4","semLabel":"스프레드"},{"t":"아이언 콘도르 매도","sub":"Range strategy","head":"지수가 당분간 좁은 범위에 머물 것 같을 때 가장 잘 맞는 전략은?","hint":"가만히 있으면 프리미엄을 먹는 쪽이에요","w":["스트래들 매수","스트랭글 매수","불 콜 스프레드"],"def":"횡보가 예상되면 양쪽 외가격 옵션을 파는 아이언 콘도르가 잘 맞아요. 범위 안에 머물면 프리미엄이 이익이 됩니다.","ex":"지수 750p 근처에서 730~770 아이언 콘도르를 팔면, 한 달 뒤 750에 머물 때 최대 이익이에요. 대신 급등·급락에는 취약합니다.","rel":"아이언 콘도르 · 숏 감마 · 횡보","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"콜과 풋을 함께 산다","sub":"Volatility strategy","head":"방향은 모르겠지만 곧 크게 움직일 것 같을 때 맞는 전략은?","hint":"위아래 어느 쪽이든 크게만 가면 돼요","w":["아이언 콘도르","커버드 콜","풋만 산다"],"def":"방향을 모르지만 변동성이 커질 것 같으면 콜과 풋을 함께 사는 스트래들이 맞아요. 어느 쪽으로든 크게 움직이면 이익입니다.","ex":"FOMC를 앞두고 지수가 750p일 때 콜·풋을 사면, 발표 후 30p만 움직여도 이익이에요. 다만 IV가 높아 비싸게 살 수 있습니다.","rel":"스트래들 · 변동성 · IV 크러시","sem":"st","type":"concept","cat":"s4","semLabel":"스트래들"},{"t":"낮은 콜을 사고 높은 콜을 판다","sub":"Slow rise strategy","head":"완만한 상승을 예상하지만 큰 비용은 쓰고 싶지 않을 때 맞는 전략은?","hint":"상승은 보되 위쪽 이익을 일부 포기해 비용을 줄여요","w":["롱 스트래들","숏 스트랭글","프로텍티브 풋"],"def":"완만한 상승에는 불 콜 스프레드가 잘 맞아요. 콜을 사고 더 높은 콜을 팔아 비용을 줄이고, 제한된 이익을 노립니다.","ex":"350 콜 8p 대신 360 콜을 4p에 팔면 비용이 절반이에요. 지수가 360까지 오르면 6p(150만원)를 법니다.","rel":"불 콜 스프레드 · 상승 전략 · 프리미엄","sem":"sp","type":"concept","cat":"s4","semLabel":"스프레드"},{"t":"풋을 사고 콜을 판다","sub":"Hedge cost strategy","head":"주식을 들고 하락은 막고 싶지만 보험료가 부담될 때 쓰는 전략은?","hint":"위쪽 이익을 팔아 보험료를 마련해요","w":["프로텍티브 풋","커버드 콜","스트랭글 매수"],"def":"칼라는 풋 매수 비용을 콜 매도로 상쇄해 하락 방어를 거의 무료로 만드는 전략이에요. 대신 상승 이익이 제한됩니다.","ex":"350p 보유, 340 풋 3p 매수, 360 콜 3p 매도면 비용이 0이에요. 지수가 330으로 빠져도 손실은 10p(250만원)입니다.","rel":"칼라 · 프로텍티브 풋 · 커버드 콜","sem":"cb","type":"concept","cat":"s4","semLabel":"커버드·보호"},{"t":"풋 매도로 사기","sub":"Buy via put sell","head":"주식을 지금 사지 않고, 원하는 가격에 사기로 하면서 프리미엄을 받는 방법은?","hint":"그 가격에 오면 사 주는 대신 돈을 받아요","w":["콜 매수","선물 매수","스톱주문"],"def":"원하는 행사가의 풋을 팔면, 지수가 그 아래로 내려올 때 그 가격에 사는 대신 프리미엄을 받아요. 실제 매입 단가를 낮추는 효과가 있습니다.","ex":"지수 750p에서 700 풋을 12p에 팔면 300만원을 받아요. 지수가 700 아래로 오면 700에 사고, 안 오면 프리미엄만 남습니다.","rel":"풋 매도 · 행사가격 · 평단가","sem":"cb","type":"concept","cat":"s4","semLabel":"커버드·보호"},{"t":"미결제약정","sub":"Open interest","head":"아직 청산되지 않고 남아 있는 선물·옵션 계약의 수를 부르는 말은?","hint":"문을 닫지 않고 열려 있는 계약 수예요","w":["거래량","매수차익잔고","호가잔량"],"def":"미결제약정(OI)은 시장에 살아 있는 계약 수예요. 새 포지션이 생기면 늘고, 청산되면 줄어듭니다.","ex":"하루 10만 계약이 거래돼도 대부분 청산되면 OI는 늘지 않아요. OI가 30만에서 32만으로 늘면 2만 계약의 새 포지션이 생긴 겁니다.","rel":"거래량 · 포지션 · 수급","sem":"oi","type":"def2term","cat":"s4","semLabel":"미결제약정"},{"t":"신규 매수 유입","sub":"OI up price up","head":"미결제약정이 늘고 가격도 오르면 보통 무엇을 뜻할까요?","hint":"새로 사는 사람이 파는 사람보다 많아요","w":["숏 청산","롱 청산","거래 부진"],"def":"OI 증가 + 가격 상승은 새 매수세가 들어와 포지션을 쌓는 것으로 해석해요. 추세가 이어질 힘이 생긴 것으로 봅니다.","ex":"선물 가격이 350에서 355로 오르는 동안 OI가 1만 계약 늘면, 새 롱이 그만큼 들어온 거예요. 상승 추세의 연료가 됩니다.","rel":"미결제약정 · 롱 포지션 · 추세","sem":"oi","type":"concept","cat":"s4","semLabel":"미결제약정"},{"t":"신규 매도 유입","sub":"OI up price down","head":"미결제약정이 늘고 가격이 내리면 보통 무엇을 뜻할까요?","hint":"새로 파는 사람이 늘고 있어요","w":["신규 매수 유입","숏 청산","롱 청산"],"def":"OI 증가 + 가격 하락은 새 매도세가 들어와 숏을 쌓는 것으로 해석해요. 하락 추세가 강해질 수 있습니다.","ex":"가격이 350에서 345로 내리는 동안 OI가 8,000계약 늘면, 새 숏이 8,000계약 들어온 거예요. 반등이 나와도 매물이 될 수 있습니다.","rel":"미결제약정 · 숏 포지션 · 추세","sem":"oi","type":"concept","cat":"s4","semLabel":"미결제약정"},{"t":"숏 청산","sub":"Short covering","head":"미결제약정이 줄고 가격이 오르면 보통 무엇을 뜻할까요?","hint":"숏이 놀라서 되사고 있어요","w":["신규 매수 유입","롱 청산","신규 매도 유입"],"def":"OI 감소 + 가격 상승은 기존 숏이 손실을 피해 되사는(환매수) 모습이에요. 새 매수세가 아니라서 상승이 오래가지 않을 수 있습니다.","ex":"지수가 3% 급등하는데 OI가 2만 계약 줄면 숏 청산이에요. 숏이 다 정리되면 상승 동력도 사라질 수 있습니다.","rel":"미결제약정 · 숏 포지션 · 환매수","sem":"oi","type":"concept","cat":"s4","semLabel":"미결제약정"},{"t":"롱 청산","sub":"Long liquidation","head":"미결제약정이 줄고 가격이 내리면 보통 무엇을 뜻할까요?","hint":"롱이 지쳐서 팔고 있어요","w":["신규 매도 유입","숏 청산","신규 매수 유입"],"def":"OI 감소 + 가격 하락은 기존 롱이 손절하거나 이익을 실현하며 파는 모습이에요. 새 숏이 들어오는 것과는 다릅니다.","ex":"가격이 350에서 344로 내리는데 OI가 1만 5,000계약 줄면 롱 청산이에요. 매도 물량이 소진되면 반등할 여지도 생깁니다.","rel":"미결제약정 · 롱 포지션 · 손절","sem":"oi","type":"concept","cat":"s4","semLabel":"미결제약정"},{"t":"프로그램 매매","sub":"Program trading","head":"정해진 조건에 따라 컴퓨터가 여러 종목을 한꺼번에 사고파는 매매는?","hint":"사람이 아니라 시스템이 조건대로 움직여요","w":["차익거래","비차익거래","공매도"],"def":"프로그램 매매는 가격 조건이 맞으면 컴퓨터가 자동으로 바스켓 주문을 내는 방식이에요. 차익거래와 비차익거래로 나뉩니다.","ex":"베이시스가 기준을 넘으면 1초 만에 200개 종목을 사고 선물을 파는 주문이 나가요. 사람이 손으로 하기 어려운 속도입니다.","rel":"차익거래 · 비차익거래 · 매수차익잔고","sem":"pg","type":"def2term","cat":"s4","semLabel":"프로그램"},{"t":"차익거래","sub":"Arbitrage","head":"현물과 선물의 가격 차이를 이용해 위험을 거의 없애고 이익을 노리는 거래는?","hint":"한쪽을 사고 다른 쪽을 팔아 가격 차이를 먹어요","w":["비차익거래","투기","헤지"],"def":"차익거래는 선물이 이론가보다 비싸면 현물을 사고 선물을 팔아 차이를 확정하는 거래예요. 만기에 가격이 같아지는 성질을 이용합니다.","ex":"현물 350p, 선물 353p, 이론가 350.5p라면 선물이 2.5p 비싸요. 현물을 사고 선물을 팔면 만기에 2.5p(62만 5,000원)가 남습니다.","rel":"비차익거래 · 베이시스 · 프로그램 매매","sem":"pg","type":"def2term","cat":"s4","semLabel":"프로그램"},{"t":"비차익거래","sub":"Non-arbitrage program","head":"선물과 현물의 가격 차이와 상관없이, 종목 바구니를 사고파는 프로그램 매매는?","hint":"가격 차이가 아니라 다른 신호로 바스켓을 사요","w":["차익거래","헤지","스프레드"],"def":"비차익거래는 선물 가격 차이와 무관하게 지수 방향이나 자금 흐름에 따라 바스켓을 매매하는 거예요. 기관의 지수 매매로 나타납니다.","ex":"선물 베이시스가 0인데도 200개 종목을 3,000억원어치 사는 주문이 나오면 비차익 매수예요. 지수를 통째로 사는 효과가 있습니다.","rel":"차익거래 · 프로그램 매매 · 지수 매매","sem":"pg","type":"def2term","cat":"s4","semLabel":"프로그램"},{"t":"매수차익잔고","sub":"Buy arbitrage balance","head":"매수차익거래로 사 둔 현물 포지션이 남아 있는 금액은?","hint":"차익거래로 묶여 있는 물량이에요","w":["미결제약정","공매도 잔고","대차잔고"],"def":"매수차익잔고는 현물을 사고 선물을 팔아 차익을 노리는 포지션이 남아 있는 규모예요. 만기나 청산 때 현물 매도 물량이 될 수 있습니다.","ex":"매수차익잔고가 3조원이면 만기일에 그중 일부가 현물 매도로 나와 지수를 누를 수 있어요. 만기 전후 수급을 볼 때 중요합니다.","rel":"차익거래 · 만기일 · 프로그램 매매","sem":"pg","type":"def2term","cat":"s4","semLabel":"프로그램"},{"t":"현물을 사고 선물을 판다","sub":"Basis arbitrage","head":"선물이 이론가보다 비쌀 때 차익거래는 어떻게 할까요?","hint":"비싼 쪽을 팔고 싼 쪽을 사요","w":["현물을 팔고 선물을 산다","둘 다 산다","둘 다 판다"],"def":"선물이 비싸면 현물을 사고 선물을 팔아요. 만기에 두 가격이 같아지면 비싸게 판 선물에서 차익이 확정됩니다.","ex":"현물 350p, 선물 353p라면 현물 매수 + 선물 매도로 3p를 잠가요. 만기 352p로 끝나면 현물 2p 이익, 선물 1p 이익으로 합계 3p입니다.","rel":"차익거래 · 베이시스 · 매수차익잔고","sem":"pg","type":"concept","cat":"s4","semLabel":"프로그램"},{"t":"지수 상승 기대","sub":"Foreign futures buy","head":"외국인이 선물을 순매수하고 있다는 것은 보통 무엇을 뜻할까요?","hint":"한국 지수가 오를 것으로 보는 쪽이에요","w":["지수 하락 기대","환율 상승 기대","거래 중단"],"def":"외국인의 선물 순매수는 지수 상승에 베팅하거나 현물 헤지를 조정하는 것으로 해석해요. 수급의 방향을 보여 주는 지표입니다.","ex":"외국인이 코스피200 선물을 5,000계약 순매수하면 계약당 8,750만원 기준 약 4,375억원어치 롱이에요. 시장이 주목하는 숫자입니다.","rel":"외국인 · 수급 · 순매수","sem":"fo","type":"concept","cat":"s4","semLabel":"외국인·수급"},{"t":"강한 상승 신호","sub":"Foreign cash and futures","head":"외국인이 현물과 선물을 동시에 순매수하면 어떻게 해석할까요?","hint":"양쪽에서 다 사면 확신이 강해 보여요","w":["하락 헤지","차익 청산","중립 포지션"],"def":"외국인이 현물도 사고 선물도 사면 방향성 매수로 보는 경우가 많아요. 헤지가 아니라 실제 위험을 늘리는 매수이기 때문입니다.","ex":"현물 3,000억원 순매수와 선물 5,000계약 순매수가 함께 나오면 시장은 강한 상승 신호로 읽어요.","rel":"외국인 · 현물 · 선물","sem":"fo","type":"concept","cat":"s4","semLabel":"외국인·수급"},{"t":"기관이 사는 쪽이 더 많다","sub":"Institution net buy","head":"기관이 선물을 순매수하면 무엇을 뜻할까요?","hint":"기관이 사는 쪽이 더 많다는 뜻이에요","w":["기관이 파는 쪽이 더 많다","외국인이 사는 쪽이 더 많다","거래가 중단됐다"],"def":"기관 순매수는 기관 투자자의 매수 계약이 매도보다 많다는 뜻이에요. 연기금·자산운용사의 헤지 수요가 섞여 있어 해석에 주의해야 합니다.","ex":"기관이 2,000계약 순매수해도 그중 상당수가 현물 보유의 헤지일 수 있어요. 무조건 상승 베팅으로 보면 안 됩니다.","rel":"외국인 · 기관 · 헤지","sem":"fo","type":"concept","cat":"s4","semLabel":"외국인·수급"},{"t":"외국인·기관·개인","sub":"Market participants","head":"선물 시장의 수급을 볼 때 흔히 나누는 세 주체는?","hint":"돈의 주인이 누구인지 나눠 봐요","w":["롱·숏·중립","콜·풋·선물","현물·선물·옵션"],"def":"선물 시장 참가자는 보통 외국인, 기관, 개인으로 나눠 봐요. 각 주체의 순매수·순매도가 지수 방향과 만기 수급을 만듭니다.","ex":"외국인 +3,000계약, 기관 −1,000계약, 개인 −2,000계약이면 외국인이 개인·기관 물량을 받아낸 구조예요.","rel":"외국인 · 기관 · 개인","sem":"fo","type":"concept","cat":"s4","semLabel":"외국인·수급"},{"t":"동시만기","sub":"Simultaneous expiry","head":"코스피200 선물과 옵션이 같은 날 함께 만기를 맞는 것을 부르는 말은?","hint":"두 상품이 같은 날 끝나요","w":["위클리 만기","롤오버","분기 결산"],"def":"동시만기는 선물과 옵션이 같은 날 만기되는 거예요. 코스피200은 3·6·9·12월 두 번째 목요일에 함께 끝나 수급이 한꺼번에 몰립니다.","ex":"동시만기일에는 선물 수십만 계약과 옵션 수백만 계약이 함께 정산돼요. 오후 3시 무렵 지수가 급하게 움직이는 일이 자주 있습니다.","rel":"네 마녀의 날 · 핀닝 · 롤오버","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"네 마녀의 날","sub":"Quadruple witching","head":"코스피200 선물·옵션과 개별주식 선물·옵션이 동시에 만기되는 날은?","hint":"네 가지 파생상품이 한꺼번에 끝나요","w":["위클리 만기일","월말 결산일","배당락일"],"def":"네 마녀의 날은 네 가지 파생상품이 동시에 만기되는 날이에요. 프로그램 매매와 롤오버가 몰려 지수 변동성이 평소보다 커집니다.","ex":"3·6·9·12월 두 번째 목요일이 네 마녀의 날이에요. 이날 마감 동시호가에서 지수가 1% 넘게 튀는 일이 있습니다.","rel":"만기일 · 동시만기 · 프로그램 매매","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"핀닝","sub":"Pinning","head":"만기일 무렵 지수가 특정 행사가격에 붙어 움직이는 현상은?","hint":"옵션 수급이 지수를 한 가격에 묶어 둬요","w":["스퀴즈","갭","슬리피지"],"def":"핀닝은 옵션 매도자의 헤지 수급 때문에 만기일 지수가 미결제가 많은 행사가 근처에 머무는 현상이에요.","ex":"750 콜과 풋에 미결제가 각 8,000계약씩 몰려 있으면, 만기일 지수가 750 근처에서 움직이려는 힘이 생겨요. 748~752에 갇히기도 합니다.","rel":"만기일 · 미결제약정 · 딜러 감마","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"정산과 롤오버가 겹치기 때문","sub":"Expiry program","head":"만기일 오후에 프로그램 매매가 몰리는 이유는?","hint":"정산과 롤오버를 한꺼번에 하기 때문이에요","w":["거래세가 없어서","증거금이 0이 돼서","옵션이 사라져서"],"def":"만기일에는 차익거래 청산, 롤오버, 옵션 헤지 조정이 한꺼번에 일어나요. 그래서 대량 프로그램 주문이 몰리고 지수가 흔들립니다.","ex":"만기일 3시 직전 수천억원대 프로그램 매도가 나와 지수가 1% 빠지는 일이 있어요. 개인은 이 시간대 변동성에 특히 주의해야 합니다.","rel":"만기일 · 프로그램 매매 · 롤오버","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"근월물을 팔고 원월물을 산다","sub":"Rollover flow","head":"롱 포지션을 가진 투자자가 만기를 넘기려면 어떻게 할까요?","hint":"가까운 계약을 팔고 먼 계약을 사요","w":["둘 다 판다","근월물을 그대로 둔다","현물로 바꾼다"],"def":"롤오버는 근월물을 청산하고 같은 방향으로 원월물을 새로 사는 거예요. 이 수급이 만기 전후 근월·원월 가격 차이를 만듭니다.","ex":"12월물 롱 10계약을 3월물로 옮기면 12월물 매도 10계약, 3월물 매수 10계약이 나가요. 두 월물 스프레드가 3p면 75만원 비용입니다.","rel":"롤오버 · 근월물 · 원월물","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"최대고통","sub":"Max pain","head":"만기일에 옵션 매수자들의 손실이 가장 커지는 지수 수준을 부르는 말은?","hint":"매도자에게 가장 편한 가격이에요","w":["손익분기점","행사가격","이론가격"],"def":"최대고통은 만기 때 옵션 매수자 전체의 이익이 최소가 되는 가격이에요. 미결제가 많은 행사가 근처에서 형성되는 경향이 있습니다.","ex":"750·755·760 콜과 풋 미결제가 많을 때 계산해 보면 752 근처가 최대고통이에요. 만기 지수가 그쪽으로 끌리는지 보는 참고 지표입니다.","rel":"핀닝 · 미결제약정 · 만기일","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"딜러 감마","sub":"Dealer gamma","head":"시장조성자가 옵션을 팔고 남은 감마 포지션을 부르는 말은?","hint":"시장조성자의 헤지가 지수를 흔들어요","w":["베가 노출","델타 중립","세타 수취"],"def":"딜러 감마는 옵션 시장조성자가 보유한 감마예요. 딜러가 숏 감마면 지수가 움직일 때 같은 방향으로 헤지해 변동성이 커집니다.","ex":"딜러가 숏 감마 상태에서 지수가 오르면 콜 헤지를 위해 선물을 더 사야 해요. 그래서 상승이 더 가팔라질 수 있습니다.","rel":"감마 · 핀닝 · 변동성","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"공매도 잔고","sub":"Short interest","head":"주식을 빌려서 판 뒤 아직 되사지 않은 물량을 부르는 말은?","hint":"빌려 판 주식이 아직 남아 있어요","w":["매수차익잔고","미결제약정","대차잔고"],"def":"공매도 잔고는 빌려서 판 주식 중 아직 되사지 않은 양이에요. 잔고가 많으면 되사는 물량이 나와 주가가 반등할 수 있습니다.","ex":"공매도 잔고가 상장주식의 5%면, 숏 스퀴즈가 나올 때 하루에 수백만 주의 매수세가 생길 수 있어요.","rel":"대차거래 · 숏 스퀴즈 · 공매도","sem":"fo","type":"concept","cat":"s4","semLabel":"외국인·수급"},{"t":"대차거래","sub":"Securities lending","head":"주식을 빌려 주고 수수료를 받는 거래는?","hint":"주식을 빌려 주는 쪽과 빌리는 쪽이 있어요","w":["공매도","스왑","리포"],"def":"대차거래는 주식을 가진 쪽이 빌려 주고, 빌린 쪽이 나중에 같은 주식을 돌려주는 거래예요. 공매도의 바탕이 됩니다.","ex":"연기금이 보유 주식을 대차로 빌려 주면 연 1~2%의 수수료를 받아요. 빌린 쪽은 그 주식을 팔아 숏 포지션을 만듭니다.","rel":"공매도 잔고 · 숏 포지션 · 수수료","sem":"fo","type":"concept","cat":"s4","semLabel":"외국인·수급"},{"t":"스프레드","sub":"Calendar spread","head":"같은 상품의 만기가 다른 두 선물 가격 차이를 부르는 말은?","hint":"달이 다른 두 계약의 값 차이예요","w":["베이시스","틱","프리미엄"],"def":"선물 스프레드는 근월물과 원월물의 가격 차이예요. 이자·배당·보관비용과 수급에 따라 달라집니다.","ex":"12월물 750.0, 3월물 753.0이면 스프레드가 3p예요. 롤오버할 때 이 3p(75만원)를 비용으로 부담합니다.","rel":"롤오버 · 콘탱고 · 근월물","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"많을수록 유동성이 좋다","sub":"OI and liquidity","head":"미결제약정이 많은 종목은 유동성이 어떨까요?","hint":"계약이 많이 살아 있으면 거래가 잘 돼요","w":["나쁘다","항상 같다","0이 된다"],"def":"미결제약정이 많은 행사가·월물은 사고팔 사람이 많아 유동성이 좋아요. 원하는 가격에 체결될 확률이 높고 호가 차이도 좁습니다.","ex":"750 콜의 미결제가 8,000계약이고 890 콜은 200계약이면, 750 콜이 훨씬 쉽게 사고팔 수 있어요. 890 콜은 팔고 싶어도 상대가 없을 수 있습니다.","rel":"미결제약정 · 유동성 · 호가","sem":"oi","type":"concept","cat":"s4","semLabel":"미결제약정"},{"t":"거래량은 하루 체결, OI는 남은 계약","sub":"Volume vs OI","head":"거래량과 미결제약정의 차이는?","hint":"오늘 오간 양과 아직 살아 있는 양이에요","w":["둘은 항상 같다","거래량은 남은 계약, OI는 하루 체결","둘 다 하루 체결량"],"def":"거래량은 하루 동안 체결된 계약 수이고, 미결제약정은 아직 청산되지 않은 계약 수예요. 거래량이 많아도 OI는 늘지 않을 수 있습니다.","ex":"같은 계약을 하루에 10번 사고팔면 거래량은 20계약이지만 OI는 그대로예요. 새 포지션이 생겨야 OI가 늘어납니다.","rel":"미결제약정 · 거래량 · 유동성","sem":"oi","type":"concept","cat":"s4","semLabel":"미결제약정"},{"t":"그 행사가에 수급이 몰린 것","sub":"OI concentration","head":"특정 행사가의 옵션 미결제약정이 유난히 많다는 것은?","hint":"그 가격에 사람들이 많이 걸어 두었어요","w":["그 옵션이 곧 상장폐지된다","그 가격이 반드시 된다","승수가 커진다"],"def":"미결제 집중은 그 행사가에 매수·매도 포지션이 많이 쌓였다는 뜻이에요. 만기일 핀닝이나 감마 헤지 수급의 원인이 됩니다.","ex":"750 콜에 미결제 1만 계약이 몰려 있으면, 만기일 지수가 750을 넘나들 때 딜러 헤지가 쏟아져 변동성이 커져요.","rel":"미결제약정 · 핀닝 · 딜러 감마","sem":"oi","type":"concept","cat":"s4","semLabel":"미결제약정"},{"t":"매도차익거래","sub":"Sell arbitrage","head":"선물이 이론가보다 쌀 때(베이시스가 마이너스) 나오는 차익거래는?","hint":"싼 선물을 사고 비싼 현물을 팔아요","w":["매수차익거래","비차익거래","헤지"],"def":"선물이 싸면 선물을 사고 현물을 팔아 차익을 노려요. 이를 매도차익거래라고 하고, 현물 매도 물량이 지수를 누를 수 있습니다.","ex":"현물 350p, 선물 347p라면 선물을 사고 현물을 팔아 3p를 잠가요. 만기에 349p로 끝나면 선물 2p, 현물 1p 이익입니다.","rel":"차익거래 · 매수차익잔고 · 베이시스","sem":"pg","type":"concept","cat":"s4","semLabel":"프로그램"},{"t":"변동성이 커진다","sub":"Expiry volatility","head":"만기일에는 지수 변동성이 평소보다 어떻게 되는 편일까요?","hint":"정산과 롤오버가 몰려요","w":["거의 0이 된다","항상 내려간다","거래가 중단된다"],"def":"만기일에는 대량 정산·롤오버·헤지 조정이 겹쳐 변동성이 커지는 경우가 많아요. 특히 마감 동시호가 시간에 흔들림이 큽니다.","ex":"평소 하루 0.8% 움직이던 지수가 만기일 오후에 1.5%까지 흔들리는 일이 있어요. 옵션 만기 청산 물량이 몰리기 때문입니다.","rel":"만기일 · 동시호가 · 프로그램 매매","sem":"fi","type":"concept","cat":"s4","semLabel":"만기·핀닝"},{"t":"위험 축소(디레버리징)","sub":"Foreign selling both","head":"외국인이 현물과 선물을 동시에 순매도하면 어떻게 해석할까요?","hint":"양쪽에서 다 팔면 위험을 줄이는 신호예요","w":["강한 상승 신호","차익거래 청산","중립 포지션"],"def":"외국인이 현물과 선물을 함께 팔면 위험을 줄이는 디레버리징으로 보는 경우가 많아요. 지수 하락 압력이 커질 수 있습니다.","ex":"현물 5,000억원 순매도와 선물 1만 계약 순매도가 동시에 나오면 시장은 위험 회피로 읽어요. 환율 급등기에는 이런 모습이 자주 나옵니다.","rel":"외국인 · 순매도 · 환율","sem":"fo","type":"concept","cat":"s4","semLabel":"외국인·수급"},{"t":"마진콜","sub":"Margin call","head":"증거금이 유지선 아래로 내려가자 증권사가 추가 입금을 요구하는 것은?","hint":"\"돈 더 넣으세요\" 하는 연락이에요","w":["반대매매","강제청산","롤오버"],"def":"마진콜은 계좌의 증거금이 유지증거금 아래로 떨어졌을 때 추가 입금을 요구하는 거예요. 정해진 시간 안에 넣지 않으면 강제청산됩니다.","ex":"유지증거금 700만원인데 잔고가 650만원이면 50만원 부족해요. 보통 다음 영업일까지 채워야 하고, 못 채우면 반대매매가 나갑니다.","rel":"유지증거금 · 추가증거금 · 반대매매","sem":"mc","type":"def2term","cat":"s5","semLabel":"마진·청산"},{"t":"추가증거금","sub":"Additional margin","head":"마진콜을 받은 뒤 계좌에 채워 넣어야 하는 돈은?","hint":"부족한 만큼 또는 개시증거금까지 채워요","w":["수수료","결제대금","이익금"],"def":"추가증거금은 마진콜을 해소하기 위해 넣는 돈이에요. 보통 개시증거금 수준까지 회복하도록 요구합니다.","ex":"개시 875만원, 유지 700만원, 현재 잔고 650만원이면 개시까지 225만원을 넣어야 안전해요. 유지선만 겨우 넘기면 다음날 또 마진콜이 옵니다.","rel":"마진콜 · 개시증거금 · 유지증거금","sem":"mc","type":"def2term","cat":"s5","semLabel":"마진·청산"},{"t":"반대매매","sub":"Forced liquidation","head":"추가 입금을 못 하면 증권사가 고객 포지션을 임의로 처분하는 것은?","hint":"내 뜻과 상관없이 회사가 정리해요","w":["마진콜","롤오버","청산주문"],"def":"반대매매는 증거금 부족을 해소하려고 증권사가 고객 계좌의 포지션을 시장가로 처분하는 거예요. 가격과 시점을 고를 수 없습니다.","ex":"지수가 급락한 날 마진콜을 못 채우면 다음날 아침 시장가로 강제 청산돼요. 그 뒤 지수가 반등해도 내 포지션은 이미 사라졌습니다.","rel":"강제청산 · 마진콜 · 시장가","sem":"mc","type":"def2term","cat":"s5","semLabel":"마진·청산"},{"t":"강제청산","sub":"Forced exit","head":"증거금 부족으로 브로커가 포지션을 강제로 없애는 것을 부르는 말은?","hint":"내 의지와 무관하게 포지션이 사라져요","w":["자발적 청산","만기 정산","롤오버"],"def":"강제청산은 위험 관리 한도를 넘어 브로커가 포지션을 없애는 조치예요. 손실이 확정되고, 최악의 가격에 체결될 수 있습니다.","ex":"10배 레버리지로 1계약을 들고 있다가 지수가 8% 빠지면 자본의 80%가 사라져요. 남은 20%로는 버티지 못해 강제청산됩니다.","rel":"반대매매 · 마진콜 · 레버리지","sem":"mc","type":"def2term","cat":"s5","semLabel":"마진·청산"},{"t":"청산 기준 가격","sub":"Liquidation price","head":"증거금이 바닥나 강제청산이 이뤄지는 가격 수준을 부르는 말은?","hint":"이 가격에 닿으면 포지션이 사라져요","w":["행사가격","정산가격","손익분기점"],"def":"청산 기준 가격은 증거금이 유지선을 깨는 지수 수준이에요. 레버리지가 높을수록 이 가격이 현재가에 가까워집니다.","ex":"증거금 875만원으로 1계약(1p당 25만원)을 들면, 875만 ÷ 25만 = 35p 하락에서 증거금이 모두 사라져요. 지수 350p에서 10% 하락입니다.","rel":"강제청산 · 유지증거금 · 레버리지","sem":"mc","type":"concept","cat":"s5","semLabel":"마진·청산"},{"t":"225만원","sub":"Margin call amount","head":"개시증거금 875만원, 유지증거금 700만원, 현재 잔고 650만원. 개시 수준까지 채우려면?","hint":"875만원 − 650만원이에요","w":["50만원","175만원","700만원"],"def":"개시증거금까지 회복하려면 875 − 650 = 225만원이 필요해요. 유지선 700만원만 넘기려면 50만원이지만, 그러면 곧 다시 마진콜을 받습니다.","ex":"225만원을 넣으면 잔고가 875만원이 돼 한 번 더 버틸 여지가 생겨요. 넣지 않으면 50만원 부족으로 다음날 강제청산될 수 있습니다.","rel":"추가증거금 · 마진콜 · 증거금","sem":"mc","type":"calc","cat":"s5","semLabel":"마진·청산"},{"t":"약 50%","sub":"Leverage loss","head":"레버리지 10배로 보유 중 지수가 5% 하락했습니다. 내 자본 손실은?","hint":"5% × 10배예요","w":["약 5%","약 10%","약 100%"],"def":"레버리지 10배면 지수 하락률의 10배가 자본 손실률이 돼요. 5% × 10 = 50%입니다.","ex":"1,000만원으로 1억원어치를 들고 있었다면 지수 5% 하락에 500만원이 사라져요. 반등을 기다리기 전에 계좌가 절반이 된 겁니다.","rel":"레버리지 · 반대매매 · 손실률","sem":"ls","type":"calc","cat":"s5","semLabel":"손실계산"},{"t":"손익비","sub":"Risk-reward ratio","head":"한 번 거래에서 기대 수익을 감수하는 손실로 나눈 비율은?","hint":"얼마를 걸고 얼마를 벌지의 비율이에요","w":["승률","기대값","MDD"],"def":"손익비는 평균 이익 ÷ 평균 손실이에요. 3:1이면 1을 걸고 3을 버는 구조로, 승률이 낮아도 이익이 날 수 있습니다.","ex":"손절 1p, 목표 3p면 손익비 3:1이에요. 승률 40%라면 10번 중 4번 이겨 12p, 6번 져 6p로 6p 이익입니다.","rel":"승률 · 기대값 · 손절","sem":"rm","type":"def2term","cat":"s5","semLabel":"자금관리"},{"t":"승률","sub":"Win rate","head":"전체 거래 중 이익이 난 거래의 비율은?","hint":"몇 번 이겼는지의 비율이에요","w":["손익비","기대값","MDD"],"def":"승률은 이익 거래 수 ÷ 전체 거래 수예요. 승률만 높아도 손익비가 나쁘면 손실이 날 수 있습니다.","ex":"10번 중 8번 이겨 승률 80%여도, 이길 때 1p 벌고 질 때 5p 잃으면 합계는 −2p예요. 승률과 손익비를 함께 봐야 합니다.","rel":"손익비 · 기대값 · 손절","sem":"rm","type":"concept","cat":"s5","semLabel":"자금관리"},{"t":"기대값","sub":"Expectancy","head":"한 번 거래에서 평균적으로 기대할 수 있는 손익은?","hint":"승률과 손익을 곱해서 더해요","w":["승률","MDD","손익비"],"def":"기대값 = (승률 × 평균 이익) − (패율 × 평균 손실)이에요. 플러스가 아니면 오래 할수록 자본이 줄어듭니다.","ex":"승률 40%, 이길 때 3p, 질 때 1p면 기대값은 0.4×3 − 0.6×1 = 0.6p예요. 10번 하면 평균 6p(150만원)를 벌게 됩니다.","rel":"승률 · 손익비 · 포지션 사이징","sem":"rm","type":"concept","cat":"s5","semLabel":"자금관리"},{"t":"0.6p","sub":"Expectancy calc","head":"승률 40%, 평균 이익 3p, 평균 손실 1p일 때 1회 기대값은?","hint":"0.4 × 3 − 0.6 × 1이에요","w":["0.2p","1.2p","2p"],"def":"(0.4 × 3) − (0.6 × 1) = 1.2 − 0.6 = 0.6p예요. 계약 1개로는 1회 평균 15만원을 기대할 수 있습니다.","ex":"10회 거래하면 기대 6p(150만원)예요. 다만 실제로는 이익과 손실이 몰려 나타나므로, 20~30회 이상 기록을 쌓아야 믿을 수 있습니다.","rel":"기대값 · 승률 · 손익비","sem":"rm","type":"calc","cat":"s5","semLabel":"자금관리"},{"t":"포지션 사이징","sub":"Position sizing","head":"한 번의 손실이 계좌를 위협하지 않도록 계약 수를 정하는 것은?","hint":"얼마나 크게 걸지 정하는 일이에요","w":["손익비","승률","롤오버"],"def":"포지션 사이징은 손절 폭과 감당 가능한 손실을 기준으로 계약 수를 정하는 거예요. 같은 전략도 크기에 따라 생존이 갈립니다.","ex":"손절 4p(계약당 100만원), 허용 손실 100만원이면 1계약이에요. 2계약을 하면 허용치의 두 배 위험을 지게 됩니다.","rel":"2% 룰 · 리스크 한도 · 계약 수","sem":"rm","type":"concept","cat":"s5","semLabel":"자금관리"},{"t":"2% 룰","sub":"2% rule","head":"한 번의 거래에서 계좌의 2% 넘게 잃지 않도록 정하는 원칙은?","hint":"계좌의 2%를 최대 손실로 잡아요","w":["10% 룰","MDD 룰","켈리 룰"],"def":"2% 룰은 한 거래의 최대 손실을 계좌의 2%로 제한하는 원칙이에요. 연속 손실이 나도 계좌가 쉽게 망가지지 않습니다.","ex":"계좌 5,000만원이면 1회 최대 손실은 100만원이에요. 5연패를 해도 500만원(10%) 손실로 끝나 회복할 여지가 남습니다.","rel":"포지션 사이징 · 리스크 한도 · 생존","sem":"rm","type":"concept","cat":"s5","semLabel":"자금관리"},{"t":"1계약","sub":"Sizing calc","head":"계좌 5,000만원, 2% 룰 적용 시 허용 손실 100만원. 손절 폭이 4p(1계약 100만원)라면 계약 수는?","hint":"허용 손실 ÷ 계약당 손실이에요","w":["2계약","4계약","10계약"],"def":"100만원 ÷ 100만원 = 1계약이에요. 손절이 넓을수록 계약 수를 줄여야 위험이 일정하게 유지됩니다.","ex":"지수가 4p만 반대로 가도 100만원이 사라지므로 1계약이 한계예요. 2계약을 하면 2% 룰을 어기게 됩니다.","rel":"2% 룰 · 포지션 사이징 · 손절","sem":"rm","type":"calc","cat":"s5","semLabel":"자금관리"},{"t":"MDD","sub":"Max drawdown","head":"계좌 잔고가 고점에서 가장 크게 떨어진 폭을 부르는 말은?","hint":"고점 대비 얼마나 빠졌는지예요","w":["승률","기대값","변동성"],"def":"MDD(최대낙폭)는 계좌가 최고점에서 저점까지 얼마나 줄었는지를 나타내요. 전략이 감당할 수 있는 고통의 크기입니다.","ex":"계좌가 5,000만원에서 3,500만원까지 줄었다면 MDD는 30%예요. 원래대로 돌아오려면 3,500만원에서 42.9%를 벌어야 합니다.","rel":"손실 회복 · 리스크 한도 · 생존","sem":"rm","type":"def2term","cat":"s5","semLabel":"자금관리"},{"t":"약 3%","sub":"Losing streak","head":"승률 50%인 전략에서 5번 연속 지는 확률은 대략 얼마일까요?","hint":"0.5를 다섯 번 곱해 보세요","w":["약 0.5%","약 10%","약 25%"],"def":"0.5^5 = 3.125%예요. 승률이 절반이어도 10번 중 1번은 4연패, 30번 중 1번은 5연패가 나옵니다.","ex":"하루 3번 거래하면 5연패는 10일 안에 한 번 올 수 있어요. 그때 계좌가 살아 있으려면 2% 룰 같은 장치가 필요합니다.","rel":"MDD · 2% 룰 · 생존","sem":"ls","type":"calc","cat":"s5","semLabel":"손실계산"},{"t":"계좌가 파산할 수 있다","sub":"Risk of ruin","head":"전략의 기대값이 플러스여도 계약 크기를 너무 키우면 결국 무엇이 위험해질까요?","hint":"크게 걸면 한 번의 연속 손실에 계좌가 끝나요","w":["수수료가 줄어든다","승률이 올라간다","만기가 짧아진다"],"def":"기대값이 플러스여도 계약이 너무 크면 연속 손실에서 계좌가 파산할 수 있어요. 이것을 파산 위험이라고 합니다.","ex":"기대값 0.6p인 전략도 계좌의 50%를 걸면 2연패에 75%가 사라져 회복이 거의 불가능해요. 크기가 생존을 결정합니다.","rel":"포지션 사이징 · MDD · 2% 룰","sem":"ls","type":"concept","cat":"s5","semLabel":"손실계산"},{"t":"사이드카","sub":"Sidecar","head":"선물이 급변할 때 프로그램 매매를 5분간 멈추는 제도는?","hint":"옆에서 잠깐 브레이크를 거는 장치예요","w":["서킷브레이커","VI","마진콜"],"def":"사이드카는 선물 가격이 5% 이상 움직인 상태가 1분 지속되면 프로그램 매매를 5분 중단하는 제도예요. 현물 시장 충격을 줄입니다.","ex":"코스피200 선물이 5% 급락해 1분간 유지되면 사이드카가 발동돼 5분간 프로그램 매수·매도가 멈춰요. 그동안 호가가 비어 변동성이 커질 수 있습니다.","rel":"서킷브레이커 · VI · 프로그램 매매","sem":"sf","type":"concept","cat":"s5","semLabel":"시장안전장치"},{"t":"서킷브레이커","sub":"Circuit breaker","head":"지수가 큰 폭으로 빠질 때 시장 전체 거래를 일시 정지하는 제도는?","hint":"시장 전체의 전원을 잠깐 내려요","w":["사이드카","VI","마진콜"],"def":"서킷브레이커는 지수가 8%·15%·20% 하락할 때 단계별로 시장 전체 거래를 멈추는 제도예요. 1단계는 8% 하락 시 20분 정지입니다.","ex":"지수가 8% 빠지면 1단계가 발동해 20분간 거래가 멈춰요. 이 시간에 손절 주문을 넣을 수 없어, 밤새 포지션을 들고 있으면 위험합니다.","rel":"사이드카 · VI · 급락","sem":"sf","type":"concept","cat":"s5","semLabel":"시장안전장치"},{"t":"VI","sub":"Volatility interruption","head":"개별 종목이나 선물 가격이 급변할 때 2분간 단일가로 거래하게 하는 장치는?","hint":"잠깐 가격을 멈추고 다시 정해요","w":["사이드카","서킷브레이커","마진콜"],"def":"VI(변동성완화장치)는 가격이 급변하면 2분간 단일가 매매로 전환해 냉각 시간을 주는 제도예요. 정적 VI와 동적 VI가 있습니다.","ex":"선물 가격이 기준에서 크게 벗어나 VI가 걸리면 2분간 단일가로만 거래돼요. 그 사이 주문을 내도 바로 체결되지 않습니다.","rel":"사이드카 · 서킷브레이커 · 단일가","sem":"sf","type":"concept","cat":"s5","semLabel":"시장안전장치"},{"t":"선물 가격이 5% 이상 급변할 때","sub":"Sidecar condition","head":"사이드카가 발동되는 직접적인 조건은?","hint":"선물이 크게 움직여 1분간 유지돼야 해요","w":["지수가 20% 하락할 때","환율이 10% 오를 때","거래량이 2배가 될 때"],"def":"사이드카는 선물 가격이 5% 이상 변한 상태가 1분 이상 지속될 때 발동해요. 현물 지수 기준이 아닙니다.","ex":"코스피200 선물이 5% 오르거나 5% 내린 채 1분이 지나면 프로그램 매매가 5분 멈춰요. 급등에도 발동됩니다.","rel":"사이드카 · 프로그램 매매 · 급변","sem":"sf","type":"concept","cat":"s5","semLabel":"시장안전장치"},{"t":"FOMC","sub":"FOMC","head":"미국 연준이 기준금리를 결정하고 발표하는 회의는?","hint":"미국 금리를 정하는 회의예요","w":["CPI","PCE","NFP"],"def":"FOMC는 미국 연방공개시장위원회로, 기준금리를 결정해요. 발표 직후 주식·채권·달러·선물이 크게 흔들립니다.","ex":"금리를 0.25%포인트 내리면 나스닥 선물이 몇 분 만에 1% 넘게 튀기도 해요. 발표 전후로 슬리피지가 커집니다.","rel":"CPI · PCE · 금리","sem":"ev","type":"concept","cat":"s5","semLabel":"지표발표"},{"t":"CPI","sub":"Consumer price index","head":"미국의 소비자물가 상승률을 보여 주는 대표 지표는?","hint":"장바구니 물가의 상승률이에요","w":["PCE","NFP","FOMC"],"def":"CPI는 소비자물가지수로, 물가 상승률을 보여 줘요. 예상보다 높으면 금리 인상 우려로 주가와 선물이 흔들립니다.","ex":"CPI가 예상 3.0%보다 높은 3.4%로 나오면 금리 인상 우려가 커져 나스닥 선물이 발표 직후 1.5% 급락하기도 합니다.","rel":"PCE · FOMC · 물가","sem":"ev","type":"concept","cat":"s5","semLabel":"지표발표"},{"t":"PCE","sub":"PCE deflator","head":"연준이 물가 판단에 특히 중시하는, 개인소비지출 물가 지표는?","hint":"연준이 더 즐겨 보는 물가 지표예요","w":["CPI","NFP","GDP"],"def":"PCE는 개인소비지출 물가지수로, 연준이 기준금리를 정할 때 CPI보다 더 중시해요. 발표일에는 변동성이 커집니다.","ex":"핵심 PCE가 예상보다 높게 나오면 금리 인하 기대가 줄어 나스닥 선물이 밀려요. CPI와 방향이 다를 때 시장이 더 혼란스러워합니다.","rel":"CPI · FOMC · 물가","sem":"ev","type":"concept","cat":"s5","semLabel":"지표발표"},{"t":"NFP","sub":"Non-farm payrolls","head":"미국의 농업 부문을 제외한 고용자 수를 보여 주는 지표는?","hint":"매달 첫 금요일에 나오는 고용 보고서예요","w":["CPI","PCE","FOMC"],"def":"NFP(비농업 고용지표)는 미국의 고용 상태를 보여 줘요. 고용이 강하면 금리 인하 기대가 줄어 지수 선물이 흔들립니다.","ex":"NFP가 예상 15만 명을 크게 웃돈 25만 명으로 나오면 금리 인하 기대가 후퇴해 나스닥 선물이 1% 빠지기도 합니다.","rel":"CPI · PCE · 금리","sem":"ev","type":"concept","cat":"s5","semLabel":"지표발표"},{"t":"변동성이 급등한다","sub":"Pre-release volatility","head":"FOMC나 CPI 발표 직전에 옵션의 변동성과 프리미엄은 어떻게 될까요?","hint":"결과를 모르니 보험료가 비싸져요","w":["변동성이 0이 된다","프리미엄이 싸진다","거래가 중단된다"],"def":"큰 지표 발표 전에는 결과를 모르는 불확실성 때문에 IV와 프리미엄이 올라가요. 발표 직전에 옵션을 사면 비싸게 사는 셈입니다.","ex":"CPI 전날 등가격 콜이 8p였는데 발표 다음 날 5p로 떨어질 수 있어요. 지수가 제자리여도 IV 크러시가 3p(75만원)를 가져갑니다.","rel":"IV 크러시 · 베가 · FOMC","sem":"ev","type":"concept","cat":"s5","semLabel":"지표발표"},{"t":"IV가 급락한다","sub":"Post-release IV","head":"지표 발표가 끝난 직후 옵션의 내재변동성은 어떻게 되는 경우가 많을까요?","hint":"발표 뒤엔 기대가 꺼져요","w":["계속 오른다","변하지 않는다","델타가 1이 된다"],"def":"발표가 끝나면 불확실성이 해소되어 IV가 급락해요. 방향이 맞아도 옵션 매수자는 프리미엄이 녹아 손실을 볼 수 있습니다.","ex":"발표 전 IV 30%였던 옵션이 발표 뒤 22%로 내려가면 베가 0.2p 기준 1.6p(40만원)가 사라져요.","rel":"IV 크러시 · 베가 · 지표발표","sem":"ev","type":"concept","cat":"s5","semLabel":"지표발표"},{"t":"오버나이트 갭","sub":"Overnight gap","head":"장 마감 후 다음 날 시가가 전일 종가와 크게 벌어져 시작하는 현상은?","hint":"밤사이 뉴스로 아침에 가격이 뛰어 있어요","w":["슬리피지","스프레드","핀닝"],"def":"오버나이트 갭은 장이 닫힌 사이 해외 뉴스나 지표로 다음 날 시가가 크게 달라지는 거예요. 손절 주문이 시가에서 밀려 체결됩니다.","ex":"밤에 나스닥이 2% 빠지면 다음 날 코스피200 선물이 7p 갭 하락으로 시작할 수 있어요. 348에 손절을 걸어도 343에 체결됩니다.","rel":"주말 갭 · 슬리피지 · 스톱주문","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"주말 갭","sub":"Weekend gap","head":"금요일 마감과 월요일 개장 사이에 생기는 가격 차이는?","hint":"이틀 동안 쌓인 뉴스가 한꺼번에 반영돼요","w":["오버나이트 갭","틱","베이시스"],"def":"주말 갭은 토·일 사이 발생한 뉴스가 월요일 시가에 반영되며 생기는 차이예요. 주말을 넘겨 포지션을 들고 있으면 통제할 수 없는 위험이 커집니다.","ex":"금요일 350에 롱을 잡아 두고 주말에 큰 악재가 나오면 월요일 340에 시작할 수 있어요. 10p(250만원) 손실이 잠자리 사이에 확정됩니다.","rel":"오버나이트 갭 · 슬리피지 · 포지션","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"슬리피지","sub":"Slippage","head":"주문한 가격과 실제 체결 가격이 벌어져 생기는 손실은?","hint":"미끄러져서 원하던 값에 못 사고팔아요","w":["수수료","스프레드","증거금"],"def":"슬리피지는 급한 시세나 얇은 호가 때문에 주문 가격보다 불리하게 체결되는 차이예요. 손절이 특히 취약합니다.","ex":"348에 손절을 걸었는데 급락해 344에 체결되면 4p(100만원) 슬리피지가 생겨요. 계획한 손실보다 4배를 잃을 수 있습니다.","rel":"오버나이트 갭 · 유동성 · 호가","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"유동성","sub":"Liquidity","head":"사고 싶을 때 바로 사고, 팔고 싶을 때 바로 팔 수 있는 성질은?","hint":"거래가 얼마나 잘 되는지예요","w":["변동성","레버리지","베이시스"],"def":"유동성은 원하는 가격에 빠르게 거래할 수 있는 정도예요. 호가가 두껍고 스프레드가 좁을수록 유동성이 좋습니다.","ex":"미결제 8,000계약인 750 콜은 100계약을 넣어도 바로 체결돼요. 200계약뿐인 890 콜은 50계약만 넣어도 가격이 20% 밀립니다.","rel":"호가 스프레드 · 미결제약정 · 슬리피지","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"호가 스프레드","sub":"Bid-ask spread","head":"가장 낮은 매도 호가와 가장 높은 매수 호가의 차이는?","hint":"사자마자 팔면 이만큼 손해예요","w":["틱","베이시스","프리미엄"],"def":"호가 스프레드는 즉시 사고팔 때 생기는 기본 비용이에요. 스프레드가 넓을수록 거래 비용이 큽니다.","ex":"매수 349.90 / 매도 350.10이면 스프레드가 0.20p예요. 사자마자 팔면 0.20p(5만원)를 잃고 시작합니다.","rel":"유동성 · 슬리피지 · 틱","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"시장조성자","sub":"Market maker","head":"항상 사고팔 호가를 내서 거래가 이어지게 하는 참가자는?","hint":"양쪽에 값을 걸어 두고 거래를 도와줘요","w":["청산소","헤지펀드","공매도 투자자"],"def":"시장조성자는 매수·매도 호가를 계속 제시해 유동성을 공급하고, 그 대가로 스프레드를 법니다. 옵션 시장에서는 델타 헤지를 하며 감마를 떠안습니다.","ex":"시장조성자가 0.05p 스프레드로 하루 1만 계약을 중개하면 이론상 5,000만원을 법니다. 대신 재고 위험을 헤지로 관리합니다.","rel":"유동성 · 호가 스프레드 · 딜러 감마","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"동시호가","sub":"Call auction","head":"여러 주문을 일정 시간 모아 단일 가격으로 한꺼번에 체결하는 방식은?","hint":"같이 모아서 한 가격에 맞춰요","w":["지정가","시장가","스톱주문"],"def":"동시호가는 주문을 모아 가장 많이 체결되는 하나의 가격을 정해 일괄 체결하는 방식이에요. 장 시작·마감과 만기일 마감에 쓰입니다.","ex":"오후 3시 20~30분 동시호가에 1만 계약 매도가 몰리면, 10분 뒤 지수가 1% 빠진 가격에 한꺼번에 체결될 수 있어요.","rel":"만기일 · 유동성 · 슬리피지","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"야간선물","sub":"Night futures","head":"정규장이 끝난 뒤 저녁부터 다음 날 새벽까지 거래되는 선물은?","hint":"밤에 해외 시장을 따라 움직여요","w":["위클리 옵션","주간 선물","스프레드"],"def":"야간선물은 정규장 마감 후에도 해외 시장 움직임에 대응해 거래되는 선물이에요. 밤사이 뉴스가 다음 날 시가에 반영될 방향을 미리 보여 줍니다.","ex":"미국 CPI 발표 후 야간선물이 1.5% 빠지면, 다음 날 국내 정규장도 하락 출발할 가능성이 커요. 밤에 손절할 기회이기도 합니다.","rel":"해외선물 · 오버나이트 갭 · 거래시간","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"거의 24시간 거래된다","sub":"Nearly 24h","head":"해외선물(CME 등)의 거래시간 특징은?","hint":"하루 대부분 시간에 거래할 수 있어요","w":["하루 2시간만 거래된다","주말에만 거래된다","장 마감이 없다"],"def":"해외선물은 주말을 제외하고 거의 24시간 거래돼요. 아시아·유럽·미국 시간대가 이어져 밤에도 가격이 움직입니다.","ex":"한국 시간 밤 10시에 미국장이 열리면 나스닥 선물 거래가 가장 활발해져요. 그래서 밤에 포지션이 크게 흔들릴 수 있습니다.","rel":"야간선물 · 환율 · 해외선물","sem":"fx","type":"concept","cat":"s5","semLabel":"해외·환율"},{"t":"달러","sub":"USD P&L","head":"해외선물의 손익은 어떤 통화로 계산될까요?","hint":"미국 상품이니 달러로 계산돼요","w":["원","엔","유로"],"def":"해외선물의 손익은 달러로 계산되고, 국내 계좌에서는 원화로 환산돼요. 그래서 환율이 최종 손익에 영향을 줍니다.","ex":"NQ 1계약으로 1,000달러를 벌었어요. 환율 1,350원이면 135만원, 1,250원이면 125만원으로 원화 손익이 달라집니다.","rel":"환율 · 해외선물 · 환전","sem":"fx","type":"concept","cat":"s5","semLabel":"해외·환율"},{"t":"데이마진","sub":"Day margin","head":"해외선물에서 당일 청산을 조건으로 낮게 적용되는 증거금은?","hint":"오늘 안에 끝내면 담보를 적게 내요","w":["오버나이트 마진","개시증거금","유지증거금"],"def":"데이마진은 장중에만 포지션을 보유할 때 적용되는 낮은 증거금이에요. 밤까지 들고 가면 더 높은 오버나이트 마진이 적용됩니다.","ex":"MES 1계약 데이마진이 1,000달러라면, 밤새 보유할 때는 2,500달러로 올라요. 같은 계약인데 시간에 따라 필요한 돈이 달라집니다.","rel":"오버나이트 마진 · 증거금 · 해외선물","sem":"fx","type":"concept","cat":"s5","semLabel":"해외·환율"},{"t":"오버나이트 마진","sub":"Overnight margin","head":"해외선물을 밤새 보유할 때 적용되는 더 높은 증거금은?","hint":"밤을 넘기면 담보를 더 요구해요","w":["데이마진","유지증거금","결제대금"],"def":"오버나이트 마진은 장 마감 후 포지션을 유지할 때 필요한 증거금이에요. 데이마진보다 높아 밤을 넘기면 추가 입금이 필요할 수 있습니다.","ex":"데이마진 1,000달러로 MES 3계약을 들고 있다가 밤을 넘기면 7,500달러가 필요해요. 2,000달러 계좌라면 2계약은 강제청산됩니다.","rel":"데이마진 · 마진콜 · 해외선물","sem":"fx","type":"concept","cat":"s5","semLabel":"해외·환율"},{"t":"진입 전에 손절가를 정한다","sub":"Stop-loss plan","head":"거래를 시작하기 전에 반드시 정해야 하는 것은?","hint":"얼마나 잃으면 나올지를 먼저 정해요","w":["목표 수익만 정한다","계약 수를 최대로 잡는다","손절은 나중에 생각한다"],"def":"손절가는 진입 전에 정해 두어야 해요. 손실이 커진 뒤에는 감정이 개입해 판단이 흐려집니다.","ex":"350에 롱 진입하며 346에 손절을 정했다면 최대 손실은 4p(100만원)예요. 미리 정하지 않으면 340까지 버티다 250만원을 잃기 쉽습니다.","rel":"포지션 사이징 · 물타기 · 매매일지","sem":"ps","type":"concept","cat":"s5","semLabel":"심리·습관"},{"t":"물타기","sub":"Averaging down","head":"손실이 커지는 포지션에 더 사서 평균 단가를 낮추는 행동은?","hint":"떨어지는 칼날을 더 크게 잡는 거예요","w":["분할 매수","손절","롤오버"],"def":"물타기는 손실 포지션에 추가 매수해 평단을 낮추는 거예요. 반등하면 빨리 본전이 되지만, 더 떨어지면 손실이 몇 배로 커집니다.","ex":"350에 1계약 사고 340에 또 사면 평단 345예요. 330까지 밀리면 손실은 2계약 × 15p = 750만원으로 불어납니다.","rel":"손절 · 포지션 사이징 · 레버리지","sem":"ps","type":"concept","cat":"s5","semLabel":"심리·습관"},{"t":"추격매수","sub":"Chasing","head":"이미 많이 오른 뒤에 뒤늦게 따라 사는 행동은?","hint":"남들 다 벌 때 뛰어들면 늦어요","w":["분할 매수","역추세 매매","헤지"],"def":"추격매수는 이미 상승한 뒤에 뛰어들어 고점에 사는 경우가 많아요. 진입 근거 없이 가격만 보고 따라가면 손절 기준도 없습니다.","ex":"지수가 20p 오른 뒤에야 롱을 잡으면, 5p만 되돌려도 손실이에요. 진입 전에 정한 자리가 아니어서 손절도 애매해집니다.","rel":"손절 · 매매일지 · 심리","sem":"ps","type":"concept","cat":"s5","semLabel":"심리·습관"},{"t":"거래가 많을수록 비용이 쌓인다","sub":"Overtrading cost","head":"하루에 거래를 너무 많이 하면 무엇이 문제일까요?","hint":"수수료와 슬리피지가 조용히 쌓여요","w":["승률이 자동으로 올라간다","증거금이 사라진다","만기가 빨라진다"],"def":"거래가 잦을수록 수수료와 호가 스프레드 비용이 누적돼요. 기대값이 작은 전략은 비용에 잠식됩니다.","ex":"1계약 수수료가 왕복 5,000원이고 하루 10번 거래하면 5만원이에요. 월 20일이면 100만원으로, 2% 룰의 허용 손실과 맞먹습니다.","rel":"수수료 · 호가 스프레드 · 기대값","sem":"ps","type":"concept","cat":"s5","semLabel":"심리·습관"},{"t":"확증편향","sub":"Confirmation bias","head":"내 포지션에 유리한 정보만 찾아보는 심리적 함정은?","hint":"보고 싶은 것만 보게 돼요","w":["손실 회피","앵커링","군중 심리"],"def":"확증편향은 이미 내린 결정을 지지하는 정보만 받아들이는 성향이에요. 반대 신호를 무시해 손절이 늦어집니다.","ex":"롱을 잡은 뒤 상승 기사만 찾아 읽고, 외국인 순매도나 금리 급등 뉴스는 흘려버리면 5p 손실이 20p가 됩니다.","rel":"손절 · 복수매매 · 매매일지","sem":"ps","type":"concept","cat":"s5","semLabel":"심리·습관"},{"t":"복수매매","sub":"Revenge trading","head":"손실 직후 감정을 이기지 못하고 곧바로 다시 큰 베팅을 하는 것은?","hint":"잃은 돈을 빨리 만회하려는 마음이에요","w":["분할 매수","헤지","롤오버"],"def":"복수매매는 손실 뒤 화가 나서 즉시 더 큰 포지션으로 재진입하는 거예요. 판단이 흐려져 손실이 연쇄적으로 커집니다.","ex":"1계약으로 50만원을 잃은 뒤 바로 3계약을 잡으면, 2p만 틀려도 150만원을 더 잃어요. 하루 만에 자본의 20%가 사라질 수 있습니다.","rel":"손절 · 매매일지 · 심리","sem":"ps","type":"concept","cat":"s5","semLabel":"심리·습관"},{"t":"매매일지","sub":"Trading journal","head":"거래의 진입 근거·결과·감정을 기록해 패턴을 찾는 도구는?","hint":"적어 두면 내 습관이 보여요","w":["차트","호가창","손익계산서"],"def":"매매일지는 진입 이유, 손절·목표, 결과, 그때의 감정을 적는 기록이에요. 반복되는 실수를 찾아 고치는 데 쓰입니다.","ex":"20번 기록을 보니 \"손절 안 지킨 5번이 전체 손실의 80%\"를 차지했어요. 그 하나만 고쳐도 계좌가 달라집니다.","rel":"기대값 · 손절 · 심리","sem":"ps","type":"concept","cat":"s5","semLabel":"심리·습관"},{"t":"스톱주문","sub":"Stop order","head":"가격이 지정한 수준에 닿으면 시장가 주문으로 바뀌는 주문은?","hint":"닿는 순간 자동으로 팔아 줘요","w":["지정가 주문","동시호가","스프레드 주문"],"def":"스톱주문은 가격이 정한 선에 도달하면 시장가로 전환돼 체결돼요. 손절에 쓰지만, 급등락에서는 밀려서 체결될 수 있습니다.","ex":"346에 스톱 매도를 걸어 두면 346 이하가 되는 순간 시장가로 나가요. 다만 갭으로 342에서 시작하면 342에 체결됩니다.","rel":"지정가 주문 · 슬리피지 · 손절","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"지정가 주문","sub":"Limit order","head":"정한 가격 또는 그보다 유리한 가격에서만 체결되는 주문은?","hint":"내가 정한 값에만 사고팔아요","w":["스톱주문","시장가 주문","조건부 주문"],"def":"지정가 주문은 가격을 정해 두고 그 가격에서만 체결돼요. 가격은 지킬 수 있지만 체결되지 않을 위험이 있습니다.","ex":"350.00 매수 지정가를 내면 350.10에서는 체결되지 않아요. 급반등이 나면 영영 못 사고 놓칠 수 있습니다.","rel":"스톱주문 · 미체결 위험 · 유동성","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"미체결 위험","sub":"Unfilled risk","head":"급하게 손절하려는데 지정가 주문이 체결되지 않는 위험은?","hint":"값을 지키려다 못 팔 수 있어요","w":["슬리피지","유동성 위험","마진콜"],"def":"미체결 위험은 지정가로 가격을 고집하다 체결이 안 되는 상황이에요. 그사이 가격이 더 나빠질 수 있습니다.","ex":"345 지정가 매도를 걸었는데 지수가 343까지 빠지고 반등하지 않으면 계속 들고 있게 돼요. 결국 335에 시장가로 던지게 됩니다.","rel":"지정가 주문 · 슬리피지 · 유동성","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"블랙스완","sub":"Black swan","head":"아무도 예상하지 못한 극단적인 사건이 시장을 뒤흔드는 것은?","hint":"상상도 못 한 일이 한 번에 와요","w":["핀닝","베이시스","콘탱고"],"def":"블랙스완은 예측 불가능하고 충격이 큰 사건이에요. 갭과 유동성 공백을 만들고, 레버리지 포지션을 한 번에 정리합니다.","ex":"2020년 3월 코로나 급락처럼 지수가 며칠 만에 30% 빠지면, 10배 레버리지는 3% 하락만으로도 청산됩니다.","rel":"오버나이트 갭 · 유동성 위기 · 마진콜","sem":"ls","type":"concept","cat":"s5","semLabel":"손실계산"},{"t":"유동성 위기","sub":"Liquidity crisis","head":"가격과 무관하게 팔고 싶어도 사 줄 사람이 없는 상황은?","hint":"호가창이 텅 비어 버려요","w":["변동성 축소","콘탱고","베이시스 확대"],"def":"유동성 위기에서는 매수 호가가 사라져 시장가로 팔아도 체결이 안 되거나 크게 밀려요. 급락장에서 자주 나타납니다.","ex":"평소 0.05p 스프레드가 3p로 벌어지고 호가 수량이 10분의 1로 줄면 유동성 위기예요. 100계약을 팔면 20p가 밀릴 수 있습니다.","rel":"슬리피지 · 호가 스프레드 · 블랙스완","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"증거금이 갑자기 늘어난다","sub":"Margin hike risk","head":"거래소가 시장 급변으로 증거금률을 올리면 기존 포지션은 어떻게 될까요?","hint":"같은 포지션인데 필요한 돈이 늘어요","w":["증거금이 줄어든다","계약이 사라진다","만기가 앞당겨진다"],"def":"증거금률이 오르면 기존 포지션도 새 기준이 적용돼 추가 입금이 필요해져요. 못 넣으면 강제청산됩니다.","ex":"증거금률이 10%에서 20%로 오르면 875만원이던 증거금이 1,750만원이 돼요. 1,000만원 계좌는 즉시 마진콜을 받습니다.","rel":"마진콜 · 레버리지 · 강제청산","sem":"ls","type":"concept","cat":"s5","semLabel":"손실계산"},{"t":"근월물 유동성이 원월물로 옮겨간다","sub":"Expiry liquidity shift","head":"만기가 다가오면 근월물과 원월물의 유동성은 어떻게 될까요?","hint":"다들 다음 달로 짐을 옮겨요","w":["원월물 유동성이 사라진다","둘 다 0이 된다","근월물이 더 활발해진다"],"def":"만기가 가까워지면 롤오버 수요로 근월물 거래가 줄고 원월물로 유동성이 옮겨가요. 만기 직전 근월물은 스프레드가 벌어집니다.","ex":"만기 3일 전 12월물 호가 스프레드가 0.5p로 벌어지고 3월물은 0.05p로 좁아져요. 이때 근월물 청산은 비용이 큽니다.","rel":"롤오버 · 유동성 · 만기일","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"},{"t":"사전교육을 이수해야 한다","sub":"Futures education","head":"국내 증권사에서 해외선물 계좌를 열려면 먼저 무엇을 해야 할까요?","hint":"아무나 바로 못 하고 교육을 먼저 받아요","w":["아무 절차 없이 가능하다","10년 경력이 필요하다","법인만 가능하다"],"def":"해외선물 거래는 투자자 보호를 위해 사전교육 이수와 모의거래 등 정해진 절차를 거쳐야 해요. 증권사별로 요건이 조금씩 다릅니다.","ex":"계좌를 만들려면 사전교육을 듣고, 증권사가 요구하는 모의거래 기간을 채운 뒤 실계좌를 열 수 있어요. 서두르면 며칠이 걸립니다.","rel":"해외선물 · 계좌 · 규제","sem":"fx","type":"concept","cat":"s5","semLabel":"해외·환율"},{"t":"여유증거금","sub":"Excess margin","head":"증거금으로 묶인 돈을 빼고 계좌에 남아 있는 쓸 수 있는 돈은?","hint":"담보 위에 남은 완충 재원이에요","w":["개시증거금","유지증거금","평가손익"],"def":"여유증거금은 총 잔고에서 필요한 증거금을 뺀 나머지예요. 이 돈이 많을수록 가격이 불리하게 움직여도 버틸 수 있습니다.","ex":"잔고 3,000만원, 필요 증거금 1,000만원이면 여유증거금은 2,000만원이에요. 지수가 8p 반대로 가도 200만원 손실로 끝나 마진콜이 없습니다.","rel":"증거금 · 마진콜 · 포지션 사이징","sem":"mc","type":"concept","cat":"s5","semLabel":"마진·청산"},{"t":"100%","sub":"Recovery math","head":"계좌가 50% 손실을 봤습니다. 원래 금액으로 돌아오려면 몇 %를 벌어야 할까요?","hint":"1,000만원이 500만원이 됐어요","w":["50%","75%","150%"],"def":"50% 손실 뒤에는 남은 500만원으로 1,000만원을 만들어야 하므로 100% 수익이 필요해요. 손실은 회복보다 훨씬 어렵습니다.","ex":"1,000만원이 500만원이 되면 100%를 벌어야 본전이에요. 반대로 100%를 벌면 2,000만원이 되니, 손실을 피하는 것이 수익보다 중요합니다.","rel":"MDD · 생존 · 2% 룰","sem":"ls","type":"calc","cat":"s5","semLabel":"손실계산"},{"t":"리스크 한도","sub":"Risk limit","head":"하루나 한 달에 잃어도 되는 최대 금액을 미리 정해 두는 것은?","hint":"이만큼 잃으면 오늘은 그만둬요","w":["목표 수익","기대값","승률"],"def":"리스크 한도는 기간별로 감당할 최대 손실을 정하는 거예요. 한도에 닿으면 거래를 멈춰 연쇄 손실을 막습니다.","ex":"하루 한도를 100만원으로 정했다면 3연패 후 그날은 거래를 끝내요. 복수매매로 500만원을 잃는 일을 막아 줍니다.","rel":"2% 룰 · 복수매매 · 생존","sem":"rm","type":"concept","cat":"s5","semLabel":"자금관리"},{"t":"상관관계가 높으면 같이 움직인다","sub":"Correlation limit","head":"코스피200 선물과 나스닥 선물을 함께 보유할 때 분산 효과가 작은 이유는?","hint":"둘 다 위험자산이라 같이 빠져요","w":["승수가 같아서","만기가 같아서","증거금이 같아서"],"def":"코스피200과 나스닥은 글로벌 위험 선호에 함께 반응해 상관관계가 높아요. 그래서 둘을 나눠 담아도 위험이 크게 줄지 않습니다.","ex":"두 시장에 각각 1계약씩 걸면 겉으로는 분산이지만, 위험 회피 국면에서 함께 빠져 손실이 두 배가 될 수 있어요.","rel":"분산투자 · 상관관계 · 포지션 사이징","sem":"rm","type":"concept","cat":"s5","semLabel":"자금관리"},{"t":"손실을 견디는 것이 먼저다","sub":"Survival first","head":"트레이딩에서 수익률보다 먼저 챙겨야 하는 원칙은?","hint":"살아남아야 다음 기회가 있어요","w":["최대 레버리지","승률 100%","매일 거래"],"def":"계좌가 살아 있어야 기회를 잡을 수 있어요. 그래서 큰 손실을 피하고 생존을 우선하는 것이 장기 성과의 바탕입니다.","ex":"연 30% 수익을 내도 한 번에 60%를 잃으면 회복에 150%가 필요해요. 10년간 살아남는 사람은 크게 잃지 않은 사람입니다.","rel":"MDD · 리스크 한도 · 2% 룰","sem":"ls","type":"concept","cat":"s5","semLabel":"손실계산"},{"t":"장 마감 전에 청산한다","sub":"Flat before close","head":"오버나이트 갭 위험을 없애는 가장 단순한 방법은?","hint":"밤을 넘기지 않으면 갭도 없어요","w":["손절을 걸지 않는다","계약을 늘린다","만기까지 들고 간다"],"def":"장 마감 전에 포지션을 모두 청산하면 밤사이 뉴스로 생기는 갭 위험을 피할 수 있어요. 대신 연속 상승의 이익도 포기합니다.","ex":"데이 트레이더가 오후 3시 20분 전에 모두 청산하면, 밤에 나스닥이 3% 빠져도 영향이 없어요. 다음 날 다시 기회를 봅니다.","rel":"오버나이트 갭 · 주말 갭 · 데이마진","sem":"mi","type":"concept","cat":"s5","semLabel":"미시구조"}];

  def2term: '다음 설명에 해당하는 말은?',
  calc: '직접 계산해 보세요',
  concept: '가장 알맞은 것은?'
};
const CAT_NAME = {
  s1: '1️⃣ 선물기초',
  s2: '2️⃣ 옵션기초',
  s3: '3️⃣ 그릭스·IV',
  s4: '4️⃣ 전략·수급',
  s5: '5️⃣ 리스크·해외'
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 문제마다 4지선다 구성: 정답 1개 + 손수 고른 헷갈리는 오답 3개 */
const ITEMS = DATA.map((d, i) => {
  const opts = [{ text: d.t, ok: true }].concat(d.w.map(t => ({ text: t, ok: false })));
  return Object.assign({}, d, { id: i, choices: shuffle(opts) });
});

/* ---------- 저장 ---------- */
const KEY = 'kebira-futures-options-300-v1';
const blankState = () => ({ solved: [], wrong: [], marks: [], streak: 0, best: 0, hits: 0, tries: 0 });

let S = blankState();
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && Array.isArray(raw.solved)) S = Object.assign(blankState(), raw);
} catch (e) { /* 저장소를 쓸 수 없으면 세션 기록만 유지 */ }

const solvedSet = new Set(S.solved);
const wrongSet = new Set(S.wrong);
const markSet = new Set(S.marks);

function save() {
  S.solved = [...solvedSet];
  S.wrong = [...wrongSet];
  S.marks = [...markSet];
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* 화면 전용 상태 */
const ui = new Map();
function uiOf(id) {
  if (!ui.has(id)) ui.set(id, { picked: new Set(), gone: new Set(), hint: 0 });
  return ui.get(id);
}

let filter = 'all';
let list = [];
let pos = 0;

function buildList() {
  if (['s1', 's2', 's3', 's4', 's5'].indexOf(filter) >= 0) list = ITEMS.filter(it => it.cat === filter);
  else if (filter === 'wrong') list = ITEMS.filter(it => wrongSet.has(it.id));
  else if (filter === 'mark') list = ITEMS.filter(it => markSet.has(it.id));
  else list = ITEMS.slice();
}

function current() { return list[pos] || null; }

/* ---------- 요소 ---------- */
const $ = id => document.getElementById(id);
const elTabs = $('tabs'), elLv = $('lv');
const elStreak = $('statStreak'), elAcc = $('statAcc'), elSolved = $('statSolved');
const elBar = $('progBar'), elPText = $('progText');
const elPrev = $('btnPrev'), elNext = $('btnNext');
const elChip = $('chip'), elQno = $('qno'), elQhead = $('qhead'), elQask = $('qask');
const elStatus = $('status'), elChoices = $('choices');
const elHint = $('btnHint'), elExplain = $('btnExplain'), elMark = $('btnMark');
const elModal = $('modal'), elMBadge = $('mBadge'), elMTerm = $('mTerm'), elMSub = $('mSub');
const elMDef = $('mDef'), elMEx = $('mEx'), elMRel = $('mRel'), elMNext = $('mNext');
const elConfirm = $('confirm');

const FILTERS = [
  { key: 'all', name: '전체' },
  { key: 's1', name: '1️⃣ 선물기초' },
  { key: 's2', name: '2️⃣ 옵션기초' },
  { key: 's3', name: '3️⃣ 그릭스·IV' },
  { key: 's4', name: '4️⃣ 전략·수급' },
  { key: 's5', name: '5️⃣ 리스크·해외' },
  { key: 'wrong', name: '❌ 오답노트' },
  { key: 'mark', name: '⭐ 북마크' }
];

function countFor(key) {
  if (['s1', 's2', 's3', 's4', 's5'].indexOf(key) >= 0) return ITEMS.filter(it => it.cat === key).length;
  if (key === 'wrong') return wrongSet.size;
  if (key === 'mark') return markSet.size;
  return ITEMS.length;
}

/* ---------- 렌더 ---------- */
function renderTabs() {
  elTabs.innerHTML = '';
  FILTERS.forEach(f => {
    const b = document.createElement('button');
    b.className = 'tab' + (filter === f.key ? ' on' : '');
    b.innerHTML = f.name + ' <span class="n">' + countFor(f.key) + '</span>';
    b.addEventListener('click', () => setFilter(f.key));
    elTabs.appendChild(b);
  });
}

function renderStats() {
  const total = S.hits + S.tries;
  const acc = total ? Math.round((S.hits / total) * 100) : 0;
  elStreak.textContent = '🔥 ' + S.streak;
  elAcc.textContent = '🎯 ' + acc + '%';
  elSolved.textContent = '✅ ' + solvedSet.size + '/' + ITEMS.length;
  elLv.textContent = 'Lv.' + Math.min(10, Math.floor(solvedSet.size / 30) + 1);
}

function renderHeader() {
  const it = current();
  if (!it) {
    elBar.style.width = '0%';
    elPText.textContent = '0 / 0';
    elPrev.disabled = true;
    elNext.disabled = true;
    return;
  }
  const w = ((pos + 1) / list.length) * 100;
  elBar.style.width = w + '%';
  elPText.textContent = (pos + 1) + ' / ' + list.length;
  elPrev.disabled = pos === 0;
  elNext.disabled = pos === list.length - 1;
}

function statusText(it) {
  const st = uiOf(it.id);
  if (solvedSet.has(it.id)) return { cls: 'ok', text: '✅ 정답! — 눌러서 해설 보기' };
  if (st.hint === 2) return { cls: 'hint', text: '💡 50:50 — 오답 2개를 지웠습니다. 이제 고르세요' };
  if (st.hint === 1) return { cls: 'hint', text: '💡 힌트: ' + it.hint };
  if (st.picked.size) return { cls: 'bad', text: '❌ 아쉽습니다. 지운 보기를 빼고 다시 골라 보세요' };
  return { cls: '', text: '4지선다 · 막히면 [💡 힌트] (2단계)' };
}

function renderQuestion() {
  const it = current();
  elChoices.innerHTML = '';

  if (!it) {
    elChip.textContent = filter === 'mark' ? '⭐ 북마크' : '❌ 오답노트';
    elChip.className = 'chip';
    elQno.textContent = '';
    elQhead.className = 'qhead empty';
    elQhead.textContent = filter === 'mark'
      ? '북마크한 문제가 없습니다.\n문제 화면에서 ☆ 북마크를 눌러 모아 보세요.'
      : '오답이 없습니다. 🎉\n틀린 문제가 생기면 여기에 모입니다.';
    elQask.textContent = '';
    elStatus.className = 'status';
    elStatus.textContent = '다른 탭에서 문제를 풀어 보세요';
    elHint.disabled = true;
    elExplain.disabled = true;
    elMark.disabled = true;
    renderHeader();
    return;
  }

  elHint.disabled = false;
  elExplain.disabled = false;
  elMark.disabled = false;

  elChip.textContent = CAT_NAME[it.cat];
  elChip.className = 'chip ' + it.cat;
  elQno.textContent = 'Q' + (it.id + 1) + ' · ' + it.semLabel;

  elQhead.className = 'qhead' + (it.type === 'calc' ? ' ko' : '');
  elQhead.textContent = it.head;
  elQask.textContent = ASK[it.type] || ASK.concept;

  const st = statusText(it);
  elStatus.className = 'status' + (st.cls ? ' ' + st.cls : '');
  elStatus.textContent = st.text;

  elMark.textContent = markSet.has(it.id) ? '★ 북마크' : '☆ 북마크';
  elMark.className = 'act mark' + (markSet.has(it.id) ? ' on' : '');

  renderChoices();
  renderHeader();
}

function renderChoices() {
  const it = current();
  elChoices.innerHTML = '';
  if (!it) return;

  const st = uiOf(it.id);
  const done = solvedSet.has(it.id);

  it.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.dataset.i = String(i);
    b.innerHTML = '<span class="k">' + 'ABCD'[i] + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = c.text;

    if (done) {
      if (c.ok) b.classList.add('ok');
      b.disabled = true;
    } else if (st.picked.has(i) || st.gone.has(i)) {
      b.classList.add('gone');
      b.disabled = true;
    }

    b.addEventListener('click', () => answer(i));
    elChoices.appendChild(b);
  });
}

/* 오답노트에서 정답을 맞히면 목록에서 빠지고 다음 문제로 이어진다 */
function refreshWrongList() {
  buildList();
  if (!list.length) { pos = 0; return; }
  pos = Math.min(pos, list.length - 1);
}

/* ---------- 정답 처리 ---------- */
function answer(i) {
  const it = current();
  if (!it || solvedSet.has(it.id)) return;
  const st = uiOf(it.id);
  if (st.picked.has(i) || st.gone.has(i)) return;
  const opt = it.choices[i];

  if (opt.ok) {
    solvedSet.add(it.id);
    wrongSet.delete(it.id);
    S.streak += 1;
    S.best = Math.max(S.best, S.streak);
    S.hits += 1;
    save();
    if (filter === 'wrong') refreshWrongList();
    renderQuestion();
    renderStats();
    renderTabs();
    const solvedId = it.id;
    setTimeout(() => {
      const cur = current();
      if (!cur || cur.id === solvedId) openModal(true, it);
    }, 340);
    return;
  }

  S.tries += 1;
  S.streak = 0;
  wrongSet.add(it.id);
  st.picked.add(i);
  save();
  renderQuestion();
  renderStats();
  renderTabs();
  const btn = elChoices.querySelector('.choice[data-i="' + i + '"]');
  if (btn) {
    btn.classList.remove('gone');
    btn.classList.add('bad');
    btn.disabled = true;
    setTimeout(() => { if (current() && current().id === it.id) renderChoices(); }, 460);
  }
}

/* ---------- 힌트 (2단계) ---------- */
elHint.addEventListener('click', () => {
  const it = current();
  if (!it) return;
  if (solvedSet.has(it.id)) { openModal(true); return; }
  const st = uiOf(it.id);
  const wrongIdx = it.choices.map((c, i) => (c.ok ? -1 : i)).filter(i => i >= 0 && !st.picked.has(i) && !st.gone.has(i));

  if (st.hint === 0) {
    st.hint = 1;
    renderQuestion();
    return;
  }
  if (wrongIdx.length >= 2) {
    shuffle(wrongIdx).slice(0, 2).forEach(i => st.gone.add(i));
    st.hint = 2;
    renderQuestion();
    return;
  }
  st.hint = 2;
  elStatus.className = 'status hint';
  elStatus.textContent = wrongIdx.length
    ? '💡 오답을 모두 지웠습니다. 남은 보기가 정답입니다'
    : '💡 더 지울 오답이 없습니다';
  renderChoices();
});

/* ---------- 북마크 ---------- */
elMark.addEventListener('click', () => {
  const it = current();
  if (!it) return;
  if (markSet.has(it.id)) markSet.delete(it.id); else markSet.add(it.id);
  save();
  renderQuestion();
  renderTabs();
});

/* ---------- 해설 모달 ---------- */
function openModal(auto, explicit) {
  const it = explicit || current();
  if (!it) return;
  const done = solvedSet.has(it.id);

  elMBadge.className = 'mbadge ' + it.cat;
  elMBadge.textContent = (done ? '🎉 정답 · ' : '📖 ') + CAT_NAME[it.cat];
  elMTerm.className = 'mterm';
  elMTerm.textContent = it.t;
  elMSub.textContent = it.sub || '';
  elMDef.textContent = it.def;
  elMEx.textContent = it.ex;
  elMRel.textContent = it.rel;

  const inList = !!(current() && current().id === it.id);
  const isLast = !inList || pos === list.length - 1;
  elMNext.disabled = false;
  elMNext.textContent = isLast ? '닫기' : '다음 문제 ▶';
  elModal.classList.add('open');
}

function closeModal() { elModal.classList.remove('open'); }
elExplain.addEventListener('click', () => openModal(false));
elStatus.addEventListener('click', () => { if (current() && solvedSet.has(current().id)) openModal(true); });
$('mClose').addEventListener('click', closeModal);
$('mBack').addEventListener('click', closeModal);
elModal.addEventListener('click', e => { if (e.target === elModal) closeModal(); });
elMNext.addEventListener('click', () => {
  closeModal();
  if (pos < list.length - 1) { pos += 1; renderQuestion(); }
});

/* ---------- 이동 / 필터 ---------- */
function setFilter(key) {
  filter = key;
  buildList();
  pos = 0;
  for (let i = 0; i < list.length; i++) {
    if (!solvedSet.has(list[i].id)) { pos = i; break; }
  }
  renderTabs();
  renderQuestion();
  renderStats();
}

elPrev.addEventListener('click', () => { if (pos > 0) { pos -= 1; renderQuestion(); } });
elNext.addEventListener('click', () => { if (pos < list.length - 1) { pos += 1; renderQuestion(); } });

/* ---------- 초기화 ---------- */
$('btnReset').addEventListener('click', () => elConfirm.classList.add('open'));
$('cCancel').addEventListener('click', () => elConfirm.classList.remove('open'));
$('cOk').addEventListener('click', () => {
  S = blankState();
  solvedSet.clear();
  wrongSet.clear();
  markSet.clear();
  ui.clear();
  try { localStorage.removeItem(KEY); } catch (e) {}
  elConfirm.classList.remove('open');
  filter = 'all';
  buildList();
  pos = 0;
  renderTabs();
  renderQuestion();
  renderStats();
});

/* ---------- 키보드 (데스크톱) ---------- */
document.addEventListener('keydown', e => {
  if (elModal.classList.contains('open') || elConfirm.classList.contains('open')) {
    if (e.key === 'Escape') { closeModal(); elConfirm.classList.remove('open'); }
    return;
  }
  if (/^[1-4]$/.test(e.key)) {
    const b = elChoices.querySelector('.choice[data-i="' + (Number(e.key) - 1) + '"]');
    if (b && !b.disabled) b.click();
  } else if (e.key === 'ArrowRight' && pos < list.length - 1) { pos += 1; renderQuestion(); }
  else if (e.key === 'ArrowLeft' && pos > 0) { pos -= 1; renderQuestion(); }
});

/* ---------- 시작 ---------- */
buildList();
pos = 0;
for (let i = 0; i < list.length; i++) {
  if (!solvedSet.has(list[i].id)) { pos = i; break; }
}
renderTabs();
renderQuestion();
renderStats();

</script>
</body>
</html>
