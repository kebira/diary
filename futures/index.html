<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#eef2f8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="케비라 선물·옵션 300" />
<title>케비라 선물·옵션 마스터 300</title>
<meta name="description" content="선물·옵션을 처음 배우는 사람을 위한 300문제. 모든 문제에 쉬운 풀이와 실전 숫자·생활 비유 예시." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f172a;
    --sub: #64748b;
    --line: #e2e8f0;
    --card: #ffffff;
    --stock: #4338ca;
    --eng: #be185d;
    --fut: #0369a1;
    --ok: #059669;
    --bad: #e11d48;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #e8edf3;
    font-family: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
    color: var(--ink);
  }

  body {
    display: flex;
    justify-content: center;
  }

  button { font-family: inherit; cursor: pointer; }

  .app {
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: linear-gradient(180deg, #f8fafc 0%, #eef2f8 100%);
    position: relative;
    overflow: hidden;
  }

  @media (min-width: 431px) {
    .app { box-shadow: 0 0 0 1px #dfe6ef, 0 18px 50px rgba(15, 23, 42, .12); }
  }

  /* 상단 7색 무지개 바 */
  .rainbow {
    height: 4px;
    flex: 0 0 auto;
    background: linear-gradient(90deg, #ef4444 0%, #f59e0b 17%, #facc15 33%, #22c55e 50%, #3b82f6 67%, #6366f1 84%, #a855f7 100%);
  }

  .top {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 14px 0;
  }

  .brand {
    font-family: 'Gowun Batang', 'Noto Sans KR', serif;
    font-size: 16.5px;
    font-weight: 700;
    letter-spacing: -.3px;
    line-height: 1.15;
    white-space: nowrap;
  }

  .brand b {
    background: linear-gradient(90deg, #e11d48, #f59e0b, #16a34a, #2563eb, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }

  .lv {
    flex: 0 0 auto;
    background: #1e293b;
    color: #fff;
    font-size: 10.5px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: .2px;
  }

  /* 카테고리 필터 */
  .tabs {
    flex: 0 0 auto;
    display: flex;
    gap: 5px;
    padding: 1px 13px 0;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    border: 1px solid #dbe3ee;
    background: #fff;
    color: #475569;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 8px;
    border-radius: 999px;
    line-height: 1;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .tab.on {
    background: #0f172a;
    color: #fff;
    border-color: #0f172a;
  }
  .tab .n { opacity: .62; font-weight: 700; margin-left: 1px; }

  .stats {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    font-size: 10.5px;
    font-weight: 800;
    color: #475569;
  }
  .stats .sp { flex: 1; }

  .mini {
    border: none;
    background: #e2e8f0;
    color: #475569;
    width: 21px;
    height: 21px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .progrow {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
  }

  .pbtn {
    width: 26px;
    height: 23px;
    border-radius: 7px;
    border: 1px solid #dbe3ee;
    background: #fff;
    color: #334155;
    font-size: 9px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pbtn:disabled { opacity: .35; }

  .prog {
    flex: 1;
    height: 5px;
    background: #dde5ef;
    border-radius: 999px;
    overflow: hidden;
  }
  .prog i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    transition: width .25s ease;
  }

  .ptext {
    font-size: 10px;
    font-weight: 800;
    color: #64748b;
    min-width: 50px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .qzone {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 14px;
  }

  .qcard {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    border: 1px solid #e6ecf4;
    border-radius: 16px;
    padding: 11px 13px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, .05);
    overflow-y: auto;
  }

  .qmeta {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .chip {
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    background: #eef2ff;
    color: var(--stock);
    letter-spacing: -.1px;
  }
  .chip.eng { background: #fdf2f8; color: var(--eng); }
  .chip.fut { background: #eef7ff; color: #0369a1; }
  .chip.s1 { background: #eef7ff; color: #0369a1; }
  .chip.s2 { background: #eef2ff; color: #4338ca; }
  .chip.s3 { background: #f5f3ff; color: #6d28d9; }
  .chip.s4 { background: #ecfdf5; color: #047857; }
  .chip.s5 { background: #fef2f2; color: #b91c1c; }

  .qno {
    font-size: 9.5px;
    font-weight: 800;
    color: #94a3b8;
    font-variant-numeric: tabular-nums;
  }

  .qbody {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
    padding: 8px 0 4px;
  }

  .qhead {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.52;
    letter-spacing: -.2px;
    word-break: keep-all;
    color: #111827;
  }
  .qhead.en {
    font-size: 27px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -.8px;
    text-align: center;
    color: #0f172a;
    word-break: break-word;
  }
  .qhead.ko {
    font-size: 18.5px;
    font-weight: 800;
    line-height: 1.4;
    text-align: center;
    letter-spacing: -.4px;
  }
  .qhead.empty {
    text-align: center;
    color: #475569;
    font-size: 14px;
    white-space: pre-line;
  }

  .qask {
    font-size: 12px;
    font-weight: 700;
    color: #64748b;
    text-align: center;
    letter-spacing: -.1px;
  }

  .status {
    flex: 0 0 auto;
    min-height: 31px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.3;
    border-radius: 9px;
    padding: 6px 9px;
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e5ebf3;
  }
  .status.hint { background: #fffbeb; border-color: #fde68a; color: #b45309; }
  .status.ok { background: #ecfdf5; border-color: #a7f3d0; color: #047857; cursor: pointer; }
  .status.bad { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

  .choices {
    flex: 0 0 auto;
    display: grid;
    gap: 7px;
    padding: 0 14px;
  }

  .choice {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 56px;
    background: #fff;
    border: 1.5px solid #dde5ef;
    border-radius: 12px;
    padding: 9px 11px;
    text-align: left;
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.34;
    color: #0f172a;
    letter-spacing: -.2px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, .04);
    transition: transform .08s ease, border-color .15s, background .15s;
  }
  .choice:active { transform: scale(.985); }

  .choice .k {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    background: #eef2f7;
    color: #475569;
    font-size: 10.5px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .choice.ok { background: #ecfdf5; border-color: #34d399; color: #065f46; font-weight: 800; }
  .choice.ok .k { background: #10b981; color: #fff; }

  .choice.bad { background: #fef2f2; border-color: #fb7185; color: #9f1239; animation: shake .3s ease; }
  .choice.bad .k { background: #f43f5e; color: #fff; }

  .choice.gone { opacity: .34; text-decoration: line-through; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    22% { transform: translateX(-5px); }
    62% { transform: translateX(5px); }
  }

  .actions {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px;
    padding: 2px 14px calc(9px + env(safe-area-inset-bottom));
  }

  .act {
    height: 42px;
    border: none;
    border-radius: 11px;
    font-size: 12.5px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    letter-spacing: -.2px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, .10);
    transition: transform .08s ease;
  }
  .act:active { transform: scale(.97); }
  .act:disabled { opacity: .45; }
  .act.hint { background: #f59e0b; }
  .act.explain { background: #2563eb; }
  .act.mark { background: #e2e8f0; color: #334155; box-shadow: none; }
  .act.mark.on { background: #fde68a; color: #92400e; }

  /* 해설 모달 */
  .modal {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(15, 23, 42, .52);
  }
  .modal.open { display: flex; }

  .sheet {
    width: 100%;
    max-height: 89dvh;
    overflow-y: auto;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 9px;
    animation: up .22s ease-out;
  }

  @keyframes up {
    from { transform: translateY(22px); opacity: .5; }
    to { transform: none; opacity: 1; }
  }

  .mhead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .mbadge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    background: #eef2ff;
    color: #4338ca;
    margin-bottom: 4px;
  }
  .mbadge.eng { background: #fdf2f8; color: #be185d; }
  .mbadge.fut { background: #eef7ff; color: #0369a1; }
  .mbadge.s1 { background: #eef7ff; color: #0369a1; }
  .mbadge.s2 { background: #eef2ff; color: #4338ca; }
  .mbadge.s3 { background: #f5f3ff; color: #6d28d9; }
  .mbadge.s4 { background: #ecfdf5; color: #047857; }
  .mbadge.s5 { background: #fef2f2; color: #b91c1c; }

  .mterm {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -.6px;
    line-height: 1.2;
    word-break: break-word;
  }
  .mterm.en { font-size: 22px; letter-spacing: -.4px; }

  .msub {
    margin-top: 3px;
    font-size: 11.5px;
    font-weight: 700;
    color: #2563eb;
    letter-spacing: -.1px;
  }

  .mx {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    border: none;
    background: #f1f5f9;
    color: #64748b;
    font-size: 14px;
    font-weight: 800;
  }

  .msec {
    background: #f8fafc;
    border-left: 3px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 12.2px;
    line-height: 1.52;
    color: #334155;
    word-break: keep-all;
  }
  .msec b {
    display: block;
    font-size: 10px;
    color: #64748b;
    margin-bottom: 3px;
    letter-spacing: .1px;
  }
  .msec.def { border-left-color: #2563eb; }
  .msec.ex {
    border-left-color: #f59e0b;
    background: linear-gradient(180deg, #fffdf3 0%, #fffbeb 100%);
    border: 1px solid #fde68a;
    border-left: 3px solid #f59e0b;
    box-shadow: 0 2px 8px rgba(245, 158, 11, .10);
  }
  .msec.ex b { color: #b45309; font-size: 10.5px; }
  .msec.ex .exbody { font-size: 12.8px; font-weight: 600; color: #3f2d0b; line-height: 1.55; }
  .msec.def b { color: #1d4ed8; }
  .msec.rel { border-left-color: #d97706; background: #fffbeb; }

  .mex { font-size: 12.8px; font-weight: 700; color: #0f172a; line-height: 1.45; }
  .mexko { margin-top: 4px; color: #475569; }

  .mbtns {
    display: grid;
    grid-template-columns: 1fr 1.25fr;
    gap: 8px;
    margin-top: 2px;
  }

  .mbtn {
    height: 46px;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
  }
  .mbtn.close { background: #e2e8f0; color: #334155; }
  .mbtn.next { background: #2563eb; color: #fff; }
  .mbtn:disabled { opacity: .4; }

  /* 초기화 확인 */
  .modal.confirm { align-items: center; padding: 24px; }
  .confirm-card {
    width: 100%;
    background: #fff;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 16px 40px rgba(15, 23, 42, .28);
  }
  .confirm-card h3 { font-size: 15px; margin-bottom: 6px; letter-spacing: -.3px; }
  .confirm-card p { font-size: 12.3px; color: #64748b; line-height: 1.5; margin-bottom: 14px; }
  .confirm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  @media (max-height: 620px) {
    .qhead { font-size: 14.5px; }
    .qhead.en { font-size: 23px; }
    .qhead.en { font-size: 22px; }
    .qhead.ko { font-size: 15.5px; }
    .choice { min-height: 46px; font-size: 14px; padding: 6px 10px; }
    .act { height: 38px; }
    .status { min-height: 27px; font-size: 10.2px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="rainbow"></div>

  <header class="top">
    <div class="brand">케비라 <b>선물·옵션</b> 300</div>
    <div class="lv" id="lv">Lv.1</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="stats">
    <span id="statStreak">🔥 0</span>
    <span id="statAcc">🎯 0%</span>
    <span id="statSolved">✅ 0/300</span>
    <span class="sp"></span>
    <button class="mini" id="btnReset" aria-label="학습 기록 초기화" title="기록 초기화">↺</button>
  </div>

  <div class="progrow">
    <button class="pbtn" id="btnPrev" aria-label="이전 문제">◀</button>
    <div class="prog"><i id="progBar"></i></div>
    <span class="ptext" id="progText">1 / 300</span>
    <button class="pbtn" id="btnNext" aria-label="다음 문제">▶</button>
  </div>

  <main class="qzone">
    <section class="qcard">
      <div class="qmeta">
        <span class="chip s1" id="chip">1️⃣ 선물기초</span>
        <span class="qno" id="qno">Q1</span>
      </div>
      <div class="qbody">
        <div class="qhead" id="qhead"></div>
        <div class="qask" id="qask"></div>
      </div>
    </section>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <section class="choices" id="choices"></section>

  <section class="actions">
    <button class="act hint" id="btnHint">💡 힌트</button>
    <button class="act explain" id="btnExplain">📖 해설</button>
    <button class="act mark" id="btnMark">☆ 북마크</button>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="문제 해설">
    <div class="sheet">
      <div class="mhead">
        <div>
          <div class="mbadge" id="mBadge">📖 해설</div>
          <div class="mterm" id="mTerm"></div>
          <div class="msub" id="mSub"></div>
        </div>
        <button class="mx" id="mClose" aria-label="닫기">✕</button>
      </div>
      <div class="msec def">
        <b>쉬운 핵심 풀이</b>
        <div id="mDef"></div>
      </div>
      <div class="msec ex">
        <b>💡 실전 숫자·생활 비유 예시</b>
        <div class="exbody" id="mEx"></div>
      </div>
      <div class="msec rel">
        <b>이어서 볼 용어</b>
        <div id="mRel"></div>
      </div>
      <div class="mbtns">
        <button class="mbtn close" id="mBack">문제로 돌아가기</button>
        <button class="mbtn next" id="mNext">다음 문제 ▶</button>
      </div>
    </div>
  </div>

  <div class="modal confirm" id="confirm" role="dialog" aria-modal="true" aria-label="기록 초기화 확인">
    <div class="confirm-card">
      <h3>학습 기록을 초기화할까요?</h3>
      <p>정답·오답 기록, 연속 정답, 북마크가 모두 지워집니다. 이 기기에만 저장된 기록이며 되돌릴 수 없습니다.</p>
      <div class="confirm-btns">
        <button class="mbtn close" id="cCancel">취소</button>
        <button class="mbtn next" id="cOk" style="background:#e11d48">초기화</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------- 데이터 ---------- */
const DATA = [{"t":"선물","sub":"Futures","head":"오늘 가격을 정해 두고, 정해진 날에 사고팔기로 미리 약속하는 계약은?","hint":"'미래의 물건'을 지금 약속으로 묶어 두는 계약이에요","w":["현물","옵션","스왑"],"def":"선물은 미래의 특정 시점에 정한 가격으로 사고팔기로 지금 맺는 표준 계약이에요. 물건은 아직 없고 약속만 있으며, 만기에는 가격이 오르든 내리든 그 가격으로 정산합니다.","ex":"금 1돈을 오늘 50만원에 \"다음 달에 살게요\" 하고 계약서를 쓰는 것과 같아요. 다음 달 금값이 60만원이면 10만원 이익, 40만원이면 10만원 손실이 확정됩니다.","rel":"현물 · 만기 · 청산","sem":"ba","type":"def2term","cat":"s1","semLabel":"기본개념"},{"t":"현물","sub":"Spot","head":"물건과 돈을 지금 이 자리에서 바로 주고받는 거래는?","hint":"오늘 당장 교환하면 현물이에요","w":["선물","옵션","스왑"],"def":"현물 거래는 \"지금 있는 물건\"을 \"지금 돈\"으로 사는 거래예요. 대금을 내면 바로 내 것이 되고, 나중에 값을 다시 정할 일이 없습니다.","ex":"마트에서 3,000원을 내고 우유 한 개를 들고 나오면 현물 거래예요. 내일 우유값이 올라도 오늘 산 우유 가격은 그대로입니다.","rel":"선물 · 기초자산 · 즉시결제","sem":"ba","type":"def2term","cat":"s1","semLabel":"기본개념"},{"t":"승수","sub":"Multiplier","head":"코스피200 선물에서 지수 1포인트를 25만원으로 바꿔 주는, 곱하는 숫자는?","hint":"지수에 곱해서 원화 금액을 만드는 숫자예요","w":["틱","베이시스","증거금률"],"def":"승수는 지수 포인트를 실제 원화 금액으로 환산하는 곱셈 값이에요. 코스피200 선물·옵션은 1포인트당 250,000원이라, 2포인트 움직이면 50만원이 됩니다.","ex":"코스피200이 350.00p일 때 계약 1개의 금액은 350 × 250,000 = 8,750만원이에요. 지수가 1p만 올라도 25만원이 붙습니다.","rel":"틱 · 틱가치 · 계약금액","sem":"tk","type":"def2term","cat":"s1","semLabel":"틱·승수"},{"t":"만기일","sub":"Expiry date","head":"선물 계약의 효력이 끝나고 마지막 정산을 하는 날은?","hint":"약속이 끝나는 날, 그날 이후 계약은 사라져요","w":["정산일","거래개시일","결제유예일"],"def":"만기일은 선물 계약이 끝나는 날이에요. 이날이 지나면 계약은 없어지고, 그때의 최종 가격으로 손익이 확정됩니다.","ex":"코스피200 선물은 3·6·9·12월의 두 번째 목요일이 만기일이에요. 12월물은 12월 10일이 만기라면 그날 오후에 모든 손익이 확정됩니다.","rel":"최종거래일 · 정산가격 · 롤오버","sem":"ex","type":"def2term","cat":"s1","semLabel":"계약·만기"},{"t":"정산가격","sub":"Settlement price","head":"하루 거래가 끝난 뒤 그날의 손익을 계산하는 기준으로 쓰는 가격은?","hint":"매일 저녁 손익을 매기는 기준 가격이에요","w":["체결가격","호가","이론가격"],"def":"정산가격은 장이 끝난 뒤 거래소가 정하는 그날의 대표 가격이에요. 이 가격으로 모든 포지션의 평가손익을 계산하고 증거금을 다시 매깁니다.","ex":"내가 350.00에 샀는데 종가 무렵 정산가격이 348.00으로 정해지면, 계좌에는 2p × 25만원 = 50만원 손실이 이미 반영돼요. 팔지 않아도 잔고가 줄어듭니다.","rel":"일일정산 · 평가손익 · 증거금","sem":"ex","type":"def2term","cat":"s1","semLabel":"계약·만기"},{"t":"레버리지","sub":"Leverage","head":"적은 돈으로 그 몇 배에 해당하는 금액을 움직이는 효과를 부르는 말은?","hint":"지렛대처럼 작은 힘으로 큰 것을 움직이는 효과예요","w":["헤지","분산투자","베이시스"],"def":"레버리지는 증거금(담보)만 내고 그보다 훨씬 큰 계약을 보유하는 구조예요. 이익도 손실도 계약 전체 금액 기준으로 계산되기 때문에 몇 배로 커집니다.","ex":"8,750만원어치 코스피200 선물 1계약을 증거금 875만원으로 보유하면 레버리지가 10배예요. 지수가 1% 오르면 내 돈은 약 10% 늘고, 1% 내리면 약 10% 줄어듭니다.","rel":"개시증거금 · 증거금률 · 반대매매","sem":"mg","type":"def2term","cat":"s1","semLabel":"증거금"},{"t":"개시증거금","sub":"Initial margin","head":"선물을 처음 살 때 계좌에 반드시 넣어 두어야 하는 담보금은?","hint":"포지션을 \"열 때\" 필요한 돈이에요","w":["유지증거금","결제대금","수수료"],"def":"개시증거금은 새로운 포지션을 열기 위해 필요한 최소 담보금이에요. 계약금액 전체가 아니라 거래소가 정한 비율만큼만 냅니다.","ex":"코스피200 선물 1계약 금액이 8,750만원이고 증거금률이 10%라면 개시증거금은 875만원이에요. 계좌에 1,000만원이 있으면 1계약을 열 수 있습니다.","rel":"유지증거금 · 레버리지 · 마진콜","sem":"mg","type":"def2term","cat":"s1","semLabel":"증거금"},{"t":"유지증거금","sub":"Maintenance margin","head":"증거금이 이 선 아래로 내려가면 추가 입금을 요구받는 최소선은?","hint":"이 선을 깨면 \"돈 더 넣으세요\" 연락이 와요","w":["개시증거금","최소결제금액","손절가"],"def":"유지증거금은 포지션을 계속 들고 있기 위해 유지해야 하는 최소 증거금이에요. 개시증거금보다 낮게 정해지고, 이 아래로 내려가면 마진콜이 나옵니다.","ex":"개시증거금 875만원, 유지증거금 700만원인 계약에서 평가손실이 200만원 나면 잔고가 675만원이 돼요. 유지선을 깼으니 추가 입금을 요구받습니다.","rel":"개시증거금 · 마진콜 · 강제청산","sem":"mg","type":"def2term","cat":"s1","semLabel":"증거금"},{"t":"일일정산","sub":"Daily mark-to-market","head":"매일 장이 끝난 뒤 손익을 계산해 계좌 잔고에 반영하는 제도는?","hint":"매일 저녁 통장을 새로 계산하는 제도예요","w":["월말결산","만기정산","분기결산"],"def":"일일정산은 매일 정산가격으로 모든 포지션의 평가손익을 계산해 계좌에 반영하는 제도예요. 이익은 바로 잔고에 들어오고 손실은 바로 빠져나갑니다.","ex":"월요일에 350.00에 매수, 화요일 정산가 352.00이면 화요일 저녁 잔고에 50만원이 이미 들어와 있어요. 수요일에 351.00으로 내려가면 25만원이 다시 빠집니다.","rel":"정산가격 · 평가손익 · 증거금","sem":"ex","type":"def2term","cat":"s1","semLabel":"계약·만기"},{"t":"베이시스","sub":"Basis","head":"선물가격에서 현물지수를 뺀 차이를 부르는 말은?","hint":"선물과 현물, 두 가격의 \"거리\"예요","w":["콘탱고","이론가","스프레드"],"def":"베이시스는 선물가격과 현물가격의 차이로, 국내에서는 보통 \"선물 − 현물\"로 계산해요. 양수면 선물이 비싸고, 음수면 현물이 비쌉니다.","ex":"코스피200 선물이 352.5p, 현물지수가 350.0p라면 베이시스는 +2.5p예요. 이 2.5p는 계약 1개당 62만 5,000원(2.5 × 25만원)에 해당합니다.","rel":"콘탱고 · 백워데이션 · 프로그램 매매","sem":"cu","type":"def2term","cat":"s1","semLabel":"베이시스·이론가"},{"t":"콘탱고","sub":"Contango","head":"선물가격이 현물가격보다 높은 상태를 부르는 말은?","hint":"먼 미래의 물건이 더 비싼, 흔한 상태예요","w":["백워데이션","스큐","역외거래"],"def":"콘탱고는 선물이 현물보다 비싼 상태로, 이자·보관비용이 선물가격에 얹혀 있기 때문에 생겨요. 이때 베이시스는 플러스가 됩니다.","ex":"현물 원유가 배럴당 70달러인데 3개월 뒤 인도분이 72달러라면 콘탱고예요. 창고에 넣어 두는 3개월치 비용과 이자가 2달러로 반영된 겁니다.","rel":"백워데이션 · 베이시스 · 보관비용","sem":"cu","type":"def2term","cat":"s1","semLabel":"베이시스·이론가"},{"t":"백워데이션","sub":"Backwardation","head":"선물가격이 현물가격보다 낮은 상태를 부르는 말은?","hint":"지금 당장이 더 급한 상황에서 나타나요","w":["콘탱고","스마일","롤오버"],"def":"백워데이션은 선물이 현물보다 싼 상태예요. 지금 물건이 급하게 필요하거나 공급이 모자라면 현물값이 치솟아 이렇게 됩니다.","ex":"원유가 부족해 현물이 90달러인데 3개월물이 86달러라면 백워데이션이에요. 지금 당장 쓰려는 사람이 많아 현물에 웃돈이 붙은 겁니다.","rel":"콘탱고 · 베이시스 · 재고","sem":"cu","type":"def2term","cat":"s1","semLabel":"베이시스·이론가"},{"t":"이론가격","sub":"Theoretical price","head":"이자·배당 같은 보유비용을 따져 계산한 \"마땅히 이래야 하는\" 선물가격은?","hint":"현물가격에 이자 붙이고 배당 빼서 만든 값이에요","w":["정산가격","체결가격","행사가격"],"def":"이론가격은 현물가격에 만기까지의 이자비용을 더하고 배당수익을 빼서 계산한 값이에요. 실제 선물가격이 이보다 비싸면 고평가, 싸면 저평가로 봅니다.","ex":"현물 350p, 금리 연 3%, 만기 1개월(1/12), 배당수익률 연 1%라면 이론가는 350 × (1 + 0.03/12 − 0.01/12) ≈ 350.58p예요. 실제 선물이 352p라면 1.4p 비싼 셈입니다.","rel":"베이시스 · 차익거래 · 고평가","sem":"cu","type":"def2term","cat":"s1","semLabel":"베이시스·이론가"},{"t":"롤오버","sub":"Rollover","head":"만기가 다가온 선물을 팔고 다음 월물로 옮겨 담는 것을 부르는 말은?","hint":"짐을 다음 배로 옮겨 싣는 것과 같아요","w":["청산","헤지","스위칭"],"def":"롤오버는 만기 때문에 포지션이 강제로 끝나는 것을 피하려고, 근월물을 청산하고 원월물로 같은 방향의 포지션을 다시 잡는 거예요.","ex":"12월물 3계약을 들고 있는데 만기가 다가오면, 12월물 3계약을 팔고 3월물 3계약을 삽니다. 이때 두 월물의 가격 차이(스프레드)만큼 비용이 생겨요.","rel":"근월물 · 원월물 · 스프레드","sem":"rl","type":"def2term","cat":"s1","semLabel":"월물·롤오버"},{"t":"근월물","sub":"Front month","head":"만기가 가장 가까운 선물 계약을 부르는 말은?","hint":"가장 먼저 끝나는, 제일 가까운 달이에요","w":["원월물","분기물","스팟물"],"def":"근월물은 만기가 가장 가까운 계약이에요. 거래가 가장 활발하고 현물가격과 가장 가깝게 움직입니다.","ex":"지금 11월이고 12월·3월·6월물이 있다면 12월물이 근월물이에요. 12월 10일 만기라면 불과 3주 뒤에 정산됩니다.","rel":"원월물 · 롤오버 · 만기일","sem":"rl","type":"def2term","cat":"s1","semLabel":"월물·롤오버"},{"t":"원월물","sub":"Back month","head":"만기가 가장 멀리 있는 선물 계약을 부르는 말은?","hint":"가장 나중에 끝나는, 먼 달 계약이에요","w":["근월물","현물","위클리"],"def":"원월물은 만기가 가장 먼 계약이에요. 거래량이 적고, 금리·배당 같은 장기 요인이 가격에 더 크게 반영됩니다.","ex":"12월·3월·6월·9월물이 있을 때 9월물이 원월물이에요. 12월물과 9월물의 가격 차이가 10p라면, 그 차이가 9개월치 이자와 배당을 반영한 셈입니다.","rel":"근월물 · 롤오버 · 콘탱고","sem":"rl","type":"def2term","cat":"s1","semLabel":"월물·롤오버"},{"t":"틱","sub":"Tick","head":"선물·옵션 가격이 움직일 수 있는 가장 작은 폭은?","hint":"가격이 한 칸씩 움직일 때 그 한 칸이에요","w":["승수","베이시스","스프레드"],"def":"틱은 호가가 바뀌는 최소 단위예요. 코스피200 선물은 0.05p, 나스닥 선물(NQ)은 0.25포인트처럼 상품마다 정해져 있습니다.","ex":"코스피200 선물이 350.00에서 350.05로 움직이면 1틱이에요. 350.03 같은 가격은 아예 주문할 수 없습니다.","rel":"틱가치 · 승수 · 호가","sem":"tk","type":"def2term","cat":"s1","semLabel":"틱·승수"},{"t":"틱가치","sub":"Tick value","head":"1틱 움직일 때 계약 1개에서 생기는 손익 금액은?","hint":"한 칸 움직임이 돈으로 얼마인지예요","w":["승수","증거금","프리미엄"],"def":"틱가치는 틱 × 승수로 계산해요. 코스피200 선물은 0.05p × 250,000원 = 12,500원이고, NQ는 0.25 × 20달러 = 5달러입니다.","ex":"코스피200 선물 1계약은 1틱에 12,500원, 10틱(0.5p)에 125,000원이 움직여요. 하루 100틱(5p)을 벌면 125만원입니다.","rel":"틱 · 승수 · 손익계산","sem":"tk","type":"def2term","cat":"s1","semLabel":"틱·승수"},{"t":"롱 포지션","sub":"Long position","head":"가격이 오르면 이익이 나는, 사는 쪽 포지션은?","hint":"싸게 사서 비싸게 팔면 이익이에요","w":["숏 포지션","헤지 포지션","스프레드"],"def":"롱은 먼저 사 두고 나중에 파는 포지션이에요. 가격이 오르면 이익, 내리면 손실이 납니다.","ex":"코스피200 선물 1계약을 350.00에 사서(롱) 352.00에 팔면 2p × 25만원 = 50만원 이익이에요. 반대로 348.00이면 50만원 손실입니다.","rel":"숏 포지션 · 청산 · 손익계산","sem":"po","type":"def2term","cat":"s1","semLabel":"포지션·청산"},{"t":"숏 포지션","sub":"Short position","head":"가격이 내리면 이익이 나는, 파는 쪽 포지션은?","hint":"비싸게 팔아 두고 싸게 되사면 이익이에요","w":["롱 포지션","콜 매수","헤지"],"def":"숏은 먼저 팔아 두고 나중에 되사는 포지션이에요. 가격이 내리면 이익, 오르면 손실이 납니다. 선물은 주식과 달리 빌리지 않고도 숏을 잡을 수 있어요.","ex":"350.00에 1계약을 팔아 두고(숏) 347.00에 되사면 3p × 25만원 = 75만원 이익이에요. 353.00까지 오르면 75만원 손실입니다.","rel":"롱 포지션 · 공매도 · 청산","sem":"po","type":"def2term","cat":"s1","semLabel":"포지션·청산"},{"t":"청산","sub":"Offset","head":"가진 포지션과 반대되는 매매를 해서 포지션을 없애는 것은?","hint":"산 것은 팔고, 판 것은 사서 0으로 만드는 거예요","w":["만기","행사","롤오버"],"def":"청산은 보유한 롱을 팔거나 숏을 되사서 포지션을 0으로 만드는 거예요. 만기까지 기다리지 않고 언제든 할 수 있습니다.","ex":"350.00에 산 1계약이 352.00이 됐을 때 매도 주문으로 청산하면 50만원이 확정돼요. 청산하지 않고 만기까지 들고 가면 만기 정산가격으로 정산됩니다.","rel":"만기 · 롤오버 · 실현손익","sem":"po","type":"def2term","cat":"s1","semLabel":"포지션·청산"},{"t":"헤지","sub":"Hedge","head":"현물 손실을 막으려고 선물로 반대 포지션을 잡는 것은?","hint":"보험처럼 반대쪽에 미리 자리를 잡아 두는 거예요","w":["투기","차익거래","롤오버"],"def":"헤지는 현물을 들고 있는 사람이 가격 하락 위험을 줄이려고 선물을 파는(숏) 방식이에요. 현물에서 손해가 나면 선물에서 이익이 나 서로 상쇄됩니다.","ex":"주식 8,750만원어치를 들고 있는데 지수가 5% 빠지면 437만 5,000원 손실이에요. 같은 금액의 선물을 숏으로 잡아 두면 선물에서 437만 5,000원이 벌려 손실이 거의 없어집니다.","rel":"투기 · 차익거래 · 베이시스","sem":"ba","type":"def2term","cat":"s1","semLabel":"기본개념"},{"t":"투기","sub":"Speculation","head":"가격이 오를지 내릴지에 베팅해 차익을 노리는 거래 목적은?","hint":"현물 없이 방향만 보고 거는 거예요","w":["헤지","차익거래","결제"],"def":"투기는 현물 보유 없이 가격 방향만 예상해 포지션을 잡는 거예요. 선물 시장에 유동성을 공급하지만, 레버리지 때문에 손실도 빠르게 커집니다.","ex":"지수가 오른다고 믿고 선물 1계약을 사면 1p당 25만원이 붙어요. 2%만 올라도 175만원이지만, 2%만 내려도 175만원이 사라집니다.","rel":"헤지 · 레버리지 · 기대값","sem":"ba","type":"def2term","cat":"s1","semLabel":"기본개념"},{"t":"기초자산","sub":"Underlying asset","head":"선물 가격이 따라 움직이는 원래 대상(지수·원유·금 등)은?","hint":"선물이 그림자처럼 따라가는 진짜 대상이에요","w":["증거금","만기일","승수"],"def":"기초자산은 선물 계약이 값을 매기는 실제 대상이에요. 코스피200 선물의 기초자산은 코스피200 지수, 원유 선물은 원유입니다.","ex":"코스피200 지수가 350에서 355로 오르면 코스피200 선물도 그만큼 따라 올라요. 기초자산이 없는 선물은 존재할 수 없습니다.","rel":"지수선물 · 상품선물 · 만기","sem":"ba","type":"def2term","cat":"s1","semLabel":"기본개념"},{"t":"2026년 12월물","sub":"Contract month","head":"\"코스피200 선물 F 2612\"라는 표기에서 2612가 뜻하는 것은?","hint":"앞 두 자리는 연도, 뒤 두 자리는 달이에요","w":["2026년 12월 6일","26번째 계약","만기까지 12일"],"def":"선물 종목 코드의 숫자는 만기 되는 연도와 월을 뜻해요. 2612는 2026년 12월에 만기가 돌아오는 계약이라는 의미입니다.","ex":"F 2612는 2026년 12월 두 번째 목요일(12월 10일) 만기예요. 그래서 11월에 이 계약을 사면 약 3주 뒤에 만기가 옵니다.","rel":"근월물 · 만기일 · 롤오버","sem":"ex","type":"def2term","cat":"s1","semLabel":"계약·만기"},{"t":"포인트","sub":"Index point","head":"코스피200 선물 가격 350.25에서 \"p\"가 뜻하는 것은?","hint":"지수가 세는 단위, 포인트예요","w":["퍼센트","원","달러"],"def":"p는 인덱스 포인트로, 지수가 움직인 크기를 세는 단위예요. 350.25p는 지수가 기준값의 350.25라는 뜻이지 350.25%라는 뜻이 아닙니다.","ex":"지수가 350.00p에서 353.50p로 오르면 3.5p 올랐다고 해요. 250,000원을 곱하면 계약 1개당 87만 5,000원 이익입니다.","rel":"승수 · 틱 · 지수","sem":"tk","type":"def2term","cat":"s1","semLabel":"틱·승수"},{"t":"지수선물","sub":"Index futures","head":"코스피200 같은 주가지수를 기초자산으로 하는 선물은?","hint":"주식을 한 묶음으로 만든 지수를 따르는 선물이에요","w":["상품선물","통화선물","개별주식선물"],"def":"지수선물은 주가지수를 기초자산으로 해요. 코스피200·나스닥100·S&P500 선물이 대표적이고, 실제 주식을 받지 않고 현금으로 정산합니다.","ex":"코스피200 선물 1계약은 지수 350p × 25만원 = 8,750만원어치예요. 개별 종목이 아니라 200개 종목을 한 번에 거래하는 셈입니다.","rel":"상품선물 · 코스피200 · 현금결제","sem":"ba","type":"def2term","cat":"s1","semLabel":"기본개념"},{"t":"상품선물","sub":"Commodity futures","head":"원유·금·옥수수처럼 실제 물건을 기초자산으로 하는 선물은?","hint":"창고에 쌓이는 진짜 물건이 대상이에요","w":["지수선물","통화선물","금리선물"],"def":"상품선물은 원유·금·곡물 같은 실물을 기초자산으로 해요. 만기에는 현금으로 정산하거나 실제 물건을 받는 실물인수도가 일어납니다.","ex":"원유 선물 1계약은 1,000배럴이에요. 배럴당 70달러면 계약금액이 7만 달러이고, 1달러 움직이면 1,000달러가 오갑니다.","rel":"실물인수도 · 지수선물 · 해외선물","sem":"gl","type":"def2term","cat":"s1","semLabel":"해외선물"},{"t":"해외선물","sub":"Overseas futures","head":"CME 같은 해외 거래소에서 달러로 거래하는 선물은?","hint":"국경을 넘어 달러로 사는 선물이에요","w":["국내선물","상품선물","스왑"],"def":"해외선물은 CME·SGX 등 해외 거래소에서 거래되는 선물이에요. 달러로 증거금을 내고 손익도 달러로 계산돼 환율이 결과에 영향을 줍니다.","ex":"나스닥 선물 1계약(NQ)은 1포인트당 20달러예요. 100포인트 오르면 2,000달러, 원화로는 환율 1,350원 기준 270만원입니다.","rel":"환율 리스크 · 마이크로 계약 · 나스닥","sem":"gl","type":"def2term","cat":"s1","semLabel":"해외선물"},{"t":"증거금률","sub":"Margin rate","head":"계약금액의 몇 퍼센트를 담보로 내는지 나타내는 비율은?","hint":"계약금액 대비 담보금의 비율이에요","w":["레버리지 배수","수수료율","세율"],"def":"증거금률은 계약금액 대비 개시증거금의 비율이에요. 이 비율이 낮을수록 레버리지가 커지고, 거래소가 위험을 보고 비율을 올리면 레버리지가 줄어듭니다.","ex":"계약금액 8,750만원에 증거금 875만원이면 증거금률 10%, 레버리지 10배예요. 거래소가 20%로 올리면 증거금이 1,750만원으로 늘어 레버리지가 5배로 줄어듭니다.","rel":"개시증거금 · 레버리지 · 마진콜","sem":"mg","type":"def2term","cat":"s1","semLabel":"증거금"},{"t":"$20","sub":"NQ multiplier","head":"나스닥100 선물(NQ)에서 지수 1포인트가 20달러가 되도록 정한 승수는?","hint":"NQ는 1포인트에 20달러예요","w":["$2","$50","$5"],"def":"NQ(나스닥100 선물)의 승수는 1포인트당 20달러예요. 지수가 100포인트 움직이면 계약 1개에서 2,000달러가 오갑니다.","ex":"나스닥이 20,000에서 20,100으로 100p 오르면 100 × 20달러 = 2,000달러, 환율 1,350원이면 270만원 이익이에요.","rel":"MNQ · 틱가치 · 해외선물","sem":"gl","type":"calc","cat":"s1","semLabel":"해외선물"},{"t":"$2","sub":"MNQ multiplier","head":"마이크로 나스닥(MNQ)의 1포인트 가치는 얼마일까요?","hint":"마이크로는 정식 계약의 10분의 1이에요","w":["$20","$0.50","$5"],"def":"MNQ는 NQ의 10분의 1 크기예요. 승수가 2달러라서 나스닥이 100p 움직여도 200달러만 오갑니다.","ex":"나스닥이 100p 오르면 NQ는 2,000달러, MNQ는 200달러예요. 처음 시작하는 사람이 1계약으로 연습하기 좋은 크기입니다.","rel":"NQ · 마이크로 계약 · 틱가치","sem":"gl","type":"calc","cat":"s1","semLabel":"해외선물"},{"t":"$50","sub":"ES multiplier","head":"S&P500 선물(ES) 1포인트의 가치는?","hint":"ES는 1포인트에 50달러예요","w":["$20","$5","$500"],"def":"ES(S&P500 선물)의 승수는 1포인트당 50달러예요. 지수가 10p만 움직여도 500달러가 오갑니다.","ex":"S&P500이 5,000에서 5,010으로 10p 오르면 10 × 50달러 = 500달러, 원화로 약 67만 5,000원이에요.","rel":"MES · NQ · 틱가치","sem":"gl","type":"calc","cat":"s1","semLabel":"해외선물"},{"t":"$5","sub":"MES multiplier","head":"마이크로 S&P500(MES)의 1포인트 가치는?","hint":"ES의 10분의 1 크기예요","w":["$50","$0.50","$2"],"def":"MES는 ES의 10분의 1 크기로 승수가 5달러예요. S&P500이 10p 움직이면 50달러가 오갑니다.","ex":"S&P500이 5,000에서 5,020으로 20p 오르면 MES 1계약은 100달러 이익이에요. ES로는 1,000달러입니다.","rel":"ES · 마이크로 계약 · 승수","sem":"gl","type":"calc","cat":"s1","semLabel":"해외선물"},{"t":"5달러","sub":"NQ tick value","head":"나스닥 선물(NQ)은 0.25포인트씩 움직입니다. 1틱의 손익은?","hint":"0.25 × 20달러를 계산해 보세요","w":["$0.50","$12.50","$20"],"def":"NQ의 틱은 0.25포인트, 승수는 20달러예요. 그래서 1틱은 0.25 × 20 = 5달러입니다.","ex":"나스닥이 20,000.00에서 20,000.25로 한 칸 움직이면 5달러(약 6,750원)가 오가요. 4틱이면 1포인트, 20달러입니다.","rel":"MNQ · 틱 · 승수","sem":"tk","type":"calc","cat":"s1","semLabel":"틱·승수"},{"t":"$0.50","sub":"MNQ tick value","head":"마이크로 나스닥(MNQ)의 틱은 0.25포인트입니다. 1틱 손익은?","hint":"0.25 × 2달러를 계산해 보세요","w":["$2","$5","$0.25"],"def":"MNQ는 틱 0.25포인트, 승수 2달러라 1틱이 0.50달러예요. NQ의 정확히 10분의 1입니다.","ex":"20,000.00에서 20,000.25로 움직이면 0.5달러, 우리 돈 약 675원이 오가요. 수수료를 생각하면 아주 작은 움직임이에요.","rel":"NQ · 마이크로 계약 · 틱가치","sem":"tk","type":"calc","cat":"s1","semLabel":"틱·승수"},{"t":"$12.50","sub":"ES tick value","head":"S&P500 선물(ES)의 1틱(0.25포인트) 손익은?","hint":"0.25 × 50달러를 계산해 보세요","w":["$5","$50","$1.25"],"def":"ES는 틱 0.25포인트, 승수 50달러라 1틱이 12.50달러예요. 4틱이면 1포인트, 50달러입니다.","ex":"S&P500이 5,000.00에서 5,000.25로 움직이면 12.50달러(약 1만 6,875원)가 오갑니다. 10틱(2.5p)이면 125달러입니다.","rel":"MES · NQ · 틱","sem":"tk","type":"calc","cat":"s1","semLabel":"틱·승수"},{"t":"$1.25","sub":"MES tick value","head":"마이크로 S&P500(MES)의 1틱(0.25포인트) 손익은?","hint":"0.25 × 5달러를 계산해 보세요","w":["$12.50","$0.50","$5"],"def":"MES는 틱 0.25포인트, 승수 5달러라 1틱이 1.25달러예요. ES의 10분의 1입니다.","ex":"S&P500이 4틱(1포인트) 움직이면 MES는 5달러, ES는 50달러가 오가요. 같은 방향이라도 계약 크기에 따라 금액이 10배 차이 납니다.","rel":"ES · 마이크로 계약 · 틱가치","sem":"tk","type":"calc","cat":"s1","semLabel":"틱·승수"},{"t":"12,500원","sub":"KOSPI200 tick value","head":"코스피200 선물 1틱(0.05p)의 손익은 얼마일까요?","hint":"0.05 × 250,000원을 계산해 보세요","w":["125,000원","2,500원","250,000원"],"def":"코스피200 선물은 틱 0.05p, 승수 250,000원이라 1틱이 12,500원이에요. 20틱이 1포인트, 25만원입니다.","ex":"지수가 350.00에서 350.05로 움직이면 12,500원이 오가요. 하루에 1포인트(20틱)를 벌면 25만원입니다.","rel":"틱 · 승수 · 코스피200","sem":"tk","type":"calc","cat":"s1","semLabel":"틱·승수"},{"t":"50만원","sub":"P&L calc","head":"코스피200 선물 1계약을 350.00에 사서 352.00에 팔았습니다. 손익은?","hint":"2포인트 × 25만원이에요","w":["25만원","75만원","500만원"],"def":"롱 1계약의 손익은 (판 가격 − 산 가격) × 승수예요. (352.00 − 350.00) × 250,000 = 500,000원 이익입니다.","ex":"2p 상승은 40틱이에요. 40 × 12,500원 = 50만원으로 같은 결과가 나옵니다. 커피 한 잔 값이 아니라 월급 일부가 하루에 오가는 셈이에요.","rel":"손익계산 · 틱가치 · 롱 포지션","sem":"ca","type":"calc","cat":"s1","semLabel":"손익계산"},{"t":"2계약","sub":"Position sizing","head":"계좌에 1,000만원이 있고 개시증거금이 계약당 500만원입니다. 최대 몇 계약을 열 수 있을까요?","hint":"1,000만원 ÷ 500만원이에요","w":["1계약","3계약","20계약"],"def":"열 수 있는 계약 수는 가용 증거금을 계약당 개시증거금으로 나눈 값이에요. 1,000만원 ÷ 500만원 = 2계약입니다.","ex":"2계약을 열면 증거금이 꽉 차서, 1틱(12,500원) 손실에도 바로 추가 입금 요구가 올 수 있어요. 보통은 절반 이하만 쓰는 게 안전합니다.","rel":"개시증거금 · 포지션 사이징 · 마진콜","sem":"mg","type":"calc","cat":"s1","semLabel":"증거금"},{"t":"10배","sub":"Leverage ratio","head":"지수 350p 선물 1계약(8,750만원어치)을 증거금 875만원으로 보유했습니다. 레버리지는?","hint":"계약금액 ÷ 증거금이에요","w":["5배","8.75배","100배"],"def":"레버리지는 계약금액을 증거금으로 나눈 값이에요. 8,750만원 ÷ 875만원 = 10배입니다.","ex":"레버리지 10배는 지수 1% 하락이 내 돈 10% 손실이라는 뜻이에요. 3.5%만 빠져도 계좌의 35%가 사라집니다.","rel":"레버리지 · 증거금률 · 반대매매","sem":"mg","type":"calc","cat":"s1","semLabel":"증거금"},{"t":"8,750,000원","sub":"Initial margin calc","head":"코스피200 350p, 승수 250,000원, 증거금률 10%일 때 1계약의 개시증거금은?","hint":"350 × 25만원 × 10%를 계산해 보세요","w":["875,000원","8,750원","87,500,000원"],"def":"계약금액 350 × 250,000 = 87,500,000원이고, 그 10%가 개시증거금이라 8,750,000원이에요.","ex":"875만원으로 8,750만원짜리 계약을 들고 있는 셈이에요. 지수가 10p(약 2.9%)만 내려도 250만원 손실이라 계좌의 28%가 날아갑니다.","rel":"증거금률 · 레버리지 · 개시증거금","sem":"mg","type":"calc","cat":"s1","semLabel":"증거금"},{"t":"두 번째 목요일","sub":"Expiry rule","head":"코스피200 선물·옵션의 만기일은 매 분기(3·6·9·12월) 몇 번째 목요일일까요?","hint":"둘째 주 목요일이에요","w":["첫 번째 목요일","세 번째 금요일","마지막 영업일"],"def":"코스피200 선물과 옵션은 3·6·9·12월의 두 번째 목요일에 함께 만기가 돌아와요. 이날은 선물과 옵션이 동시에 끝나 변동성이 커집니다.","ex":"2026년 12월의 두 번째 목요일은 12월 10일이에요. 이날 오후 3시 20분 무렵까지 최종 거래가 이뤄지고 정산됩니다.","rel":"만기일 · 네 마녀의 날 · 핀닝","sem":"ex","type":"concept","cat":"s1","semLabel":"계약·만기"},{"t":"기준일 100 대비 3.5배","sub":"KOSPI200 level","head":"코스피200 지수가 350p라는 것은 무엇을 뜻할까요?","hint":"기준일을 100으로 놓고 비교한 값이에요","w":["200개 종목 평균 주가 350원","시가총액 350조원","하루 상승률 350%"],"def":"코스피200은 1990년 1월 3일의 시가총액을 100으로 놓고 만든 지수예요. 350p는 그때보다 시가총액이 3.5배가 됐다는 뜻입니다.","ex":"지수가 350p이고 승수가 25만원이면 1계약이 8,750만원이에요. 지수가 1% 오르는 것은 3.5p, 계약당 87만 5,000원입니다.","rel":"지수선물 · 승수 · 포인트","sem":"ba","type":"concept","cat":"s1","semLabel":"기본개념"},{"t":"1,875,000원","sub":"Loss calc","head":"코스피200 선물 5계약을 롱으로 잡고 있는데 지수가 1.5p 하락했습니다. 손실은?","hint":"1.5 × 25만원 × 5계약이에요","w":["187,500원","375,000원","9,375,000원"],"def":"롱의 손실은 (하락 포인트) × 승수 × 계약 수예요. 1.5 × 250,000 × 5 = 1,875,000원입니다.","ex":"1.5p는 30틱이라 30 × 12,500원 × 5계약 = 187만 5,000원이에요. 5계약으로 늘린 순간 같은 움직임의 손실도 5배가 됩니다.","rel":"손익계산 · 포지션 사이징 · 레버리지","sem":"ca","type":"calc","cat":"s1","semLabel":"손익계산"},{"t":"선물가격이 낮아진다","sub":"Dividend effect","head":"배당을 많이 주는 지수일수록 선물가격은 이론적으로 어떻게 될까요?","hint":"배당은 선물을 들고 있는 사람에게 오지 않아요","w":["선물가격이 높아진다","선물가격과 무관하다","만기일에만 높아진다"],"def":"선물을 보유하면 현물과 달리 배당을 받지 못해요. 그래서 배당수익률만큼 선물가격이 현물보다 낮게 형성됩니다.","ex":"현물 350p, 배당수익률 연 2%, 만기 3개월이면 배당 몫이 350 × 2% × 3/12 = 1.75p예요. 이만큼 선물가격이 눌립니다.","rel":"이론가격 · 콘탱고 · 배당락","sem":"cu","type":"concept","cat":"s1","semLabel":"베이시스·이론가"},{"t":"선물가격이 올라간다","sub":"Interest rate effect","head":"금리가 오르면 코스피200 선물가격은 이론적으로 어떻게 될까요?","hint":"빌린 돈의 이자가 비싸지면 미리 사 두는 값도 올라요","w":["선물가격이 내려간다","영향이 전혀 없다","배당만큼 내려간다"],"def":"금리가 오르면 현물을 사 두는 데 드는 이자비용이 커져요. 그 비용이 선물가격에 얹혀 콘탱고가 깊어지고 선물가격은 올라갑니다.","ex":"현물 350p, 금리 3%, 만기 3개월이면 이자 몫이 350 × 3% × 3/12 = 2.625p예요. 금리가 4%로 오르면 0.875p 더 높아집니다.","rel":"이론가격 · 콘탱고 · 보유비용","sem":"cu","type":"concept","cat":"s1","semLabel":"베이시스·이론가"},{"t":"보관비용","sub":"Carrying cost","head":"원유를 창고에 쌓아 두는 비용처럼, 선물가격을 현물보다 높이는 비용은?","hint":"물건을 보관하고 나르는 데 드는 비용이에요","w":["배당수익률","증거금","틱가치"],"def":"보관비용은 창고료·운송비·보험료처럼 실물을 들고 있는 데 드는 비용이에요. 이 비용 때문에 먼 만기의 선물이 더 비싼 콘탱고가 나타납니다.","ex":"원유 1,000배럴을 3개월 보관하는 데 배럴당 2달러가 들면, 3개월물은 현물보다 2달러 비싸져요. 계약 전체로는 2,000달러 차이입니다.","rel":"콘탱고 · 백워데이션 · 이론가격","sem":"cu","type":"concept","cat":"s1","semLabel":"베이시스·이론가"},{"t":"0에 가까워진다","sub":"Convergence","head":"만기일이 다가오면 베이시스(선물 − 현물)는 어떻게 될까요?","hint":"만기에는 두 가격이 같은 것을 가리켜야 해요","w":["점점 커진다","음수가 된다","변하지 않는다"],"def":"만기일에는 선물과 현물이 같은 시점의 가격이 되어 차이가 사라져요. 그래서 베이시스는 만기로 갈수록 0에 수렴합니다.","ex":"만기 3주 전 베이시스가 +2.5p였는데 만기 당일 0이 됐어요. 선물을 사 두고 현물을 팔아 두면 2.5p(62만 5,000원)가 수익 또는 비용으로 확정됩니다.","rel":"베이시스 · 만기일 · 차익거래","sem":"cu","type":"concept","cat":"s1","semLabel":"베이시스·이론가"},{"t":"실물인수도","sub":"Physical delivery","head":"원유 선물 만기에 실제 원유를 받는 것을 부르는 말은?","hint":"돈이 아니라 진짜 물건이 오는 결제예요","w":["현금결제","롤오버","청산"],"def":"실물인수도는 만기에 실제 상품을 넘겨받거나 넘겨주는 결제예요. 원유·금·곡물 선물에서 일어나며, 받을 준비가 안 됐다면 위험합니다.","ex":"원유 선물 1계약은 1,000배럴이에요. 만기까지 들고 가면 배럴당 70달러 기준 7만 달러어치 원유를 실제로 받아야 할 수 있습니다.","rel":"현금결제 · 상품선물 · 만기일","sem":"ex","type":"concept","cat":"s1","semLabel":"계약·만기"},{"t":"마이크로 계약","sub":"Micro contract","head":"정식 계약의 10분의 1 크기로 만든 작은 선물 계약은?","hint":"이름 앞에 M이 붙는 작은 계약이에요","w":["미니 계약","위클리 계약","스프레드 계약"],"def":"마이크로 계약은 정식 선물의 10분의 1 크기예요. MNQ·MES처럼 M이 붙고, 증거금과 손익이 작아 초보자가 연습하기 좋습니다.","ex":"NQ 1계약의 하루 손익이 2,000달러라면 MNQ는 200달러예요. 같은 전략을 10분의 1 위험으로 시험해 볼 수 있습니다.","rel":"MNQ · MES · 증거금","sem":"gl","type":"concept","cat":"s1","semLabel":"해외선물"},{"t":"환율 리스크","sub":"FX risk","head":"달러로 거래하는 해외선물에서 원화로 바꿀 때 손익이 달라지는 위험은?","hint":"달러 이익이 원화로 바뀔 때 환율이 끼어들어요","w":["베이시스 리스크","유동성 리스크","만기 리스크"],"def":"해외선물 손익은 달러로 확정된 뒤 원화로 환전돼요. 그래서 달러 이익이 나도 원화가 강세가 되면 원화 손익이 줄 수 있습니다.","ex":"나스닥에서 1,000달러를 벌었어요. 환율 1,350원이면 135만원이지만, 1,250원이면 125만원이에요. 10만원이 환율 때문에 사라집니다.","rel":"해외선물 · 환전 · 달러","sem":"fx","type":"concept","cat":"s1","semLabel":"해외·환율"},{"t":"평가손익","sub":"Unrealized P&L","head":"아직 팔지 않았지만 현재 가격으로 계산한 손익은?","hint":"아직 실현되지 않은, 종이 위의 손익이에요","w":["실현손익","확정손익","결제손익"],"def":"평가손익은 포지션을 그대로 둔 채 현재 가격으로 매겨 본 손익이에요. 일일정산으로 매일 계좌에 반영되지만, 청산 전까지는 계속 변합니다.","ex":"350.00에 산 1계약이 지금 351.00이면 평가이익 25만원이에요. 그대로 두고 349.00이 되면 평가이익이 25만원 손실로 바뀝니다.","rel":"실현손익 · 일일정산 · 청산","sem":"po","type":"concept","cat":"s1","semLabel":"포지션·청산"},{"t":"실현손익","sub":"Realized P&L","head":"포지션을 청산해 실제로 확정된 손익은?","hint":"팔아서 통장에 남은, 되돌릴 수 없는 손익이에요","w":["평가손익","이론손익","예상손익"],"def":"실현손익은 청산 주문이 체결되어 확정된 손익이에요. 이익은 계좌에 남고 손실은 사라지지 않아 다음 거래의 자본이 줄어듭니다.","ex":"350.00에 산 1계약을 351.00에 팔면 25만원 실현이익이에요. 25만원으로 1계약을 더 살 수 있지만, 손실 25만원이 났다면 자본이 그만큼 줄어 1계약도 못 삽니다.","rel":"평가손익 · 청산 · 자본","sem":"po","type":"concept","cat":"s1","semLabel":"포지션·청산"},{"t":"선물 매도","sub":"Short without borrowing","head":"현물 주식을 빌리지 않고도 지수 하락에 베팅할 수 있는 수단은?","hint":"빌릴 필요 없이 팔아 둘 수 있는 계약이에요","w":["주식 공매도","콜옵션 매수","현물 매수"],"def":"선물은 계약을 새로 만들어 파는 것이므로 빌릴 주식이 없어도 숏을 잡을 수 있어요. 공매도 제도와 달리 대차료나 상환 기한도 없습니다.","ex":"지수가 내릴 것 같으면 코스피200 선물 1계약을 팔아 두면 돼요. 지수가 5p 내리면 125만원 이익이고, 빌린 주식은 한 주도 없습니다.","rel":"숏 포지션 · 공매도 · 대차거래","sem":"po","type":"concept","cat":"s1","semLabel":"포지션·청산"},{"t":"청산소","sub":"Clearing house","head":"거래소에서 모든 계약의 상대방이 되어 결제를 보증하는 기구는?","hint":"모두의 반대편에 서서 결제를 책임지는 곳이에요","w":["증권사","자산운용사","시장조성자"],"def":"청산소는 매수자와 매도자 사이에 들어가 모든 계약의 상대방이 되어 줘요. 그래서 내 거래 상대가 파산해도 결제가 보장됩니다.","ex":"내가 모르는 사람에게 선물을 팔아도, 그 사람이 망하면 청산소가 대신 결제해 줘요. 대신 청산소는 증거금으로 그 위험을 관리합니다.","rel":"증거금 · 거래소 · 결제","sem":"ba","type":"concept","cat":"s1","semLabel":"기본개념"},{"t":"낮아진다","sub":"Margin hike","head":"시장이 험해져 거래소가 증거금률을 올리면 레버리지는 어떻게 될까요?","hint":"담보를 더 많이 내야 하니 지렛대가 짧아져요","w":["높아진다","변하지 않는다","계약금액이 커진다"],"def":"증거금률이 오르면 같은 계약을 들고 있기 위해 더 많은 돈이 필요해요. 그래서 같은 자본으로 보유할 수 있는 계약이 줄고 레버리지가 낮아집니다.","ex":"증거금률 10%에서 20%로 오르면 875만원이던 증거금이 1,750만원이 돼요. 1,000만원 계좌는 1계약도 유지하기 어려워집니다.","rel":"증거금률 · 레버리지 · 마진콜","sem":"mg","type":"concept","cat":"s1","semLabel":"증거금"},{"t":"오후 3시 30분","sub":"KRX hours","head":"코스피200 선물의 정규 거래시간이 끝나는 시각은?","hint":"주식 정규장과 같은 시각에 끝나요","w":["오후 3시","오후 4시","오후 6시"],"def":"코스피200 선물 정규장은 오전 9시부터 오후 3시 30분까지예요. 그 뒤에는 시간외·야간 거래가 이어집니다.","ex":"오후 3시 20분부터 30분까지는 동시호가로 마감 가격을 정해요. 이 10분 사이에 대량 주문이 몰리면 가격이 크게 튈 수 있습니다.","rel":"동시호가 · 야간선물 · 거래시간","sem":"ex","type":"concept","cat":"s1","semLabel":"계약·만기"},{"t":"제로섬","sub":"Zero-sum","head":"선물 거래에서 한쪽 이익이 다른 쪽 손실이 되는 구조를 부르는 말은?","hint":"모두의 이익을 합치면 0이 되는 구조예요","w":["플러스섬","복리","분산투자"],"def":"선물은 누군가의 이익이 정확히 다른 누군가의 손실이 되는 제로섬 구조예요. 다만 수수료와 세금이 빠지면 전체 합은 오히려 마이너스가 됩니다.","ex":"내가 50만원을 벌면 반대편 누군가는 50만원을 잃어요. 여기에 양쪽 수수료가 각각 붙어 시장 전체로는 손실이 커집니다.","rel":"수수료 · 투기 · 헤지","sem":"ba","type":"concept","cat":"s1","semLabel":"기본개념"},{"t":"콜옵션","sub":"Call option","head":"정해진 가격에 살 수 있는 권리를 사고파는 계약은?","hint":"\"살 권리\"를 사는 옵션이에요","w":["풋옵션","선물","스왑"],"def":"콜옵션은 만기나 그 전에 정한 가격(행사가격)으로 기초자산을 살 수 있는 권리예요. 사는 사람은 권리만 갖고, 파는 사람은 팔아야 할 의무를 집니다.","ex":"코스피200이 350p일 때 \"350에 살 권리\"를 2p에 사면 50만원을 냅니다. 지수가 360이 되면 350에 살 수 있는 권리가 10p어치가 돼요.","rel":"풋옵션 · 행사가격 · 프리미엄","sem":"ba","type":"def2term","cat":"s2","semLabel":"기본개념"},{"t":"풋옵션","sub":"Put option","head":"정해진 가격에 팔 수 있는 권리를 사고파는 계약은?","hint":"\"팔 권리\"를 사는 옵션이에요","w":["콜옵션","선물","스왑"],"def":"풋옵션은 정한 가격으로 기초자산을 팔 수 있는 권리예요. 지수가 내려갈수록 \"비싼 값에 팔 권리\"가 더 값져서 풋 가격이 오릅니다.","ex":"지수 350p에서 \"350에 팔 권리\"를 2p(50만원)에 샀는데 지수가 340이 되면, 350에 팔 수 있으니 10p 이익이에요. 50만원이 250만원이 됩니다.","rel":"콜옵션 · 프리미엄 · 보험","sem":"ba","type":"def2term","cat":"s2","semLabel":"기본개념"},{"t":"옵션 매수자","sub":"Option buyer","head":"프리미엄을 내고 권리를 사는 쪽은 누구일까요?","hint":"돈을 내고 \"선택할 권리\"를 얻는 사람이에요","w":["옵션 매도자","청산소","시장조성자"],"def":"옵션 매수자는 프리미엄을 내고 권리를 얻어요. 유리하면 행사하고 불리하면 버리면 되므로 손실이 프리미엄으로 제한됩니다.","ex":"프리미엄 2p(50만원)를 내고 콜을 사면, 지수가 폭락해도 손실은 50만원이에요. 반대로 지수가 30p 오르면 750만원이 될 수도 있습니다.","rel":"옵션 매도자 · 프리미엄 · 권리","sem":"ri","type":"def2term","cat":"s2","semLabel":"권리·의무"},{"t":"옵션 매도자","sub":"Option seller","head":"프리미엄을 받는 대신 권리를 지켜 줄 의무를 지는 쪽은?","hint":"보험료를 받고 사고를 책임지는 쪽이에요","w":["옵션 매수자","청산소","헤지펀드"],"def":"옵션 매도자는 프리미엄을 먼저 받지만, 매수자가 행사하면 응해야 하는 의무를 져요. 그래서 증거금을 내야 하고 손실이 커질 수 있습니다.","ex":"프리미엄 2p(50만원)를 받고 콜을 팔았는데 지수가 40p 급등하면 1,000만원을 물어 줘야 해요. 받은 50만원으로 1,000만원을 감당할 수 없습니다.","rel":"옵션 매수자 · 증거금 · 의무","sem":"ri","type":"def2term","cat":"s2","semLabel":"권리·의무"},{"t":"프리미엄","sub":"Premium","head":"옵션을 사고팔 때 지불하는 옵션의 가격은?","hint":"보험료처럼 권리에 붙는 값이에요","w":["행사가격","증거금","틱가치"],"def":"프리미엄은 옵션의 가격이에요. 내재가치와 시간가치로 이뤄지고, 만기가 가까워지거나 변동성이 줄면 낮아집니다.","ex":"행사가 350인 콜이 2.35p에 거래되면 1계약에 2.35 × 250,000 = 587,500원이에요. 이 돈을 내고 살 권리를 삽니다.","rel":"행사가격 · 내재가치 · 시간가치","sem":"pr","type":"def2term","cat":"s2","semLabel":"프리미엄"},{"t":"행사가격","sub":"Strike price","head":"옵션으로 사거나 팔 수 있기로 미리 정해 둔 기준 가격은?","hint":"권리를 쓸 때 적용되는 약속된 가격이에요","w":["프리미엄","정산가격","베이시스"],"def":"행사가격은 옵션 계약에 적힌 약속 가격이에요. 콜은 이 가격에 살 수 있고, 풋은 이 가격에 팔 수 있습니다.","ex":"코스피200 옵션은 2.5p 간격으로 행사가격이 있어요. 지수 750p 근처라면 745·747.5·750·752.5처럼 촘촘히 늘어섭니다.","rel":"내가격 · 등가격 · 외가격","sem":"ba","type":"def2term","cat":"s2","semLabel":"기본개념"},{"t":"행사","sub":"Exercise","head":"옵션 매수자가 자신의 권리를 실제로 쓰는 것을 부르는 말은?","hint":"권리를 종이에서 현실로 꺼내 쓰는 거예요","w":["청산","롤오버","만기"],"def":"행사는 매수자가 \"이 가격에 사겠다(팔겠다)\"고 권리를 주장하는 거예요. 국내 지수옵션은 만기일에 자동으로 행사·결제됩니다.","ex":"지수 355p에서 행사가 350 콜을 행사하면 5p 이익이에요. 25만원을 곱해 125만원을 받습니다.","rel":"만기 · 내재가치 · 자동행사","sem":"mt","type":"def2term","cat":"s2","semLabel":"만기·결제"},{"t":"만기","sub":"Expiration","head":"옵션의 권리가 사라지는 마지막 날은?","hint":"이날이 지나면 권리는 휴지조각이 돼요","w":["행사가격","정산일","거래개시일"],"def":"옵션 만기는 권리가 끝나는 날이에요. 그때까지 이익이 없으면 옵션은 가치 0이 되어 프리미엄 전액을 잃습니다.","ex":"영화 관람권이 오늘 자정까지 유효하다면, 오늘 영화를 못 보면 관람권 값은 사라져요. 옵션도 만기 후에는 아무 권리도 남지 않습니다.","rel":"시간가치 · 행사 · 위클리","sem":"mt","type":"def2term","cat":"s2","semLabel":"만기·결제"},{"t":"내가격","sub":"In the money","head":"지금 행사하면 바로 이익이 나는 옵션 상태를 부르는 말은?","hint":"행사하면 이익이 나는 \"안쪽\" 상태예요","w":["등가격","외가격","평가손실"],"def":"내가격(ITM)은 지금 행사하면 이익이 남는 상태예요. 콜은 지수가 행사가보다 높을 때, 풋은 지수가 행사가보다 낮을 때 내가격입니다.","ex":"행사가 350 콜인데 지수가 355면 5p가 내재가치로 남아 있어 내가격이에요. 계약 1개 기준 125만원의 실질 가치가 있습니다.","rel":"등가격 · 외가격 · 내재가치","sem":"sk","type":"def2term","cat":"s2","semLabel":"ITM·ATM·OTM"},{"t":"등가격","sub":"At the money","head":"현재 지수와 행사가격이 거의 같은 옵션 상태는?","hint":"지수와 행사가가 딱 붙어 있는 상태예요","w":["내가격","외가격","깊은외가격"],"def":"등가격(ATM)은 현재가와 행사가격이 같은 상태예요. 내재가치는 0이지만 시간가치가 가장 커서 프리미엄이 높은 편입니다.","ex":"지수 750p에서 행사가 750 콜은 등가격이에요. 내재가치는 0이지만 만기까지 21일 남았다면 시간가치만으로 8p(200만원)에 거래될 수 있습니다.","rel":"내가격 · 외가격 · 시간가치","sem":"sk","type":"def2term","cat":"s2","semLabel":"ITM·ATM·OTM"},{"t":"외가격","sub":"Out of the money","head":"지금 행사하면 오히려 손해라서 행사하지 않을 옵션 상태는?","hint":"아직 이익이 안 나는 \"바깥\" 상태예요","w":["내가격","등가격","내재가치"],"def":"외가격(OTM)은 행사하면 이익이 없어 권리를 쓰지 않는 상태예요. 내재가치가 0이고 시간가치만 남아 있어 가격이 쌉니다.","ex":"지수 750p에서 행사가 800 콜은 외가격이에요. 지금 행사하면 50p 손해라 아무도 행사하지 않고, 남은 21일의 기대만으로 0.5p 정도에 거래됩니다.","rel":"내가격 · 등가격 · 시간가치","sem":"sk","type":"def2term","cat":"s2","semLabel":"ITM·ATM·OTM"},{"t":"현재가가 행사가보다 높다","sub":"Call ITM","head":"콜옵션이 내가격(ITM)이 되려면 현재가와 행사가가 어떤 관계여야 할까요?","hint":"콜은 \"싸게 살 권리\"예요","w":["현재가가 행사가보다 낮다","현재가와 행사가가 같다","현재가가 0이다"],"def":"콜은 행사가격에 살 수 있는 권리라서, 현재가가 행사가보다 높아야 이익이 나요. 그 차이가 콜의 내재가치가 됩니다.","ex":"지수 355p, 행사가 350 콜이면 내재가치가 5p예요. 반대로 행사가 360 콜은 현재가가 더 낮아 외가격입니다.","rel":"내가격 · 내재가치 · 풋 ITM","sem":"sk","type":"concept","cat":"s2","semLabel":"ITM·ATM·OTM"},{"t":"현재가가 행사가보다 낮다","sub":"Put ITM","head":"풋옵션이 내가격(ITM)이 되려면 현재가와 행사가가 어떤 관계여야 할까요?","hint":"풋은 \"비싸게 팔 권리\"예요","w":["현재가가 행사가보다 높다","현재가와 행사가가 같다","현재가가 행사가의 두 배다"],"def":"풋은 행사가격에 팔 수 있는 권리라서, 현재가가 행사가보다 낮아야 이익이 나요. 그 차이가 풋의 내재가치입니다.","ex":"지수 340p, 행사가 350 풋이면 10p가 내재가치예요. 계약당 250만원어치 실질 가치가 있습니다.","rel":"외가격 · 내재가치 · 콜 ITM","sem":"sk","type":"concept","cat":"s2","semLabel":"ITM·ATM·OTM"},{"t":"내재가치","sub":"Intrinsic value","head":"지금 당장 행사하면 얻을 수 있는 이익 부분을 부르는 말은?","hint":"행사하면 바로 손에 쥐는 이익이에요","w":["시간가치","프리미엄","증거금"],"def":"내재가치는 지금 행사했을 때의 이익이에요. 콜은 (현재가 − 행사가), 풋은 (행사가 − 현재가)로 계산하고, 0보다 작으면 0입니다.","ex":"지수 355p, 행사가 350 콜의 내재가치는 5p(125만원)예요. 프리미엄이 7p라면 나머지 2p는 시간가치입니다.","rel":"시간가치 · 프리미엄 · 내가격","sem":"mo","type":"def2term","cat":"s2","semLabel":"가치구성"},{"t":"시간가치","sub":"Time value","head":"만기까지 남은 시간과 기대 때문에 붙는, 내재가치를 뺀 나머지 값은?","hint":"프리미엄에서 내재가치를 뺀 부분이에요","w":["내재가치","행사가격","베이시스"],"def":"시간가치는 \"앞으로 더 유리해질 수 있다\"는 기대에 대한 값이에요. 프리미엄에서 내재가치를 빼면 남고, 만기가 다가오면 줄어듭니다.","ex":"프리미엄 7p, 내재가치 5p라면 시간가치는 2p(50만원)예요. 만기까지 3일 남으면 이 2p는 하루 0.6p씩 빠르게 녹습니다.","rel":"내재가치 · 세타 · 만기","sem":"mo","type":"def2term","cat":"s2","semLabel":"가치구성"},{"t":"줄어든다","sub":"Time decay","head":"만기가 가까워질수록 옵션의 시간가치는 어떻게 될까요?","hint":"남은 시간이 줄면 기대도 줄어요","w":["늘어난다","변하지 않는다","내재가치가 줄어든다"],"def":"시간가치는 만기가 가까워질수록 줄고, 마지막 날에는 0이 돼요. 그래서 옵션 매수자는 가만히 있어도 매일 값을 잃습니다.","ex":"만기 30일 전 3p이던 시간가치가 만기 3일 전에는 0.8p가 될 수 있어요. 지수가 제자리여도 2.2p(55만원)가 사라집니다.","rel":"세타 · 시간가치 · 만기","sem":"mo","type":"concept","cat":"s2","semLabel":"가치구성"},{"t":"행사가격 + 프리미엄","sub":"Call break-even","head":"콜옵션 매수자의 만기 손익분기점은 어떻게 계산할까요?","hint":"행사가에 낸 프리미엄을 더해야 본전이에요","w":["행사가격 − 프리미엄","행사가격","행사가격 + 2배 프리미엄"],"def":"콜 매수자는 행사가격에 살 수 있지만 프리미엄을 냈어요. 그래서 그 둘을 더한 가격을 넘어야 본전입니다.","ex":"행사가 350 콜을 2p에 사면 352p가 손익분기점이에요. 만기 지수가 352면 이익 2p에서 프리미엄 2p를 빼 본전입니다.","rel":"풋 손익분기 · 프리미엄 · 만기","sem":"ca","type":"calc","cat":"s2","semLabel":"손익계산"},{"t":"행사가격 − 프리미엄","sub":"Put break-even","head":"풋옵션 매수자의 만기 손익분기점은 어떻게 계산할까요?","hint":"행사가에서 프리미엄을 빼야 본전이에요","w":["행사가격 + 프리미엄","행사가격","행사가격 − 2배 프리미엄"],"def":"풋 매수자는 행사가격에 팔 수 있지만 프리미엄을 냈어요. 그래서 행사가에서 프리미엄을 뺀 가격 아래로 내려가야 이익입니다.","ex":"행사가 350 풋을 2p에 사면 348p가 손익분기점이에요. 만기 지수가 348이면 2p 이익에서 프리미엄 2p를 빼 본전입니다.","rel":"콜 손익분기 · 프리미엄 · 만기","sem":"ca","type":"calc","cat":"s2","semLabel":"손익계산"},{"t":"프리미엄 전액","sub":"Max loss (call buy)","head":"콜옵션 매수자의 최대 손실은 얼마일까요?","hint":"권리를 버리면 되니 낸 돈까지만 잃어요","w":["행사가격 전액","무한대","프리미엄의 두 배"],"def":"콜 매수자는 권리를 버릴 수 있어 손실이 낸 프리미엄을 넘지 않아요. 지수가 아무리 폭락해도 이 금액까지만 잃습니다.","ex":"프리미엄 2p(50만원)에 콜 1계약을 샀다면 최대 손실은 50만원이에요. 지수가 100p 빠져도 50만원입니다.","rel":"콜 매도 최대손실 · 프리미엄 · 권리","sem":"ri","type":"calc","cat":"s2","semLabel":"권리·의무"},{"t":"받은 프리미엄","sub":"Max profit (call sell)","head":"콜옵션 매도자가 얻을 수 있는 최대 이익은?","hint":"먼저 받은 보험료가 전부예요","w":["행사가격 전액","무한대","내재가치"],"def":"콜 매도자는 프리미엄을 받고 시작해요. 지수가 행사가 아래로 가면 상대가 권리를 버리므로 받은 프리미엄이 그대로 이익입니다.","ex":"프리미엄 2p(50만원)를 받고 콜을 팔면 최대 이익은 50만원이에요. 지수가 340으로 폭락해도 50만원이 전부입니다.","rel":"콜 매도 최대손실 · 프리미엄 · 옵션 매도자","sem":"ri","type":"calc","cat":"s2","semLabel":"권리·의무"},{"t":"무한대","sub":"Unlimited risk (call sell)","head":"콜옵션 매도자의 이론상 최대 손실은 얼마일까요?","hint":"지수는 위로 끝없이 오를 수 있어요","w":["프리미엄 전액","행사가격","0원"],"def":"콜 매도자는 행사가격에 팔아야 하는데 지수는 위로 한계가 없어요. 그래서 이론상 손실에 상한이 없습니다.","ex":"행사가 350 콜을 2p에 팔았는데 지수가 450이 되면 100p를 물어 줘야 해요. 2,500만원 손실로, 받은 50만원의 50배입니다.","rel":"콜 매수 최대손실 · 증거금 · 마진콜","sem":"ri","type":"concept","cat":"s2","semLabel":"권리·의무"},{"t":"지수가 0이 될 때","sub":"Max profit timing","head":"풋옵션 매수자의 이익은 지수가 어디까지 내려갈 때 가장 커질까요?","hint":"살 수 있는 권리가 아니라 팔 수 있는 권리예요","w":["지수가 행사가격이 될 때","지수가 두 배가 될 때","만기 전날"],"def":"풋 매수자는 행사가격에 팔 수 있어요. 지수가 0에 가까워질수록 행사가격과의 차이가 커져 이익이 최대가 됩니다.","ex":"행사가 350 풋을 2p에 샀다면 지수가 0일 때 348p(8,700만원)가 이익이에요. 지수가 100이어도 248p로 이미 큰 이익입니다.","rel":"풋 매수 최대이익 · 내재가치 · 만기","sem":"ri","type":"concept","cat":"s2","semLabel":"권리·의무"},{"t":"증거금을 내야 한다","sub":"Margin for sellers","head":"옵션 매도자는 프리미엄을 받지만 무엇을 추가로 부담할까요?","hint":"의무를 지는 쪽은 담보를 맡겨야 해요","w":["아무것도 부담하지 않는다","행사가격 전액을 낸다","만기까지 거래할 수 없다"],"def":"옵션 매도자는 의무를 지므로 증거금을 내야 해요. 기초자산이 불리하게 움직이면 증거금이 늘고 추가 입금을 요구받습니다.","ex":"콜 1계약을 팔면 수십만~수백만원의 증거금이 필요해요. 지수가 급등하면 증거금이 하루 만에 두 배로 뛰기도 합니다.","rel":"옵션 매수자 · 증거금 · 마진콜","sem":"ri","type":"concept","cat":"s2","semLabel":"권리·의무"},{"t":"프리미엄만 낸다","sub":"Premium only","head":"옵션 매수자가 거래할 때 내는 돈은 무엇뿐일까요?","hint":"권리를 사는 값만 내면 돼요","w":["행사가격 전액","증거금","기초자산 가격"],"def":"옵션 매수자는 프리미엄만 내면 되고 증거금은 필요 없어요. 대신 권리를 쓰지 않으면 낸 프리미엄을 잃습니다.","ex":"지수 350p 콜 1계약 프리미엄이 2p라면 50만원만 있으면 살 수 있어요. 8,750만원어치 권리를 50만원으로 사는 셈입니다.","rel":"프리미엄 · 옵션 매도자 · 레버리지","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"250,000원","sub":"Contract unit","head":"코스피200 옵션 1계약의 프리미엄 1포인트는 얼마일까요?","hint":"선물과 같은 승수를 써요","w":["25,000원","2,500원","500,000원"],"def":"코스피200 옵션의 승수도 250,000원이에요. 프리미엄 1p가 계약 1개에서 25만원이 됩니다.","ex":"프리미엄 2.35p인 옵션 1계약은 587,500원이에요. 0.05p(1틱)만 움직여도 12,500원이 오갑니다.","rel":"승수 · 프리미엄 · 틱가치","sem":"pr","type":"def2term","cat":"s2","semLabel":"프리미엄"},{"t":"4계약","sub":"Contracts with 1M","head":"프리미엄이 1p인 옵션을 100만원으로 사려면 최대 몇 계약일까요?","hint":"1계약에 25만원이에요","w":["1계약","2계약","40계약"],"def":"1계약 프리미엄은 1 × 250,000 = 25만원이에요. 100만원 ÷ 25만원 = 4계약입니다.","ex":"4계약을 사면 지수가 1p만 올라도 100만원, 2p 오르면 200만원 이익이에요. 반대로 1p 내리면 낸 100만원이 모두 사라질 수 있습니다.","rel":"프리미엄 · 승수 · 레버리지","sem":"ca","type":"calc","cat":"s2","semLabel":"손익계산"},{"t":"75만원","sub":"Call P&L","head":"행사가 350 콜을 2p에 사서 만기 지수가 355가 됐습니다. 1계약 손익은?","hint":"내재가치 5p에서 낸 2p를 빼세요","w":["25만원","125만원","250만원"],"def":"만기 손익은 (지수 − 행사가 − 프리미엄) × 승수예요. (355 − 350 − 2) × 250,000 = 750,000원 이익입니다.","ex":"5p 이익에서 프리미엄 2p를 빼 3p가 남았어요. 3 × 25만원 = 75만원으로, 낸 50만원의 1.5배를 벌었습니다.","rel":"콜 손익분기 · 내재가치 · 승수","sem":"ca","type":"calc","cat":"s2","semLabel":"손익계산"},{"t":"100만원","sub":"Put P&L","head":"행사가 350 풋을 3p에 사서 만기 지수가 343이 됐습니다. 1계약 손익은?","hint":"(350 − 343 − 3) × 25만원이에요","w":["50만원","150만원","175만원"],"def":"풋 만기 손익은 (행사가 − 지수 − 프리미엄) × 승수예요. (350 − 343 − 3) × 250,000 = 1,000,000원 이익입니다.","ex":"지수가 7p 빠져 7p 이익, 프리미엄 3p를 빼 4p가 남았어요. 4 × 25만원 = 100만원입니다.","rel":"풋 손익분기 · 프리미엄 · 승수","sem":"ca","type":"calc","cat":"s2","semLabel":"손익계산"},{"t":"50만원 손실","sub":"Call sell P&L","head":"행사가 350 콜을 2p에 팔았는데 만기 지수가 354가 됐습니다. 매도자 1계약 손익은?","hint":"받은 2p에서 4p 손실을 빼세요","w":["50만원 이익","100만원 이익","본전"],"def":"콜 매도자 손익은 (프리미엄 + 행사가 − 지수) × 승수예요. (2 + 350 − 354) × 250,000 = −500,000원입니다.","ex":"받은 50만원으로 4p(100만원) 손실을 메우고 50만원을 더 물었어요. 매도는 이익이 제한되고 손실이 열려 있다는 걸 보여 줍니다.","rel":"콜 매도 최대손실 · 프리미엄 · 손익계산","sem":"ca","type":"calc","cat":"s2","semLabel":"손익계산"},{"t":"매주 목요일","sub":"Weekly options","head":"코스피200 위클리 옵션은 언제 만기가 돌아올까요?","hint":"매주 같은 요일에 끝나요","w":["매월 두 번째 목요일","매주 금요일","매분기 마지막 날"],"def":"코스피200 위클리 옵션은 매주 목요일에 만기가 돌아와요. 만기가 짧아 프리미엄이 싸고 시간가치가 매우 빠르게 줄어듭니다.","ex":"월요일에 산 위클리 콜은 목요일 만기예요. 사흘 만에 결판이 나므로 지수가 크게 움직이지 않으면 프리미엄이 거의 0이 됩니다.","rel":"만기 · 시간가치 · 월물 옵션","sem":"mt","type":"concept","cat":"s2","semLabel":"만기·결제"},{"t":"자동으로 행사된다","sub":"Auto exercise","head":"국내 지수옵션 만기일에 내가격(ITM) 옵션은 어떻게 될까요?","hint":"따로 신청하지 않아도 이익은 챙겨 줘요","w":["아무 일 없이 사라진다","외가격이 된다","선물로 바뀐다"],"def":"만기일에 내가격 옵션은 별도 신청 없이 자동으로 행사되어 차액이 현금으로 정산돼요. 외가격 옵션은 자동으로 버려집니다.","ex":"행사가 350 콜을 2p에 사 두고 만기 지수가 353이면, 3p를 자동으로 받아 프리미엄 2p를 뺀 1p(25만원)가 들어와요.","rel":"현금결제 · 행사 · 내가격","sem":"mt","type":"concept","cat":"s2","semLabel":"만기·결제"},{"t":"현금결제","sub":"Cash settlement","head":"코스피200 옵션 만기에 주식을 주고받지 않고 차액만 돈으로 정산하는 방식은?","hint":"지수는 실제로 건네줄 수 없어요","w":["실물인수도","롤오버","중도청산"],"def":"코스피200 옵션은 지수를 실제로 넘길 수 없어 현금결제로 끝나요. 만기 지수와 행사가의 차이만 돈으로 주고받습니다.","ex":"행사가 350 콜, 만기 지수 353이면 3p × 25만원 = 75만원을 현금으로 받아요. 주식 200종목을 받는 게 아닙니다.","rel":"자동행사 · 실물인수도 · 만기","sem":"mt","type":"concept","cat":"s2","semLabel":"만기·결제"},{"t":"개별주식 옵션","sub":"Single stock option","head":"만기에 실제 주식을 주고받는, 해외에 많은 옵션 종류는?","hint":"지수가 아니라 한 종목이 대상이에요","w":["지수옵션","위클리 옵션","통화옵션"],"def":"개별주식 옵션은 한 회사 주식을 기초자산으로 해요. 미국에서는 만기에 실제 주식을 주고받는 실물인수도로 결제됩니다.","ex":"애플 주식 100주를 200달러에 살 수 있는 콜을 행사하면 100주를 실제로 받아요. 100주 × 200달러 = 2만 달러를 내고 사는 겁니다.","rel":"현금결제 · 실물인수도 · 기초자산","sem":"mt","type":"concept","cat":"s2","semLabel":"만기·결제"},{"t":"내재가치 + 시간가치","sub":"Premium components","head":"옵션 프리미엄은 무엇과 무엇으로 이뤄질까요?","hint":"지금의 이익 + 미래의 기대예요","w":["행사가격 + 증거금","내재가치 + 증거금","시간가치 + 승수"],"def":"프리미엄 = 내재가치 + 시간가치예요. 내재가치는 지금 행사하면 얻는 이익, 시간가치는 만기까지의 기대에 대한 값입니다.","ex":"프리미엄 7p, 내재가치 5p면 시간가치는 2p예요. 만기가 다가오면 5p는 남고 2p만 0을 향해 줄어듭니다.","rel":"내재가치 · 시간가치 · 프리미엄","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"0원","sub":"OTM intrinsic","head":"외가격(OTM) 옵션의 내재가치는 얼마일까요?","hint":"지금 행사하면 손해라 아무도 행사하지 않아요","w":["프리미엄만큼","행사가격만큼","음수"],"def":"외가격 옵션은 지금 행사하면 이익이 없으므로 내재가치가 0이에요. 프리미엄 전액이 시간가치입니다.","ex":"지수 750p에서 행사가 800 콜의 내재가치는 0이에요. 프리미엄 0.5p는 전부 \"만기까지 50p가 오를지도\" 하는 기대값입니다.","rel":"내재가치 · 외가격 · 시간가치","sem":"mo","type":"calc","cat":"s2","semLabel":"가치구성"},{"t":"만기 때 이익이 날 가능성이 낮아서","sub":"Why OTM is cheap","head":"외가격 옵션이 내가격 옵션보다 싼 이유는?","hint":"이익이 날 확률이 낮을수록 값이 싸요","w":["만기가 더 길어서","승수가 더 작아서","증거금이 더 많아서"],"def":"외가격 옵션은 만기까지 그만큼 움직여야 이익이 나므로 확률이 낮아요. 확률이 낮은 권리는 값이 싸고, 대신 맞으면 수익률이 큽니다.","ex":"지수 750p에서 행사가 800 콜은 21일 안에 6.7%가 올라야 본전이에요. 그래서 0.5p로 싸지만, 지수가 810이 되면 10p가 되어 20배가 됩니다.","rel":"외가격 · 프리미엄 · 레버리지","sem":"mo","type":"concept","cat":"s2","semLabel":"가치구성"},{"t":"콜 − 풋 = 선물 − 행사가","sub":"Put-call parity","head":"같은 행사가·만기의 콜과 풋 가격 사이에 성립하는 관계식은?","hint":"콜과 풋의 차이가 선물과 행사가의 차이와 같아요","w":["콜 + 풋 = 선물 + 행사가","콜 = 풋","콜 × 풋 = 선물"],"def":"풋콜패리티는 콜 가격에서 풋 가격을 뺀 값이 선물가격에서 행사가격을 뺀 값과 같다는 법칙이에요. 어긋나면 차익거래가 생깁니다.","ex":"선물 352p, 행사가 350, 콜 4p라면 패리티상 풋은 4 − (352 − 350) = 2p여야 해요. 풋이 3p에 거래되면 1p(25만원) 차익 기회입니다.","rel":"합성 선물 · 차익거래 · 프리미엄","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"합성 롱 선물","sub":"Synthetic long","head":"콜옵션 매수와 풋옵션 매도를 같은 행사가로 하면 어떤 포지션과 같아질까요?","hint":"위로 오르면 이익, 아래로 내리면 손실이에요","w":["합성 숏 선물","무위험 포지션","롱 스트래들"],"def":"콜 매수 + 풋 매도는 선물 매수와 손익 모양이 같아요. 그래서 합성 롱 선물이라고 부르고, 반대는 합성 숏 선물입니다.","ex":"선물 350p에서 콜 3p 매수, 풋 1p 매도를 하면 순 2p를 내요. 만기 355면 콜 5p 이익, 풋 0 손실로 3p가 남아 선물 2계약과 비슷합니다.","rel":"풋콜패리티 · 합성 숏 선물 · 스트래들","sem":"sy","type":"concept","cat":"s2","semLabel":"합성·차익"},{"t":"유럽형","sub":"European style","head":"만기일에만 행사할 수 있는 옵션 방식은?","hint":"유럽은 약속한 날에만 문을 열어요","w":["미국형","아메리칸형","아시아형"],"def":"유럽형 옵션은 만기일에만 행사할 수 있어요. 코스피200 옵션과 대부분의 지수옵션이 유럽형입니다.","ex":"코스피200 콜을 11월에 사도 12월 10일 만기 전에는 행사할 수 없어요. 대신 그 전에 시장에서 팔아 차익을 낼 수 있습니다.","rel":"미국형 · 행사 · 만기","sem":"mt","type":"concept","cat":"s2","semLabel":"만기·결제"},{"t":"미국형","sub":"American style","head":"만기 전 언제든 행사할 수 있는 옵션 방식은?","hint":"미국은 아무 때나 문을 두드릴 수 있어요","w":["유럽형","아시아형","버뮤다형"],"def":"미국형 옵션은 만기 전 어느 영업일에도 행사할 수 있어요. 미국 개별주식 옵션이 대표적이고, 유럽형보다 가치가 조금 더 큽니다.","ex":"애플 주식 콜을 사면 배당락 전에 행사해 주식을 받을 수도 있어요. 그만큼 선택권이 많아 프리미엄이 비싸집니다.","rel":"유럽형 · 개별주식 옵션 · 행사","sem":"mt","type":"concept","cat":"s2","semLabel":"만기·결제"},{"t":"의무를 지기 때문","sub":"Seller risk","head":"옵션 매도자가 이익은 제한되고 손실은 커지는 이유는?","hint":"프리미엄은 확정, 책임은 열려 있어요","w":["프리미엄을 안 받아서","만기가 더 길어서","승수가 더 커서"],"def":"옵션 매도자는 프리미엄만 확정으로 받고, 매수자가 행사하면 응해야 하는 의무를 져요. 그래서 손실이 이익보다 훨씬 커질 수 있습니다.","ex":"콜을 2p(50만원)에 팔면 이익은 최대 50만원이에요. 그런데 지수가 50p 오르면 1,250만원을 물어 줘야 해요.","rel":"옵션 매도자 · 증거금 · 무한대","sem":"ri","type":"concept","cat":"s2","semLabel":"권리·의무"},{"t":"증거금이 늘어난다","sub":"Margin change","head":"콜옵션을 판 뒤 기초자산이 급등하면 매도자의 증거금은?","hint":"불리하게 움직이면 담보를 더 요구해요","w":["줄어든다","그대로다","0이 된다"],"def":"기초자산이 오르면 콜 매도자의 잠재 손실이 커져요. 거래소는 그만큼 증거금을 올리고, 부족하면 추가 입금(마진콜)을 요구합니다.","ex":"지수 750p에서 콜 1계약을 팔았는데 지수가 8% 오르면 증거금이 두 배 가까이 뛸 수 있어요. 계좌에 여유가 없으면 강제청산됩니다.","rel":"증거금 · 마진콜 · 강제청산","sem":"ri","type":"concept","cat":"s2","semLabel":"권리·의무"},{"t":"0.05포인트","sub":"Option tick","head":"코스피200 옵션의 최소 호가 단위(틱)는?","hint":"선물과 같은 0.05p예요","w":["0.01포인트","0.5포인트","1포인트"],"def":"코스피200 옵션 가격은 0.05p 단위로 움직여요. 0.05p는 계약 1개에서 12,500원에 해당합니다.","ex":"프리미엄이 2.30에서 2.35로 한 칸 움직이면 1계약에 12,500원이 오가요. 2.33 같은 가격에는 주문을 낼 수 없습니다.","rel":"틱 · 프리미엄 · 승수","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"매수콜·매도콜·매수풋·매도풋","sub":"Four positions","head":"옵션의 기본 포지션 네 가지를 모두 나열한 것은?","hint":"사는 쪽·파는 쪽 × 콜·풋이에요","w":["롱선물·숏선물·롱옵션·숏옵션","매수콜·매수풋·스프레드·스트래들","내가격·등가격·외가격·딥아이티엠"],"def":"옵션은 콜/풋과 매수/매도를 조합해 네 가지 기본 포지션이 있어요. 손익 모양이 각각 다릅니다.","ex":"같은 콜옵션도 사면 손실은 50만원으로 제한되고, 팔면 이익은 50만원으로 제한돼요. 방향이 같아도 포지션에 따라 위험이 정반대입니다.","rel":"콜옵션 · 풋옵션 · 옵션 매도자","sem":"ba","type":"concept","cat":"s2","semLabel":"기본개념"},{"t":"기초자산이 오르면","sub":"Call rises","head":"콜옵션 가격이 오르는 가장 직접적인 상황은?","hint":"콜은 오르는 시장에서 값이 커져요","w":["기초자산이 내리면","만기가 지나면","금리가 0이 되면"],"def":"콜은 살 수 있는 권리라서 기초자산이 오르면 그 권리가 더 값져요. 행사가격이 낮을수록, 만기가 길수록 더 크게 오릅니다.","ex":"지수 750p에서 행사가 750 콜이 8p였는데 지수가 760이 되면 15p까지 오를 수 있어요. 7p × 25만원 = 175만원 차이입니다.","rel":"풋옵션 · 내가격 · 변동성","sem":"ba","type":"concept","cat":"s2","semLabel":"기본개념"},{"t":"기초자산이 내리면","sub":"Put rises","head":"풋옵션 가격이 오르는 가장 직접적인 상황은?","hint":"풋은 내리는 시장에서 값이 커져요","w":["기초자산이 오르면","만기가 멀어지면","배당이 늘면"],"def":"풋은 팔 수 있는 권리라서 기초자산이 내리면 값이 커져요. 지수가 급락할 때 풋은 몇 배로 뛰기도 합니다.","ex":"지수 750p에서 행사가 750 풋이 8p였는데 지수가 735로 빠지면 18p가 될 수 있어요. 10p × 25만원 = 250만원 이익입니다.","rel":"콜옵션 · 외가격 · 변동성","sem":"ba","type":"concept","cat":"s2","semLabel":"기본개념"},{"t":"모두 올라간다","sub":"Volatility effect","head":"변동성이 커지면 콜과 풋 가격은 어떻게 될까요?","hint":"크게 움직일수록 양쪽 다 쓸모가 커져요","w":["콜만 오른다","풋만 오른다","둘 다 내린다"],"def":"변동성이 커지면 위로 크게 오를 가능성과 아래로 크게 내릴 가능성이 함께 커져요. 그래서 콜과 풋 가격이 같이 오릅니다.","ex":"지수가 제자리여도 변동성이 20%에서 40%로 두 배가 되면 등가격 콜·풋 프리미엄이 거의 두 배가 될 수 있어요. 방향이 아니라 \"흔들림\"에 값이 붙습니다.","rel":"내재변동성 · 베가 · IV 크러시","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"만기 전 청산","sub":"Close before expiry","head":"옵션을 만기까지 들고 가지 않고 시장에서 되팔아 차익을 얻는 것은?","hint":"프리미엄이 올랐으면 팔면 돼요","w":["행사","롤오버","자동결제"],"def":"만기 전 청산은 산 옵션을 시장에서 더 높은 프리미엄에 팔아 차익을 확정하는 거예요. 행사하지 않아도 되고 현금이 바로 들어옵니다.","ex":"콜을 2p에 사고 일주일 뒤 5p에 팔면 3p × 25만원 = 75만원이 확정돼요. 만기까지 기다릴 필요가 없습니다.","rel":"프리미엄 · 행사 · 청산","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"사라진다","sub":"After exercise","head":"만기일에 행사된 옵션의 권리는 그 뒤 어떻게 될까요?","hint":"권리를 썼으니 남는 게 없어요","w":["계속 남아 있다","선물로 전환된다","다음 달로 이월된다"],"def":"옵션은 행사되면 권리가 소멸해요. 행사익은 현금으로 정산되고 계약은 사라지며, 다음 만기의 새 옵션을 따로 사야 합니다.","ex":"행사가 350 콜을 행사해 75만원을 받으면 그 옵션은 끝이에요. 지수가 더 올라도 추가 이익은 없습니다.","rel":"행사 · 자동행사 · 만기","sem":"mt","type":"concept","cat":"s2","semLabel":"만기·결제"},{"t":"없다","sub":"No obligation","head":"옵션 매수자가 지는 의무는 무엇일까요?","hint":"사는 쪽은 권리만 가져요","w":["매일 증거금을 내야 한다","행사해야 한다","만기까지 팔 수 없다"],"def":"옵션 매수자는 권리만 있고 의무가 없어요. 불리하면 프리미엄을 포기하고 버리면 되므로 추가 손실이 생기지 않습니다.","ex":"콜을 50만원에 사고 지수가 폭락해도 \"안 살게요\" 하면 끝이에요. 증거금 요구도, 추가 납부도 없습니다.","rel":"옵션 매도자 · 프리미엄 전액 · 권리","sem":"ri","type":"concept","cat":"s2","semLabel":"권리·의무"},{"t":"375,000원","sub":"Premium value","head":"프리미엄 1.50p인 코스피200 옵션 1계약의 금액은?","hint":"1.50 × 250,000원이에요","w":["37,500원","150,000원","3,750,000원"],"def":"프리미엄 × 승수로 계산해요. 1.50 × 250,000 = 375,000원입니다.","ex":"1.50p짜리 옵션 2계약은 75만원이에요. 지수가 1p만 올라 2.50p가 되면 2계약으로 50만원 이익입니다.","rel":"프리미엄 · 승수 · 계약수","sem":"pr","type":"calc","cat":"s2","semLabel":"프리미엄"},{"t":"매도자에게 유리","sub":"Time decay favors","head":"시간이 흐르며 시간가치가 줄어드는 것은 누구에게 유리할까요?","hint":"시간은 프리미엄을 녹여요","w":["매수자에게 유리","양쪽 모두에게 유리","아무에게도 영향 없다"],"def":"시간가치가 줄면 옵션 가격이 내려가요. 그래서 옵션을 산 매수자는 불리하고, 판 매도자는 유리합니다.","ex":"매수자는 2p(50만원)를 냈는데 3일 뒤 프리미엄이 1p로 줄면 평가손실 25만원이에요. 매도자는 같은 금액을 평가이익으로 갖습니다.","rel":"시간가치 · 세타 · 옵션 매도자","sem":"mo","type":"concept","cat":"s2","semLabel":"가치구성"},{"t":"프리미엄이 줄어든다","sub":"Time decay for buyers","head":"지수가 제자리에 있어도 옵션 매수자의 프리미엄은 어떻게 될까요?","hint":"가만히 있어도 매일 값이 녹아요","w":["그대로 유지된다","매일 올라간다","내재가치가 커진다"],"def":"시간이 흐르면 시간가치가 줄어 프리미엄이 내려가요. 방향이 맞아도 시간이 오래 걸리면 프리미엄을 다 잃을 수 있습니다.","ex":"지수 750p에 21일 남은 등가격 콜이 8p예요. 지수가 750에 머문 채 일주일이 지나면 5.5p까지 내려갈 수 있어요. 62만 5,000원 손실입니다.","rel":"시간가치 · 세타 · 손익분기","sem":"mo","type":"concept","cat":"s2","semLabel":"가치구성"},{"t":"싸다","sub":"Higher strike call","head":"같은 만기의 콜옵션에서 행사가격이 높을수록 프리미엄은?","hint":"높은 가격에 살 권리는 쓸모가 적어요","w":["비싸다","항상 같다","음수가 된다"],"def":"행사가격이 높은 콜은 더 비싼 값에 사는 권리라서 쓸모가 적어 프리미엄이 싸요. 낮은 행사가 콜이 더 비쌉니다.","ex":"지수 750p에서 행사가 750 콜이 8p라면, 행사가 780 콜은 1p도 안 될 수 있어요. 30p나 더 비싸게 사는 권리라서 값이 확 싸집니다.","rel":"행사가격 · 내가격 · 프리미엄","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"비싸다","sub":"Lower strike call","head":"같은 만기의 콜옵션에서 행사가격이 낮을수록 프리미엄은?","hint":"싸게 살 권리는 더 값져요","w":["싸다","항상 같다","0이 된다"],"def":"행사가격이 낮은 콜은 더 싸게 살 권리라서 내재가치가 커요. 그래서 프리미엄이 더 비쌉니다.","ex":"지수 750p에서 행사가 720 콜은 이미 30p의 내재가치가 있어 32p예요. 행사가 750 콜(8p)보다 네 배 비쌉니다.","rel":"행사가격 · 내재가치 · 콜옵션","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"작아진다","sub":"Time value vs distance","head":"행사가격이 현재가에서 멀어질수록 그 옵션의 시간가치는?","hint":"아주 먼 행사가는 기대도 작아져요","w":["커진다","변하지 않는다","내재가치가 커진다"],"def":"행사가격이 현재가에서 멀어질수록 만기까지 이익이 날 확률이 낮아져 시간가치가 작아져요. 등가격에서 시간가치가 가장 큽니다.","ex":"지수 750p, 만기 21일일 때 등가격 콜의 시간가치는 8p예요. 행사가 800 콜은 0.5p, 850 콜은 0.05p로 거의 사라집니다.","rel":"시간가치 · 등가격 · 외가격","sem":"mo","type":"concept","cat":"s2","semLabel":"가치구성"},{"t":"거의 0이 된다","sub":"OTM near expiry","head":"만기가 하루 남은 외가격 옵션의 가격은 어떻게 될까요?","hint":"하루 만에 이익이 날 가능성이 거의 없어요","w":["크게 오른다","내재가치만큼 남는다","행사가격이 된다"],"def":"만기가 임박한 외가격 옵션은 이익이 날 시간이 거의 없어 가격이 0에 가까워져요. 이때 산 매수자는 프리미엄 전액을 잃습니다.","ex":"지수 750p에서 행사가 780 콜의 만기 전날 가격은 0.05p(12,500원) 수준이에요. 하루 만에 30p(4%)가 오를 확률이 거의 없기 때문입니다.","rel":"시간가치 · 외가격 · 만기","sem":"mo","type":"concept","cat":"s2","semLabel":"가치구성"},{"t":"보험","sub":"Put as insurance","head":"주식을 들고 있는 사람이 풋옵션을 사는 것을 일상에 비유하면?","hint":"사고가 나면 보상받는 계약이에요","w":["은행 예금","복권","마이너스 통장"],"def":"풋옵션은 주식이 떨어질 때 손실을 막아 주는 보험이에요. 프리미엄은 보험료, 행사가격은 보상 기준선입니다.","ex":"주식 1억원어치를 들고 행사가 350 풋을 100만원에 사면, 지수가 20% 빠져도 350 아래 손실은 보상받아요. 보험료 100만원으로 2,000만원 손실을 막는 셈입니다.","rel":"프로텍티브 풋 · 헤지 · 프리미엄","sem":"ba","type":"concept","cat":"s2","semLabel":"기본개념"},{"t":"손실이 프리미엄으로 제한된다","sub":"Option vs futures","head":"선물 매수와 옵션 매수의 가장 큰 차이는?","hint":"옵션은 버릴 수 있지만 선물은 못 버려요","w":["옵션은 이익이 제한된다","선물은 증거금이 없다","옵션은 만기가 없다"],"def":"선물은 가격이 내리면 손실이 계속 커지지만, 옵션 매수자는 권리를 버리면 손실이 프리미엄에서 끝나요. 대신 옵션은 프리미엄을 미리 냅니다.","ex":"지수 750p 선물 1계약은 10% 하락에 1,875만원 손실이에요. 같은 방향을 콜 8p(200만원)로 샀다면 최대 손실은 200만원입니다.","rel":"프리미엄 전액 · 레버리지 · 선물","sem":"ba","type":"concept","cat":"s2","semLabel":"기본개념"},{"t":"즉시 계좌에 들어온다","sub":"Premium received","head":"옵션을 팔면 받은 프리미엄은 언제 계좌에 들어올까요?","hint":"체결되면 바로 받아요","w":["만기일에 들어온다","다음 달에 들어온다","들어오지 않는다"],"def":"옵션을 팔면 프리미엄이 체결 즉시 계좌에 들어와요. 대신 의무를 진 대가로 증거금이 함께 묶입니다.","ex":"콜 1계약을 팔아 50만원을 받으면 그날 계좌에 50만원이 늘어요. 하지만 100만원의 증거금이 함께 잡혀 실제로 쓸 수 있는 돈은 그만큼 줄어듭니다.","rel":"증거금 · 옵션 매도자 · 프리미엄","sem":"pr","type":"concept","cat":"s2","semLabel":"프리미엄"},{"t":"델타","sub":"Delta","head":"기초자산이 1포인트 움직일 때 옵션 가격이 얼마나 움직이는지를 나타내는 그릭스는?","hint":"속도계예요. 얼마나 따라가는지 보여 줘요","w":["감마","세타","베가"],"def":"델타는 기초자산 1포인트 변화에 대한 옵션 가격의 변화량이에요. 콜은 0~1, 풋은 −1~0 사이의 값을 갖습니다.","ex":"델타가 0.6인 콜은 지수가 1p 오르면 프리미엄이 0.6p 올라요. 25만원을 곱하면 계약당 15만원이 움직입니다.","rel":"감마 · 세타 · 베가","sem":"de","type":"def2term","cat":"s3","semLabel":"델타"},{"t":"0에서 1 사이","sub":"Call delta range","head":"콜옵션 델타의 값 범위는?","hint":"콜은 지수가 오르면 오르니 플러스예요","w":["−1에서 0 사이","0에서 100 사이","−1에서 1 사이"],"def":"콜 델타는 0에서 1 사이예요. 아주 깊은 내가격은 1에 가깝고, 아주 먼 외가격은 0에 가깝습니다.","ex":"깊은 내가격 콜은 델타 0.95라 지수 1p에 0.95p 움직여 거의 선물과 같아요. 먼 외가격 콜은 델타 0.05라 거의 반응하지 않습니다.","rel":"풋 델타 · 등가격 · 내가격","sem":"de","type":"concept","cat":"s3","semLabel":"델타"},{"t":"−1에서 0 사이","sub":"Put delta range","head":"풋옵션 델타의 값 범위는?","hint":"풋은 지수가 오르면 내려서 마이너스예요","w":["0에서 1 사이","−100에서 0 사이","0에서 0.5 사이"],"def":"풋 델타는 −1에서 0 사이예요. 지수가 오르면 풋 가격이 내려가기 때문입니다. 깊은 내가격 풋은 −1에 가깝습니다.","ex":"델타 −0.4인 풋은 지수가 1p 오르면 프리미엄이 0.4p 내려요. 지수가 내리면 그만큼 오릅니다.","rel":"콜 델타 · 내가격 · 감마","sem":"de","type":"concept","cat":"s3","semLabel":"델타"},{"t":"약 0.5","sub":"ATM delta","head":"등가격(ATM) 옵션의 델타는 대략 얼마일까요?","hint":"오를지 내릴지 반반이라 절반이에요","w":["약 0","약 1","약 2"],"def":"등가격 옵션은 오를 가능성과 내릴 가능성이 비슷해 델타가 약 0.5예요. 콜은 +0.5, 풋은 −0.5 근처입니다.","ex":"지수 750p 등가격 콜의 델타가 0.5라면, 지수가 1p 오를 때 프리미엄이 약 0.5p(12만 5,000원) 오릅니다.","rel":"델타 · 등가격 · 내가격","sem":"de","type":"concept","cat":"s3","semLabel":"델타"},{"t":"프리미엄이 0.6p 오른다","sub":"Delta example","head":"델타 0.6인 콜을 1계약 보유 중 지수가 1p 올랐습니다. 프리미엄은?","hint":"1p × 0.6이에요","w":["프리미엄이 0.6p 내린다","프리미엄이 6p 오른다","변화 없다"],"def":"프리미엄 변화 = 델타 × 기초자산 변화예요. 0.6 × 1p = 0.6p 상승합니다.","ex":"0.6p는 계약당 15만원이에요. 지수가 5p 오르면 약 3p(75만원)가 됩니다. 델타는 움직이면서 조금씩 달라진다는 점도 기억하세요.","rel":"델타 · 감마 · 손익계산","sem":"ca","type":"calc","cat":"s3","semLabel":"손익계산"},{"t":"0.6계약어치 선물","sub":"Delta equivalent","head":"델타 0.6인 콜 1계약은 선물로 환산하면 얼마어치일까요?","hint":"계약 1개 × 델타만큼 선물을 들고 있는 셈이에요","w":["1계약어치 선물","6계약어치 선물","0.06계약어치 선물"],"def":"델타는 옵션을 선물 몇 계약어치로 볼 수 있는지 알려 줘요. 델타 0.6 콜 1계약은 선물 0.6계약과 비슷하게 움직입니다.","ex":"델타 0.6 콜 10계약은 선물 6계약어치예요. 지수가 1p 오르면 6 × 25만원 = 150만원 이익이 납니다.","rel":"델타 · 합성 선물 · 헤지","sem":"de","type":"concept","cat":"s3","semLabel":"델타"},{"t":"감마","sub":"Gamma","head":"델타가 얼마나 빠르게 변하는지를 나타내는 그릭스는?","hint":"속도의 변화, 가속도계예요","w":["델타","세타","베가"],"def":"감마는 기초자산 1p 변화에 델타가 얼마나 변하는지예요. 델타의 변화율이라서 가속도라고 부릅니다.","ex":"델타 0.5, 감마 0.05인 콜은 지수가 1p 오르면 델타가 0.55로 커져요. 다음 1p에서는 0.55p씩 움직입니다.","rel":"델타 · 감마 스캘핑 · 등가격","sem":"ga","type":"def2term","cat":"s3","semLabel":"감마"},{"t":"등가격 근처","sub":"Gamma peaks","head":"감마가 가장 큰 구간은 어디일까요?","hint":"델타가 0.5에서 급하게 바뀌는 곳이에요","w":["깊은 내가격","깊은 외가격","만기 1년 전"],"def":"감마는 등가격 근처에서 가장 커요. 지수가 조금만 움직여도 델타가 확 바뀌기 때문입니다.","ex":"등가격 콜의 감마가 0.07이면 지수 2p에 델타가 0.14나 변해요. 깊은 외가격 옵션의 감마는 거의 0입니다.","rel":"감마 · 델타 · 등가격","sem":"ga","type":"concept","cat":"s3","semLabel":"감마"},{"t":"델타를 다시 맞추는 것","sub":"Gamma hedging","head":"감마 때문에 달라진 델타를 원래 수준으로 되돌리는 작업은?","hint":"주식이나 선물을 사고팔아 균형을 다시 맞춰요","w":["세타 헤지","베가 헤지","롤오버"],"def":"감마 헤지는 지수가 움직여 델타가 변했을 때, 선물을 사거나 팔아 델타를 다시 중립으로 맞추는 거예요. 리밸런싱이라고도 합니다.","ex":"델타 0.5 콜 10계약(선물 5계약어치)인데 지수가 올라 델타가 0.6이 되면, 선물 1계약을 더 사서 6계약어치로 맞춰요.","rel":"감마 · 델타 중립 · 감마 스캘핑","sem":"ga","type":"concept","cat":"s3","semLabel":"감마"},{"t":"세타","sub":"Theta","head":"하루가 지날 때 옵션 프리미엄이 얼마나 줄어드는지를 나타내는 그릭스는?","hint":"시간이 지나며 녹는 값을 보여 줘요","w":["델타","감마","베가"],"def":"세타는 시간 경과에 따른 프리미엄 감소량이에요. 보통 하루 기준으로 표시하고, 옵션 매수자에게는 비용입니다.","ex":"세타가 0.8p인 옵션은 하루 뒤 0.8p(20만원)가 줄어요. 지수가 제자리여도 매일 이만큼 잃습니다.","rel":"시간가치 · 베가 · 옵션 매도자","sem":"th","type":"def2term","cat":"s3","semLabel":"세타"},{"t":"옵션 매수자에게 불리하다","sub":"Theta sign","head":"세타는 누구에게 불리할까요?","hint":"시간은 옵션을 사 둔 사람을 갉아먹어요","w":["옵션 매도자에게 불리하다","양쪽 모두에게 불리하다","아무에게도 영향 없다"],"def":"시간이 흐르면 옵션 가격이 내려가므로 매수자는 불리하고 매도자는 유리해요. 세타는 매수자에게 마이너스, 매도자에게 플러스입니다.","ex":"세타 0.8p 옵션을 10계약 사 두면 하루에 0.8 × 25만원 × 10 = 200만원이 사라져요. 반대로 팔아 두면 하루 200만원이 쌓입니다.","rel":"세타 · 시간가치 · 옵션 매도자","sem":"th","type":"concept","cat":"s3","semLabel":"세타"},{"t":"사흘 치가 한꺼번에 빠진다","sub":"Weekend theta","head":"금요일 장 마감 후 월요일 개장까지 옵션의 시간가치는 어떻게 될까요?","hint":"주말에도 시간은 흘러요","w":["변하지 않는다","하루 치만 빠진다","오히려 늘어난다"],"def":"주말에는 거래가 없지만 시간은 흘러요. 그래서 월요일 아침에는 금·토·일 사흘 치 시간가치가 한꺼번에 빠져 있습니다.","ex":"세타 0.5p인 옵션을 금요일 종가에 사 두면 월요일 아침에 1.5p(37만 5,000원)가 먼저 빠진 상태로 시작해요.","rel":"세타 · 시간가치 · 주말 갭","sem":"th","type":"concept","cat":"s3","semLabel":"세타"},{"t":"세타가 급격히 커진다","sub":"Theta acceleration","head":"만기가 가까워질수록 세타는 어떻게 될까요?","hint":"마지막 며칠에 시간가치가 빠르게 사라져요","w":["작아진다","0이 된다","음수가 된다"],"def":"만기가 가까울수록 시간가치가 빠르게 줄어 세타가 급격히 커져요. 만기 당일에는 남은 시간가치가 거의 0이 됩니다.","ex":"만기 30일 전 세타가 0.3p이던 옵션이 만기 3일 전에는 2p까지 커져요. 하루에 50만원씩 사라지는 셈입니다.","rel":"세타 · 시간가치 · 만기","sem":"th","type":"concept","cat":"s3","semLabel":"세타"},{"t":"베가","sub":"Vega","head":"내재변동성(IV)이 1%포인트 변할 때 옵션 가격이 얼마나 변하는지를 나타내는 그릭스는?","hint":"변동성에 대한 민감도예요","w":["델타","감마","세타"],"def":"베가는 IV 1%포인트 변화에 대한 프리미엄 변화량이에요. 변동성이 오르면 콜·풋 모두 가격이 올라 베가가 플러스입니다.","ex":"베가가 0.15p인 옵션은 IV가 20%에서 21%로 오르면 0.15p(37,500원) 올라요. 콜이든 풋이든 마찬가지입니다.","rel":"내재변동성 · 감마 · IV 크러시","sem":"ve","type":"def2term","cat":"s3","semLabel":"베가"},{"t":"만기가 길수록 크다","sub":"Vega and maturity","head":"같은 행사가라면 베가는 만기에 따라 어떻게 달라질까요?","hint":"시간이 길수록 변동성이 끼칠 여지가 커져요","w":["만기가 짧을수록 크다","만기와 무관하다","만기 당일이 가장 크다"],"def":"베가는 만기가 길수록 커요. 변동성이 변할 여지가 많기 때문입니다. 반대로 만기 당일에는 베가가 거의 0이 됩니다.","ex":"만기 1년 옵션의 베가가 0.5p라면, 만기 1주 옵션은 0.05p 수준이에요. 같은 IV 변화에도 장기 옵션이 10배 크게 반응합니다.","rel":"베가 · 만기 · 내재변동성","sem":"ve","type":"concept","cat":"s3","semLabel":"베가"},{"t":"로","sub":"Rho","head":"금리가 변할 때 옵션 가격이 얼마나 변하는지를 나타내는 그릭스는?","hint":"이자율에 대한 민감도예요","w":["베가","세타","감마"],"def":"로는 금리 1%포인트 변화에 대한 옵션 가격 변화량이에요. 콜은 금리가 오르면 플러스, 풋은 마이너스 영향을 받습니다.","ex":"로가 0.1p인 콜은 금리가 1%포인트 오르면 0.1p(25,000원) 올라요. 만기가 길수록 로의 영향이 커집니다.","rel":"베가 · 금리 · 만기","sem":"rh","type":"def2term","cat":"s3","semLabel":"로"},{"t":"영향이 매우 작다","sub":"Rho small","head":"주가지수 옵션에서 로(금리 민감도)의 실제 영향은?","hint":"지수옵션은 금리보다 다른 요인이 훨씬 커요","w":["가장 큰 영향을 준다","델타보다 크다","변동성만큼 크다"],"def":"주가지수 옵션은 만기가 짧고 금리 변동이 작아 로의 영향이 거의 없어요. 실전에서는 델타·감마·세타·베가를 먼저 봅니다.","ex":"금리가 0.25%포인트 올라도 만기 1개월 콜의 가격 변화는 0.02p(5,000원) 수준이에요. 같은 날 IV 1%p 변화가 0.15p를 움직이는 것과 비교됩니다.","rel":"로 · 베가 · 금리","sem":"rh","type":"concept","cat":"s3","semLabel":"로"},{"t":"내재변동성","sub":"Implied volatility","head":"옵션 가격에 이미 반영되어 있는 시장의 미래 변동성 기대치는?","hint":"가격에 새겨진 시장의 \"흔들림 예상\"이에요","w":["역사적변동성","베이시스","프리미엄"],"def":"내재변동성(IV)은 현재 옵션 가격을 이론식에 넣어 거꾸로 계산한 변동성이에요. 시장 참가자들이 예상하는 앞으로의 흔들림입니다.","ex":"등가격 콜이 8p인데 계산해 보니 IV가 30%로 나왔어요. 시장이 앞으로 연 30% 정도 흔들릴 것으로 본다는 뜻입니다.","rel":"역사적변동성 · 베가 · IV 크러시","sem":"iv","type":"def2term","cat":"s3","semLabel":"내재변동성"},{"t":"역사적변동성","sub":"Historical volatility","head":"과거 가격이 실제로 얼마나 흔들렸는지를 계산한 값은?","hint":"이미 지나간 기록으로 계산한 변동성이에요","w":["내재변동성","베타","샤프지수"],"def":"역사적변동성(HV)은 지난 20일·60일 같은 기간의 실제 수익률 흔들림으로 계산해요. IV와 비교해 옵션이 비싼지 싼지 판단합니다.","ex":"최근 20일 지수가 하루 평균 1%씩 움직였다면 HV는 연 약 16%예요. IV가 30%라면 옵션이 역사보다 비싸게 거래되는 겁니다.","rel":"내재변동성 · 변동성 위험 프리미엄 · IV","sem":"iv","type":"def2term","cat":"s3","semLabel":"내재변동성"},{"t":"옵션이 비싸게 거래된다","sub":"IV above HV","head":"내재변동성(IV)이 역사적변동성(HV)보다 높다는 것은?","hint":"시장이 과거보다 더 흔들릴 것으로 본다는 뜻이에요","w":["옵션이 싸게 거래된다","변동성이 곧 0이 된다","델타가 1이 된다"],"def":"IV가 HV보다 높으면 시장이 앞으로 더 크게 흔들릴 것으로 보고 옵션에 웃돈을 주는 거예요. 옵션 매수자에게는 비싼 가격입니다.","ex":"HV 16%인데 IV 30%라면 옵션 값에 기대 프리미엄이 얹혀 있어요. 이때는 옵션을 사기보다 파는 쪽이 통계적으로 유리할 수 있습니다.","rel":"내재변동성 · 역사적변동성 · 변동성 위험 프리미엄","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"IV 크러시","sub":"IV crush","head":"큰 이벤트가 지나간 뒤 내재변동성이 급락하는 현상은?","hint":"막상 일이 끝나면 기대가 확 꺼져요","w":["IV 랠리","감마 스퀴즈","베이시스 붕괴"],"def":"IV 크러시는 발표나 이벤트가 끝나 불확실성이 사라지며 IV가 급락하는 거예요. 방향이 맞아도 옵션 매수자가 손실을 볼 수 있습니다.","ex":"실적발표 전 IV 60%였던 옵션이 발표 다음 날 35%로 떨어지면, 주가가 2% 올라도 프리미엄은 오히려 내려갈 수 있어요.","rel":"내재변동성 · 베가 · 실적발표","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"발표 직후 급락한다","sub":"IV after earnings","head":"실적발표 직전에 오른 IV는 발표 뒤 어떻게 되는 경우가 많을까요?","hint":"불확실성이 사라지면 기대값도 사라져요","w":["계속 오른다","변하지 않는다","0이 된다"],"def":"실적발표 전에는 결과를 모르니 IV가 오르고, 발표가 끝나면 불확실성이 해소되어 IV가 급락해요. 이를 IV 크러시라고 합니다.","ex":"발표 전 50%였던 IV가 발표 뒤 30%로 내려가면 베가 0.3p 옵션은 6p(150만원)가 그대로 사라져요. 주가가 조금 올라도 손실입니다.","rel":"IV 크러시 · 베가 · 실적발표","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"IV가 올라간다","sub":"IV before FOMC","head":"FOMC나 CPI 발표를 앞두고 옵션의 IV는 어떻게 될까요?","hint":"결과를 모를수록 보험료가 비싸져요","w":["IV가 내려간다","IV가 0이 된다","델타가 0이 된다"],"def":"큰 지표 발표 전에는 결과가 어떻게 나올지 몰라 불확실성이 커져요. 그래서 옵션 수요가 늘고 IV가 올라갑니다.","ex":"CPI 발표 전날 VKOSPI가 15에서 19로 오르면, 등가격 옵션 프리미엄이 20% 넘게 비싸져요. 같은 지수라도 값이 다릅니다.","rel":"IV 크러시 · VKOSPI · FOMC","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"변동성 스큐","sub":"Volatility skew","head":"행사가격에 따라 IV가 한쪽으로 기울어지는 현상은?","hint":"한쪽 꼬리만 유난히 비싼 모양이에요","w":["변동성 스마일","변동성 기간구조","베이시스"],"def":"스큐는 행사가격별 IV가 좌우 비대칭으로 기우는 현상이에요. 주식시장에서는 폭락 공포 때문에 낮은 행사가 풋의 IV가 더 높습니다.","ex":"2026-11-20 실제 코스피200 시세에서 콜 IV는 47%대, 풋 IV는 76~81%였어요. 같은 지수인데 풋 쪽이 훨씬 비싼 전형적 스큐입니다.","rel":"변동성 스마일 · 풋 스큐 · VKOSPI","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"변동성 스마일","sub":"Volatility smile","head":"양쪽 꼬리(깊은 풋과 깊은 콜)의 IV가 모두 높아 U자 모양이 되는 현상은?","hint":"양쪽 끝이 올라가 웃는 입 모양이에요","w":["변동성 스큐","기간구조","콘탱고"],"def":"스마일은 등가격에서 멀어질수록 IV가 다시 올라가는 모양이에요. 급등·급락 같은 큰 움직임의 가능성에 양쪽 모두 값이 붙습니다.","ex":"환율 옵션에서는 달러가 급등할 때와 급락할 때 모두 위험이 커 U자 모양이 뚜렷해요. 주가지수는 아래쪽이 더 높은 비대칭 스큐가 흔합니다.","rel":"변동성 스큐 · 꼬리 위험 · IV","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"하락 위험을 더 비싸게 본다","sub":"Put skew","head":"코스피200 옵션에서 낮은 행사가 풋의 IV가 콜보다 높은 이유는?","hint":"폭락은 빠르고 크게 와서 보험이 비싸요","w":["상승 위험이 더 크다고 보기 때문","풋의 승수가 더 커서","풋의 만기가 더 길어서"],"def":"주식시장은 급락이 급등보다 빠르고 크게 나타나요. 그래서 하락을 막아 주는 풋옵션 수요가 많아 IV가 더 높습니다.","ex":"지수 750p에서 550 풋의 IV가 79%라면, 900 콜은 47%예요. 똑같이 먼 외가격인데 폭락 보험료가 훨씬 비쌉니다.","rel":"변동성 스큐 · 풋옵션 · 꼬리 위험","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"VKOSPI","sub":"VKOSPI","head":"코스피200 옵션의 30일 내재변동성을 지수화한 국내 변동성 지수는?","hint":"국내판 공포지수예요","w":["VIX","HV","VQ"],"def":"VKOSPI는 코스피200 옵션 가격에 반영된 30일 기대 변동성을 지수로 만든 거예요. 시장의 공포 수준을 보여 줍니다.","ex":"VKOSPI가 15에서 30으로 오르면 시장이 한 달 뒤 흔들림을 두 배로 본다는 뜻이에요. 옵션 프리미엄도 그만큼 비싸집니다.","rel":"VIX · 내재변동성 · 공포지수","sem":"vo","type":"def2term","cat":"s3","semLabel":"변동성지수"},{"t":"VIX","sub":"VIX","head":"S&P500 옵션의 30일 내재변동성을 나타내는 미국의 변동성 지수는?","hint":"미국 시장의 공포지수예요","w":["VKOSPI","HV","SPX"],"def":"VIX는 S&P500 옵션의 30일 기대 변동성을 지수화한 값이에요. 20 아래면 평온, 30을 넘으면 불안이 큰 상태로 봅니다.","ex":"VIX 15는 앞으로 한 달 S&P500이 연 15% 정도 흔들릴 것으로 본다는 뜻이에요. 하루로 환산하면 약 0.9%입니다.","rel":"VKOSPI · 내재변동성 · 공포지수","sem":"vo","type":"def2term","cat":"s3","semLabel":"변동성지수"},{"t":"반대로 움직인다","sub":"VIX vs S&P","head":"VIX와 S&P500 지수는 보통 어떤 관계일까요?","hint":"지수가 급락하면 공포지수는 튀어요","w":["같이 움직인다","아무 관계 없다","항상 2배가 된다"],"def":"VIX와 S&P500은 보통 반대로 움직여요. 지수가 급락하면 공포가 커져 VIX가 급등하고, 시장이 안정되면 VIX가 내려갑니다.","ex":"S&P500이 하루 3% 빠지면 VIX가 15에서 28로 뛰는 일이 흔해요. 반대로 지수가 오르면 VIX는 서서히 식습니다.","rel":"VKOSPI · 변동성 · 헤지","sem":"vo","type":"concept","cat":"s3","semLabel":"변동성지수"},{"t":"평균으로 돌아가려는 성질","sub":"Mean reversion","head":"변동성이 아주 높아지거나 낮아지면 다시 평균 쪽으로 돌아가려는 성질은?","hint":"공포는 오래가지 않아요","w":["추세 지속","모멘텀","역상관"],"def":"변동성은 평균으로 회귀하는 성질이 있어요. 급등한 VIX는 시간이 지나며 내려오고, 너무 낮았던 변동성은 다시 올라갑니다.","ex":"VIX가 50까지 치솟아도 몇 달 뒤 20 아래로 돌아오는 일이 반복됐어요. 그래서 변동성 매도 전략은 오래 살아남지만 급등에는 취약합니다.","rel":"VIX · 변동성 위험 프리미엄 · 평균회귀","sem":"vo","type":"concept","cat":"s3","semLabel":"변동성지수"},{"t":"약 1.25%","sub":"Daily vol from IV","head":"IV가 20%일 때 하루 기대 변동폭은 대략 얼마일까요?","hint":"연 변동성을 16으로 나누면 하루가 돼요","w":["약 20%","약 5%","약 0.2%"],"def":"연 변동성 20%는 1년에 약 20% 흔들린다는 뜻이에요. 거래일 252일의 제곱근이 약 16이라, 하루 기대 변동은 20 ÷ 16 ≈ 1.25%입니다.","ex":"지수 750p에 IV 20%면 하루 약 9.4p(235만원)가 표준적인 흔들림이에요. 이보다 크게 움직이면 옵션 매수자가 유리해집니다.","rel":"내재변동성 · 기대 변동폭 · 세타","sem":"iv","type":"calc","cat":"s3","semLabel":"내재변동성"},{"t":"약 1.9%","sub":"Daily vol IV 30","head":"IV가 30%라면 하루 기대 변동폭은 대략 얼마일까요?","hint":"30을 16으로 나눠 보세요","w":["약 3%","약 0.3%","약 30%"],"def":"하루 기대 변동은 IV를 약 16으로 나눈 값이에요. 30 ÷ 16 ≈ 1.9%입니다.","ex":"지수 750p, IV 30%면 하루 표준 흔들림이 약 14p(350만원)예요. IV가 높다는 건 하루 등락이 그만큼 클 것으로 본다는 뜻입니다.","rel":"내재변동성 · VKOSPI · 변동성","sem":"iv","type":"calc","cat":"s3","semLabel":"내재변동성"},{"t":"IV × √(남은 기간)","sub":"Expected move","head":"만기까지 기대되는 전체 변동폭을 구하는 공식은?","hint":"변동성에 기간의 제곱근을 곱해요","w":["IV × 남은 기간","IV ÷ 남은 기간","IV + 남은 기간"],"def":"기대 변동폭은 IV × √(남은 기간)이에요. 기간이 4배면 변동폭은 2배가 되고, 1/4이면 절반이 됩니다.","ex":"IV 20%, 3개월(0.25년) 남았다면 20% × √0.25 = 10%예요. 지수 750p면 위아래 약 75p가 기대 범위입니다.","rel":"내재변동성 · 기대 변동폭 · 만기","sem":"iv","type":"calc","cat":"s3","semLabel":"내재변동성"},{"t":"델타가 0.64로 커진다","sub":"Gamma example","head":"델타 0.6, 감마 0.04인 콜이 지수 1p 상승 후 델타는?","hint":"델타에 감마를 더해 보세요","w":["델타가 0.56으로 작아진다","델타가 0.6 그대로다","델타가 1.0이 된다"],"def":"새 델타 = 기존 델타 + 감마 × 지수 변화예요. 0.6 + 0.04 × 1 = 0.64입니다.","ex":"같은 1p 상승에도 처음엔 0.6p, 다음엔 0.64p씩 프리미엄이 붙어요. 상승이 이어질수록 이익이 조금씩 빨라지는 것이 감마 효과입니다.","rel":"감마 · 델타 · 손익계산","sem":"ca","type":"calc","cat":"s3","semLabel":"손익계산"},{"t":"2.4p (60만원)","sub":"Theta example","head":"세타가 0.8p인 옵션 1계약을 3일 보유했습니다. 시간가치 손실은?","hint":"0.8p × 3일 × 25만원이에요","w":["0.8p (20만원)","24p (600만원)","2.4p (6만원)"],"def":"세타 × 경과일 × 승수로 계산해요. 0.8 × 3 = 2.4p, 2.4 × 250,000 = 600,000원입니다.","ex":"지수가 제자리여도 3일 만에 60만원이 사라져요. 옵션 매수자가 방향을 맞히고도 손해를 보는 가장 흔한 이유입니다.","rel":"세타 · 시간가치 · 손익계산","sem":"ca","type":"calc","cat":"s3","semLabel":"손익계산"},{"t":"0.30p 상승","sub":"Vega example","head":"베가가 0.15p인 옵션의 IV가 20%에서 22%로 올랐습니다. 프리미엄 변화는?","hint":"IV 2%포인트 × 베가 0.15p예요","w":["0.15p 상승","0.30p 하락","3p 상승"],"def":"프리미엄 변화 = 베가 × IV 변화(%포인트)예요. 0.15 × 2 = 0.30p 상승합니다.","ex":"0.30p는 75,000원이에요. 지수가 전혀 움직이지 않아도 IV만 올라 7만 5,000원을 벌 수 있습니다.","rel":"베가 · 내재변동성 · 손익계산","sem":"ca","type":"calc","cat":"s3","semLabel":"손익계산"},{"t":"IV 백분위","sub":"IV percentile","head":"지금 IV가 최근 1년 중 몇 % 수준인지 나타내는 지표는?","hint":"높은지 낮은지 순위로 보여 줘요","w":["IV 랭크","델타","HV"],"def":"IV 백분위는 현재 IV가 과거 1년 값들 중 어느 위치인지 보여 줘요. 90%면 지난 1년의 상위 10% 수준으로 아주 높다는 뜻입니다.","ex":"IV 25%가 백분위 90%라면, 숫자만 보면 낮아 보여도 최근 1년 기준으로는 매우 높은 편이에요. 옵션 매도에 유리한 자리입니다.","rel":"IV 랭크 · 내재변동성 · 변동성 위험 프리미엄","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"IV 랭크","sub":"IV rank","head":"최근 1년 IV의 최저~최고 범위 안에서 현재 IV의 위치를 0~100으로 나타낸 지표는?","hint":"1년 범위에서 어디쯤인지 보여 줘요","w":["IV 백분위","베가","VKOSPI"],"def":"IV 랭크는 (현재 IV − 1년 최저) ÷ (1년 최고 − 1년 최저) × 100이에요. 0에 가까우면 변동성이 바닥, 100이면 꼭대기입니다.","ex":"1년 최저 IV 12%, 최고 40%, 현재 25%라면 랭크는 (25−12)/(40−12)×100 ≈ 46이에요. 중간 정도 자리입니다.","rel":"IV 백분위 · 변동성 · 내재변동성","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"변동성 위험 프리미엄","sub":"Volatility risk premium","head":"IV가 실제 실현 변동성보다 평균적으로 높은 만큼을 부르는 말은?","hint":"보험은 늘 실제 사고보다 비싸게 팔려요","w":["베이시스","감마","시간가치"],"def":"변동성 위험 프리미엄은 IV가 HV보다 높은 부분이에요. 투자자들이 위험을 피하려고 옵션에 웃돈을 주기 때문에 생깁니다.","ex":"HV가 평균 15%인데 IV가 평균 20%라면 5%포인트가 위험 프리미엄이에요. 장기적으로 옵션 매도가 유리한 통계적 이유입니다.","rel":"내재변동성 · 역사적변동성 · IV 랭크","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"장기 IV가 단기 IV보다 높다","sub":"Normal term structure","head":"변동성 기간구조가 정상일 때 장기 IV와 단기 IV의 관계는?","hint":"평온할 때는 먼 미래가 조금 더 불확실해요","w":["단기 IV가 더 높다","둘이 항상 같다","장기 IV가 0이다"],"def":"평온한 시장에서는 장기 IV가 단기 IV보다 조금 높아요. 시간이 길수록 불확실성이 크기 때문입니다.","ex":"만기 1주 IV 18%, 3개월 IV 21%라면 정상 구조예요. 이때 단기 옵션을 팔고 장기 옵션을 사는 캘린더 전략이 가능합니다.","rel":"기간구조 · 이벤트 전 역전 · 캘린더 스프레드","sem":"iv","type":"concept","cat":"s3","semLabel":"내재변동성"},{"t":"단기 IV가 장기 IV보다 높다","sub":"Inverted term structure","head":"큰 이벤트를 앞두고 변동성 기간구조가 역전되면 어떤 모양일까요?","hint":"당장의 불안이 먼 미래보다 커져요","w":["장기 IV가 더 높다","둘 다 0이 된다","장기 IV만 오
