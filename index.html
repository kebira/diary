<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 일기장</title>
<style>
  :root {
    --main: #87a58a;      /* 세이지 그린 (주조색) */
    --sub: #f3ebdd;       /* 웜 베이지 (보조색) */
    --bg: #fbf9f5;
    --text: #3b3b36;
    --muted: #8b8a82;
    --card: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f2320; --text:#e8e6df; --muted:#9a9a90; --card:#2a2e2a; --sub:#3a3a30; --shadow:0 1px 3px rgba(0,0,0,0.3); }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Pretendard", "Noto Sans KR", sans-serif; background:var(--bg); color:var(--text); line-height:1.8; }
  h1, h2, .serif { font-family: "Noto Serif KR", Georgia, serif; font-weight:600; }
  button { font: inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 16px; background:var(--main); color:#fff; transition: box-shadow .2s, transform .2s; }
  button:hover { box-shadow:0 2px 8px rgba(0,0,0,0.12); transform: translateY(-1px); }
  button.ghost { background:var(--sub); color:var(--text); }
  button.danger { background:#c97b6b; }
  input, textarea, select { font:inherit; width:100%; padding:10px; border:1px solid #d8d4c8; border-radius:8px; background:var(--card); color:var(--text); }
  textarea { min-height:120px; resize:vertical; }
  .label { font-size:12px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:4px; display:block; }
  .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
  .hidden { display:none !important; }
  .fade { animation: fade .4s ease; }
  @keyframes fade { from {opacity:0} to {opacity:1} }

  /* 로그인 */
  #login { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:20px; text-align:center; }
  #login p { color:var(--muted); margin:0; }

  /* 앱 레이아웃 */
  #app { display:grid; grid-template-columns: 280px 1fr; min-height:100vh; }
  #side { border-right:1px solid #e4dfd2; padding:20px; overflow-y:auto; max-height:100vh; position:sticky; top:0; }
  #main { padding:28px; max-width:820px; width:100%; }
  .topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .nav { display:flex; gap:8px; align-items:center; }
  .year-title { font-size:14px; color:var(--muted); cursor:pointer; padding:6px 0; }
  .list-item { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
  .list-item:hover, .list-item.active { background:var(--sub); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .msg { font-size:13px; color:var(--muted); min-height:20px; margin-top:8px; }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    #side { position:static; max-height:none; border-right:none; border-bottom:1px solid #e4dfd2; }
    #main { padding:18px; }
    .row { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<!-- ============================================================
  Firebase 설정값 입력 위치
  아래 firebaseConfig 객체를 Firebase 콘솔에서 복사한 값으로 교체하세요.
============================================================ -->
<script type="module">
// ▼ Firebase 설정값을 여기에 넣으세요 ▼
const firebaseConfig = {
  apiKey: "AIzaSyBrlgD7EeAgtnZmJnX-gfJgRQgyxZDXUg4",
  authDomain: "diary-kebira.firebaseapp.com",
  projectId: "diary-kebira",
  storageBucket: "diary-kebira.firebasestorage.app",
  messagingSenderId: "738922362336",
  appId: "1:738922362336:web:41a5cf733453c53d90e785"
};
// ▲ Firebase 설정값 끝 ▲

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let currentDate = new Date();
let diaryCache = {};      // 'YYYY-MM-DD' -> 데이터
let activeDateStr = fmt(new Date());
let viewMode = "list";    // list | calendar

// ---------- 유틸 ----------
const $ = (id) => document.getElementById(id);
function fmt(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function showMsg(text, isError=false) {
  const el = $("msg");
  el.textContent = text;
  el.style.color = isError ? "#c97b6b" : "var(--muted)";
}
function calcDuration(inT, outT) {
  if (!inT || !outT) return "";
  const [h1,m1] = inT.split(":").map(Number);
  const [h2,m2] = outT.split(":").map(Number);
  let diff = (h2*60+m2) - (h1*60+m1);
  if (diff < 0) diff += 24*60;
  return `${diff}분`;
}
function diaryDoc(dateStr) {
  return doc(db, "users", currentUser.uid, "diaries", dateStr);
}

// ---------- 로그인 ----------
$("loginBtn").addEventListener("click", async () => {
  try { await signInWithPopup(auth, provider); }
  catch (e) { alert("로그인에 실패했습니다. 다시 시도해 주세요."); }
});
$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    await loadAll();
    renderSide();
    loadDate(fmt(new Date()));
  } else {
    $("login").classList.remove("hidden");
    $("app").classList.add("hidden");
  }
});

// ---------- 데이터 ----------
async function loadAll() {
  try {
    const snap = await getDocs(collection(db, "users", currentUser.uid, "diaries"));
    diaryCache = {};
    snap.forEach(d => diaryCache[d.id] = d.data());
  } catch (e) {
    showMsg("연결을 확인해 주세요.", true);
  }
}

function renderSide() {
  const list = $("sideList");
  list.innerHTML = "";
  const keys = Object.keys(diaryCache).sort().reverse();
  if (keys.length === 0) {
    list.innerHTML = `<p class="msg">아직 작성한 일기가 없습니다. 오늘 하루를 기록해 보세요.</p>`;
    return;
  }
  const byYear = {};
  keys.forEach(k => { const y = k.slice(0,4); (byYear[y] ||= []).push(k); });
  Object.keys(byYear).forEach(y => {
    const title = document.createElement("div");
    title.className = "year-title";
    title.textContent = `▸ ${y}년 (${byYear[y].length})`;
    const box = document.createElement("div");
    box.className = "hidden";
    title.addEventListener("click", () => box.classList.toggle("hidden"));
    byYear[y].forEach(k => {
      const item = document.createElement("div");
      item.className = "list-item" + (k === activeDateStr ? " active" : "");
      item.textContent = `${k} ${diaryCache[k].mood || ""}`;
      item.addEventListener("click", () => loadDate(k));
      box.appendChild(item);
    });
    list.appendChild(title);
    list.appendChild(box);
  });
}

function loadDate(dateStr) {
  activeDateStr = dateStr;
  const d = diaryCache[dateStr] || {};
  $("dateLabel").textContent = dateStr;
  $("mood").value = d.mood || "보통";
  $("title").value = d.title || "";
  $("body").value = d.body || "";
  $("tradeTime").value = d.tradeTime || "";
  $("tradeResult").value = d.tradeResult || "";
  $("tradeMemo").value = d.tradeMemo || "";
  $("gymIn").value = d.gymIn || "";
  $("gymOut").value = d.gymOut || "";
  $("gymActivity").value = d.gymActivity || "";
  $("gymDuration").textContent = calcDuration(d.gymIn, d.gymOut) || "-";
  $("emptyBox").classList.toggle("hidden", !!diaryCache[dateStr]);
  $("editor").classList.remove("hidden");
  $("editor").classList.remove("fade"); void $("editor").offsetWidth; $("editor").classList.add("fade");
  renderSide();
}

$("gymIn").addEventListener("change", () => $("gymDuration").textContent = calcDuration($("gymIn").value, $("gymOut").value) || "-");
$("gymOut").addEventListener("change", () => $("gymDuration").textContent = calcDuration($("gymIn").value, $("gymOut").value) || "-");

function shiftDate(days) {
  const [y,m,d] = activeDateStr.split("-").map(Number);
  const nd = new Date(y, m-1, d + days);
  loadDate(fmt(nd));
}
$("prevDay").addEventListener("click", () => shiftDate(-1));
$("nextDay").addEventListener("click", () => shiftDate(1));
$("todayBtn").addEventListener("click", () => loadDate(fmt(new Date())));

$("saveBtn").addEventListener("click", async () => {
  if (!currentUser) return;
  const data = {
    mood: $("mood").value,
    title: $("title").value.trim(),
    body: $("body").value,
    tradeTime: $("tradeTime").value,
    tradeResult: $("tradeResult").value,
    tradeMemo: $("tradeMemo").value,
    gymIn: $("gymIn").value,
    gymOut: $("gymOut").value,
    gymActivity: $("gymActivity").value,
    updatedAt: new Date().toISOString()
  };
  try {
    await setDoc(diaryDoc(activeDateStr), data);
    diaryCache[activeDateStr] = data;
    $("emptyBox").classList.add("hidden");
    renderSide();
    showMsg("저장되었습니다.");
  } catch (e) {
    showMsg("저장에 실패했습니다. 연결을 확인해 주세요.", true);
  }
});

$("deleteBtn").addEventListener("click", async () => {
  if (!currentUser || !diaryCache[activeDateStr]) return;
  if (!confirm("이 날짜의 일기를 삭제할까요?")) return;
  try {
    await deleteDoc(diaryDoc(activeDateStr));
    delete diaryCache[activeDateStr];
    loadDate(activeDateStr);
    showMsg("삭제되었습니다.");
  } catch (e) {
    showMsg("삭제에 실패했습니다. 연결을 확인해 주세요.", true);
  }
});

// 검색
$("searchBox").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  const list = $("sideList");
  if (!q) { renderSide(); return; }
  list.innerHTML = "";
  Object.keys(diaryCache).sort().reverse()
    .filter(k => (diaryCache[k].title||"").toLowerCase().includes(q) || (diaryCache[k].body||"").toLowerCase().includes(q))
    .forEach(k => {
      const item = document.createElement("div");
      item.className = "list-item";
      item.textContent = `${k} ${diaryCache[k].title || ""}`;
      item.addEventListener("click", () => loadDate(k));
      list.appendChild(item);
    });
});

// JSON 내보내기 / 가져오기
$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(diaryCache, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `diary-backup-${fmt(new Date())}.json`;
  a.click();
});
$("importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const obj = JSON.parse(await file.text());
    for (const k of Object.keys(obj)) {
      await setDoc(doc(db, "users", currentUser.uid, "diaries", k), obj[k]);
      diaryCache[k] = obj[k];
    }
    renderSide();
    showMsg("가져오기가 완료되었습니다.");
  } catch (err) {
    showMsg("파일을 읽을 수 없습니다. JSON 파일을 확인해 주세요.", true);
  }
});

$("themeNote").textContent = "";
window.__diary = { loadDate };
</script>

<!-- 로그인 화면 -->
<div id="login">
  <h1>나의 일기장</h1>
  <p>기록을 시작하려면 Google 계정으로 로그인하세요.</p>
  <button id="loginBtn">Google로 로그인</button>
</div>

<!-- 앱 화면 -->
<div id="app" class="hidden">
  <aside id="side">
    <input id="searchBox" placeholder="제목·본문 검색" style="margin-bottom:14px;">
    <div id="sideList"></div>
    <div style="margin-top:20px; display:grid; gap:8px;">
      <button class="ghost" id="exportBtn">JSON 내보내기</button>
      <label class="ghost" style="display:block; text-align:center; padding:10px; border-radius:8px; background:var(--sub); cursor:pointer;">
        JSON 가져오기
        <input id="importFile" type="file" accept="application/json" class="hidden">
      </label>
      <button class="ghost" id="logoutBtn">로그아웃</button>
    </div>
  </aside>

  <main id="main">
    <div class="topbar">
      <div class="nav">
        <button class="ghost" id="prevDay">◀</button>
        <span class="label" id="dateLabel"></span>
        <button class="ghost" id="nextDay">▶</button>
        <button class="ghost" id="todayBtn">오늘</button>
      </div>
    </div>

    <div id="emptyBox" class="card empty hidden">
      <p class="serif" style="font-size:18px; margin:0 0 8px;">아직 이 날의 기록이 없습니다.</p>
      <p style="margin:0;">오늘 하루를 가볍게 적어 보세요.</p>
    </div>

    <section id="editor" class="hidden">
      <div class="card">
        <div class="row">
          <div>
            <span class="label">기분</span>
            <select id="mood"><option>좋음</option><option>보통</option><option>나쁨</option></select>
          </div>
          <div>
            <span class="label">제목</span>
            <input id="title" placeholder="제목을 입력하세요">
          </div>
        </div>
        <div style="margin-top:12px;">
          <span class="label">본문</span>
          <textarea id="body" placeholder="오늘의 이야기를 적어 보세요."></textarea>
        </div>
      </div>

      <div class="card">
        <span class="label">거래 기록</span>
        <div class="row">
          <div><span class="label">거래시간</span><input id="tradeTime" placeholder="예: 09:05"></div>
          <div><span class="label">거래결과</span><input id="tradeResult" placeholder="예: 코스피200 선물 1계약 매수, 익절 +0.5pt"></div>
        </div>
        <div style="margin-top:12px;">
          <span class="label">기타</span>
          <textarea id="tradeMemo" placeholder="자유롭게 메모하세요."></textarea>
        </div>
      </div>

      <div class="card">
        <span class="label">운동 기록</span>
        <div class="row">
          <div><span class="label">헬스장 입장</span><input id="gymIn" type="time"></div>
          <div><span class="label">헬스장 퇴장</span><input id="gymOut" type="time"></div>
        </div>
        <p class="msg">소요 시간: <span id="gymDuration">-</span></p>
        <div style="margin-top:12px;">
          <span class="label">활동 내역</span>
          <textarea id="gymActivity" placeholder="예: 벤치프레스 3세트 10회 60kg"></textarea>
        </div>
      </div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button id="saveBtn">저장</button>
        <button class="danger" id="deleteBtn">삭제</button>
        <span class="msg" id="msg"></span>
      </div>
    </section>
  </main>
</div>

</body>
</html>
